name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: apps/admin
      - run: make gen
      - name: Fail if generated files changed
        run: |
          git add -N .
          git diff --exit-code --stat || {
            echo "::error::Generated files are stale. Run 'make gen' and commit the result."
            exit 1
          }

  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hiro
          POSTGRES_PASSWORD: hiro
          POSTGRES_DB: hiro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hiro -d hiro_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: server
      - run: go test -race -p 1 ./...
        env:
          HIRO_TEST_DATABASE_URL: postgres://hiro:hiro@localhost:5432/hiro_test?sslmode=disable
      - run: go build ./...

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the generated API client
        working-directory: apps/mobile/packages/hiro_api
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  image:
    name: Docker image
    needs: [generated, server, admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.short }}
            COMMIT=${{ steps.meta.outputs.short }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runner image (Claude Code + toolchains)
        uses: docker/build-push-action@v6
        with:
          context: deploy/runner
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.image }}-runner:${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}-runner:latest
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  deploy:
    name: Deploy
    needs: [image]
    # Enable by setting the repository variable DEPLOY_ENABLED=true and the
    # secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$TARGET" \
            'cd /opt/hiro && docker compose --profile build pull hiro egress runner && docker compose up -d && docker image prune -f'
