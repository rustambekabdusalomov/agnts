# Production stack: Caddy (HTTPS) -> agnts -> PostgreSQL, plus nightly backups.
# Installed and managed by the agnts CLI (`agnts install`, `agnts upgrade`).
# By hand, on the server, from this directory:
#   cp .env.example .env   # fill it in
#   docker compose up -d
#   docker compose exec agnts agnts user create <username>
name: agnts

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AGNTS_DOMAIN: ${AGNTS_DOMAIN:?set AGNTS_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # The hosted product (CADDYFILE=./Caddyfile.cloud) also serves the
      # website and a separate API domain.
      AGNTS_SITE_DOMAIN: ${AGNTS_SITE_DOMAIN:-}
      AGNTS_API_DOMAIN: ${AGNTS_API_DOMAIN:-}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - ./pitch-day:/srv/pitch-day:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agnts
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agnts:
    image: ${AGNTS_IMAGE:-registry.agnts.uz/agnts:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AGNTS_DATABASE_URL: postgres://hiro:${POSTGRES_PASSWORD}@postgres:5432/hiro?sslmode=disable
      AGNTS_DATA_DIR: /var/lib/agnts
      # Run containers live on an internal network; the egress proxy is their
      # only way out (Claude API, git hosts, package registries).
      AGNTS_RUN_NETWORK: agnts-runs
      AGNTS_RUN_PROXY: http://egress:3128
      AGNTS_RUNNER_IMAGE: ${AGNTS_RUNNER_IMAGE:-agnts-runner:latest}
    # agnts starts one container per run through the Docker socket. That makes
    # the agnts container root-equivalent on the host; run containers never get
    # the socket. DOCKER_GID is the host's docker group (getent group docker).
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agntsdata:/var/lib/agnts
    # Not published: only Caddy reaches agnts, which is why agnts trusts the
    # X-Forwarded-For entry Caddy writes.
    expose:
      - "8080"
      # Internal listener: the egress proxy reads the hosts allowed in
      # Settings here. Caddy never routes it; run containers cannot reach it.
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  egress:
    image: ${AGNTS_IMAGE:-registry.agnts.uz/agnts:latest}
    restart: unless-stopped
    command: ["egress-proxy"]
    environment:
      # Comma-separated; empty uses the built-in list (Anthropic, GitHub,
      # GitLab.com, the toolchain downloads mise uses and the package
      # registries of the supported languages: see internal/egress). A value
      # here replaces that list; to add a host, use Settings -> Previews -> Allowed hosts.
      AGNTS_EGRESS_ALLOW: ${AGNTS_EGRESS_ALLOW:-}
      # Hosts added under Settings -> Network (a staging API for previews),
      # re-read every 30 seconds.
      AGNTS_EGRESS_EXTRA_URL: http://agnts:8081/egress/allow
      # Private networks: a run's connection to a host on its workspace's
      # routes goes through the gateway (empty AGNTS_GATEWAY: off).
      AGNTS_GATEWAY: ${AGNTS_GATEWAY:-}
      AGNTS_GATEWAY_SECRET: ${AGNTS_GATEWAY_SECRET:-}
      AGNTS_EGRESS_ROUTE_URL: http://agnts:8081/egress/route
    # The image's own check probes the API port; the proxy has none.
    healthcheck:
      disable: true
    networks: [default, runs]
    logging: *logging

  # Private networks (Settings → Private network): every workspace's tunnel
  # into its own network. WireGuard runs here in user space; OpenVPN runs in
  # a sidecar per workspace that agnts starts on the agnts-ovpn network;
  # agnts-link connectors reach /link through Caddy. agnts and the egress
  # proxy dial through it with AGNTS_GATEWAY_SECRET. Turn on with
  #   AGNTS_GATEWAY=gateway:3129 and AGNTS_GATEWAY_SECRET=<random> in .env,
  #   docker compose --profile private-network up -d
  gateway:
    image: ${AGNTS_IMAGE:-registry.agnts.uz/agnts:latest}
    restart: unless-stopped
    command: ["gateway"]
    profiles: ["private-network"]
    environment:
      # The gateway opens the sealed VPN configs: agnts's own key.
      AGNTS_ENC_KEY: ${AGNTS_ENC_KEY:-}
      AGNTS_GATEWAY_SECRET: ${AGNTS_GATEWAY_SECRET:-}
      AGNTS_LOG_LEVEL: ${AGNTS_LOG_LEVEL:-info}
    expose:
      - "3129" # CONNECT, for agnts and the egress proxy
      - "3130" # agnts-link sessions, routed by Caddy at /link
    healthcheck:
      disable: true
    networks: [default, ovpn]
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiro
      POSTGRES_DB: hiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiro -d hiro"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: hiro
      PGDATABASE: hiro
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Build-only: the image run containers start from.
  #   docker compose --profile build build runner
  runner:
    image: ${AGNTS_RUNNER_IMAGE:-agnts-runner:latest}
    build: ./runner
    profiles: ["build"]

  # Build-only: the OpenVPN sidecar (OpenVPN plus the agnts binary).
  #   docker compose --profile build build ovpn
  ovpn:
    image: ${AGNTS_OVPN_IMAGE:-agnts-ovpn:latest}
    build:
      context: ./ovpn
      args:
        AGNTS_IMAGE: ${AGNTS_IMAGE:-registry.agnts.uz/agnts:latest}
    profiles: ["build"]

networks:
  runs:
    name: agnts-runs
    internal: true
  # OpenVPN sidecars and the gateway; the sidecars need a way out to the
  # VPN server, run containers never join it.
  ovpn:
    name: agnts-ovpn

# Volume names are pinned to the ones created before the project was renamed
# from hiro, so existing data, certificates and clones stay attached.
volumes:
  agntsdata:
    name: hiro_hirodata
  pgdata:
    name: hiro_pgdata
  caddy_data:
    name: hiro_caddy_data
  caddy_config:
    name: hiro_caddy_config
