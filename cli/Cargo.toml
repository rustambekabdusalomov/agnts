[package]
name = "agnts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Install and manage agnts on a Linux server"

[lib]
name = "agnts_cli"
path = "src/lib.rs"

[[bin]]
name = "agnts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
console = "0.15"
dialoguer = "0.11"
directories = "6"
hex = "0.4"
indicatif = "0.17"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
x509-parser = "0.16"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OS keychain holds the access key on the machines people run the CLI
# from. Linux uses a 0600 file instead: servers rarely run a Secret Service.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
