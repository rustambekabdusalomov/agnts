      responses:
        '200':
          description: The suggestions added
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/brief:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: getRepoBrief
      summary: What agnts knows about how the repository works; empty and idle before the first survey
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveRepoBrief
      x-role: owner
      summary: Replace the approved brief with your text; empty text removes it
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoBriefInput' }
      responses:
        '200':
          description: Saved; new runs read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/brief/survey:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: surveyRepoBrief
      x-role: owner
      summary: Have Claude survey the repository and write a draft brief (an update when it has one)
      tags: [repos]
      responses:
        '200':
          description: Queued, or already queued or running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/brief/approve:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: approveRepoBrief
      x-role: owner
      summary: Make the draft the brief that runs read
      tags: [repos]
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/brief/discard:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: discardRepoBriefDraft
      x-role: owner
      summary: Drop the draft a survey wrote
      tags: [repos]
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/local-branches:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoLocalBranches
      summary: Branches in agnts's own clones on the server, and whether origin has them
      tags: [repos]
      responses:
        '200':
          description: OK, newest commit first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocalBranch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/members:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoMembers
      summary: People with access to the repository on its git host
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RepoMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/branches:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoBranches
      summary: Branches with their tip, ahead/behind the default branch and checks
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/commits:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoCommits
      summary: Commits on the default branch, newest first, 50 per page; a shorter page is the last
      tags: [repos]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Commit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/pipelines:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoPipelines
      summary: CI runs with their stages, newest first, 20 per page; a shorter page is the last
      tags: [repos]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pipeline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/environments:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoEnvironments
      summary: Deployment environments and what runs there
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/deploy:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: deployRepo
      x-role: owner
      summary: Start a deployment (GitLab manual job, or the GitHub deploy workflow). Never available from MCP.
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId: { type: integer, format: int64, description: GitLab manual job to start }
                ref: { type: string, description: 'GitHub: branch to deploy (default branch if empty)' }
      responses:
        '202': { description: Started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/signup:
    get:
      operationId: getSignupInfo
      summary: Whether people can register, and whether this install has no user yet
      tags: [auth]
      security: []
      x-scope: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupInfo' }
    post:
      operationId: register
      summary: Create an account (and its first workspace, unless joining by invite)
      tags: [auth]
      security: []
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the link's token
      tags: [auth]
      security: []
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password reset link (always answers 204)
      tags: [auth]
      security: []
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '204': { description: Sent if the address is known }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset link's token
      tags: [auth]
      security: []
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 200 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '204': { description: Password changed; every session ended }
        '400': { $ref: '#/components/responses/BadRequest' }

  /account/profile:
    put:
      operationId: updateProfile
      summary: Change the display name or email
      tags: [account]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 100 }
                email: { type: string, maxLength: 254 }
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /account/password:
    put:
      operationId: changePassword
      summary: Change the password
      tags: [account]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: { type: string, maxLength: 256 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/BadRequest' }

  /account/verify:
    post:
      operationId: resendVerification
      summary: Send the email verification link again
      tags: [account]
      x-scope: user
      responses:
        '204': { description: Sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /account/totp/setup:
    post:
      operationId: beginTotp
      summary: Start turning on two-factor sign-in (a new secret, not saved yet)
      tags: [account]
      x-scope: user
      responses:
        '200':
          description: The secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, url]
                properties:
                  secret: { type: string }
                  url: { type: string }

  /account/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Turn two-factor sign-in on with a code from the new secret
      tags: [account]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string, maxLength: 64 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Turned on }
        '400': { $ref: '#/components/responses/BadRequest' }

  /account/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn two-factor sign-in off
      tags: [account]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 256 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Turned off }
        '400': { $ref: '#/components/responses/BadRequest' }

  /account/claude:
    get:
      operationId: getMyClaude
      summary: Your personal Claude connection (used by workspaces in per-member mode)
      tags: [account]
      x-scope: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaudeConnectionState' }
    put:
      operationId: setMyClaude
      summary: Connect your Claude account
      tags: [account]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaudeConnectionInput' }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaudeConnectionState' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteMyClaude
      summary: Disconnect your Claude account
      tags: [account]
      x-scope: user
      responses:
        '204': { description: Disconnected }

  /feedback:
    post:
      operationId: sendFeedback
      summary: Send feedback to the platform's Admins
      tags: [feedback]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, minLength: 1, maxLength: 5000 }
                workspace: { type: string, maxLength: 40, description: 'The slug of the workspace it is sent from (yours), for context' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /platform/feedback:
    get:
      operationId: listPlatformFeedback
      summary: Every feedback people sent, newest first (Admin)
      tags: [platform]
      x-scope: admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feedback' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/feedback/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updatePlatformFeedback
      summary: Mark a feedback done, or new again (Admin)
      tags: [platform]
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, done] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces:
    get:
      operationId: listWorkspaces
      summary: The workspaces you are a member of
      tags: [workspaces]
      x-scope: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceSummary' }
    post:
      operationId: createWorkspace
      summary: Create a workspace you own
      tags: [workspaces]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug: { type: string, maxLength: 40, description: 'The address in links; derived from the name when empty' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
    get:
      operationId: getInvite
      summary: What an invite link is for
      tags: [workspaces]
      security: []
      x-scope: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
    post:
      operationId: acceptInvite
      summary: Join the workspace an invite is for
      tags: [workspaces]
      x-scope: user
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspace:
    get:
      operationId: getWorkspace
      summary: The current workspace and your role in it
      tags: [workspace]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDetail' }
    put:
      operationId: updateWorkspace
      summary: Rename the workspace or change its address
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                slug: { type: string, maxLength: 40 }
      responses:
        '200':
          description: The workspace after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkspace
      summary: Delete the workspace (kept 7 days for undo, then purged)
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "The workspace's address, typed to confirm" }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workspace/members:
    get:
      operationId: listMembers
      summary: The workspace's members
      tags: [workspace]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }

  /workspace/members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeMember
      summary: Remove a member
      tags: [workspace]
      x-role: owner
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspace/members/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setMemberRole
      summary: Make a member (not the owner) a user or a viewer
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [user, viewer] }
      responses:
        '204': { description: Changed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspace/transfer:
    post:
      operationId: transferWorkspace
      summary: Make another member the owner
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '204': { description: Transferred }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/leave:
    post:
      operationId: leaveWorkspace
      x-viewer: true
      summary: Leave the workspace
      tags: [workspace]
      responses:
        '204': { description: Left }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspace/invites:
    get:
      operationId: listInvites
      summary: Open invites
      tags: [workspace]
      x-role: owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
    post:
      operationId: createInvite
      summary: Invite someone by email or by a link (valid 7 days)
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, maxLength: 254, description: 'Sends the link by email; empty makes a link to share yourself' }
                role: { type: string, enum: [user, viewer], description: 'The role the invite joins as (user when omitted)' }
      responses:
        '201':
          description: Created; the link is shown once
          content:
            application/json:
              schema:
                type: object
                required: [invite, url]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  url: { type: string }
                  emailed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspace/invites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokeInvite
      summary: Revoke an open invite
      tags: [workspace]
      x-role: owner
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/queue:
    get:
      operationId: getQueue
      summary: Where the workspace's tickets stand in the queue
      tags: [workspace]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueStatus' }

  /workspace/claude:
    get:
      operationId: getWorkspaceClaude
      summary: Which Claude account the workspace's runs use
      tags: [workspace]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceClaude' }
    put:
      operationId: updateWorkspaceClaude
      summary: Choose the Claude mode, the fallback and the default member
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [shared, member] }
                fallback: { type: boolean, description: Continue on workspace credits when the account is at its limit or missing }
                defaultMemberId: { type: integer, format: int64, description: 'Whose account tickets without a person use in per-member mode; 0 for the owner' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceClaude' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workspace/claude/connection:
    put:
      operationId: setWorkspaceClaudeConnection
      summary: Connect the workspace's shared Claude account
      tags: [workspace]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaudeConnectionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceClaude' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteWorkspaceClaudeConnection
      summary: Disconnect the workspace's shared Claude account
      tags: [workspace]
      x-role: owner
      responses:
        '204': { description: Disconnected }

  /workspace/billing:
    get:
      operationId: getBilling
      summary: The workspace's plan, slots, members and credits
      tags: [billing]
      x-role: owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Billing' }

  /workspace/billing/slots:
    put:
      operationId: setSlots
      summary: Change how many runs the workspace may have at once
      tags: [billing]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots: { type: integer, minimum: 1, maximum: 50, description: 'At most AGNTS_MAX_SLOTS (5 by default)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Billing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /workspace/billing/checkout:
    post:
      operationId: checkoutCredits
      summary: Start buying credits; returns the payment page to open
      tags: [billing]
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountUzs, provider]
              properties:
                amountUzs: { type: integer, format: int64, minimum: 10000, description: Amount to pay in so'm }
                provider: { type: string, enum: [payme, click] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, paymentId]
                properties:
                  url: { type: string }
                  paymentId: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /platform/overview:
    get:
      operationId: getPlatformOverview
      summary: Servers, runs and the queue across every workspace (Admin)
      tags: [platform]
      x-scope: admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/workspaces:
    get:
      operationId: listPlatformWorkspaces
      summary: Every workspace, metadata only (Admin)
      tags: [platform]
      x-scope: admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformWorkspace' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updatePlatformWorkspace
      summary: Change a workspace's plan, slots, member limit, or suspend it (Admin)
      tags: [platform]
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, maxLength: 40 }
                slots: { type: integer, minimum: 1, maximum: 50 }
                memberLimit: { type: integer, minimum: 0, maximum: 10000 }
                suspended: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformWorkspace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/workspaces/{id}/credits:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: grantCredits
      summary: Grant (or take back, when negative) credits (Admin)
      tags: [platform]
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, format: int64 }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformWorkspace' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/users:
    get:
      operationId: listPlatformUsers
      summary: Every user, with their workspaces and last sign-in (Admin)
      tags: [platform]
      x-scope: admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformUser' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/admins:
    post:
      operationId: createPlatformAdmin
      summary: Create an Admin account that signs in with a password (Admin)
      tags: [platform]
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                email: { type: string, maxLength: 254 }
                displayName: { type: string, maxLength: 100 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /platform/admins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deletePlatformAdmin
      summary: Delete an Admin account; not your own (Admin)
      tags: [platform]
      x-scope: admin
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updatePlatformUser
      summary: Grant or remove the Admin role (Admin); refused when Admins and Users are separate accounts
      tags: [platform]
      x-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAdmin]
              properties:
                isAdmin: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ci/failures:
    get:
      operationId: listCIFailures
      summary: CI failure groups, newest occurrence first
      tags: [ci]
      parameters:
        - name: repoId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          required: false
          description: Comma-separated statuses; empty for all
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CIFailure' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ci/failures/{failureId}:
    parameters:
      - $ref: '#/components/parameters/CIFailureID'
    get:
      operationId: getCIFailure
      summary: One CI failure group with its redacted log excerpt
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIFailure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ci/failures/{failureId}/fix:
    parameters:
      - $ref: '#/components/parameters/CIFailureID'
    post:
      operationId: fixCIFailure
      summary: Open a ticket that fixes the failure now (ignores the auto-fix setting and the daily budget)
      tags: [ci]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ci/failures/{failureId}/mute:
    parameters:
      - $ref: '#/components/parameters/CIFailureID'
    post:
      operationId: muteCIFailure
      summary: Ignore this failure (no tickets, no notifications)
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIFailure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ci/failures/{failureId}/unmute:
    parameters:
      - $ref: '#/components/parameters/CIFailureID'
    post:
      operationId: unmuteCIFailure
      summary: Watch a muted failure again
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIFailure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ci/failures/{failureId}/rerun:
    parameters:
      - $ref: '#/components/parameters/CIFailureID'
    post:
      operationId: rerunCIFailure
      summary: Re-run the failed jobs of the newest failing run on the git host
      tags: [ci]
      responses:
        '204': { description: Re-run started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /tickets/{key}/ci:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: getTicketCIFailure
      summary: The CI failure a CI ticket fixes (404 for other tickets)
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIFailure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/ci-watch:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: getRepoCIWatch
      summary: How agnts watches this repository's CI, and whether the git token can read it
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIWatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putRepoCIWatch
      summary: Change how agnts watches this repository's CI
      tags: [ci]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CIWatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIWatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    NetworkID:
      name: networkId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CIFailureID:
      name: failureId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RepoID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [jira, plane, github, claude, telegram, gitlab, openai] }
    RuleID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LessonID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RelationID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TicketKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$', maxLength: 64 }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hiro_session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    SignupInfo:
      type: object
      required: [open, firstUser, emailEnabled]
      properties:
        open: { type: boolean, description: Anyone can register; otherwise only with an invite link }
        firstUser: { type: boolean, description: No account exists yet; the first one becomes Admin }
        emailEnabled: { type: boolean, description: "The server can send email (verification, invites, resets)" }
        googleClientId: { type: string, description: 'OAuth client id for "Continue with Google" (a form post to /auth/google); absent when it is off' }
        passwordSignup: { type: boolean, description: 'Registering with a password works; when only Admins sign in with one, only for the first account' }

    RegisterRequest:
      type: object
      required: [email, password, client]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        username: { type: string, maxLength: 64, description: 'Derived from the email when empty' }
        displayName: { type: string, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 256 }
        workspaceName: { type: string, maxLength: 80, description: 'Name of the first workspace; not created when joining by invite' }
        invite: { type: string, maxLength: 200, description: An invite token to join with }
        client: { type: string, enum: [web, mobile] }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }

    WorkspaceRole:
      type: string
      description: 'owner runs the workspace; user works in it; viewer sees everything and changes nothing'
      enum: [owner, user, viewer]

    Feedback:
      type: object
      required: [id, kind, title, description, status, sender, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [feedback, connector], description: 'feedback: sent from an account; connector: a connector request from the website' }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [new, done] }
        sender: { type: string, description: 'The sender''s name when they sent it' }
        email: { type: string }
        userId: { type: integer, format: int64, description: 'Absent once the account is deleted' }
        workspace: { type: string, description: The name of the workspace it was sent from }
        createdAt: { type: string, format: date-time }

    PlatformUser:
      type: object
      description: A user as the Admin cabinet lists them
      required: [user, hasPassword, workspaces]
      properties:
        user: { $ref: '#/components/schemas/User' }
        hasPassword: { type: boolean, description: Can sign in with a password; false for accounts made with Google sign-in }
        lastSignInAt: { type: string, format: date-time, description: The newest session still on record }
        workspaces:
          type: array
          description: The workspaces they belong to (not deleted), with their role
          items: { $ref: '#/components/schemas/WorkspaceSummary' }

    WorkspaceSummary:
      type: object
      required: [id, slug, name, role, members, plan, slots]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        members: { type: integer }
        plan: { type: string }
        slots: { type: integer }
        suspended: { type: boolean }

    WorkspaceDetail:
      type: object
      required: [id, slug, name, role, ownerId, plan, slots, memberLimit, members, claudeMode, claudeFallback, creditsBalance, createdAt]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        ownerId: { type: integer, format: int64 }
        plan: { type: string }
        slots: { type: integer }
        memberLimit: { type: integer, description: 0 means no limit }
        members: { type: integer }
        claudeMode: { type: string, enum: [shared, member] }
        claudeFallback: { type: boolean }
        defaultMemberId: { type: integer, format: int64 }
        creditsBalance: { type: integer, format: int64 }
        trialEndsAt: { type: string, format: date-time }
        suspended: { type: boolean }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, username, role, joinedAt, claudeConnected]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, description: Shown to the owner only }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        joinedAt: { type: string, format: date-time }
        claudeConnected: { type: boolean, description: Has a personal Claude connection (per-member mode) }

    Invite:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    InvitePreview:
      type: object
      required: [workspace, expiresAt]
      properties:
        workspace: { type: string, description: The workspace's name }
        invitedBy: { type: string }
        email: { type: string }
        expiresAt: { type: string, format: date-time }

    Capacity:
      type: object
      required: [budgetMb, reservedMb, runs, full]
      properties:
        budgetMb: { type: integer, format: int64, description: Memory the server lends to runs; 0 when it is not limited }
        reservedMb: { type: integer, format: int64 }
        runs: { type: integer }
        diskFreeMb: { type: integer, format: int64 }
        full: { type: boolean }

    WaitReason:
      type: string
      enum: [blocked, slots, server, claude]
      description: >-
        Why a ticket waits for a worker: blocked (related tickets or held,
        for the team), slots (the workspace's runs are in use), server (no
        memory left on the server, for the platform), claude (the Claude
        account is at its limit or missing).

    QueueStatus:
      type: object
      required: [running, slots, waiting, serverQueue, serverQueueLength, capacity]
      properties:
        running: { type: integer }
        slots: { type: integer }
        waiting:
          type: object
          description: The workspace's waiting tickets by reason
          properties:
            blocked: { type: integer }
            slots: { type: integer }
            server: { type: integer }
            claude: { type: integer }
        serverQueue:
          type: array
          description: The workspace's tickets waiting for the server
          items:
            type: object
            required: [key, position, others]
            properties:
              key: { type: string }
              position: { type: integer, description: 1-based place in the whole server queue }
              others: { type: integer, description: Tickets of other workspaces ahead }
              estimateSec: { type: integer, description: About how long until it may start }
        serverQueueLength: { type: integer }
        capacity: { $ref: '#/components/schemas/Capacity' }

    ClaudeConnectionInput:
      type: object
      required: [kind, token]
      properties:
        kind: { type: string, enum: [subscription, api_key], description: 'subscription: a token from `claude setup-token`; api_key: an Anthropic API key' }
        token: { type: string, minLength: 10, maxLength: 500 }

    ClaudeConnectionState:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        kind: { type: string, enum: [subscription, api_key] }
        tokenHint: { type: string, description: The token's last four characters }
        account: { type: string }
        lastError: { type: string }
        pausedUntil: { type: string, format: date-time, description: At its usage limit until then }
        usage: { $ref: '#/components/schemas/Usage' }
        checkedAt: { type: string, format: date-time }

    WorkspaceClaude:
      type: object
      required: [mode, fallback, connection, members, creditsBalance, subscriptionsAllowed]
      properties:
        mode: { type: string, enum: [shared, member] }
        fallback: { type: boolean }
        defaultMemberId: { type: integer, format: int64 }
        connection: { $ref: '#/components/schemas/ClaudeConnectionState' }
        members:
          type: array
          description: Who has a personal connection (per-member mode)
          items:
            type: object
            required: [userId, username, connected]
            properties:
              userId: { type: integer, format: int64 }
              username: { type: string }
              connected: { type: boolean }
              pausedUntil: { type: string, format: date-time }
        creditsBalance: { type: integer, format: int64 }
        subscriptionsAllowed: { type: boolean, description: 'This server accepts Claude subscription tokens (self-hosted); otherwise API keys only' }

    LedgerEntry:
      type: object
      required: [id, amount, reason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        amount: { type: integer, format: int64, description: Credits; negative for spend }
        reason: { type: string, enum: [purchase, run, refund, grant] }
        ticketKey: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    Billing:
      type: object
      required: [plan, slots, maxSlots, memberLimit, members, creditsBalance, ledger, prices, paymentsEnabled]
      properties:
        plan: { type: string }
        slots: { type: integer }
        maxSlots: { type: integer }
        memberLimit: { type: integer }
        members: { type: integer }
        creditsBalance: { type: integer, format: int64 }
        trialEndsAt: { type: string, format: date-time }
        monthlyUzs: { type: integer, format: int64, description: "What the plan, extra slots and extra members cost a month" }
        monthlyUsd: { type: number, format: double, description: 'The same in US dollars, as the billing page shows it' }
        ledger:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
        prices:
          type: object
          required: [workspaceUzs, slotUzs, memberUzs, creditUzs, workspaceUsd, slotUsd, memberUsd, creditUsd, includedMembers, markup]
          properties:
            workspaceUsd: { type: number, format: double, description: 'A workspace a month, in US dollars (shown on the billing page)' }
            slotUsd: { type: number, format: double, description: 'An extra parallel run a month, in US dollars' }
            memberUsd: { type: number, format: double, description: 'A member above the included ones a month, in US dollars' }
            creditUsd: { type: number, format: double, description: 'One credit, in US dollars' }
            workspaceUzs: { type: integer, format: int64 }
            slotUzs: { type: integer, format: int64 }
            memberUzs: { type: integer, format: int64 }
            creditUzs: { type: integer, format: int64, description: Price of one credit ($0.01 of API cost at the markup) }
            includedMembers: { type: integer }
            markup: { type: number }
        paymentsEnabled: { type: boolean }
        selfHosted: { type: boolean, description: 'No billing: slots and members are set by the Admin' }

    PlatformWorkspace:
      type: object
      required: [id, slug, name, plan, slots, memberLimit, members, creditsBalance, running, createdAt]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        owner: { type: string }
        plan: { type: string }
        slots: { type: integer }
        memberLimit: { type: integer }
        members: { type: integer }
        creditsBalance: { type: integer, format: int64 }
        running: { type: integer }
        suspended: { type: boolean }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PlatformOverview:
      type: object
      required: [capacity, runs, serverQueue, workspaces, users]
      properties:
        capacity: { $ref: '#/components/schemas/Capacity' }
        runs:
          type: array
          items:
            type: object
            required: [workspaceId, ticketKey, stage, startedAt]
            properties:
              workspaceId: { type: integer, format: int64 }
              workspace: { type: string }
              ticketKey: { type: string }
              stage: { type: string }
              startedAt: { type: string, format: date-time }
        serverQueue:
          type: array
          items:
            type: object
            required: [workspaceId, ticketKey]
            properties:
              workspaceId: { type: integer, format: int64 }
              workspace: { type: string }
              ticketKey: { type: string }
        workspaces: { type: integer }
        users: { type: integer }

    LoginRequest:
      type: object
      required: [username, password, client]
      properties:
        username: { type: string, minLength: 1, maxLength: 254, description: Username or email }
        password: { type: string, minLength: 1, maxLength: 256 }
        code:
          type: string
          description: Six-digit code from the authenticator app, when two-factor sign-in is on
          pattern: '^[0-9]{6}$'
        totpSecret:
          type: string
          maxLength: 128
          description: An Admin finishing two-factor setup at sign-in (beginLoginTotp's secret); code must match it
        client:
          type: string
          enum: [web, mobile]

    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 1, maxLength: 4096, description: The ID token Google Sign-In gave the app }
        invite: { type: string, maxLength: 256, description: "An invite link's token, to join that workspace" }

    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
        token:
          type: string
          description: Session token, returned only when client is mobile

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        isAdmin: { type: boolean, description: The platform operator (system role Admin) }
        hasTotp: { type: boolean, description: Signs in with a second factor }
        lastWorkspace: { type: string, description: The slug of the workspace opened last }
        workspaces:
          type: array
          description: The workspaces the user is a member of (on /auth/me only)
          items: { $ref: '#/components/schemas/WorkspaceSummary' }
        createdAt: { type: string, format: date-time }

    Meta:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    TicketState:
      type: string
      enum: [new, analyzing, waiting_for_answers, coding, testing, waiting_for_review, pushing, done, rejected, failed, rate_limited]

    TicketKind:
      type: string
      enum: [code, test, plan, analysis, bug, review]
      description: >-
        What the work produces. code and test make a change (diff, checks,
        pull request); plan, analysis and bug write a Markdown report.
        review reviews a pull request someone else opened (source git):
        approving it merges the pull request. Nobody picks review: those
        tickets come from syncing the git host.

    TicketKindChoice:
      type: string
      enum: [auto, code, test, plan, analysis, bug]
      description: A kind, or auto for agnts to pick one during analysis

    ImplementInput:
      type: object
      properties:
        repoId: { type: integer, format: int64, description: 'Where to implement it; defaults to the report''s repository' }
        start:
          type: string
          enum: [code, queue]
          description: 'code = start now without questions (default), queue = keep until started'

    Footprint:
      type: object
      description: What the analysis predicts the work will change; the queue compares footprints
      required: [files]
      properties:
        files:
          type: array
          items: { type: string }
        modules:
          type: array
          items: { type: string }
        provides:
          type: array
          description: What the change adds that other work could use
          items: { type: string }
        consumes:
          type: array
          description: What the change needs that may not exist yet
          items: { type: string }
        migrations: { type: boolean }

    Blocker:
      type: object
      required: [key, title, state, type]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        type: { $ref: '#/components/schemas/RelationType' }

    RelationType:
      type: string
      enum: [depends_on, conflicts]
      description: 'depends_on: one waits for the other to merge; conflicts: both change the same code, so they do not run side by side'

    RelationInput:
      type: object
      required: [otherKey, type]
      properties:
        otherKey: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/RelationType' }

    Relation:
      type: object
      required: [id, type, direction, source, status, confidence, reason, basis, files, other, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/RelationType' }
        direction:
          type: string
          enum: [waits_for, waited_by, conflicts]
          description: 'From the ticket asked about: it waits for other, other waits for it, or they conflict'
        source:
          type: string
          enum: [jira, plane, user, agnts, rule, git]
          description: 'Who found it: a Jira link, a Plane relation, a person, the analysis, overlapping footprints, or the finished diffs (when nobody predicted it)'
        status:
          type: string
          enum: [active, proposed, dismissed]
          description: Only active relations hold the queue; proposed ones wait for a person
        confidence: { type: number, format: double }
        reason: { type: string }
        basis:
          type: string
          description: 'For rule and git relations: files, migrations, lockfile, codegen, i18n or diff'
        files:
          type: array
          description: Files both tickets change, when known
          items: { type: string }
        other: { $ref: '#/components/schemas/RelatedTicket' }
        confirmedAt: { type: string, format: date-time, description: When the finished changes proved the conflict real }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RelatedTicket:
      type: object
      required: [key, title, state, landed]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        landed: { type: boolean, description: 'Its change is merged (or it was rejected): it holds nothing back' }

    Relations:
      type: object
      required: [items, blockedBy]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        blockedBy:
          type: array
          description: What holds the ticket's coding back right now
          items: { $ref: '#/components/schemas/Blocker' }

    FollowUpsMode:
      type: string
      enum: [inherit, 'on', 'off']
      description: 'Follow-up suggestions for one ticket: inherit follows Settings'

    FollowUpsSetting:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/FollowUpsMode' }

    FollowUpSuggestion:
      type: object
      required: [id, source, type, revision, title, description, serves, kind, priority, status, ready, createdAt]
      properties:
        id: { type: integer, format: int64 }
        source:
          type: string
          enum: [analyze, work, review, manual]
          description: 'The run that suggested it; manual = made from a review finding'
        type:
          type: string
          enum: [prerequisite, split, unfinished, gap]
          description: How it serves the parent ticket
        revision: { type: integer, description: "The parent's revision when it was suggested" }
        title: { type: string }
        description: { type: string }
        serves: { type: string, description: How it helps finish the parent ticket }
        kind: { $ref: '#/components/schemas/TicketKind' }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, accepted, dismissed] }
        ready: { type: boolean, description: 'A ticket can be made from it now (open, and the parent is done unless the analysis suggested it)' }
        after:
          type: array
          items: { type: integer, format: int64 }
          description: 'Ids of sibling suggestions that must land first; once both are tickets, this one depends on them'
        childKey: { type: string, description: 'The ticket made from it' }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    FollowUpTicket:
      type: object
      required: [key, title, state, kind, source]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        kind: { $ref: '#/components/schemas/TicketKind' }
        source: { type: string, enum: [jira, plane, local, git, ci] }
        held: { type: boolean }

    FollowUps:
      type: object
      required: [enabled, suggestions, children]
      properties:
        enabled: { type: boolean, description: "This ticket's runs suggest follow-ups" }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/FollowUpSuggestion' }
        children:
          type: array
          description: Tickets made from the suggestions
          items: { $ref: '#/components/schemas/FollowUpTicket' }

    AcceptFollowUp:
      type: object
      required: [id]
      description: A suggestion to create, with optional edits
      properties:
        id: { type: integer, format: int64 }
        target:
          type: string
          enum: [local, jira, plane]
          description: 'local = an agnts task (default), jira = a new issue in the Jira project, plane = a new work item in the Plane project'
        title: { type: string, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        kind: { $ref: '#/components/schemas/TicketKind' }
        priority: { type: string, enum: [low, medium, high] }
        repoId: { type: integer, format: int64, description: "Defaults to the parent ticket's repository" }

    AcceptFollowUps:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AcceptFollowUp' }
        start:
          type: boolean
          description: 'Queue the new tickets to run now instead of holding them until someone starts each one'

    AcceptFollowUpResult:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        ticket: { $ref: '#/components/schemas/Ticket' }
        error: { type: string, description: 'Why no ticket was made from this suggestion' }

    AcceptFollowUpsResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AcceptFollowUpResult' }

    TranslationLanguage:
      type: string
      description: A language agnts can translate into
      enum: [en, ru, uz, kk, tr, de, es, fr, zh, ja, ko, ar]

    TranslateInput:
      type: object
      required: [lang]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }

    Translation:
      type: object
      required: [lang, items]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }
        items:
          type: array
          description: Each text as the ticket page shows it, and its translation
          items:
            type: object
            required: [source, text]
            properties:
              source: { type: string }
              text: { type: string }

    TicketKindInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/TicketKindChoice' }

    Ticket:
      type: object
      required: [key, source, title, description, priority, state, revision, turns, branch, prUrl, kind, kindAuto, createdAt, updatedAt]
      properties:
        key: { type: string }
        source: { type: string, enum: [jira, plane, local, git, ci] }
        repoId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        resumeState: { $ref: '#/components/schemas/TicketState' }
        revision: { type: integer }
        replayOf: { type: string, description: 'For a replay: the done ticket it re-runs. Replays are never pushed.' }
        turns: { type: integer }
        branch: { type: string }
        headSha: { type: string, description: "The reviewed commit: the branch head agnts committed, or for a pull request review the head agnts reviewed" }
        prNumber: { type: integer }
        prUrl: { type: string }
        ciFixes: { type: integer, description: 'Rounds a red CI check sent the pull request back to coding' }
        assignees:
          type: array
          description: Git host usernames the pull request is (or will be) assigned to
          items: { type: string }
        afterApprove: { type: string, enum: [pr, main] }
        held: { type: boolean, description: Kept in the queue until started }
        askFirst: { type: boolean }
        kind: { $ref: '#/components/schemas/TicketKind' }
        kindAuto: { type: boolean, description: 'agnts picks the kind; the analysis may still change it' }
        postReport: { type: boolean, description: 'The approved report is posted to the tracker issue' }
        parentKey: { type: string, description: 'The plan or bug investigation this ticket implements' }
        followUpOf: { type: string, description: 'The ticket that suggested this one as a follow-up' }
        suggestFollowUps: { $ref: '#/components/schemas/FollowUpsMode' }
        openSuggestions: { type: integer, description: 'Follow-up suggestions waiting for a decision' }
        blockedBy:
          type: array
          description: >-
            The tickets holding this one's coding back right now (it is in
            coding with no commit yet). Absent when nothing does.
          items: { $ref: '#/components/schemas/Blocker' }
        repoName: { type: string }
        models: { $ref: '#/components/schemas/ModelOverrides' }
        since: { type: string, format: date-time, description: When the ticket entered its current state }
        stopReason: { type: string, description: Why it failed or paused }
        mergedAt: { type: string, format: date-time }
        pull: { $ref: '#/components/schemas/PullRequest' }
        trackerUpdate: { $ref: '#/components/schemas/TrackerUpdate' }
        learnState:
          type: string
          enum: [none, pending, done, failed]
          description: The learn run after push; pending also while it runs
        reviewState:
          type: string
          enum: [none, pending, running, done, failed]
          description: The code review agnts runs beside the human review
        previewState:
          type: string
          enum: [none, pending, running, done, failed]
          description: The screenshots agnts takes beside the human review
        previewCompare: { type: boolean, description: Previews of this ticket also capture the default branch (before shots) }
        canPreview: { type: boolean, description: The ticket's repository has a preview command }
        spend: { $ref: '#/components/schemas/TokenSpend' }
        waitReason: { $ref: '#/components/schemas/WaitReason' }
        waitMessage: { type: string, description: "Why it waits, in a sentence" }
        queuedAt: { type: string, format: date-time, description: When it started waiting for a worker }
        memberId: { type: integer, format: int64, description: 'Whose ticket it is (per-member Claude mode runs on their account)' }
        member: { type: string, description: The member's username }
        createdBy: { type: string, description: Who created it; absent for webhooks and agnts }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TokenSpend:
      type: object
      description: >-
        Tokens Claude used (on a ticket: all its runs; absent until one is
        recorded). costUsd is what Claude Code reports the same work
        would cost on the API; on a Claude plan it is an estimate, not a charge.
      required: [input, output, cacheRead, cacheWrite, total, costUsd]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        cacheWrite: { type: integer, format: int64 }
        total: { type: integer, format: int64, description: All four counts added }
        costUsd: { type: number, format: double }

    TicketSpendList:
      type: object
      required: [days, total, tickets]
      properties:
        days: { type: integer }
        total: { $ref: '#/components/schemas/TokenSpend' }
        tickets:
          type: array
          description: Costliest first; partial runs have no cost, so ties fall back to tokens
          items: { $ref: '#/components/schemas/TicketSpendRow' }

    TicketSpendRow:
      type: object
      description: One ticket's spend within the period (not its lifetime spend)
      required: [key, title, kind, state, calls, topStage, spend]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { $ref: '#/components/schemas/TicketKind' }
        state: { $ref: '#/components/schemas/TicketState' }
        repoName: { type: string }
        calls: { type: integer, description: Claude invocations in the period }
        topStage:
          type: string
          enum: [analyze, coding, retry, helper, learn, review, preview]
          description: The stage that cost the most
        spend: { $ref: '#/components/schemas/TokenSpend' }

    StageSpend:
      type: object
      description: Spend for one stage and model; on a ticket, in the order the stage first ran
      required: [stage, model, calls, turns, partial, spend]
      properties:
        stage:
          type: string
          enum: [analyze, coding, retry, helper, learn, review, preview]
          description: 'retry is fix attempts after failed checks and requested changes'
        model: { type: string }
        calls: { type: integer, description: Claude invocations }
        turns: { type: integer }
        partial:
          type: boolean
          description: A run was cut off, so its tokens are counted from the messages seen and its cost is unknown
        spend: { $ref: '#/components/schemas/TokenSpend' }

    Question:
      type: object
      required: [id, position, text, options, multiple, note]
      properties:
        id: { type: integer, format: int64 }
        position: { type: integer }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        multiple:
          type: boolean
          description: Several options may be chosen; the answer then lists the chosen ones, one per line
        answer: { type: string }
        note: { type: string }

    Attachment:
      type: object
      required: [id, name, contentType, size, purpose, url, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, description: Bytes }
        purpose:
          type: string
          enum: [pending, ticket, answer, retry, feedback]
          description: 'pending = uploaded, not attached yet; ticket = the task description; answer = an answer (see questionId); retry = a retry note; feedback = requested changes'
        questionId: { type: integer, format: int64 }
        image: { type: boolean, description: 'A picture clients can show in place' }
        url: { type: string, description: 'Where to load the file, relative to the API base' }
        createdAt: { type: string, format: date-time }

    Analysis:
      type: object
      required: [summary, plan]
      properties:
        summary: { type: string }
        plan:
          type: array
          items: { type: string }
        complexity:
          type: string
          enum: [simple, complex]
          description: The analysis's rating; picks the review model on auto
        footprint: { $ref: '#/components/schemas/Footprint' }
        approaches:
          type: array
          description: Ways to do the work that the analysis weighed; exactly one is chosen
          items: { $ref: '#/components/schemas/Approach' }
        outOfScope:
          type: array
          description: What the work will deliberately not do
          items: { type: string }
        ship: { $ref: '#/components/schemas/ShipNotes' }
        defect: { type: boolean, description: 'The work fixes broken behaviour; with proveFixes on it must prove the fix' }
        acceptance:
          type: array
          description: What the finished work must do, as checks
          items:
            type: object
            required: [id, criterion, check]
            properties:
              id: { type: string }
              criterion: { type: string }
              check: { type: string, enum: [ui, api, test, manual] }
        secondOpinion: { $ref: '#/components/schemas/SecondOpinion' }

    Approach:
      type: object
      required: [title, sketch, pros, cons, chosen]
      properties:
        title: { type: string }
        sketch: { type: string }
        pros:
          type: array
          items: { type: string }
        cons:
          type: array
          items: { type: string }
        fit: { type: string, description: 'How it fits the repository brief and the team rules, or what it bends' }
        chosen: { type: boolean }
        why: { type: string, description: 'For the chosen approach, why it beats the others; for the others, why not' }

    ShipNotes:
      type: object
      description: How the change ships; absent fields do not apply
      properties:
        migrations: { type: string }
        compatibility: { type: string }
        rollout: { type: string }
        rollback: { type: string }

    Finding:
      type: object
      required: [severity, category, title]
      properties:
        severity: { type: string, enum: [blocker, major, minor, nit] }
        category:
          type: string
          enum: [correctness, security, performance, tests, rules, architecture, scope, maintainability, accuracy, completeness, other]
        file: { type: string, description: Path relative to the repository }
        line: { type: integer }
        title: { type: string }
        detail: { type: string }
        suggestion: { type: string, description: 'What to change, written to be sent back as feedback' }
        confidence: { type: number, description: "How sure the reviewer was, 0 to 1; absent when it did not say" }
        pass: { type: string, description: 'The specialist pass that found it (security, failures, tests, types), empty for the main review' }
        adopted: { type: boolean, description: "A person put it in their feedback" }

    CodeReview:
      type: object
      required: [revision, model, modelReason, verdict, summary, findings, strengths, createdAt]
      description: >-
        agnts's review of the latest result, advice beside the human review.
        It reviewed an older revision when revision is below the ticket's.
      properties:
        revision: { type: integer }
        model: { $ref: '#/components/schemas/Model' }
        modelReason: { type: string, description: Why this model reviewed it }
        verdict: { type: string, enum: [looks_good, has_concerns, needs_changes] }
        summary: { type: string }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        strengths:
          type: array
          items: { type: string }
        deep: { type: boolean, description: The review ran the specialist passes }
        dropped: { type: integer, description: Findings left out for low confidence or as duplicates }
        createdAt: { type: string, format: date-time }

    ShotRef:
      type: object
      required: [runId, shotId]
      properties:
        runId: { type: integer, format: int64 }
        shotId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }

    PreviewInput:
      type: object
      properties:
        compare: { type: boolean, description: Also capture the default branch; kept for later previews of the ticket }

    PreviewShot:
      type: object
      required: [id, name, route, viewport, side, url]
      properties:
        id: { type: string }
        name: { type: string }
        route: { type: string }
        viewport: { type: string, enum: [desktop, phone] }
        side: { type: string, enum: [after, before] }
        note: { type: string }
        width: { type: integer }
        height: { type: integer }
        consoleErrors: { type: integer }
        url: { type: string, description: 'Where to load the PNG, relative to the API base' }

    PreviewIssue:
      type: object
      required: [severity, description]
      properties:
        severity: { type: string, enum: [high, medium, low] }
        description: { type: string }
        shotId: { type: string }

    TicketPreview:
      type: object
      required: [runId, revision, model, compare, status, summary, shots, issues, createdAt]
      description: >-
        Screenshots of the running app at the latest result, advice beside
        the human review. It shows an older revision when revision is below
        the ticket's.
      properties:
        runId: { type: integer, format: int64 }
        revision: { type: integer }
        model: { $ref: '#/components/schemas/Model' }
        compare: { type: boolean, description: Before shots were taken too }
        status: { type: string, enum: [ok, partial, failed], description: 'failed: the app did not start' }
        summary: { type: string }
        shots:
          type: array
          items: { $ref: '#/components/schemas/PreviewShot' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/PreviewIssue' }
        acceptance: { $ref: '#/components/schemas/Acceptance' }
        createdAt: { type: string, format: date-time }

    CheckStep:
      type: object
      required: [name, command, exitCode, durationMs]
      properties:
        name: { type: string }
        command: { type: string }
        exitCode: { type: integer }
        durationMs: { type: integer, format: int64 }
        timedOut: { type: boolean }
        output: { type: string }

    FileChange:
      type: object
      required: [path, add, del, diff]
      properties:
        path: { type: string }
        add: { type: integer }
        del: { type: integer }
        diff: { type: string }

    Result:
      type: object
      required: [summary, notes, checks, files, createdAt]
      properties:
        summary: { type: string }
        notes:
          type: array
          items: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/CheckStep' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileChange' }
        report: { type: string, description: 'The Markdown report, for report kinds' }
        deviations:
          type: array
          description: Where the work departed from the chosen approach or the plan, and why
          items: { type: string }
        redFlags:
          type: array
          description: "Lines agnts's scan of the change flagged for the reviewer: skipped tests, removed assertions, silenced linters and the like"
          items: { $ref: '#/components/schemas/RedFlag' }
        proof: { $ref: '#/components/schemas/Proof' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        createdAt: { type: string, format: date-time }

    RedFlag:
      type: object
      required: [kind, path, text]
      properties:
        kind: { type: string, enum: [secret, env_file, skipped_test, removed_assertion, deleted_test, silenced_lint, check_config, swallowed_error, rule_violation, debug_leftover, todo, new_dependency] }
        path: { type: string }
        line: { type: integer, description: Line in the new file; absent for the whole file }
        text: { type: string }

    TicketDetail:
      type: object
      required: [ticket, questions, attachments]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        attachments:
          type: array
          description: Files attached to the task, its answers and retry notes, oldest first
          items: { $ref: '#/components/schemas/Attachment' }
        analysis: { $ref: '#/components/schemas/Analysis' }
        result: { $ref: '#/components/schemas/Result' }
        childKey: { type: string, description: 'The code task that implements this report, if any' }
        followUps: { $ref: '#/components/schemas/FollowUps' }
        relations: { $ref: '#/components/schemas/Relations' }
        review: { $ref: '#/components/schemas/CodeReview' }
        preview: { $ref: '#/components/schemas/TicketPreview' }
        history:
          type: array
          items: { $ref: '#/components/schemas/HistoryItem' }
        maxTurns: { type: integer }
        effectiveModels: { $ref: '#/components/schemas/StageModels' }
        spendByStage:
          type: array
          description: Empty until a Claude run is recorded
          items: { $ref: '#/components/schemas/StageSpend' }

    Event:
      type: object
      required: [id, ticketKey, step, type, level, origin, message, data, createdAt]
      properties:
        id: { type: integer, format: int64 }
        ticketKey: { type: string }
        runId: { type: integer, format: int64 }
        step: { type: string }
        type: { type: string }
        level: { type: string, enum: [debug, info, warn, error] }
        origin: { type: string, enum: [system, web, mobile, mcp, telegram, webhook] }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
        durationMs: { type: integer, format: int64 }
        user: { type: string, description: The person behind the event; absent for agnts }
        createdAt: { type: string, format: date-time }

    AnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, format: int64 }
              answer: { type: string, minLength: 1, maxLength: 5000, description: 'For a multiple-choice question, the chosen options, one per line' }
              note: { type: string, maxLength: 5000 }
              attachments:
                type: array
                maxItems: 10
                description: Uploads to attach to this answer
                items: { type: integer, format: int64 }

    Model:
      type: string
      pattern: '^(haiku|sonnet|opus|codex:[a-z0-9][a-z0-9._-]{0,63})$'
      description: 'A Claude model (haiku, sonnet, opus), or codex:<model> for a run on Codex CLI'

    ReviewModel:
      type: string
      pattern: '^(auto|haiku|sonnet|opus|codex:[a-z0-9][a-z0-9._-]{0,63})$'
      description: 'auto: opus for complex tickets, sonnet otherwise'

    StageModels:
      type: object
      required: [analyze, coding, retry, helper]
      properties:
        analyze: { $ref: '#/components/schemas/Model' }
        coding: { $ref: '#/components/schemas/Model' }
        retry: { $ref: '#/components/schemas/Model' }
        helper: { $ref: '#/components/schemas/Model' }
        learn: { $ref: '#/components/schemas/Model' }
        review: { $ref: '#/components/schemas/ReviewModel' }
        preview: { $ref: '#/components/schemas/Model' }

    TicketRepo:
      type: object
      required: [repoId]
      properties:
        repoId: { type: integer, format: int64 }

    ModelOverrides:
      type: object
      properties:
        analyze: { $ref: '#/components/schemas/Model' }
        coding: { $ref: '#/components/schemas/Model' }
        retry: { $ref: '#/components/schemas/Model' }
        review: { $ref: '#/components/schemas/Model' }
        preview: { $ref: '#/components/schemas/Model' }

    HistoryItem:
      type: object
      required: [at, state, message, origin]
      properties:
        at: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/TicketState' }
        message: { type: string }
        origin: { type: string }
        user: { type: string, description: The person behind it; absent for agnts }

    TaskCreate:
      type: object
      required: [title, priority, afterApprove, start]
      properties:
        repoId: { type: integer, format: int64, description: 'Omit for a task without a repository (report kinds or auto)' }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, medium, high] }
        afterApprove: { type: string, enum: [pr, main] }
        start:
          type: string
          enum: [ask, code, queue]
          description: ask = analyse and ask first, code = no questions, queue = keep until started
        followUps: { $ref: '#/components/schemas/FollowUpsMode' }
        attachments:
          type: array
          maxItems: 10
          description: Uploads to attach to the description
          items: { type: integer, format: int64 }

    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, medium, high] }
        afterApprove: { type: string, enum: [pr, main] }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        attachments:
          type: array
          maxItems: 10
          description: 'The files the description should have: the task''s files to keep and new uploads. Left out keeps them; files not listed are deleted.'
          items: { type: integer, format: int64 }

    EventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        nextBefore: { type: integer, format: int64 }

    StepDuration:
      type: object
      required: [state, count]
      properties:
        state: { $ref: '#/components/schemas/TicketState' }
        avgMs: { type: integer, format: int64 }
        count: { type: integer }

    EventSummary:
      type: object
      required: [runsStarted, reachedReview, avgTurns, stops, errors, steps]
      properties:
        runsStarted: { type: integer }
        reachedReview: { type: integer }
        avgTurns: { type: integer }
        stops: { type: integer }
        errors: { type: integer }
        steps:
          type: array
          items: { $ref: '#/components/schemas/StepDuration' }

    UsageWindow:
      type: object
      properties:
        utilization: { type: number, format: double, description: 0 to 1 }
        resetsAt: { type: string, format: date-time }

    Usage:
      type: object
      required: [fiveHour, sevenDay, status, paused, pauseAbove, refreshing]
      properties:
        fiveHour: { $ref: '#/components/schemas/UsageWindow' }
        sevenDay: { $ref: '#/components/schemas/UsageWindow' }
        status: { type: string, enum: [allowed, allowed_warning, rejected, unknown] }
        updatedAt: { type: string, format: date-time }
        paused: { type: boolean, description: New runs are held back }
        pausedUntil: { type: string, format: date-time }
        pauseAbove: { type: integer }
        refreshing: { type: boolean }

    GitSettings:
      type: object
      required: [authorName, authorEmail, coAuthor, prTitle, draft]
      properties:
        authorName: { type: string, maxLength: 200 }
        authorEmail: { type: string, maxLength: 200 }
        coAuthor: { type: boolean, description: Add a Co-authored-by agnts line }
        prTitle: { type: string, maxLength: 200, description: '{key} and {title} are replaced' }
        draft: { type: boolean }

    Settings:
      type: object
      required: [models, maxTurns, timeoutMin, allow, deny, askFirst, autoResume, pauseAbove, parallel, git]
      properties:
        models: { $ref: '#/components/schemas/StageModels' }
        maxTurns: { type: integer, minimum: 20, maximum: 200 }
        timeoutMin: { type: integer, minimum: 10, maximum: 120 }
        allow:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
        deny:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
        askFirst: { type: boolean }
        autoResume: { type: boolean }
        autoLearn: { type: boolean, description: Learn from every pushed ticket }
        autoReview: { type: boolean, description: Review every result while it waits for review }
        autoPreview: { type: boolean, description: Take screenshots of every UI change in repositories with a preview command }
        visualCheck: { type: boolean, description: Coding runs may start the app and look at the pages they changed }
        autoBrief: { type: boolean, description: 'Survey a repository without a brief when its first ticket is analysed, and refresh the brief after merges' }
        selfReview: { type: boolean, description: "Send blocker and major findings of agnts's code review back to the coder once per revision, before a person reviews" }
        reflect: { type: boolean, description: 'Learn from change requests and rejections: suggest rules, which apply once someone adopts them' }
        egressAllow:
          type: array
          maxItems: 50
          description: 'Hosts run containers may reach besides the built-in list, such as a staging API; .example.com matches subdomains'
          items: { type: string, maxLength: 253 }
        suggestFollowUps: { type: boolean, description: 'Runs suggest follow-up tickets (off by default; a ticket can override it)' }
        pullReviews: { $ref: '#/components/schemas/PullReviewSettings' }
        ci: { $ref: '#/components/schemas/CISettings' }
        guard: { $ref: '#/components/schemas/GuardSettings' }
        stalls:
          type: string
          pattern: '^(off|log|act)$'
          description: 'What agnts does when a run looks stuck: nothing, note it on the ticket, or also tell Claude to step back (once per run)'
        proveFixes: { type: boolean, description: 'Bug fixes need a test that fails before the change and passes after it; agnts checks it' }
        deepReview:
          type: string
          pattern: '^(off|auto|always)$'
          description: 'Specialist passes in the code review (security, silent failures, tests, types); auto: large or complex work'
        learnFromRuns: { type: boolean, description: 'Suggest tips from runs that had trouble (failed checks, a stall)' }
        secondOpinion:
          type: string
          maxLength: 80
          description: 'A model that critiques the chosen approach of complex tickets (codex:<model> or a Claude model); empty turns it off'
        pauseAbove: { type: integer, minimum: 50, maximum: 100 }
        parallel: { type: integer, minimum: 1, maximum: 3 }
        git: { $ref: '#/components/schemas/GitSettings' }
        notify: { $ref: '#/components/schemas/NotifySettings' }

    GuardSettings:
      type: object
      required: [profile, disabled, factCheck]
      description: How strict agnts-guard, the hooks inside every run, is
      properties:
        profile: { $ref: '#/components/schemas/GuardProfile' }
        disabled:
          type: array
          maxItems: 20
          description: Guard hooks turned off
          items: { $ref: '#/components/schemas/GuardHook' }
        factCheck: { type: integer, minimum: 0, maximum: 100, description: 'Percent of strict-profile tickets whose runs must state facts before the first edit of each file (A/B)' }

    GuardProfile:
      type: string
      enum: [minimal, standard, strict]

    GuardHook:
      type: string
      enum: ['pre:secret', 'pre:redflags', 'pre:rules', 'pre:fact-check', 'pre:destructive', 'post:edit-check', 'stop:gate', 'session:progress']

    EditCheck:
      type: object
      required: [name, globs, cmd]
      properties:
        name: { type: string, maxLength: 80 }
        globs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        cmd: { type: string, maxLength: 2000, description: '{file} is the edited file, {dir} its directory, both relative to the repository' }
        every: { type: integer, minimum: 0, maximum: 3600, description: 'Seconds between runs; 0 runs it after every edit' }

    CoverageConfig:
      type: object
      properties:
        enabled: { type: boolean }
        command: { type: string, maxLength: 2000, description: 'Runs the tests with coverage; empty uses the one agnts derives' }
        report: { type: string, maxLength: 500, description: 'The report the command writes (Go profile or lcov), in the repository or under /agnts/out/' }
        threshold: { type: integer, minimum: 0, maximum: 100 }

    AgentConfigFinding:
      type: object
      required: [path, kind, severity, text]
      properties:
        path: { type: string }
        line: { type: integer }
        kind: { type: string, enum: [hidden_unicode, agent_instruction, exfiltration, encoded_blob, hooks, mcp_server] }
        severity: { type: string, enum: [high, medium, info] }
        text: { type: string }

    AgentConfigScan:
      type: object
      required: [scannedAt, findings]
      description: "What agnts found in the repository's instructions for AI agents (CLAUDE.md, AGENTS.md, .claude/, .mcp.json)"
      properties:
        scannedAt: { type: string, format: date-time }
        findings:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigFinding' }

    RepoHarnessInput:
      type: object
      properties:
        guardProfile:
          type: string
          enum: ['', minimal, standard, strict]
          description: Empty follows the workspace
        secretAllow:
          type: array
          maxItems: 50
          description: 'Path globs where example credentials are expected, besides testdata/, fixtures/ and *.example'
          items: { type: string, maxLength: 200 }
        editChecks:
          type: array
          maxItems: 20
          nullable: true
          description: 'Per-file checks after each edit; null uses the ones agnts derives from the toolchains'
          items: { $ref: '#/components/schemas/EditCheck' }
        editChecksOff: { type: boolean }
        coverage: { $ref: '#/components/schemas/CoverageConfig' }
        acceptance: { type: boolean, description: "Check the ticket's acceptance criteria in the running app after the preview" }

    RepoHarness:
      allOf:
        - $ref: '#/components/schemas/RepoHarnessInput'
        - type: object
          properties:
            derivedEditChecks:
              type: array
              description: The per-file checks agnts derives from the toolchains
              items: { $ref: '#/components/schemas/EditCheck' }
            derivedCoverage:
              type: object
              description: The coverage command agnts derives; empty when it knows none
              properties:
                command: { type: string }
                report: { type: string }
            agentConfig: { $ref: '#/components/schemas/AgentConfigScan' }

    StarterPack:
      type: object
      required: [pack, name, rules, offered]
      properties:
        pack: { type: string }
        name: { type: string }
        rules: { type: integer }
        offered: { type: boolean, description: "Its rules are already among the repository's rules or suggestions" }

    RuleEnforce:
      type: object
      required: ['on', action]
      description: 'agnts-guard checks the rule while Claude works: file (edits of matching files, or added lines matching the pattern), bash (commands), diff (the finished change, on the server)'
      properties:
        'on': { type: string, enum: [file, bash, diff] }
        paths:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        pattern: { type: string, maxLength: 500, description: A regular expression (RE2) }
        action: { type: string, enum: [block, warn] }
        message: { type: string, maxLength: 1000 }

    TryEnforceInput:
      type: object
      required: [enforce]
      properties:
        enforce: { $ref: '#/components/schemas/RuleEnforce' }
        repoId: { type: integer, format: int64, description: Leave out to check every repository }

    TryEnforceResult:
      type: object
      required: [checked, tickets, hits]
      properties:
        checked: { type: integer, description: Changes looked at }
        tickets:
          type: array
          items: { type: string }
        hits:
          type: array
          items:
            type: object
            required: [ticket, path, text]
            properties:
              ticket: { type: string }
              path: { type: string }
              line: { type: integer }
              text: { type: string }
        note: { type: string }

    Proof:
      type: object
      required: [status, tests]
      description: 'Evidence that a bug fix fixes the bug: reproducing tests run before and after the change'
      properties:
        status: { type: string, enum: [proven, not_reproduced, still_failing, inconclusive, no_test, error] }
        base: { type: string, description: The commit the change started from }
        why: { type: string }
        tests:
          type: array
          items: { $ref: '#/components/schemas/ProofTest' }

    ProofTest:
      type: object
      required: [file, name, command, status, before, after]
      properties:
        file: { type: string }
        name: { type: string }
        command: { type: string }
        status: { type: string }
        before: { $ref: '#/components/schemas/ProofRun' }
        after: { $ref: '#/components/schemas/ProofRun' }

    ProofRun:
      type: object
      required: [exit, output, ms]
      properties:
        exit: { type: integer }
        output: { type: string }
        ms: { type: integer, format: int64 }

    Coverage:
      type: object
      required: [covered, total, percent, files]
      description: "How much of the change's added lines the tests ran"
      properties:
        covered: { type: integer }
        total: { type: integer }
        percent: { type: number }
        threshold: { type: integer }
        error: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, covered, total, uncovered]
            properties:
              path: { type: string }
              covered: { type: integer }
              total: { type: integer }
              uncovered:
                type: array
                items:
                  type: object
                  required: [from, to]
                  properties:
                    from: { type: integer }
                    to: { type: integer }

    Acceptance:
      type: object
      required: [status, summary, criteria]
      description: "The check of the ticket's acceptance criteria in the running app"
      properties:
        status: { type: string, enum: [ok, partial, failed] }
        summary: { type: string }
        criteria:
          type: array
          items:
            type: object
            required: [id, criterion, verdict]
            properties:
              id: { type: string }
              criterion: { type: string }
              verdict: { type: string, enum: [pass, fail, unknown] }
              evidence: { type: string }
              steps:
                type: array
                items: { type: string }
              shots:
                type: array
                description: Screenshot ids in the preview
                items: { type: string }

    SecondOpinion:
      type: object
      required: [model, agrees, summary]
      description: "Another model's read of the approach a complex ticket's analysis chose"
      properties:
        model: { type: string }
        agrees: { type: boolean }
        summary: { type: string }
        concerns:
          type: array
          items: { type: string }
        alternative: { type: string }
        error: { type: string }

    TrackerUpdate:
      type: object
      description: >-
        A newer version of the issue from the tracker, which arrived after
        agnts started on the ticket. agnts keeps working from the version it
        started with until you restart the ticket with this one or keep the
        current one.
      required: [title, description, at]
      properties:
        title: { type: string }
        description: { type: string }
        at: { type: string, format: date-time, description: When agnts saw it }

    CIStatus:
      type: string
      enum: [triage, open, fixing, fixed, resolved, flaky, infra, muted, regression]
      description: >-
        triage: new, waiting for a re-run; open: confirmed, no ticket working on it;
        fixing: a ticket works on it; fixed: the fix is merged, waiting for a green run;
        resolved: green again; flaky: passed on re-run; infra: the runner or the network,
        not the code; muted: ignored; regression: failed again after the fix was merged

    CIOccurrence:
      type: object
      required: [runId, url, sha, job, at]
      properties:
        runId: { type: integer, format: int64 }
        url: { type: string }
        sha: { type: string }
        job: { type: string }
        at: { type: string, format: date-time }
        flaky: { type: boolean, description: Passed when re-run }

    CIFailure:
      type: object
      description: CI failures of one job with the same fingerprint on one branch
      required: [id, repoId, repo, branch, workflow, job, title, class, status, count, flakyCount, firstSeenAt, lastSeenAt, firstSha, lastSha, occurrences, ticketKey, prNumber]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repo: { type: string }
        branch: { type: string, description: 'The branch, or pr/<number> for a failure on someone else''s pull request' }
        workflow: { type: string }
        job: { type: string }
        title: { type: string }
        class: { type: string, description: 'code, test, config, dependency, infra, flaky, report, or empty while unknown' }
        status: { $ref: '#/components/schemas/CIStatus' }
        count: { type: integer }
        flakyCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        firstSha: { type: string }
        lastSha: { type: string }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/CIOccurrence' }
        ticketKey: { type: string, description: 'The ticket fixing it, or empty' }
        ticketState: { $ref: '#/components/schemas/TicketState' }
        fixedSha: { type: string }
        fixedAt: { type: string, format: date-time }
        prNumber: { type: integer, description: 'Someone else''s pull request (diagnosis comment only), 0 otherwise' }
        sample: { type: string, description: 'Redacted log excerpt (single reads only)' }

    CIWatch:
      type: object
      required: [enabled, branches, ignore, prs]
      properties:
        enabled: { type: boolean }
        branches:
          type: array
          maxItems: 20
          description: Globs of extra watched branches; the default branch is always watched
          items: { type: string, maxLength: 200 }
        ignore:
          type: array
          maxItems: 50
          description: Globs of workflow or job names never watched
          items: { type: string, maxLength: 200 }
        prs:
          type: string
          maxLength: 20
          description: "Failures on other people's pull requests: off (ignore) or comment (post one diagnosis comment)"
        autoFix: { type: boolean, nullable: true, description: 'Overrides the workspace setting for this repository; null follows it' }
        problem: { type: string, readOnly: true, description: 'Why agnts cannot read this repository''s CI with the current token, or empty' }

    CISettings:
      type: object
      required: [autoFix, maxAutoPerDay, retryFlaky, feedbackRounds, infraPatterns]
      properties:
        autoFix: { type: boolean, description: 'Open a ticket for every confirmed failure on a watched branch; off, failures wait for Fix it' }
        maxAutoPerDay: { type: integer, minimum: 0, maximum: 50, description: Automatic CI tickets a day at most }
        retryFlaky: { type: boolean, description: Re-run the failed jobs of a new failure once before believing it }
        feedbackRounds: { type: integer, minimum: 0, maximum: 5, description: "How many times a red check sends one of agnts's pull requests back to coding; 0 turns it off" }
        infraPatterns:
          type: array
          maxItems: 50
          description: Extra regular expressions that mark a failure as infra (not the code)
          items: { type: string, maxLength: 300 }

    PullReviewSettings:
      type: object
      description: Reviews of the pull requests waiting for you on GitHub or GitLab
      required: [enabled, reviewRequested, skipDrafts, rereview, mergeMethod]
      properties:
        enabled: { type: boolean, description: 'Sync the pull requests waiting for you every few minutes and review the new ones' }
        reviewRequested: { type: boolean, description: 'Also take pull requests whose review is requested from you, not only those assigned to you' }
        skipDrafts: { type: boolean, description: Leave draft pull requests alone until they are ready }
        rereview: { type: boolean, description: "Review again when the author pushes new commits while agnts's review waits for you" }
        mergeMethod: { type: string, enum: [merge, squash, rebase], description: How an accepted pull request is merged }

    PullRequest:
      type: object
      description: The pull request (GitLab merge request) a review ticket reviews, as of the last sync
      required: [number, url, title, author, headRef, headSha, baseRef, draft, state, login, why]
      properties:
        number: { type: integer, description: 'The pull request number (GitLab: the IID)' }
        url: { type: string }
        title: { type: string }
        author: { type: string, description: Git host username of the author }
        headRef: { type: string, description: The branch it comes from }
        headSha: { type: string, description: Its newest commit on the git host }
        baseRef: { type: string, description: The branch it goes into }
        draft: { type: boolean }
        state: { type: string, enum: [open, closed, merged] }
        login: { type: string, description: The git host user it waits for; their reviewer profile shapes its reviews }
        why: { type: string, enum: [assigned, review_requested] }
        additions: { type: integer }
        deletions: { type: integer }
        updatedAt: { type: string, format: date-time }
        postedSha: { type: string, description: "The reviewed commit whose review agnts last posted on the pull request" }
        postedAt: { type: string, format: date-time, description: When agnts last posted its review on the pull request }

    ReviewSync:
      type: object
      description: What a sync of the pull requests waiting for you found
      required: [repos, open, created, rereview, closed, errors]
      properties:
        repos: { type: integer, description: Repositories asked }
        open: { type: integer, description: Pull requests waiting for you }
        created: { type: integer, description: New reviews queued }
        rereview: { type: integer, description: Reviews queued again for new commits }
        closed: { type: integer, description: Reviews ended because the pull request was merged or closed on the git host }
        errors:
          type: array
          description: Repositories or pull requests that could not be read
          items: { type: string }

    ReviewerNote:
      type: object
      description: >-
        Something a person told agnts about one of its pull request
        reviews. Later reviews for the same git host user read it until it
        is folded into their profile.
      required: [id, login, kind, note, createdAt]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string, description: The git host user the review was for }
        username: { type: string, description: Who wrote it in agnts }
        repoName: { type: string }
        ticketKey: { type: string }
        pullTitle: { type: string }
        kind: { type: string, enum: [rereview, dismissed, manual] }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    ReviewerNoteInput:
      type: object
      required: [login, note]
      properties:
        login: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, minLength: 1, maxLength: 4000 }

    Reviewer:
      type: object
      description: What agnts learned about how one git host user reviews pull requests
      required: [login, profile, notesFolded, pending]
      properties:
        login: { type: string }
        profile: { type: string, description: Markdown; empty until a review folds notes in or someone writes it }
        notesFolded: { type: integer, description: Notes folded into the profile so far }
        updatedAt: { type: string, format: date-time }
        pending:
          type: array
          description: Notes the next review folds in, newest first
          items: { $ref: '#/components/schemas/ReviewerNote' }

    Reviewers:
      type: object
      required: [reviewers, notes]
      properties:
        reviewers:
          type: array
          items: { $ref: '#/components/schemas/Reviewer' }
        notes:
          type: array
          description: The newest notes of everyone, newest first
          items: { $ref: '#/components/schemas/ReviewerNote' }

    ReviewerProfileInput:
      type: object
      required: [profile]
      properties:
        profile: { type: string, maxLength: 8000, description: Markdown; empty clears it }

    NotifySettings:
      type: object
      required: [push, telegram, needsYou, stopped, done]
      properties:
        push: { type: boolean }
        telegram: { type: boolean }
        needsYou: { type: boolean }
        stopped: { type: boolean }
        done: { type: boolean }
        lessons: { type: boolean, description: New lessons were found }
        review: { type: boolean, description: A code review finished }
        preview: { type: boolean, description: Preview screenshots are ready }
        previewPhotos: { type: boolean, description: Send phone screenshots to Telegram with the message }
        followUps: { type: boolean, description: Follow-up tickets were suggested }
        ci: { type: boolean, description: A watched branch went red }

    Repository:
      type: object
      required: [id, name, kind, provider, cloneUrl, defaultBranch, buildCmd, lintCmd, testCmd, branchPrefix, taskPrefix, instructions, jiraProject, claudeMd, openTickets]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [jira, plane, side]
          description: jira when the repository has a Jira project key, plane when it has only a Plane project, else side. Every repository takes side-project tasks.
        provider: { type: string, enum: [github, gitlab] }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        buildCmd: { type: string }
        lintCmd: { type: string }
        testCmd: { type: string }
        branchPrefix: { type: string }
        taskPrefix: { type: string }
        instructions: { type: string, description: Extra instructions added to every prompt }
        jiraProject: { type: string }
        planeProject: { type: string, description: 'Plane project identifier (WEB in WEB-123); empty when not linked' }
        claudeMd: { type: string, enum: [found, missing, unknown] }
        openTickets: { type: integer }
        deployWorkflow: { type: string }
        archivedAt: { type: string, format: date-time, description: Set while the repository is archived }
        preview: { $ref: '#/components/schemas/RepoPreview' }
        stack: { type: string, description: 'Toolchain names, comma-separated (go,node)' }
        toolchains:
          type: array
          description: Installed into every run container
          items: { $ref: '#/components/schemas/Toolchain' }
        toolchainsOverride: { type: boolean, description: Set by a person; detection leaves them alone }
        toolchainsDetectedAt: { type: string, format: date-time }
        toolchainNotes:
          type: array
          description: What detection could not handle
          items: { type: string }
        runnerImage: { type: string, description: 'Custom runner image (built FROM agnts-runner); empty uses the default' }
        memoryMb: { type: integer, description: 'Run container memory; 0 uses the server default' }
        buildEnvSet: { type: boolean }
        buildEnvNames:
          type: array
          description: Names of the build environment variables; the values are never returned
          items: { type: string }
        harness: { $ref: '#/components/schemas/RepoHarness' }

    RepositoryInput:
      type: object
      required: [name, cloneUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind:
          type: string
          enum: [jira, plane, side]
          deprecated: true
          description: Ignored; derived from jiraProject and planeProject.
        cloneUrl: { type: string, minLength: 1, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 100 }
        buildCmd: { type: string, maxLength: 500 }
        lintCmd: { type: string, maxLength: 500 }
        testCmd: { type: string, maxLength: 500 }
        branchPrefix: { type: string, maxLength: 50 }
        taskPrefix: { type: string, maxLength: 8 }
        instructions: { type: string, maxLength: 20000 }
        jiraProject: { type: string, maxLength: 20 }
        planeProject: { type: string, maxLength: 12 }
        deployWorkflow: { type: string, maxLength: 200, description: 'GitHub workflow file run by Deploy, e.g. deploy.yml' }
        preview: { $ref: '#/components/schemas/RepoPreviewInput' }
        toolchains:
          type: array
          maxItems: 12
          description: Absent keeps the stored list
          items: { $ref: '#/components/schemas/Toolchain' }
        toolchainsOverride: { type: boolean, description: 'true: these toolchains were set by hand; detection keeps them' }
        runnerImage: { type: string, maxLength: 255 }
        memoryMb: { type: integer, minimum: 0, maximum: 65536 }
        buildEnv:
          type: string
          maxLength: 16384
          description: 'KEY=value lines given to every run (registry tokens); replaces the stored one, "" clears it, absent keeps it'

    Toolchain:
      type: object
      required: [tool, version]
      description: A language runtime or build tool, installed with mise as tool@version
      properties:
        tool: { type: string, maxLength: 40, description: 'mise tool name: go, node, python, rust, java, dotnet, ruby, ...' }
        version: { type: string, maxLength: 64, description: 'Exact, a prefix (20, 3.12), latest, lts or system' }
        source: { type: string, description: 'Where it was found: go.mod, .nvmrc, default, manual' }
        dir: { type: string, description: Subdirectory it was found in }

    RepoDetectInput:
      type: object
      properties:
        id: { type: integer, format: int64, description: A saved repository; the other fields are then optional }
        cloneUrl: { type: string, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 100 }
        deep: { type: boolean, description: Ask Claude when the file scan finds no commands }

    RepoDetection:
      type: object
      required: [toolchains, buildCmd, lintCmd, testCmd, notes, stack, source]
      properties:
        toolchains:
          type: array
          items: { $ref: '#/components/schemas/Toolchain' }
        buildCmd: { type: string }
        lintCmd: { type: string }
        testCmd: { type: string }
        notes:
          type: array
          items: { type: string }
        stack: { type: string }
        source: { type: string, enum: [files, claude], description: Whether Claude filled in what the file scan could not }

    RepoPreview:
      type: object
      required: [command, port, readyPath, routes, uiPaths, login, envSet, envNames]
      description: How agnts starts the app to take screenshots; an empty command turns previews off
      properties:
        command: { type: string }
        port: { type: integer }
        readyPath: { type: string }
        routes:
          type: array
          items: { type: string }
        uiPaths:
          type: array
          items: { type: string }
        login: { type: string }
        envSet: { type: boolean }
        envNames:
          type: array
          description: The names of the variables in the environment; the values are never returned
          items: { type: string }

    RepoPreviewInput:
      type: object
      properties:
        command: { type: string, maxLength: 1000 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        readyPath: { type: string, maxLength: 300 }
        routes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        uiPaths:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 300 }
        login: { type: string, maxLength: 2000 }
        env:
          type: string
          maxLength: 16384
          description: 'KEY=value lines; replaces the stored environment, "" clears it, absent keeps it'

    RepoMember:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        name: { type: string }
        avatarUrl: { type: string }
        url: { type: string, description: Profile page on the git host }
        role: { type: string, description: 'The host''s role name, e.g. admin, write (GitHub) or Maintainer, Developer (GitLab)' }

    RemoteRepository:
      type: object
      required: [fullName, cloneUrl, defaultBranch, private, added]
      properties:
        fullName: { type: string, description: 'owner/name, or group/sub/project on GitLab' }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        description: { type: string }
        updatedAt: { type: string, format: date-time }
        added: { type: boolean, description: Already added to agnts }

    Integration:
      type: object
      required: [provider, connected, settings]
      properties:
        provider: { type: string }
        connected: { type: boolean }
        checkedAt: { type: string, format: date-time }
        account: { type: string }
        tokenHint: { type: string, description: Last four characters }
        lastError: { type: string }
        settings:
          type: object
          additionalProperties: { type: string }
        webhookUrl: { type: string }
        webhookSecret: { type: string, description: 'GitHub and GitLab: secret to enter in the webhook settings' }
        webhookSecretSet: { type: boolean, description: 'Plane: a webhook secret is stored (deliveries are accepted)' }

    PlaneState:
      type: object
      required: [name, group, projects]
      properties:
        name: { type: string }
        group: { type: string, enum: [backlog, unstarted, started, completed, cancelled, triage] }
        projects:
          type: array
          description: Identifiers of the linked projects that have this state
          items: { type: string }

    ConnectResult:
      type: object
      required: [integration]
      properties:
        integration: { $ref: '#/components/schemas/Integration' }
        webhookSecret: { type: string, description: Shown once; paste it into the provider's webhook settings }

    DashboardCounts:
      type: object
      required: [needs, answers, reviews, stopped, running, queued]
      properties:
        needs: { type: integer }
        answers: { type: integer }
        reviews: { type: integer }
        stopped: { type: integer }
        running: { type: integer }
        queued: { type: integer }

    LiveRun:
      type: object
      required: [ticket, model, turns, maxTurns, lastMessage]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        model: { type: string }
        turns: { type: integer }
        maxTurns: { type: integer }
        lastMessage: { type: string }

    HourBucket:
      type: object
      required: [hour, agnts, you, problems]
      properties:
        hour: { type: integer }
        agnts: { type: integer }
        you: { type: integer }
        problems: { type: integer }

    WeekStats:
      type: object
      required: [picked, pushed, firstTryPct, avgTurns, avgWaitMin, stopped]
      properties:
        picked: { type: integer }
        pushed: { type: integer }
        firstTryPct: { type: integer }
        avgTurns: { type: integer }
        avgWaitMin: { type: integer }
        stopped: { type: integer }

    RepoActivity:
      type: object
      required: [repo, open]
      properties:
        repo: { $ref: '#/components/schemas/Repository' }
        open: { type: integer }
        latest: { $ref: '#/components/schemas/Ticket' }

    Dashboard:
      type: object
      required: [counts, waiting, live, pipeline, todayByHour, week, lastWeek, repos, recent, usage, parallel]
      properties:
        counts: { $ref: '#/components/schemas/DashboardCounts' }
        waiting:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        live:
          type: array
          items: { $ref: '#/components/schemas/LiveRun' }
        pipeline:
          type: object
          additionalProperties: { type: integer }
          description: Open tickets per state
        todayByHour:
          type: array
          items: { $ref: '#/components/schemas/HourBucket' }
        week: { $ref: '#/components/schemas/WeekStats' }
        lastWeek: { $ref: '#/components/schemas/WeekStats' }
        repos:
          type: array
          items: { $ref: '#/components/schemas/RepoActivity' }
        recent:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        usage: { $ref: '#/components/schemas/Usage' }
        parallel: { type: integer }

    DeviceRegistration:
      type: object
      required: [platform, fcmToken]
      properties:
        platform: { type: string, enum: [ios, android] }
        fcmToken: { type: string, minLength: 1, maxLength: 4096 }
        appVersion: { type: string, maxLength: 50 }

    McpStatus:
      type: object
      required: [url, staticToken, connections]
      properties:
        url: { type: string, description: The connector URL to add in Claude }
        staticToken: { type: boolean }
        connections: { type: integer, description: Claude connections authorised with OAuth }

    NetworkRoute:
      type: object
      description: A host (gitlab.corp.local), a domain (.corp.local) or a private range (10.20.0.0/16), with ports (80 and 443 when none).
      properties:
        host: { type: string, maxLength: 253 }
        cidr: { type: string, maxLength: 64 }
        ports:
          type: array
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 65535 }

    PrivateNetworkList:
      type: object
      required: [available, linkUrl, max, networks]
      properties:
        available: { type: boolean, description: The server runs the gateway (private networks can be used) }
        linkUrl: { type: string, description: Where agnts-link connects }
        max: { type: integer, description: How many networks a workspace may keep }
        networks:
          type: array
          items: { $ref: '#/components/schemas/PrivateNetwork' }

    PrivateNetwork:
      type: object
      required: [id, name, kind, enabled, routes, status, tokenSet, webhooks, pollMinutes, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [wireguard, openvpn, connector] }
        enabled: { type: boolean }
        summary: { type: string, description: 'The config without its keys, e.g. peer vpn.corp.com:51820' }
        routes:
          type: array
          items: { $ref: '#/components/schemas/NetworkRoute' }
        ca:
          type: object
          required: [subjects, notAfter]
          properties:
            subjects: { type: array, items: { type: string } }
            notAfter: { type: string, format: date-time }
        status:
          type: string
          enum: [connecting, up, error, disabled, gateway_down]
        lastError: { type: string }
        upAt: { type: string, format: date-time }
        handshakeAt: { type: string, format: date-time, description: "WireGuard's last handshake, or agnts-link's last heartbeat" }
        detail: { type: string }
        tokenSet: { type: boolean, description: An agnts-link token exists }
        webhooks:
          type: string
          enum: [relay, polling]
          description: relay — agnts-link forwards webhooks; polling — trackers reached through it are read every pollMinutes
        pollMinutes: { type: integer }
        updatedAt: { type: string, format: date-time }

    PrivateNetworkInput:
      type: object
      required: [name, kind, enabled, routes]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: 'Unique in the workspace, e.g. the company or office it reaches' }
        kind: { type: string, enum: [wireguard, openvpn, connector] }
        enabled: { type: boolean }
        config: { type: string, maxLength: 65536, description: The WireGuard or OpenVPN config; left out keeps the saved one }
        username: { type: string, maxLength: 256, description: OpenVPN auth-user-pass }
        password: { type: string, maxLength: 256, description: OpenVPN auth-user-pass; left out or empty keeps the saved one }
        routes:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/NetworkRoute' }
        caPem: { type: string, maxLength: 65536, description: 'Company CA certificates (PEM); "" removes them, left out keeps them' }

    PrivateNetworkSaved:
      type: object
      required: [network]
      properties:
        network: { $ref: '#/components/schemas/PrivateNetwork' }
        token: { type: string, description: 'A new agnts-link token, shown once' }

    NetworkTest:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: The connection was made }
        via: { type: string }
        network:
          type: object
          description: The network the routes pick for the target
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        resolved: { type: string, description: The address the name resolved to inside the tunnel }
        connectMs: { type: integer, format: int64 }
        error: { type: string }
        tls:
          type: object
          required: [verified]
          properties:
            verified: { type: boolean }
            subject: { type: string }
            issuer: { type: string }
            notAfter: { type: string, format: date-time }
            error: { type: string }

    NetworkActivity:
      type: object
      required: [today, refused, dials]
      properties:
        today: { type: integer, description: Connections in the last 24 hours }
        refused: { type: integer, description: 'Of those, refused or failed' }
        dials:
          type: array
          items:
            type: object
            required: [at, target, source, ok, bytesIn, bytesOut]
            properties:
              at: { type: string, format: date-time }
              target: { type: string }
              network: { type: integer, format: int64, description: 'The network that carried it (none: refused before one was picked, or since removed)' }
              ticket: { type: string }
              source: { type: string, description: 'run, server, test or webhook' }
              ok: { type: boolean }
              error: { type: string }
              bytesIn: { type: integer, format: int64 }
              bytesOut: { type: integer, format: int64 }

    CI:
      type: string
      enum: [ok, fail, run, pending, manual, skip, canceled, none]

    Branch:
      type: object
      required: [name, default, sha, message, author, ahead, behind, ci]
      properties:
        name: { type: string }
        default: { type: boolean }
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        ahead: { type: integer }
        behind: { type: integer }
        ci: { $ref: '#/components/schemas/CI' }
        ticketKey: { type: string }

    LocalBranch:
      type: object
      required: [name, sha, message, author, ahead, behind, status, unpushed]
      properties:
        name: { type: string }
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        ahead: { type: integer, description: Commits not on the default branch }
        behind: { type: integer, description: Default branch commits the branch lacks }
        status:
          type: string
          enum: [local, pushed, unpushed, differs]
          description: 'local: not on origin; pushed: origin has the same commit; unpushed: origin is behind; differs: origin has commits the local branch lacks'
        unpushed: { type: integer, description: Commits origin lacks (status unpushed) }
        ticketKey: { type: string }

    Commit:
      type: object
      required: [sha, message, author, add, del, ci]
      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        add: { type: integer }
        del: { type: integer }
        ci: { $ref: '#/components/schemas/CI' }
        url: { type: string }
        ticketKey: { type: string }

    Stage:
      type: object
      required: [id, name, status, durationMs, manual]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/CI' }
        durationMs: { type: integer, format: int64 }
        manual: { type: boolean }

    Pipeline:
      type: object
      required: [id, name, branch, sha, message, trigger, status, durationMs, url, stages]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        branch: { type: string }
        sha: { type: string }
        message: { type: string }
        trigger: { type: string }
        status: { $ref: '#/components/schemas/CI' }
        created: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        url: { type: string }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }

    Environment:
      type: object
      required: [name, sha, url]
      properties:
        name: { type: string }
        sha: { type: string }
        deployedAt: { type: string, format: date-time }
        url: { type: string }

    PeriodStats:
      type: object
      required: [picked, pushed, rejected, stopped, firstTry, afterChanges, agntsMin, waitMin, reviewMin, answerMin, turns, merged, closed, spend]
      properties:
        merged: { type: integer, description: agnts pull requests merged in the period }
        closed: { type: integer, description: agnts pull requests closed without a merge in the period }
        picked: { type: integer }
        pushed: { type: integer }
        rejected: { type: integer }
        stopped: { type: integer }
        firstTry: { type: integer }
        afterChanges: { type: integer }
        agntsMin: { type: number }
        waitMin: { type: number }
        reviewMin: { type: number }
        answerMin: { type: number }
        turns: { type: number }
        spend: { $ref: '#/components/schemas/TokenSpend' }

    DayStat:
      type: object
      required: [date, picked, pushed, rejected, stopped, agntsMin, waitMin, turns, spend]
      properties:
        date: { type: string, format: date }
        picked: { type: integer }
        pushed: { type: integer }
        rejected: { type: integer }
        stopped: { type: integer }
        agntsMin: { type: number }
        waitMin: { type: number }
        turns: { type: number }
        peakUsage: { type: number }
        spend: { $ref: '#/components/schemas/TokenSpend' }

    Analytics:
      type: object
      required: [days, current, previous, perDay, steps, stops, models, repos, hours, insights, spendByStage, quality]
      properties:
        days: { type: integer }
        quality:
          type: array
          description: How the tickets whose first coding run started in the period went, by prompt version, oldest first
          items: { $ref: '#/components/schemas/QualityStat' }
        current: { $ref: '#/components/schemas/PeriodStats' }
        previous: { $ref: '#/components/schemas/PeriodStats' }
        perDay:
          type: array
          items: { $ref: '#/components/schemas/DayStat' }
        steps:
          type: object
          additionalProperties: { type: number }
          description: Average minutes per state
        stops:
          type: object
          additionalProperties: { type: integer }
          description: 'Stopped runs by reason: tests, limit, you, turns, other'
        models:
          type: array
          items:
            type: object
            required: [model, runs, reachedReview, avgTurns]
            properties:
              model: { type: string }
              runs: { type: integer }
              reachedReview: { type: integer }
              avgTurns: { type: number }
        repos:
          type: array
          items:
            type: object
            required: [repoId, name, kind, claudeMd, tickets, done, finished, avgTurns, agntsMin, merged, closed, asked, analyzed, ciFailures]
            properties:
              merged: { type: integer, description: Pull requests merged in the period }
              closed: { type: integer, description: Pull requests closed without a merge in the period }
              asked: { type: integer, description: Questions agnts asked in the period }
              analyzed: { type: integer, description: Tickets analysed in the period }
              ciFailures: { type: integer, description: CI failure groups that failed in the period }
              repoId: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              claudeMd: { type: string }
              tickets: { type: integer }
              done: { type: integer }
              finished: { type: integer }
              avgTurns: { type: number }
              agntsMin: { type: number }
        hours:
          type: array
          items: { type: integer }
          description: agnts's events per hour of day (server time zone)
        spendByStage:
          type: array
          items: { $ref: '#/components/schemas/StageSpend' }
          description: Spend of every ticket in the period by stage and model, costliest first
        insights:
          type: array
          items:
            type: object
            required: [kind, values]
            properties:
              kind: { type: string, enum: [claudeMd, waiting, stopsTests, stopsLimit, night, mergeRate, slowAnswers, followUpsNoise, flakyJob] }
              values:
                type: object
                additionalProperties: { type: string }

    Spread:
      type: object
      description: 'Typical (median) and slow (90th percentile) minutes; absent when nothing was measured'
      properties:
        p50: { type: number }
        p90: { type: number }

    DeliveryPeriod:
      type: object
      required: [opened, merged, closed, mergeMin, pushed, pushedMin, mergedTickets, mergedMin, questions, askedTickets, analyzedTickets, answerMin]
      properties:
        opened: { type: integer, description: Pull requests opened in the period }
        merged: { type: integer, description: 'Of those, merged so far' }
        closed: { type: integer, description: 'Of those, closed without a merge so far' }
        mergeMin: { $ref: '#/components/schemas/Spread' }
        pushed: { type: integer, description: Tickets that first reached done in the period }
        pushedMin: { $ref: '#/components/schemas/Spread' }
        mergedTickets: { type: integer, description: Tickets merged in the period }
        mergedMin: { $ref: '#/components/schemas/Spread' }
        questions: { type: integer }
        askedTickets: { type: integer, description: Tickets that asked the questions }
        analyzedTickets: { type: integer, description: Tickets analysed in the period }
        answerMin: { $ref: '#/components/schemas/Spread' }

    DeliveryDay:
      type: object
      required: [date, merged, closed]
      properties:
        date: { type: string, format: date }
        merged: { type: integer }
        closed: { type: integer }
        pushedMin: { type: number, description: Median minutes picked → pushed of the tickets pushed that day }
        mergedMin: { type: number, description: Median minutes picked → merged of the tickets merged that day }

    SlowTicket:
      type: object
      required: [key, title, cycleMin, agntsMin, answersMin, reviewMin, queueMin, merged]
      properties:
        key: { type: string }
        title: { type: string }
        cycleMin: { type: number, description: Minutes picked → pushed }
        agntsMin: { type: number }
        answersMin: { type: number }
        reviewMin: { type: number }
        queueMin: { type: number, description: 'The rest: queued, paused or retried' }
        merged: { type: boolean }

    StalePR:
      type: object
      required: [key, title, repo, url, openedAt]
      properties:
        key: { type: string }
        title: { type: string }
        repo: { type: string }
        url: { type: string }
        openedAt: { type: string, format: date-time }

    AnalyticsDelivery:
      type: object
      required: [days, current, previous, perDay, slowest, stale, unanswered]
      properties:
        days: { type: integer }
        current: { $ref: '#/components/schemas/DeliveryPeriod' }
        previous: { $ref: '#/components/schemas/DeliveryPeriod' }
        perDay:
          type: array
          items: { $ref: '#/components/schemas/DeliveryDay' }
        slowest:
          type: array
          description: The slowest tickets pushed in the period, and where their time went
          items: { $ref: '#/components/schemas/SlowTicket' }
        stale:
          type: array
          description: Pull requests still open after a week, oldest first
          items: { $ref: '#/components/schemas/StalePR' }
        unanswered: { type: integer, description: Questions waiting for an answer now }

    CIPeriod:
      type: object
      required: [seen, new, fixed, autoFixed, flaky, fixMin, ownFixes]
      properties:
        seen: { type: integer, description: Failure groups that failed in the period }
        new: { type: integer, description: First seen in the period }
        fixed: { type: integer }
        autoFixed: { type: integer, description: Fixed by an agnts ticket }
        flaky: { type: integer }
        fixMin: { $ref: '#/components/schemas/Spread' }
        ownFixes: { type: integer, description: "Times red CI sent agnts's own pull request back to coding" }

    CIDay:
      type: object
      required: [date, new, fixed]
      properties:
        date: { type: string, format: date }
        new: { type: integer }
        fixed: { type: integer }

    FlakyJob:
      type: object
      required: [id, repo, workflow, job, title, flaky, failures]
      properties:
        id: { type: integer, format: int64 }
        repo: { type: string }
        workflow: { type: string }
        job: { type: string }
        title: { type: string }
        flaky: { type: integer, description: Times it passed on re-run }
        failures: { type: integer }

    AnalyticsCI:
      type: object
      required: [days, watching, current, previous, byClass, perDay, flakiest, open]
      properties:
        days: { type: integer }
        watching: { type: boolean, description: CI watching is set up for at least one repository }
        current: { $ref: '#/components/schemas/CIPeriod' }
        previous: { $ref: '#/components/schemas/CIPeriod' }
        byClass:
          type: object
          additionalProperties: { type: integer }
          description: 'Failure groups seen in the period by class: code, test, config, dependency, infra, flaky, unknown'
        perDay:
          type: array
          items: { $ref: '#/components/schemas/CIDay' }
        flakiest:
          type: array
          items: { $ref: '#/components/schemas/FlakyJob' }
        open: { type: integer, description: Failure groups that need attention now }

    LearningPeriod:
      type: object
      required: [lessons, lessonsLearned, rulesSuggested, rulesAdopted, rulesManual, reflections, reflectionRules, followUps, accepted, dismissed, reviewerNotes]
      properties:
        lessons: { type: integer }
        lessonsLearned: { type: integer }
        rulesSuggested: { type: integer, description: Rules suggested from tickets }
        rulesAdopted: { type: integer, description: 'Of those, in use now' }
        rulesManual: { type: integer, description: Rules written by a person }
        reflections: { type: integer }
        reflectionRules: { type: integer, description: Rules the reflections suggested }
        followUps: { type: integer }
        accepted: { type: integer, description: Follow-ups accepted in the period }
        dismissed: { type: integer, description: Follow-ups dismissed in the period }
        reviewerNotes: { type: integer }

    LessonCount:
      type: object
      required: [category, created, learned]
      properties:
        category: { type: string }
        created: { type: integer }
        learned: { type: integer }

    FollowUpCount:
      type: object
      required: [name, suggested, accepted, dismissed]
      properties:
        name: { type: string }
        suggested: { type: integer }
        accepted: { type: integer }
        dismissed: { type: integer }

    ReviewerStat:
      type: object
      required: [login, rereview, dismissed, manual, repos]
      properties:
        login: { type: string }
        rereview: { type: integer }
        dismissed: { type: integer }
        manual: { type: integer }
        repos:
          type: array
          items: { type: string }

    AnalyticsLearning:
      type: object
      required: [days, current, previous, lessons, followUpTypes, followUpSources, reviewers]
      properties:
        days: { type: integer }
        current: { $ref: '#/components/schemas/LearningPeriod' }
        previous: { $ref: '#/components/schemas/LearningPeriod' }
        lessons:
          type: array
          items: { $ref: '#/components/schemas/LessonCount' }
        followUpTypes:
          type: array
          description: Follow-ups suggested in the period by type (prerequisite, split, unfinished, gap)
          items: { $ref: '#/components/schemas/FollowUpCount' }
        followUpSources:
          type: array
          description: Follow-ups suggested in the period by source (analyze, work, review, manual)
          items: { $ref: '#/components/schemas/FollowUpCount' }
        reviewers:
          type: array
          description: Reviewers with the most notes in the period
          items: { $ref: '#/components/schemas/ReviewerStat' }

    RepoBrief:
      type: object
      required: [repoId, repoName, body, bodySha, draft, draftSha, status, mergesSince, refreshAfter, error, updatedAt]
      description: >-
        What agnts knows about how a repository works. A survey writes the
        draft; once a person approves it, the body reaches every run of the
        repository's tickets as /agnts/context/brief.md.
      properties:
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        body: { type: string, description: 'The approved brief, Markdown; empty when there is none' }
        bodySha: { type: string, description: The commit the approved brief describes }
        draft: { type: string, description: 'The latest survey, waiting for approval; empty when there is none' }
        draftSha: { type: string }
        status: { type: string, enum: [idle, pending, surveying, failed] }
        mergesSince: { type: integer, description: Tickets merged since the brief was approved }
        refreshAfter: { type: integer, description: 'Merges after which agnts surveys again, when Settings allow' }
        error: { type: string, description: Why the last survey failed }
        surveyedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RepoBriefInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 40000 }

    ReplayReport:
      type: object
      required: [versions, replays]
      properties:
        versions:
          type: array
          description: Replays with a change, summed by the prompt version they ran with
          items: { $ref: '#/components/schemas/ReplayVersion' }
        replays:
          type: array
          description: The newest replays first
          items: { $ref: '#/components/schemas/ReplayResult' }

    ReplayVersion:
      type: object
      required: [promptVersion, replays, checksPassed, reviewed, looksGood, avgOverlap, avgRecall, avgTurns, avgCostUsd, originalTurns, originalCostUsd]
      properties:
        promptVersion: { type: string }
        replays: { type: integer }
        checksPassed: { type: integer }
        reviewed: { type: integer, description: "Replays agnts's code review read" }
        looksGood: { type: integer, description: Reviews that found nothing to block }
        avgOverlap: { type: number, description: 'Average Jaccard index of the changed files, replay against original' }
        avgRecall: { type: number, description: "Average share of the original's files the replay changed too" }
        avgTurns: { type: number }
        avgCostUsd: { type: number }
        originalTurns: { type: number, description: 'Average turns of the originals, for comparison' }
        originalCostUsd: { type: number }

    ReplayResult:
      type: object
      required: [key, original, title, state, promptVersion, hasChange, checksPassed, files, originalFiles, overlap, recall, turns, originalTurns, costUsd, originalCostUsd, createdAt]
      properties:
        key: { type: string }
        original: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        promptVersion: { type: string }
        hasChange: { type: boolean }
        checksPassed: { type: boolean }
        files:
          type: array
          items: { type: string }
        originalFiles:
          type: array
          items: { type: string }
        overlap: { type: number }
        recall: { type: number }
        verdict: { type: string, enum: [looks_good, has_concerns, needs_changes] }
        turns: { type: integer }
        originalTurns: { type: integer }
        costUsd: { type: number }
        originalCostUsd: { type: number }
        createdAt: { type: string, format: date-time }

    QualityStat:
      type: object
      required: [promptVersion, tickets, reachedReview, done, firstTry, rejected, changeRounds, fixAttempts, serious, redFlags, selfFixes]
      properties:
        promptVersion: { type: string, description: 'Empty for runs from before versions were recorded' }
        tickets: { type: integer, description: First coding run in the period }
        reachedReview: { type: integer }
        done: { type: integer }
        firstTry: { type: integer, description: Done without a person asking for changes }
        rejected: { type: integer }
        changeRounds: { type: number, description: 'Average change requests by a person, over the tickets that reached review' }
        fixAttempts: { type: number, description: Average failing checks sent back to Claude }
        serious: { type: integer, description: Reviewed with a blocker or major finding at least once }
        footprintHit: { type: number, description: 'Average share of the changed files the analysis predicted; absent when none was measured' }
        redFlags: { type: integer, description: Red flags found in the diffs }
        selfFixes: { type: integer, description: "Findings of agnts's own review sent back to the coder" }
        guardBlocks: { type: integer, description: Actions agnts-guard refused in their coding runs }
        stopSaves: { type: integer, description: 'Tickets whose stop gate sent failing checks back and whose checks then passed first time' }
        stalls: { type: integer, description: Times their runs looked stuck }
        proofDue: { type: integer, description: Tickets with a proof of fix }
        proven: { type: integer, description: 'Of those, proven' }
        findings: { type: integer, description: Review findings shown on them }
        adopted: { type: integer, description: "Of those, put into a person's feedback" }
        tokens: { type: number, description: 'Average tokens of a done ticket, all stages' }
        factCheck: { type: integer, description: Tickets in the fact check group (A/B) }
        factCheckFirst: { type: integer, description: 'Of those, done without a person asking for changes' }

    LessonCategory:
      type: string
      enum: [pattern, architecture, algorithm, library, language, testing, security, performance, tooling, other]

    LessonLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    LessonBrief:
      type: object
      required: [id, repoId, repoName, ticketKey, slug, title, category, level, summary, quizCount, readMinutes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        ticketKey: { type: string }
        slug: { type: string, description: 'Concept id, unique per repository' }
        title: { type: string }
        category: { $ref: '#/components/schemas/LessonCategory' }
        level: { $ref: '#/components/schemas/LessonLevel' }
        summary: { type: string }
        quizCount: { type: integer }
        readMinutes: { type: integer, description: 'Estimated minutes to read the lesson and take its quiz' }
        learnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    LearnQueueItem:
      type: object
      required: [key, title, repoName, status, lessons, updatedAt]
      properties:
        key: { type: string }
        title: { type: string }
        repoName: { type: string }
        status:
          type: string
          enum: [running, pending, failed, none]
          description: 'none: the ticket was never learned from'
        lessons: { type: integer, description: Lessons it produced so far }
        updatedAt: { type: string, format: date-time }

    LessonList:
      type: object
      required: [items, total, unlearned]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LessonBrief' }
        total: { type: integer, description: 'All lessons, ignoring filters' }
        unlearned: { type: integer, description: 'Lessons not learned yet, ignoring filters' }

    LessonRef:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Relative to the repository root }
        line: { type: integer }
        note: { type: string }

    QuizQuestion:
      type: object
      required: [question, options, answer]
      properties:
        question: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: integer, description: Index of the correct option }
        explanation: { type: string }

    Link:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string, description: Always https }

    Lesson:
      type: object
      required: [id, repoId, repoName, ticketKey, slug, title, category, level, summary, explanation, whyHere, refs, quiz, reading, readMinutes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        ticketKey: { type: string }
        slug: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/LessonCategory' }
        level: { $ref: '#/components/schemas/LessonLevel' }
        summary: { type: string }
        explanation: { type: string, description: 'Plain text; paragraphs are separated by blank lines' }
        whyHere: { type: string, description: Why this change needed it }
        readMinutes: { type: integer, description: 'Estimated minutes to read the lesson and take its quiz' }
        refs:
          type: array
          items: { $ref: '#/components/schemas/LessonRef' }
        quiz:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        reading:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        learnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RuleStatus:
      type: string
      enum: [pending, analyzing, questions, ready, failed, suggested]
      description: >-
        Where Claude's review stands. Tickets follow a rule only when it is
        ready and enabled. A suggested rule is one agnts proposed from
        feedback: adopt it with a review or as written, or delete it to
        dismiss it (it is then not suggested again).

    RuleKind:
      type: string
      enum: [rule, context, tip]
      default: rule
      description: >-
        rule: an instruction tickets follow. context: business knowledge
        (a glossary, invariants, roles) that runs read as
        /agnts/context/business.md. tip: a practical lesson about working in
        a repository, learned from runs that had trouble; runs get tips as
        skills.

    RuleQuestion:
      type: object
      required: [index, text, options, round]
      properties:
        index: { type: integer, description: Position in the rule's questions; answers refer to it }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: string, description: Empty while the question is open }
        note: { type: string }
        round: { type: integer, description: The review round that asked it }

    Rule:
      type: object
      required: [id, title, body, enabled, status, kind, interpretation, clarified, text, questions, rounds, error, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/RuleKind' }
        sourceTicket: { type: string, description: 'For a rule agnts suggested: the ticket whose feedback taught it' }
        reason: { type: string, description: 'For a rule agnts suggested: which feedback shows it' }
        repoId: { type: integer, format: int64, description: Absent for a global rule }
        repoName: { type: string }
        title: { type: string }
        body: { type: string, description: The rule as written }
        enabled: { type: boolean }
        status: { $ref: '#/components/schemas/RuleStatus' }
        interpretation: { type: string, description: 'What Claude will do because of the rule' }
        clarified: { type: string, description: 'The rule rewritten with what the answers settled; empty when used as written' }
        text: { type: string, description: What tickets are given }
        questions:
          type: array
          items: { $ref: '#/components/schemas/RuleQuestion' }
        rounds: { type: integer, description: Question rounds so far }
        error: { type: string, description: Why the last review failed }
        enforce: { $ref: '#/components/schemas/RuleEnforce' }
        delivery: { type: string, enum: [prompt, skill], description: 'prompt: in every prompt; skill: a skill Claude loads when its description matches the work' }
        skillDescription: { type: string, description: 'When the rule applies, for its skill' }
        source: { type: string, description: 'Where it came from: empty (a person), reflect, run, promoted or pack:<language>' }
        confidence: { type: number, description: 'For a learned suggestion: 0.3 to 0.9, earned each time it is seen again' }
        evidence: { type: integer, description: How many times a learned suggestion was seen }
        lastSeen: { type: string, format: date-time }
        watching: { type: boolean, description: 'A learned suggestion with too little evidence to show yet' }
        analyzedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RuleInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        repoId: { type: integer, format: int64, description: Leave out for a rule every repository follows }
        enabled: { type: boolean, default: true }
        kind: { $ref: '#/components/schemas/RuleKind' }
        enforce: { $ref: '#/components/schemas/RuleEnforce' }
        removeEnforce: { type: boolean, description: Remove the enforcement; enforce left out keeps it }
        delivery: { type: string, enum: [prompt, skill], description: Left out keeps the rule's }

    RuleAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, answer]
            properties:
              index: { type: integer, minimum: 0 }
              answer: { type: string, maxLength: 2000 }
              note: { type: string, maxLength: 2000 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. unauthorized, bad_request
        message: { type: string }

  responses:
    BadGateway:
      description: The git host returned an error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TicketOK:
      description: The ticket after the change
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ticket' }
    NotFound:
      description: No such ticket
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Your role does not allow this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: The plan does not include this; upgrade or buy credits
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: Not available on this server
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not allowed in the ticket's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in, or the credentials are wrong
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit; retry later
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
