openapi: 3.0.3
info:
  title: agnts API
  version: 0.1.0
  description: |
    REST API shared by the admin panel (Vue) and the mobile app (Flutter).
    Both clients are generated from this file with `make gen`.

    Web clients authenticate with the `hiro_session` cookie; mobile clients
    send the same session token as `Authorization: Bearer <token>`.
servers:
  - url: /api
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/login/totp:
    post:
      operationId: beginLoginTotp
      summary: Start the two-factor setup an Admin without it does at sign-in
      description: >-
        Two-factor sign-in is mandatory for Admins. When login answers 401
        totp_setup_required, this returns a new secret (after checking the
        password again); signing in with it as totpSecret and a matching code
        saves it and starts the session.
      tags: [auth]
      x-scope: user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: A secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, url]
                properties:
                  secret: { type: string, description: 'Base32, for manual entry' }
                  url: { type: string, description: 'otpauth:// URL, for a QR code' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      operationId: login
      summary: Sign in with password and TOTP code
      tags: [auth]
      x-scope: user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Web clients get the session cookie; mobile clients get the token in the body.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/google:
    post:
      operationId: signInWithGoogle
      summary: Sign in with a Google ID token (the mobile app)
      description: >
        The phone signs in with Google itself and sends the ID token here. Like
        "Continue with Google" on the website, a new account starts as a solo
        developer with a workspace of its own, or joins the workspace of an invite.
        Always a mobile session: the token comes back in the body.
      tags: [auth]
      x-scope: user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Google sign-in is off on this server, or Google could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      x-scope: user
      responses:
        '204': { description: Signed out }

  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      x-scope: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /meta:
    get:
      operationId: getMeta
      summary: Server version and build information
      tags: [meta]
      x-scope: user
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }

  /tickets:
    get:
      operationId: listTickets
      summary: Tickets, most recently active first
      tags: [tickets]
      parameters:
        - name: state
          in: query
          description: Only tickets in these states
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketState' }
          style: form
          explode: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{key}:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: getTicket
      summary: A ticket with its questions, analysis and latest result
      tags: [tickets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/events:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listTicketEvents
      summary: The ticket's log, oldest first; poll with `after` for live updates
      tags: [tickets]
      parameters:
        - name: after
          in: query
          description: Only events with a larger id
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{key}/answers:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: answerQuestions
      summary: Answer the ticket's questions; when all are answered, coding starts
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswersRequest' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/secrets-ack:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: acknowledgeSecrets
      summary: Confirm that the lines flagged as secrets in the change under review are not real credentials
      description: >-
        A change with lines agnts's scan flagged as secrets (or a dotenv
        file) cannot be approved until a person confirms, for that commit,
        that they are not real credentials.
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/approve:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: approveTicket
      summary: Approve the reviewed work
      description: >-
        For a change, agnts pushes the branch and opens the pull request. For a
        report, the ticket is done; the report is posted to the tracker issue
        only when postReport is true.
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignees:
                  type: array
                  maxItems: 10
                  description: Git host usernames to assign the pull request to (changes only)
                  items: { type: string, minLength: 1, maxLength: 100 }
                postReport:
                  type: boolean
                  description: Post the approved report as a comment on the tracker issue (reports only)
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/request-changes:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: requestChanges
      summary: Send the ticket back to coding with feedback
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, minLength: 1, maxLength: 20000 }
                shots:
                  type: array
                  maxItems: 6
                  description: Preview screenshots the feedback points at; the coding run gets them
                  items: { $ref: '#/components/schemas/ShotRef' }
                attachments:
                  type: array
                  maxItems: 10
                  description: Uploads that go with the feedback (mockups, logs, screenshots); the coding run reads them
                  items: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/reject:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: rejectTicket
      summary: Stop work on the ticket for good
      tags: [tickets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/retry:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: retryTicket
      summary: Resume a failed or rate-limited ticket where it stopped
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 4000
                  description: How to get past the failure. The next coding run gets it with the error, like requested changes. Not allowed when the ticket resumes at pushing, since no Claude run follows.
                attachments:
                  type: array
                  maxItems: 10
                  description: Uploads that help get past the failure; the next coding run reads them. Same rule as note.
                  items: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/analyze:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: startTicket
      summary: Start a held ticket now (it is queued for the next free slot)
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/learn:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: learnFromTicket
      summary: Queue a learn run for a pushed ticket (again, if it already ran)
      tags: [learn]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/replay:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: replayTicket
      summary: >-
        Re-run a done code or test ticket with today's agnts, from the commit it
        started from, to compare the two (Analytics → Replay evaluation). The
        replay is a new local task that is never pushed.
      tags: [tickets]
      responses:
        '200':
          description: The replay ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/review:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: reviewTicket
      summary: Queue a code review of a ticket waiting for review (again, if one already ran)
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/restart-update:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: restartWithUpdate
      summary: Start the ticket over from the newer version of its issue; the work so far is dropped
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/keep-version:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: keepCurrentVersion
      summary: Keep working from the version agnts started with; this newer version of the issue is not asked about again
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/post-review:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: postPullReview
      summary: Post agnts's latest review of a pull request on it as a comment (once per reviewed commit)
      tags: [reviews]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/preview:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: previewTicket
      summary: Queue a preview (screenshots of the running app) of a ticket waiting for review, again if one already ran
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewInput' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/preview/{runId}/shots/{shotId}:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: shotId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
    get:
      operationId: getPreviewShot
      summary: One preview screenshot, as PNG
      tags: [tickets]
      responses:
        '200':
          description: The screenshot; it never changes, so it may be cached
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/translate:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: translateTicket
      x-viewer: true
      summary: Translate a ticket's texts (its own and what agnts wrote) into a language
      description: >-
        Translations are stored per text, so a text is sent to Claude only
        once per language; asking again, or for a later revision that keeps
        most texts, answers from the store. Texts not yet translated are
        translated in this request, which can take a minute.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateInput' }
      responses:
        '200':
          description: Each text of the ticket with its translation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Translation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tickets/{key}/stop:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: stopTicket
      summary: Stop the running stage; the ticket moves to failed and can be retried
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/models:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketModels
      summary: Override models for this ticket; omit a stage to use the default
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelOverrides' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/repo:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketRepo
      summary: Link the ticket to a repository
      description: >-
        Allowed on a new ticket, or a failed or rate-limited one that has not
        pushed. A stopped ticket starts over from analysis on retry, since its
        analysis and branch belonged to the old repository.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketRepo' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/implement:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: implementTicket
      summary: Make the code task that carries out a done plan or bug investigation
      description: >-
        Creates a local code task linked back to the report (parentKey), with
        the approved report in its description. A report is implemented once.
        repoId is needed only when the report has no repository.
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImplementInput' }
      responses:
        '201': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/follow-ups:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listFollowUps
      summary: Suggested follow-up tickets and the tickets made from them
      tags: [tickets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUps' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setFollowUps
      summary: Turn follow-up suggestions on or off for this ticket
      description: >-
        inherit follows Settings (suggestFollowUps). Suggestions add a little
        to every prompt of the ticket's runs, so they are off unless asked for.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FollowUpsSetting' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/follow-ups/accept:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: acceptFollowUps
      summary: Create tickets from chosen suggestions
      description: >-
        Each chosen suggestion becomes a queued (held) ticket, as a local task,
        a new Jira issue or a new Plane work item. Nothing runs until it is started. Items are
        handled one by one; each result says what happened to its suggestion.
        What the analysis suggested can be created at once; what the work or
        its review found waits until this ticket is done.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptFollowUps' }
      responses:
        '200':
          description: One result per item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptFollowUpsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/follow-ups/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: dismissFollowUp
      summary: Decline a suggestion; later runs will not suggest it again
      tags: [tickets]
      responses:
        '200':
          description: The dismissed suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/review/findings/{index}/follow-up:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - name: index
        in: path
        required: true
        description: The finding's position in the newest code review
        schema: { type: integer, minimum: 0 }
    post:
      operationId: followUpFromFinding
      summary: Turn a code review finding into a follow-up suggestion
      description: No Claude run is involved.
      tags: [tickets]
      responses:
        '201':
          description: The new suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/relations:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listRelations
      summary: The ticket's ordering constraints and what holds it back now
      tags: [tickets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addRelation
      summary: Make this ticket wait for another, or keep the two from running side by side
      description: >-
        depends_on: this ticket does not start coding until the other is
        merged (or rejected). conflicts: whichever of the two starts coding
        second waits until the first is merged. A dependency that would make
        two tickets wait for each other is refused (400). Adding a relation
        agnts proposed or someone dismissed makes it active.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationInput' }
      responses:
        '201':
          description: The relation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/relations/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - $ref: '#/components/parameters/RelationID'
    post:
      operationId: acceptRelation
      summary: Accept a relation agnts proposed; the queue follows it from now on
      tags: [tickets]
      responses:
        '200':
          description: The relation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/relations/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - $ref: '#/components/parameters/RelationID'
    post:
      operationId: dismissRelation
      summary: Dismiss a relation (run anyway); agnts does not propose it again
      tags: [tickets]
      responses:
        '200':
          description: The relation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/merged:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: markTicketMerged
      summary: Record that a done ticket's pull request was merged
      description: >-
        For setups without a git host webhook. Tickets waiting for this one
        may start coding.
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/kind:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketKind
      summary: Change what the ticket produces
      description: >-
        Allowed on a new ticket, while agnts waits for answers, and on a failed
        or rate-limited one that has not pushed. auto lets the analysis pick
        the kind again; any other kind is final.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketKindInput' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/member:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketMember
      summary: Make a member the ticket's member (per-member Claude mode runs it on their account)
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64, description: A member of the workspace; 0 for yourself }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file to attach to a task, an answer or a retry note
      description: >-
        The upload stays pending until the request that uses it (createTask,
        updateTask, answerQuestions, retryTicket, requestChanges) lists its id; pending uploads
        nobody used are deleted after a day. Pictures (PNG, JPEG, GIF, WebP)
        are shown in place; other files download. Claude reads every attached
        file, pictures and PDFs included.
      tags: [attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: At most 10 MB
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file is larger than 10 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attachments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getAttachment
      summary: An attached file's bytes
      tags: [attachments]
      responses:
        '200':
          description: The file; it never changes, so it may be cached
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAttachment
      summary: Delete an upload that nothing uses yet
      tags: [attachments]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks:
    post:
      operationId: createTask
      summary: Create a side-project task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{key}:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    patch:
      operationId: updateTask
      summary: Edit a task that has not started
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTask
      summary: Delete a task that has not started
      tags: [tasks]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events:
    get:
      operationId: listEvents
      summary: The global log, newest first, with filters and a cursor
      tags: [logs]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [all, state, tool, command, user, limit, problems], default: all }
        - name: key
          in: query
          description: Ticket key, or a prefix of one
          schema: { type: string, maxLength: 64 }
        - name: errors
          in: query
          schema: { type: boolean, default: false }
        - name: before
          in: query
          description: Only events with a smaller id (pagination)
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/summary:
    get:
      operationId: getEventSummary
      summary: Run statistics and time per step, for the Logs page
      tags: [logs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/export:
    get:
      operationId: exportEvents
      summary: Download the log (last 90 days) as JSON lines or CSV
      tags: [logs]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: A file download
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/stream:
    get:
      operationId: streamEvents
      summary: Server-Sent Events with every new event row (resume with Last-Event-ID)
      tags: [logs]
      responses:
        '200':
          description: 'An event stream; each message is an Event as JSON, with id set to the event id'
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard:
    get:
      operationId: getDashboard
      summary: Everything the dashboard shows, in one call
      tags: [dashboard]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usage:
    get:
      operationId: getUsage
      summary: Plan usage from Claude Code's rate limit events
      tags: [usage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usage/refresh:
    post:
      operationId: refreshUsage
      x-viewer: true
      summary: Start a tiny Claude run to read fresh limits; a usage_updated event follows
      tags: [usage]
      responses:
        '202':
          description: Refresh started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /usage/tickets:
    get:
      operationId: getTicketSpend
      summary: Tickets that used the most of the plan in a period, by Claude Code's cost estimate
      tags: [usage]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketSpendList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putSettings
      x-role: owner
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /repos:
    get:
      operationId: listRepos
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRepo
      x-role: owner
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /repos/detect:
    post:
      operationId: detectRepo
      x-role: owner
      summary: Work out a repository's toolchains and check commands
      description: |
        Reads the default branch (of a saved repository by id, or of any
        clone URL) and returns what it needs, without saving. With deep,
        Claude also reads the README and CI files when the file scan finds
        nothing; that takes a minute and uses the Claude plan.
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoDetectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoDetection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: getRepo
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRepo
      x-role: owner
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    put:
      operationId: updateIntegration
      x-role: owner
      summary: Change an integration's settings (never its token)
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/{provider}/connect:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: connectIntegration
      x-role: owner
      summary: Save a token (and settings), check it against the provider, and connect
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 8, maxLength: 4096 }
                webhookSecret:
                  type: string
                  maxLength: 200
                  description: 'Plane: the secret Plane shows when you create the webhook. Empty keeps the stored one.'
                settings:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{provider}/test:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: testIntegration
      x-role: owner
      tags: [integrations]
      responses:
        '200':
          description: Result of the check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/{provider}/disconnect:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: disconnectIntegration
      x-role: owner
      summary: Forget the token
      tags: [integrations]
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{provider}/repos:
    parameters:
      - $ref: '#/components/parameters/Provider'
    get:
      operationId: listRemoteRepos
      x-role: owner
      summary: Repositories the connected GitHub or GitLab token can reach, for import
      tags: [integrations]
      responses:
        '200':
          description: OK, most recently updated first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemoteRepository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /integrations/jira/sync:
    post:
      operationId: syncJira
      summary: Pick up labelled Jira issues now (only those assigned to you, unless that is off) and refresh the tickets agnts has for them
      tags: [integrations]
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [found, created]
                properties:
                  found: { type: integer }
                  created: { type: integer }
                  updated: { type: integer, description: Tickets not started yet that took the issue's new text }
                  waiting: { type: integer, description: 'Started tickets whose issue changed: each asks you to restart with the new version or keep the current one' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/plane/sync:
    post:
      operationId: syncPlane
      summary: Pick up labelled Plane work items now
      tags: [integrations]
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [found, created]
                properties:
                  found: { type: integer }
                  created: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/plane/webhook-secret:
    put:
      operationId: setPlaneWebhookSecret
      x-role: owner
      summary: Store the secret Plane generated for the agnts webhook
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/plane/states:
    get:
      operationId: listPlaneStates
      summary: States of the Plane projects linked to repositories, for the status mapping
      tags: [integrations]
      responses:
        '200':
          description: States, by name, with the projects that have them
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaneState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /docs/{page}:
    get:
      operationId: getPageDoc
      summary: The "How this page works" text, as Markdown
      tags: [docs]
      x-scope: user
      parameters:
        - name: page
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z-]*$', maxLength: 32 }
        - name: lang
          in: query
          schema: { type: string, enum: [en, ru, uz], default: en }
      responses:
        '200':
          description: Markdown
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices:
    post:
      operationId: registerDevice
      summary: Register this phone for push notifications (call again when the token changes)
      tags: [devices]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '204': { description: Registered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/unregister:
    post:
      operationId: unregisterDevice
      summary: Stop push notifications to this phone (on sign-out)
      tags: [devices]
      x-scope: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /oauth/consent:
    get:
      operationId: getConsent
      x-scope: user
      summary: Details of a pending Claude connection request, for the consent page
      tags: [mcp]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clientName, redirectHost]
                properties:
                  clientName: { type: string }
                  redirectHost: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: decideConsent
      x-scope: user
      summary: Approve or deny a Claude connection; returns where to send the browser
      tags: [mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, redirectUri, codeChallenge, codeChallengeMethod, approve]
              properties:
                clientId: { type: string }
                redirectUri: { type: string }
                codeChallenge: { type: string }
                codeChallengeMethod: { type: string }
                state: { type: string }
                resource: { type: string }
                approve: { type: boolean }
                workspace: { type: string, description: 'The slug of the workspace Claude may act in (required to approve)' }
      responses:
        '200':
          description: Redirect target
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-settings:
    get:
      operationId: getMcpSettings
      summary: The MCP connector URL and current connections
      tags: [mcp]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-settings/token:
    post:
      operationId: rotateMcpToken
      x-viewer: true
      summary: Create a new static MCP bearer token (shown once; the old one stops working)
      tags: [mcp]
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-settings/revoke:
    post:
      operationId: revokeMcp
      x-viewer: true
      summary: Disconnect every Claude connection and delete the static token
      tags: [mcp]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /networks:
    get:
      operationId: listPrivateNetworks
      summary: The workspace's private networks (VPNs and agnts-link connectors)
      description: |
        Tunnels into the team's own networks and the routes (hosts, domains,
        private ranges) that go through each: agnts's calls to a self-hosted
        GitLab, Jira or Plane, git, and run containers' connections to those
        hosts. A connection goes through the network whose route matches it
        most closely. Secrets are never returned.
      tags: [network]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateNetworkList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPrivateNetwork
      x-role: owner
      summary: Add a private network
      description: |
        Its routes may not claim a host, domain or range another of the
        workspace's networks has (on a common port); a route nested inside
        another network's is fine. A connector's token is returned once.
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivateNetworkInput' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateNetworkSaved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /networks/test:
    post:
      operationId: testPrivateNetwork
      x-role: owner
      summary: Connect to host:port through the network its routes pick, and check its TLS certificate
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, maxLength: 300, description: 'host:port, e.g. gitlab.corp.local:443' }
                network: { type: integer, format: int64, description: The network expected to carry it; the result says if another one would }
      responses:
        '200':
          description: What the test found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkTest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /networks/activity:
    get:
      operationId: getNetworkActivity
      summary: Connections made through private networks (the last 100, and the day's counts)
      tags: [network]
      parameters:
        - name: network
          in: query
          description: Only this network's connections
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /networks/{networkId}:
    parameters:
      - $ref: '#/components/parameters/NetworkID'
    get:
      operationId: getPrivateNetwork
      summary: One private network
      tags: [network]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateNetwork' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePrivateNetwork
      x-role: owner
      summary: Change a private network
      description: |
        Left-out secrets (config, password) keep the stored ones. Switching
        to a connector makes its token, returned once.
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivateNetworkInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateNetworkSaved' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePrivateNetwork
      x-role: owner
      summary: Remove a private network
      tags: [network]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /networks/{networkId}/reconnect:
    parameters:
      - $ref: '#/components/parameters/NetworkID'
    post:
      operationId: reconnectPrivateNetwork
      x-role: owner
      summary: Restart the tunnel (a new OpenVPN sidecar, a new WireGuard handshake, agnts-link reconnects)
      tags: [network]
      responses:
        '200':
          description: The network, reconnecting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateNetwork' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /networks/{networkId}/token:
    parameters:
      - $ref: '#/components/parameters/NetworkID'
    post:
      operationId: rotateLinkToken
      x-role: owner
      summary: Make a new agnts-link token for a connector network (shown once; the old one stops working)
      tags: [network]
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons:
    get:
      operationId: listLessons
      summary: Lessons agnts learned from pushed tickets, newest first
      tags: [learn]
      parameters:
        - name: repo
          in: query
          schema: { type: integer, format: int64 }
        - name: ticket
          in: query
          schema: { type: string, maxLength: 64 }
        - name: status
          in: query
          description: new (not learned yet), learned, or all (default)
          schema: { type: string, enum: [new, learned, all] }
        - name: q
          in: query
          description: Search in titles and summaries
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lessons/queue:
    get:
      operationId: getLearnQueue
      summary: Done tickets whose learn run is running, queued, failed or never happened
      tags: [learn]
      responses:
        '200':
          description: Running first, then queued in run order, then failed and never learned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearnQueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lessons/{id}:
    parameters:
      - $ref: '#/components/parameters/LessonID'
    get:
      operationId: getLesson
      summary: One lesson with its explanation, code references, quiz and reading
      tags: [learn]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{id}/learned:
    parameters:
      - $ref: '#/components/parameters/LessonID'
    put:
      operationId: markLessonLearned
      summary: Mark a lesson learned
      tags: [learn]
      responses:
        '200':
          description: The lesson after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unmarkLessonLearned
      summary: Mark a lesson as not learned yet
      tags: [learn]
      responses:
        '200':
          description: The lesson after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews/sync:
    post:
      operationId: syncReviews
      summary: Ask the git host for the pull requests waiting for you and queue reviews of the new ones
      tags: [reviews]
      responses:
        '200':
          description: What the sync found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSync' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reviews/reviewers:
    get:
      operationId: listReviewers
      summary: How each person agnts reviews pull requests for reviews, as it learned from their notes
      tags: [reviews]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reviewers' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reviews/reviewers/{login}:
    parameters:
      - name: login
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    put:
      operationId: saveReviewerProfile
      summary: Replace a reviewer profile with your text; empty text clears it
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewerProfileInput' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reviewer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reviews/notes:
    post:
      operationId: addReviewerNote
      summary: Tell agnts something about how you review; the next review for that user reads it
      tags: [reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewerNoteInput' }
      responses:
        '201':
          description: Kept
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewerNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reviews/notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteReviewerNote
      summary: Forget a note (one already folded into a profile stays there until the profile is edited)
      tags: [reviews]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules:
    get:
      operationId: listRules
      summary: Every rule, global ones first, then by repository
      tags: [rules]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRule
      x-role: owner
      summary: Add a rule; Claude reviews it before tickets follow it
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Created and queued for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rules/try:
    post:
      operationId: tryEnforce
      summary: "Check an enforcement against agnts's last changes before turning it on"
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TryEnforceInput' }
      responses:
        '200':
          description: What the enforcement would have caught
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TryEnforceResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rules/{id}:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    get:
      operationId: getRule
      tags: [rules]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRule
      x-role: owner
      summary: Edit a rule. Changing its text or repository starts a new review; turning it on or off does not.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRule
      x-role: owner
      tags: [rules]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules/{id}/answers:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    put:
      operationId: answerRule
      x-role: owner
      summary: Answer every open question of a rule; Claude then reviews it again
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleAnswers' }
      responses:
        '200':
          description: Answers saved, review queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: acceptRule
      x-role: owner
      summary: Apply a rule as written, skipping its open questions or a failed review
      tags: [rules]
      responses:
        '200':
          description: The rule after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules/{id}/review:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: reviewRule
      x-role: owner
      summary: Have Claude review a rule again, keeping its answers
      tags: [rules]
      responses:
        '200':
          description: Queued for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics:
    get:
      operationId: getAnalytics
      summary: Throughput, quality, time and plan statistics for a period
      tags: [analytics]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/delivery:
    get:
      operationId: getAnalyticsDelivery
      summary: What happened to agnts pull requests, cycle time and questions for a period
      tags: [analytics]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/ci:
    get:
      operationId: getAnalyticsCi
      summary: CI failures, fixes and flaky jobs for a period
      tags: [analytics]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsCI' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/learning:
    get:
      operationId: getAnalyticsLearning
      summary: Lessons, rules, follow-ups and reviewer notes for a period
      tags: [analytics]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsLearning' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /eval/replays:
    get:
      operationId: getReplayReport
      summary: How the newest replays compare with the tickets they re-ran, by prompt version
      tags: [analytics]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /repos/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: archiveRepo
      x-role: owner
      summary: Archive the repository; it keeps its history but takes no new tickets or tasks
      tags: [repos]
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: unarchiveRepo
      x-role: owner
      summary: Restore an archived repository
      tags: [repos]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/harness:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    put:
      operationId: saveRepoHarness
      x-role: owner
      summary: "Set the repository's guard profile, per-file checks, coverage and acceptance check"
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoHarnessInput' }
      responses:
        '200':
          description: The repository after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/starter-rules:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listStarterPacks
      summary: "Starter rule packs that fit the repository's toolchains"
      tags: [rules]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StarterPack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: offerStarterRules
      x-role: owner
      summary: "Add a starter pack's rules to the repository as suggestions"
