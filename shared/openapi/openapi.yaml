      summary: A page of a channel, oldest first (the newest, the ones before `before`, or the ones after `after` to fill a gap after a reconnect)
      tags: [chat]
      parameters:
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendChatMessage
      summary: Send a message. The same clientMsgId sent again returns the stored message (200) instead of a second one (201)
      tags: [chat]
      x-viewer: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSendRequest' }
      responses:
        '200':
          description: Already stored (a resend)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/channels/{channelId}/voice:
    parameters:
      - $ref: '#/components/parameters/ChatChannelID'
    post:
      operationId: sendChatVoice
      summary: Send a voice message. Muse hears it after it is stored; its words become the message's text (an event brings them)
      tags: [chat]
      x-viewer: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [clientMsgId, durationMs, audio, wav]
              properties:
                clientMsgId: { type: string, format: uuid }
                durationMs: { type: integer, format: int64, description: The recording's length, at most 2 minutes }
                replyTo: { type: integer, format: int64 }
                audio: { type: string, format: binary, description: 'The recording to keep and play (WebM, Ogg, MP4, MP3, AAC or WAV), at most 3 MB' }
                wav: { type: string, format: binary, description: The same audio as 16-bit PCM WAV for Muse to hear, at most 4 MB }
      responses:
        '200':
          description: Already stored (a resend)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: The recording is too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /chat/channels/{channelId}/read:
    parameters:
      - $ref: '#/components/parameters/ChatChannelID'
    put:
      operationId: markChatRead
      summary: Save how far you have read a channel
      tags: [chat]
      x-viewer: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadId]
              properties:
                lastReadId: { type: integer, format: int64 }
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /chat/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ChatMessageID'
    get:
      operationId: getChatMessage
      summary: One message with its refs (opens a citation in its channel)
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/messages/{messageId}/audio:
    parameters:
      - $ref: '#/components/parameters/ChatMessageID'
    get:
      operationId: getChatAudio
      summary: A voice message's recording, to play
      tags: [chat]
      responses:
        '200':
          description: The recording
          content:
            audio/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/messages/{messageId}/actions:
    parameters:
      - $ref: '#/components/parameters/ChatMessageID'
    post:
      operationId: actOnChatCard
      summary: Press a button on agnts's card; it runs the real action (approve, merge, fix, …) and returns the card
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatActionRequest' }
      responses:
        '200':
          description: The card after the action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /chat/messages/{messageId}/ticket:
    parameters:
      - $ref: '#/components/parameters/ChatMessageID'
    post:
      operationId: chatMessageToTicket
      summary: Turn a message into a ticket draft; the draft card arrives in the thread as an event
      tags: [chat]
      responses:
        '202': { description: Drafting }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /chat/messages/{messageId}/refs/remove:
    parameters:
      - $ref: '#/components/parameters/ChatMessageID'
    post:
      operationId: removeChatRef
      summary: Remove a wrong link under a message (the linker will not add it back)
      tags: [chat]
      x-viewer: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string }
                id: { type: string }
      responses:
        '200':
          description: The message after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/stats:
    get:
      operationId: getChatStats
      summary: What the model did in the team chat today (links, answers, drafts) and its median time
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  parameters:
    ChatChannelID:
      name: channelId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChatMessageID:
      name: messageId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ModuleProvider:
      name: provider
      in: query
      required: false
      description: 'The module whose account it is: muse or claude (Codex runs on the workspace''s OpenAI key). Defaults to your default module.'
      schema: { type: string, enum: [muse, claude] }
    MeetingID:
      name: meetingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionID:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MeetingCode:
      name: code
      in: path
      required: true
      description: 'The meeting code, abc-defg-hij (dashes optional)'
      schema: { type: string, minLength: 10, maxLength: 14 }
    SeatToken:
      name: X-Meeting-Seat
      in: header
      description: The seat a join handed out
      schema: { type: string, maxLength: 100 }
    KnockToken:
      name: X-Knock-Token
      in: header
      description: The knock's secret a join handed out
      schema: { type: string, maxLength: 100 }
    CommentID:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GuestToken:
      name: X-Guest-Token
      in: header
      description: The guest's secret token from joinPublicDocument
      schema: { type: string, maxLength: 100 }
    DocumentID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DocumentVersionNo:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DocumentFormat:
      name: format
      in: query
      schema: { type: string, enum: [md, pdf], default: md }
    PublicToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-Za-z]{20,64}$' }
    RunWorkspace:
      name: workspace
      in: query
      schema: { type: integer, format: int64 }
    RunPurpose:
      name: purpose
      in: query
      description: A stage (analyze, code, review…), a background call (assistant, brief, detect, reflect, rules, translate), second_opinion, or the groups stages and background
      schema: { type: string, maxLength: 32 }
    RunStatus:
      name: status
      in: query
      schema: { type: string, enum: [running, done, error, timeout, cancelled, oom] }
    RunEngine:
      name: engine
      in: query
      schema: { type: string, enum: [muse, claude, codex] }
    RunModel:
      name: model
      in: query
      description: Part of a model name
      schema: { type: string, maxLength: 64 }
    RunTicket:
      name: ticket
      in: query
      description: A ticket key, or its start
      schema: { type: string, maxLength: 64 }
    RunStalled:
      name: stalled
      in: query
      description: Only invocations that had stalls
      schema: { type: boolean }
    RunFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    RunTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    RunMinCost:
      name: minCost
      in: query
      description: Only invocations that cost at least this many USD
      schema: { type: number, minimum: 0 }
    ConversationID:
      name: conversationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MessageID:
      name: messageId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ActionID:
      name: actionId
      in: path
      required: true
      schema: { type: string }
    NetworkID:
      name: networkId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LogSourceID:
      name: sourceId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LogFindingID:
      name: findingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CIFailureID:
      name: failureId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RepoID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [jira, plane, github, claude, telegram, gitlab, openai] }
    RuleID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LessonID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RelationID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PullNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DraftID:
      name: draftId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SuiteID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TicketKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$', maxLength: 64 }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hiro_session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    EgressStatus:
      type: object
      required: [reachable]
      properties:
        reachable: { type: boolean, description: agnts could read the egress proxy's status }
        error: { type: string }
        upstream: { $ref: '#/components/schemas/EgressUpstream' }
    EgressUpstream:
      type: object
      required: [configured, ok, latencyMs, history, calls, failed]
      properties:
        configured: { type: boolean, description: AGNTS_EGRESS_UPSTREAM is set }
        via: { type: string, description: The upstream proxy, without its password }
        hosts:
          type: array
          items: { type: string }
        target: { type: string, description: The host each check reaches through it }
        ok: { type: boolean }
        checkedAt: { type: string, format: date-time }
        lastOkAt: { type: string, format: date-time }
        downSince: { type: string, format: date-time }
        latencyMs: { type: integer, format: int64 }
        error: { type: string }
        exit:
          type: object
          required: [ip, at]
          properties:
            ip: { type: string }
            org: { type: string }
            city: { type: string }
            country: { type: string }
            at: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            required: [at, ok, ms]
            properties:
              at: { type: string, format: date-time }
              ok: { type: boolean }
              ms: { type: integer, format: int64 }
        calls: { type: integer, format: int64, description: Connections runs made through it since egress started }
        failed: { type: integer, format: int64 }
        lastCallError: { type: string }
    ChatChannel:
      type: object
      required: [id, name, topic, agents, createdAt, lastId, unread, lastReadId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        topic: { type: string }
        agents: { type: boolean, description: agnts posts its cards here }
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        lastId: { type: integer, format: int64, description: The newest message's id }
        unread: { type: integer }
        lastReadId: { type: integer, format: int64 }
    ChatChannelInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 'Lower case letters, digits, - and _ (spaces become -)' }
        topic: { type: string }
        agents: { type: boolean }
    ChatChannelUpdate:
      type: object
      properties:
        topic: { type: string }
        agents: { type: boolean }
        archive: { type: boolean }
    ChatAI:
      type: object
      description: Which model made it and what it took
      required: [provider, model, ms, costUsd]
      properties:
        provider: { type: string }
        model: { type: string }
        ms: { type: integer, format: int64 }
        costUsd: { type: number }
    ChatRef:
      type: object
      required: [type, id, source, confidence]
      properties:
        type: { type: string, enum: [ticket, pr, repo, finding] }
        id: { type: string, description: 'A ticket key, "<repo>#<number>", a repository name or a finding id' }
        source: { type: string, enum: [explicit, model, card] }
        confidence: { type: number }
        reason: { type: string }
        label: { type: string }
        url: { type: string }
        ai: { $ref: '#/components/schemas/ChatAI' }
    ChatCard:
      type: object
      required: [type, state, title, actions]
      properties:
        type: { type: string, enum: [log_finding, review_ready, pr_opened, ticket_draft] }
        state: { type: string, enum: [open, done, failed, expired] }
        title: { type: string }
        summary: { type: string }
        actions:
          type: array
          items: { type: string, enum: [fix, mute, approve, request_changes, merge, create, create_assign] }
        data: { type: object, additionalProperties: true }
        by: { type: string }
        done: { type: string }
        result: { type: string }
        at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, channelId, author, kind, body, refs, createdAt]
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        replyTo: { type: integer, format: int64 }
        authorId: { type: integer, format: int64 }
        author: { type: string, description: The person's username, or agnts }
        kind: { type: string, enum: [text, agent_card, agent_text, system] }
        body: { type: string }
        card: { $ref: '#/components/schemas/ChatCard' }
        ai: { $ref: '#/components/schemas/ChatAI' }
        ticketKey: { type: string }
        audio: { $ref: '#/components/schemas/ChatAudio' }
        clientMsgId: { type: string }
        refs:
          type: array
          items: { $ref: '#/components/schemas/ChatRef' }
        createdAt: { type: string, format: date-time }
    ChatAudio:
      type: object
      description: A voice message; the message's body is its transcript
      required: [contentType, durationMs, transcript]
      properties:
        contentType: { type: string }
        durationMs: { type: integer, format: int64 }
        transcript: { type: string, enum: [pending, done, none, failed], description: 'none: no words were heard' }
        error: { type: string }
    ChatSendRequest:
      type: object
      required: [clientMsgId, body]
      properties:
        clientMsgId: { type: string, format: uuid, description: Made on the device; a resend with the same id returns the stored message }
        body: { type: string, maxLength: 8000 }
        replyTo: { type: integer, format: int64 }
    ChatActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [fix, mute, approve, request_changes, merge, create, create_assign] }
        feedback: { type: string, description: What to change (request_changes) }
        draft:
          type: object
          description: The edited draft (create, create_assign)
          properties:
            title: { type: string }
            description: { type: string }
            repoId: { type: integer, format: int64 }
    ChatStats:
      type: object
      required: [links, answers, drafts, medianMs]
      properties:
        links: { type: integer }
        answers: { type: integer }
        drafts: { type: integer }
        medianMs: { type: integer, format: int64 }
    SignupInfo:
      type: object
      required: [open, firstUser, emailEnabled]
      properties:
        open: { type: boolean, description: Anyone can register; otherwise only with an invite link }
        firstUser: { type: boolean, description: No account exists yet; the first one becomes Admin }
        emailEnabled: { type: boolean, description: "The server can send email (verification, invites, resets)" }
        googleClientId: { type: string, description: 'OAuth client id for "Continue with Google" (a form post to /auth/google); absent when it is off' }
        passwordSignup: { type: boolean, description: 'Registering with a password works; when only Admins sign in with one, only for the first account' }

    RegisterRequest:
      type: object
      required: [email, password, client]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        username: { type: string, maxLength: 64, description: 'Derived from the email when empty' }
        displayName: { type: string, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 256 }
        workspaceName: { type: string, maxLength: 80, description: 'Name of the first workspace; not created when joining by invite' }
        invite: { type: string, maxLength: 200, description: An invite token to join with }
        client: { type: string, enum: [web, mobile] }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }

    WorkspaceRole:
      type: string
      description: 'owner runs the workspace; user works in it; viewer sees everything and changes nothing'
      enum: [owner, user, viewer]

    Feedback:
      type: object
      required: [id, kind, title, description, status, sender, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [feedback, connector], description: 'feedback: sent from an account; connector: a connector request from the website' }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [new, done] }
        sender: { type: string, description: 'The sender''s name when they sent it' }
        email: { type: string }
        userId: { type: integer, format: int64, description: 'Absent once the account is deleted' }
        workspace: { type: string, description: The name of the workspace it was sent from }
        createdAt: { type: string, format: date-time }

    RunTranscript:
      type: object
      description: One recorded Claude Code or Codex invocation, without its prompt and events
      required: [id, workspaceId, workspace, workspaceSlug, purpose, background, engine, model, startedAt, status, exitReason,
        turns, toolCalls, toolErrors, stalls, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd,
        rawBytes, storedBytes, truncated]
      properties:
        id: { type: integer, format: int64 }
        workspaceId: { type: integer, format: int64 }
        workspace: { type: string }
        workspaceSlug: { type: string }
        runId: { type: integer, format: int64 }
        ticketKey: { type: string }
        subject: { type: string, description: 'What a background call is about: a repository, a rule, a language' }
        claudeAccount: { type: string, description: The Claude account's label }
        claudeUser: { type: string, description: 'The member whose Claude account it is (per-member mode)' }
        purpose: { type: string }
        background: { type: boolean, description: A call outside a ticket's stages }
        modelStage: { type: string }
        engine: { type: string, enum: [muse, claude, codex] }
        model: { type: string }
        sessionId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        status: { type: string, enum: [running, done, error, timeout, cancelled, oom] }
        exitReason: { type: string }
        turns: { type: integer }
        toolCalls: { type: integer }
        toolErrors: { type: integer }
        stalls: { type: integer }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        costUsd: { type: number }
        rawBytes: { type: integer, description: Uncompressed size of the events }
        storedBytes: { type: integer, description: Compressed size as stored }
        truncated: { type: boolean, description: The size limit was reached; later content was left out }

    RunHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunTranscript' }
        nextCursor: { type: string, description: Absent on the last page }

    RunHistorySummary:
      type: object
      required: [count, errors, stalled, costUsd, backgroundCostUsd, inputTokens, outputTokens, p50Ms, p95Ms]
      properties:
        count: { type: integer }
        errors: { type: integer, description: 'Ended in error, timeout or out of memory' }
        stalled: { type: integer, description: Had at least one stall }
        costUsd: { type: number }
        backgroundCostUsd: { type: number, description: The part of costUsd spent outside a ticket's stages }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        p50Ms: { type: integer, format: int64, description: Median duration of finished invocations }
        p95Ms: { type: integer, format: int64 }

    RunTranscriptEvent:
      type: object
      description: >-
        One line of a transcript. k is the kind: init, text, tool, tool_result, rate_limit, result or note.
        t is milliseconds since the start. Other fields depend on the kind (text, id, name, summary, input,
        output, error, exit_code, cut, subtype, turns, cost, status).
      required: [k, t]
      additionalProperties: true
      properties:
        k: { type: string, description: 'init, text, tool, tool_result, rate_limit, result or note; clients show kinds they do not know as is' }
        t: { type: integer, format: int64 }
        text: { type: string, description: 'text, result, note: the text' }
        id: { type: string, description: 'tool, tool_result: pairs a result with its call' }
        name: { type: string, description: 'tool: the tool (Bash, Read, Edit…)' }
        summary: { type: string, description: 'tool: a one-line summary of the call' }
        input:
          description: 'tool: the input as given (an object), or as text when it was too big to keep as JSON (cut is then set)'
        output: { type: string, description: 'tool_result: what the tool returned' }
        error: { type: boolean, description: 'tool_result, result: it failed' }
        exit_code: { type: integer, description: 'tool_result: a command''s exit code (Codex)' }
        cut: { type: integer, description: 'The original length in bytes when the content was shortened' }
        subtype: { type: string, description: 'result: success, error_max_turns…' }
        turns: { type: integer, description: 'result: turns taken' }
        cost: { type: number, description: 'result: cost in USD' }
        status: { type: string, description: 'rate_limit: the plan usage status' }
        session_id: { type: string, description: 'init: the Claude Code session' }
        model: { type: string, description: 'init: the model Claude Code reported' }

    RunTranscriptDetail:
      type: object
      required: [transcript, events, siblings]
      properties:
        transcript: { $ref: '#/components/schemas/RunTranscript' }
        events:
          type: array
          items: { $ref: '#/components/schemas/RunTranscriptEvent' }
        siblings:
          type: array
          description: The run's other invocations (first pass, fix attempts, second opinion), oldest first
          items: { $ref: '#/components/schemas/RunTranscript' }
        unreadable: { type: boolean, description: Part of the stored body could not be read; events holds what could }

    AdminAuditEntry:
      type: object
      required: [id, adminName, action, target, createdAt]
      properties:
        id: { type: integer, format: int64 }
        adminId: { type: integer, format: int64, description: Absent once the Admin account is deleted }
        adminName: { type: string }
        action: { type: string, description: 'transcript.view, transcript.prompt, transcript.download, run_history.settings' }
        target: { type: string }
        workspaceId: { type: integer, format: int64 }
        workspace: { type: string }
        ip: { type: string }
        createdAt: { type: string, format: date-time }

    RunHistorySettings:
      type: object
      required: [retentionDays, toolOutputKB, textKB, transcriptMB]
      properties:
        retentionDays: { type: integer, minimum: 0, maximum: 3650, description: Transcripts older than this are deleted daily; 0 keeps them }
        toolOutputKB: { type: integer, minimum: 1, maximum: 1024, description: Cap of one tool output; its start and end are kept }
        textKB: { type: integer, minimum: 1, maximum: 1024, description: Cap of one text block or tool input }
        transcriptMB: { type: integer, minimum: 1, maximum: 64, description: Cap of one transcript; past it only tool calls and the result are kept }

    PlatformUser:
      type: object
      description: A user as the Admin cabinet lists them
      required: [user, hasPassword, workspaces]
      properties:
        user: { $ref: '#/components/schemas/User' }
        hasPassword: { type: boolean, description: Can sign in with a password; false for accounts made with Google sign-in }
        lastSignInAt: { type: string, format: date-time, description: The newest session still on record }
        workspaces:
          type: array
          description: The workspaces they belong to (not deleted), with their role
          items: { $ref: '#/components/schemas/WorkspaceSummary' }
        freeCredits: { $ref: '#/components/schemas/FreeCredits' }
        creditUsage: { $ref: '#/components/schemas/CreditUsage' }
        modules: { $ref: '#/components/schemas/UserModules' }

    Module:
      type: string
      enum: [muse, claude, codex]
      description: 'A coding module: Muse Code (Meta), Claude Code (Anthropic) or Codex (OpenAI)'

    ModulesSettings:
      type: object
      description: Which coding modules the server offers and who gets which by default (Admin)
      required: [available, enabled, default]
      properties:
        available:
          type: array
          readOnly: true
          description: What this server can run (AGNTS_PROVIDERS); enabled stays within it
          items: { $ref: '#/components/schemas/Module' }
        enabled:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Module' }
        default:
          type: array
          description: 'What a person gets unless an Admin set theirs, the default module first; codex cannot be first'
          items: { $ref: '#/components/schemas/Module' }

    UserModules:
      type: object
      required: [effective]
      properties:
        own:
          type: array
          nullable: true
          description: The list an Admin set; absent or null follows the default
          items: { $ref: '#/components/schemas/Module' }
        effective:
          type: array
          description: What the person may use now, in their order, the default module first
          items: { $ref: '#/components/schemas/Module' }
        order:
          type: array
          nullable: true
          description: The order the person put their modules in themselves; absent or null keeps the Admin's
          items: { $ref: '#/components/schemas/Module' }
        setAt: { type: string, format: date-time }

    WorkspaceSummary:
      type: object
      required: [id, slug, name, role, members, plan, slots]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        members: { type: integer }
        plan: { type: string }
        slots: { type: integer }
        suspended: { type: boolean }

    WorkspaceDetail:
      type: object
      required: [id, slug, name, role, ownerId, plan, slots, memberLimit, members, claudeMode, claudeFallback, creditsBalance, createdAt]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        ownerId: { type: integer, format: int64 }
        plan: { type: string }
        slots: { type: integer }
        memberLimit: { type: integer, description: 0 means no limit }
        members: { type: integer }
        claudeMode: { type: string, enum: [shared, member] }
        claudeFallback: { type: boolean }
        defaultMemberId: { type: integer, format: int64 }
        creditsBalance: { type: integer, format: int64 }
        trialEndsAt: { type: string, format: date-time }
        suspended: { type: boolean }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, username, role, joinedAt, claudeConnected]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, description: Shown to the owner only }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        joinedAt: { type: string, format: date-time }
        claudeConnected: { type: boolean, description: Has a personal Claude connection (per-member mode) }

    Invite:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    InvitePreview:
      type: object
      required: [workspace, expiresAt]
      properties:
        workspace: { type: string, description: The workspace's name }
        invitedBy: { type: string }
        email: { type: string }
        expiresAt: { type: string, format: date-time }

    Capacity:
      type: object
      required: [budgetMb, reservedMb, runs, full]
      properties:
        budgetMb: { type: integer, format: int64, description: Memory the server lends to runs; 0 when it is not limited }
        reservedMb: { type: integer, format: int64 }
        runs: { type: integer }
        diskFreeMb: { type: integer, format: int64 }
        full: { type: boolean }

    WaitReason:
      type: string
      enum: [blocked, slots, server, claude]
      description: >-
        Why a ticket waits for a worker: blocked (related tickets or held,
        for the team), slots (the workspace's runs are in use), server (no
        memory left on the server, for the platform), claude (the Claude
        account is at its limit or missing).

    QueueStatus:
      type: object
      required: [running, slots, waiting, serverQueue, serverQueueLength, capacity]
      properties:
        running: { type: integer }
        slots: { type: integer }
        waiting:
          type: object
          description: The workspace's waiting tickets by reason
          properties:
            blocked: { type: integer }
            slots: { type: integer }
            server: { type: integer }
            claude: { type: integer }
        serverQueue:
          type: array
          description: The workspace's tickets waiting for the server
          items:
            type: object
            required: [key, position, others]
            properties:
              key: { type: string }
              position: { type: integer, description: 1-based place in the whole server queue }
              others: { type: integer, description: Tickets of other workspaces ahead }
              estimateSec: { type: integer, description: About how long until it may start }
        serverQueueLength: { type: integer }
        capacity: { $ref: '#/components/schemas/Capacity' }

    ClaudeConnectionInput:
      type: object
      required: [kind, token]
      properties:
        kind: { type: string, enum: [subscription, api_key, muse_api_key], description: 'subscription: a token from `claude setup-token`; api_key: an Anthropic API key; muse_api_key: a Meta Model API key (LLM_…). A Meta sign-in connects through the muse/login operations.' }
        token: { type: string, minLength: 10, maxLength: 500 }

    ClaudeConnectionState:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        kind: { type: string, enum: [subscription, api_key, muse_api_key, muse_login] }
        tokenHint: { type: string, description: The token's last four characters }
        account: { type: string }
        lastError: { type: string }
        pausedUntil: { type: string, format: date-time, description: At its usage limit until then }
        usage: { $ref: '#/components/schemas/Usage' }
        checkedAt: { type: string, format: date-time }

    WorkspaceClaude:
      type: object
      required: [mode, fallback, connection, members, creditsBalance, subscriptionsAllowed]
      properties:
        mode: { type: string, enum: [shared, member] }
        fallback: { type: boolean }
        defaultMemberId: { type: integer, format: int64 }
        connection: { $ref: '#/components/schemas/ClaudeConnectionState' }
        members:
          type: array
          description: Who has a personal connection (per-member mode)
          items:
            type: object
            required: [userId, username, connected]
            properties:
              userId: { type: integer, format: int64 }
              username: { type: string }
              connected: { type: boolean }
              pausedUntil: { type: string, format: date-time }
        creditsBalance: { type: integer, format: int64 }
        subscriptionsAllowed: { type: boolean, description: 'This server accepts Claude subscription tokens (self-hosted); otherwise API keys only' }

    LedgerEntry:
      type: object
      required: [id, amount, reason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        amount: { type: integer, format: int64, description: Credits; negative for spend }
        reason: { type: string, enum: [purchase, run, document, refund, grant] }
        ticketKey: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    Billing:
      type: object
      required: [plan, slots, maxSlots, memberLimit, members, creditsBalance, ledger, prices, paymentsEnabled]
      properties:
        plan: { type: string }
        slots: { type: integer }
        maxSlots: { type: integer }
        memberLimit: { type: integer }
        members: { type: integer }
        creditsBalance: { type: integer, format: int64 }
        trialEndsAt: { type: string, format: date-time }
        monthlyUzs: { type: integer, format: int64, description: "What the plan, extra slots and extra members cost a month" }
        monthlyUsd: { type: number, format: double, description: 'The same in US dollars, as the billing page shows it' }
        ledger:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
        prices:
          type: object
          required: [workspaceUzs, slotUzs, memberUzs, creditUzs, workspaceUsd, slotUsd, memberUsd, creditUsd, includedMembers, markup]
          properties:
            workspaceUsd: { type: number, format: double, description: 'A workspace a month, in US dollars (shown on the billing page)' }
            slotUsd: { type: number, format: double, description: 'An extra parallel run a month, in US dollars' }
            memberUsd: { type: number, format: double, description: 'A member above the included ones a month, in US dollars' }
            creditUsd: { type: number, format: double, description: 'One credit, in US dollars' }
            workspaceUzs: { type: integer, format: int64 }
            slotUzs: { type: integer, format: int64 }
            memberUzs: { type: integer, format: int64 }
            creditUzs: { type: integer, format: int64, description: Price of one credit ($0.01 of API cost at the markup) }
            includedMembers: { type: integer }
            markup: { type: number }
        paymentsEnabled: { type: boolean }
        selfHosted: { type: boolean, description: 'No billing: slots and members are set by the Admin' }

    PlatformWorkspace:
      type: object
      required: [id, slug, name, plan, slots, memberLimit, members, creditsBalance, running, createdAt]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        owner: { type: string }
        plan: { type: string }
        slots: { type: integer }
        memberLimit: { type: integer }
        members: { type: integer }
        creditsBalance: { type: integer, format: int64 }
        running: { type: integer }
        suspended: { type: boolean }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PlatformOverview:
      type: object
      required: [capacity, runs, serverQueue, workspaces, users]
      properties:
        capacity: { $ref: '#/components/schemas/Capacity' }
        runs:
          type: array
          items:
            type: object
            required: [workspaceId, ticketKey, stage, startedAt]
            properties:
              workspaceId: { type: integer, format: int64 }
              workspace: { type: string }
              ticketKey: { type: string }
              stage: { type: string }
              startedAt: { type: string, format: date-time }
        serverQueue:
          type: array
          items:
            type: object
            required: [workspaceId, ticketKey]
            properties:
              workspaceId: { type: integer, format: int64 }
              workspace: { type: string }
              ticketKey: { type: string }
        workspaces: { type: integer }
        users: { type: integer }

    LoginRequest:
      type: object
      required: [username, password, client]
      properties:
        username: { type: string, minLength: 1, maxLength: 254, description: Username or email }
        password: { type: string, minLength: 1, maxLength: 256 }
        code:
          type: string
          description: Six-digit code from the authenticator app, when two-factor sign-in is on
          pattern: '^[0-9]{6}$'
        totpSecret:
          type: string
          maxLength: 128
          description: An Admin finishing two-factor setup at sign-in (beginLoginTotp's secret); code must match it
        client:
          type: string
          enum: [web, mobile]

    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 1, maxLength: 4096, description: The ID token Google Sign-In gave the app }
        invite: { type: string, maxLength: 256, description: "An invite link's token, to join that workspace" }

    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
        token:
          type: string
          description: Session token, returned only when client is mobile

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        isAdmin: { type: boolean, description: The platform operator (system role Admin) }
        hasTotp: { type: boolean, description: Signs in with a second factor }
        lastWorkspace: { type: string, description: The slug of the workspace opened last }
        modules:
          type: array
          description: The coding modules the user may use, the default first (on /auth/me only)
          items: { $ref: '#/components/schemas/Module' }
        workspaces:
          type: array
          description: The workspaces the user is a member of (on /auth/me only)
          items: { $ref: '#/components/schemas/WorkspaceSummary' }
        createdAt: { type: string, format: date-time }

    Meta:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    TicketState:
      type: string
      enum: [new, analyzing, waiting_for_answers, coding, testing, waiting_for_review, pushing, done, rejected, failed, rate_limited]

    TicketKind:
      type: string
      enum: [code, test, plan, analysis, bug, review, swaggertest]
      description: >-
        What the work produces. code and test make a change (diff, checks,
        pull request); plan, analysis and bug write a Markdown report.
        review reviews a pull request someone else opened (source git):
        approving it merges the pull request. Nobody picks review: those
        tickets come from syncing the git host. swaggertest tests an HTTP
        API against its Swagger/OpenAPI spec and reports the results; those
        tickets come from the Swagger test form only.

    TicketKindChoice:
      type: string
      enum: [auto, code, test, plan, analysis, bug]
      description: A kind, or auto for agnts to pick one during analysis

    ImplementInput:
      type: object
      properties:
        repoId: { type: integer, format: int64, description: 'Where to implement it; defaults to the report''s repositories' }
        repoIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, format: int64 }
          description: Several repositories instead of repoId
        groupId: { type: integer, format: int64 }
        start:
          type: string
          enum: [code, queue]
          description: 'code = start now without questions (default), queue = keep until started'

    Footprint:
      type: object
      description: What the analysis predicts the work will change; the queue compares footprints
      required: [files]
      properties:
        files:
          type: array
          items: { type: string }
        modules:
          type: array
          items: { type: string }
        provides:
          type: array
          description: What the change adds that other work could use
          items: { type: string }
        consumes:
          type: array
          description: What the change needs that may not exist yet
          items: { type: string }
        migrations: { type: boolean }

    Blocker:
      type: object
      required: [key, title, state, type]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        type: { $ref: '#/components/schemas/RelationType' }

    RelationType:
      type: string
      enum: [depends_on, conflicts]
      description: 'depends_on: one waits for the other to merge; conflicts: both change the same code, so they do not run side by side'

    RelationInput:
      type: object
      required: [otherKey, type]
      properties:
        otherKey: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/RelationType' }

    Relation:
      type: object
      required: [id, type, direction, source, status, confidence, reason, basis, files, other, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/RelationType' }
        direction:
          type: string
          enum: [waits_for, waited_by, conflicts]
          description: 'From the ticket asked about: it waits for other, other waits for it, or they conflict'
        source:
          type: string
          enum: [jira, plane, user, agnts, rule, git]
          description: 'Who found it: a Jira link, a Plane relation, a person, the analysis, overlapping footprints, or the finished diffs (when nobody predicted it)'
        status:
          type: string
          enum: [active, proposed, dismissed]
          description: Only active relations hold the queue; proposed ones wait for a person
        confidence: { type: number, format: double }
        reason: { type: string }
        basis:
          type: string
          description: 'For rule and git relations: files, migrations, lockfile, codegen, i18n or diff'
        files:
          type: array
          description: Files both tickets change, when known
          items: { type: string }
        other: { $ref: '#/components/schemas/RelatedTicket' }
        confirmedAt: { type: string, format: date-time, description: When the finished changes proved the conflict real }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RelatedTicket:
      type: object
      required: [key, title, state, landed]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        landed: { type: boolean, description: 'Its change is merged (or it was rejected): it holds nothing back' }

    Relations:
      type: object
      required: [items, blockedBy]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        blockedBy:
          type: array
          description: What holds the ticket's coding back right now
          items: { $ref: '#/components/schemas/Blocker' }

    FollowUpsMode:
      type: string
      enum: [inherit, 'on', 'off']
      description: 'Follow-up suggestions for one ticket: inherit follows Settings'

    FollowUpsSetting:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/FollowUpsMode' }

    FollowUpSuggestion:
      type: object
      required: [id, source, type, revision, title, description, serves, kind, priority, status, ready, createdAt]
      properties:
        id: { type: integer, format: int64 }
        source:
          type: string
          enum: [analyze, work, review, manual]
          description: 'The run that suggested it; manual = made from a review finding'
        type:
          type: string
          enum: [prerequisite, split, unfinished, gap]
          description: How it serves the parent ticket
        revision: { type: integer, description: "The parent's revision when it was suggested" }
        title: { type: string }
        description: { type: string }
        serves: { type: string, description: How it helps finish the parent ticket }
        kind: { $ref: '#/components/schemas/TicketKind' }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, accepted, dismissed] }
        ready: { type: boolean, description: 'A ticket can be made from it now (open, and the parent is done unless the analysis suggested it)' }
        after:
          type: array
          items: { type: integer, format: int64 }
          description: 'Ids of sibling suggestions that must land first; once both are tickets, this one depends on them'
        childKey: { type: string, description: 'The ticket made from it' }
        repoIds:
          type: array
          description: "The parent's repositories it is about; absent for all of them"
          items: { type: integer, format: int64 }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    FollowUpTicket:
      type: object
      required: [key, title, state, kind, source]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        kind: { $ref: '#/components/schemas/TicketKind' }
        source: { type: string, enum: [jira, plane, local, git, ci, logs] }
        held: { type: boolean }

    FollowUps:
      type: object
      required: [enabled, suggestions, children]
      properties:
        enabled: { type: boolean, description: "This ticket's runs suggest follow-ups" }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/FollowUpSuggestion' }
        children:
          type: array
          description: Tickets made from the suggestions
          items: { $ref: '#/components/schemas/FollowUpTicket' }

    AcceptFollowUp:
      type: object
      required: [id]
      description: A suggestion to create, with optional edits
      properties:
        id: { type: integer, format: int64 }
        target:
          type: string
          enum: [local, jira, plane]
          description: 'local = an agnts task (default), jira = a new issue in the Jira project, plane = a new work item in the Plane project'
        title: { type: string, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        kind: { $ref: '#/components/schemas/TicketKind' }
        priority: { type: string, enum: [low, medium, high] }
        repoId: { type: integer, format: int64, description: "Defaults to the parent ticket's repositories (those the suggestion is about)" }
        repoIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }

    AcceptFollowUps:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AcceptFollowUp' }
        start:
          type: boolean
          description: 'Queue the new tickets to run now instead of holding them until someone starts each one'

    AcceptFollowUpResult:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        ticket: { $ref: '#/components/schemas/Ticket' }
        error: { type: string, description: 'Why no ticket was made from this suggestion' }

    AcceptFollowUpsResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AcceptFollowUpResult' }

    AssistantLanguage:
      type: string
      description: The language the assistant answers in (the app's)
      enum: [en, ru, uz]

    AssistantAsk:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        lang: { $ref: '#/components/schemas/AssistantLanguage' }

    AssistantTranscript:
      type: object
      required: [text]
      properties:
        text: { type: string, description: The words Muse heard in the recording }

    AssistantLink:
      type: object
      description: A screen of the app an answer points to
      required: [kind]
      properties:
        kind: { type: string, enum: [ticket, ci, lesson] }
        key: { type: string, description: 'The ticket key (kind ticket)' }
        id: { type: integer, format: int64, description: The CI failure or lesson id }

    AssistantMessage:
      type: object
      required: [id, role, text, speech, links, status, lang, rating, shared, createdAt]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant] }
        text: { type: string, description: 'The question, or the answer in Markdown' }
        speech: { type: string, description: The answer in 1-3 plain sentences (empty for questions) }
        links:
          type: array
          items: { $ref: '#/components/schemas/AssistantLink' }
        status: { type: string, enum: [pending, answering, done, failed] }
        error: { type: string, description: Why the answer failed }
        lang: { $ref: '#/components/schemas/AssistantLanguage' }
        durationMs: { type: integer, format: int64 }
        files:
          type: array
          description: The snapshot files the answer was made from
          items: { type: string }
        rating: { type: integer, enum: [-1, 0, 1], description: 'Your rating: 1 helpful, -1 not, 0 none' }
        ratingComment: { type: string }
        shared: { type: boolean, description: The answer's snapshot is kept for prompt tests }
        actions:
          type: array
          description: Actions the answer proposes, each waiting for you to confirm
          items: { $ref: '#/components/schemas/AssistantAction' }
        actionErrors:
          type: array
          description: Actions the assistant tried to propose that agnts could not prepare, and why
          items: { type: string }
        handoff: { $ref: '#/components/schemas/CodeHandoff' }
        ticketKey: { type: string, description: 'Code mode: the ticket the message went to' }
        routed: { $ref: '#/components/schemas/CodeRouted' }
        attachments:
          type: array
          description: 'Code mode: uploads that went with the message'
          items: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    AssistantAction:
      type: object
      description: >-
        A write the assistant proposed. Nothing happens until you confirm
        it; the summary is agnts's own words for what it will do.
      required: [id, messageId, conversationId, tool, summary, destructive, status, expiresAt]
      properties:
        id: { type: string }
        messageId: { type: integer, format: int64 }
        conversationId: { type: integer, format: int64 }
        tool:
          type: string
          enum: [answer_questions, start_run, request_changes, retry_run, create_task, implement_ticket, accept_follow_ups, dismiss_follow_up, set_ticket_kind, approve_ticket, reject_ticket]
        ticketKey: { type: string, description: 'The ticket it acts on, or the one it created' }
        summary: { type: string }
        destructive: { type: boolean, description: 'It cannot be taken back (approve, reject): ask once more before confirming' }
        status:
          type: string
          enum: [proposed, running, done, failed, cancelled, expired]
        result: { type: string, description: 'What happened (done), or why not (failed)' }
        expiresAt: { type: string, format: date-time }

    AssistantConversation:
      type: object
      required: [id, title, mode, createdAt, updatedAt, messages]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, description: 'The first question, cut' }
        mode: { $ref: '#/components/schemas/ChatMode' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          description: Oldest first; in lists, only the last message
          items: { $ref: '#/components/schemas/AssistantMessage' }
        repos: { $ref: '#/components/schemas/RepoChoice' }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        quick: { type: boolean, description: "Code mode: its tickets skip their checks" }
        tickets:
          type: array
          description: 'Code mode: its tickets, oldest first; in lists, only the current one'
          items: { $ref: '#/components/schemas/CodeTicket' }

    ChatMode:
      type: string
      enum: [chat, code]
      description: 'chat: the assistant answers about the workspace. code: the conversation drives tickets that change repositories'

    CodeRouted:
      type: string
      enum: [created, answered, changes, continued, retried, queued, sent, failed, steered]
      description: >-
        What a Code message did: created a ticket, answered its questions,
        asked for changes, continued or retried it, waits for the running
        stage (queued; then sent or failed), or went into the running Muse
        turn (steered)

    RepoChoice:
      type: object
      description: One of repoId, repoIds and groupId
      properties:
        repoId: { type: integer, format: int64 }
        repoIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }

    CodeTicket:
      type: object
      required: [key, title, state, kind, repos, current, moved, attachedAt]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        kind: { $ref: '#/components/schemas/TicketKind' }
        repos: { type: array, items: { type: string }, description: 'Repository names, the primary first' }
        current: { type: boolean, description: New messages go to it }
        moved: { type: boolean, description: Another of your conversations has it now }
        attachedAt: { type: string, format: date-time }

    CodeStart:
      type: object
      properties:
        text: { type: string, maxLength: 4000, description: What you want done }
        attachments:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
        repos: { $ref: '#/components/schemas/RepoChoice' }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        quick: { type: boolean, description: 'Tickets skip their checks (build, lint, test)' }
        ticketKey: { type: string, maxLength: 64, description: Work on this existing ticket instead of starting one }

    CodeSend:
      type: object
      properties:
        text: { type: string, maxLength: 4000 }
        attachments:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
        answers:
          type: array
          description: Answers to the ticket's questions, one per question (the question card)
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, format: int64 }
              answer: { type: string, minLength: 1, maxLength: 5000 }

    CodeHandoff:
      type: object
      description: "A Chat answer's offer to do a code change in Code mode: open it with these and send"
      required: [request, repoIds, repos]
      properties:
        request: { type: string }
        repoIds: { type: array, items: { type: integer, format: int64 } }
        repos: { type: array, items: { type: string } }

    TimelineItem:
      type: object
      description: One of message (yours) and event (a ticket's)
      required: [at]
      properties:
        at: { type: string, format: date-time }
        message: { $ref: '#/components/schemas/AssistantMessage' }
        event: { $ref: '#/components/schemas/Event' }

    CodeApproval:
      type: object
      description: A tool call the agent waits on your decision about
      required: [id, conversationId, ticketKey, tool, reason, status, expiresAt]
      properties:
        id: { type: string }
        conversationId: { type: integer, format: int64 }
        ticketKey: { type: string }
        tool: { type: string }
        command: { type: string }
        path: { type: string }
        reason: { type: string, description: Why a rule asks about it }
        status: { type: string, enum: [pending, allowed, denied, expired] }
        expiresAt: { type: string, format: date-time }

    CodeTimeline:
      type: object
      required: [conversation, items, approvals]
      properties:
        conversation: { $ref: '#/components/schemas/AssistantConversation' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
        approvals:
          type: array
          description: Tool calls waiting for your decision
          items: { $ref: '#/components/schemas/CodeApproval' }

    AssistantRating:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, enum: [-1, 0, 1] }
        comment: { type: string, maxLength: 1000 }
        share: { type: boolean, description: Keep the answer's snapshot so new prompts can be tried on it }

    AssistantStats:
      type: object
      required: [days, questions, answered, failed, people, medianMs, p90Ms, medianStartMs, medianSnapshotMs, medianClaudeMs, warm, up, down, tokens, costUsd, actions, versions]
      properties:
        days: { type: integer }
        questions: { type: integer }
        answered: { type: integer }
        failed: { type: integer }
        people: { type: integer, description: How many people asked }
        medianMs: { type: integer, format: int64 }
        p90Ms: { type: integer, format: int64 }
        medianStartMs: { type: integer, format: int64, description: 'Opening (or reusing) the container, median' }
        medianSnapshotMs: { type: integer, format: int64, description: 'Reading the workspace, median' }
        medianClaudeMs: { type: integer, format: int64, description: 'The Claude Code run, median' }
        warm: { type: integer, description: Answers that reused the container kept from the last one }
        up: { type: integer }
        down: { type: integer }
        tokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
        actions:
          type: object
          description: >-
            The actions answers proposed and what became of them. Few
            confirmed of many proposed means the assistant offers too
            eagerly.
          required: [proposed, done, failed, cancelled, expired, notOffered]
          properties:
            proposed: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer, description: Declined by the person }
            expired: { type: integer }
            notOffered: { type: integer, description: Proposals that failed agnts's checks }
        versions:
          type: array
          description: Per prompt version, newest first
          items:
            type: object
            required: [promptVersion, answered, failed, up, down, medianMs, tokens, proposed, done]
            properties:
              promptVersion: { type: string }
              answered: { type: integer }
              failed: { type: integer }
              up: { type: integer }
              down: { type: integer }
              medianMs: { type: integer, format: int64 }
              tokens: { type: integer, format: int64 }
              proposed: { type: integer, description: Actions proposed }
              done: { type: integer, description: Actions confirmed and done }

    AssistantRated:
      type: object
      required: [messageId, user, question, answer, rating, comment, promptVersion, shared, ratedAt]
      properties:
        messageId: { type: integer, format: int64 }
        user: { type: string }
        question: { type: string }
        answer: { type: string }
        rating: { type: integer, enum: [-1, 1] }
        comment: { type: string }
        promptVersion: { type: string }
        shared: { type: boolean }
        actions:
          type: array
          description: The actions the answer proposed, and what became of them
          items: { $ref: '#/components/schemas/AssistantAction' }
        ratedAt: { type: string, format: date-time }

    TranslationLanguage:
      type: string
      description: A language agnts can translate into
      enum: [en, ru, uz, kk, tr, de, es, fr, zh, ja, ko, ar]

    TranslateInput:
      type: object
      required: [lang]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }

    Translation:
      type: object
      required: [lang, items]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }
        items:
          type: array
          description: Each text as the ticket page shows it, and its translation
          items:
            type: object
            required: [source, text]
            properties:
              source: { type: string }
              text: { type: string }

    DocumentTranslation:
      type: object
      required: [lang, version, title, body, complete]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }
        version: { type: integer, description: The version translated }
        title: { type: string }
        body: { type: string, description: 'The Markdown, rendered like the original' }
        complete: { type: boolean, description: 'False when some blocks are still as written' }

    TicketKindInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/TicketKindChoice' }

    Ticket:
      type: object
      required: [key, source, title, description, priority, state, revision, turns, branch, prUrl, kind, kindAuto, skipChecks, createdAt, updatedAt]
      properties:
        key: { type: string }
        ticketNumber: { type: string, description: "The team's number for the work (AMANAT-2288), used in branch and commit names; absent uses key" }
        source: { type: string, enum: [jira, plane, local, git, ci, logs] }
        repoId: { type: integer, format: int64, description: 'The primary repository; repos lists all of them' }
        repos:
          type: array
          description: Every repository the ticket works in, the primary first, with its branch and pull request
          items: { $ref: '#/components/schemas/TicketRepoState' }
        group: { $ref: '#/components/schemas/RepoGroupRef' }
        partlyMerged: { type: boolean, description: 'Some pull requests merged and at least one closed without a merge' }
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        resumeState: { $ref: '#/components/schemas/TicketState' }
        revision: { type: integer }
        replayOf: { type: string, description: 'For a replay: the done ticket it re-runs. Replays are never pushed.' }
        turns: { type: integer }
        branch: { type: string, description: "The primary repository's branch (see repos)" }
        headSha: { type: string, description: "The reviewed commit: the branch head agnts committed (in the primary repository; see repos), or for a pull request review the head agnts reviewed" }
        prNumber: { type: integer, description: "The primary repository's pull request (see repos)" }
        prUrl: { type: string, description: "The primary repository's pull request (see repos)" }
        ciFixes: { type: integer, description: 'Rounds a red CI check sent the pull request back to coding' }
        assignees:
          type: array
          description: Git host usernames the pull request is (or will be) assigned to
          items: { type: string }
        afterApprove: { type: string, enum: [pr, main, none], description: "pr: open a pull request (a review: merge it); main: push to the default branch; none: a review asked for from the pull request page, which approving finishes without merging" }
        held: { type: boolean, description: Kept in the queue until started }
        askFirst: { type: boolean }
        kind: { $ref: '#/components/schemas/TicketKind' }
        kindAuto: { type: boolean, description: 'agnts picks the kind; the analysis may still change it' }
        skipChecks: { type: boolean, description: 'coding runs skip the checks and go to review on the code alone (set with retryTicket or requestChanges)' }
        benchmark: { type: boolean, description: 'A merged ticket in the benchmark that changes to agnts are replayed against (setTicketBenchmark)' }
        postReport: { type: boolean, description: 'The approved report is posted to the tracker issue' }
        parentKey: { type: string, description: 'The plan or bug investigation this ticket implements' }
        followUpOf: { type: string, description: 'The ticket that suggested this one as a follow-up' }
        suggestFollowUps: { $ref: '#/components/schemas/FollowUpsMode' }
        openSuggestions: { type: integer, description: 'Follow-up suggestions waiting for a decision' }
        blockedBy:
          type: array
          description: >-
            The tickets holding this one's coding back right now (it is in
            coding with no commit yet). Absent when nothing does.
          items: { $ref: '#/components/schemas/Blocker' }
        repoName: { type: string }
        models: { $ref: '#/components/schemas/ModelOverrides' }
        since: { type: string, format: date-time, description: When the ticket entered its current state }
        stopReason: { type: string, description: Why it failed or paused }
        mergedAt: { type: string, format: date-time }
        pull: { $ref: '#/components/schemas/PullRequest' }
        trackerUpdate: { $ref: '#/components/schemas/TrackerUpdate' }
        learnState:
          type: string
          enum: [none, pending, done, failed]
          description: The learn run after push; pending also while it runs
        reviewState:
          type: string
          enum: [none, pending, running, done, failed]
          description: The code review agnts runs beside the human review
        previewState:
          type: string
          enum: [none, pending, running, done, failed]
          description: The screenshots agnts takes beside the human review
        previewCompare: { type: boolean, description: Previews of this ticket also capture the default branch (before shots) }
        canPreview: { type: boolean, description: The ticket's repository has a preview command }
        continueTo: { $ref: '#/components/schemas/TicketState' }
        canStartOver: { type: boolean, description: "This rejected ticket can start over from scratch (nothing of it was pushed); continueTo, when set, is where Continue sends it without a note" }
        savedWork:
          type: array
          items: { type: string }
          description: "Ticket page of a stopped (failed, rate-limited or rejected) ticket: the files of the unfinished change its last coding run left, which the next coding run picks up again (paths from /workspace). Absent when there is none."
        spend: { $ref: '#/components/schemas/TokenSpend' }
        waitReason: { $ref: '#/components/schemas/WaitReason' }
        waitMessage: { type: string, description: "Why it waits, in a sentence" }
        queuedAt: { type: string, format: date-time, description: When it started waiting for a worker }
        memberId: { type: integer, format: int64, description: 'Whose ticket it is (per-member Claude mode runs on their account)' }
        member: { type: string, description: The member's username }
        createdBy: { type: string, description: Who created it; absent for webhooks and agnts }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TokenSpend:
      type: object
      description: >-
        Tokens Claude used (on a ticket: all its runs; absent until one is
        recorded). costUsd is what Claude Code reports the same work
        would cost on the API; on a Claude plan it is an estimate, not a charge.
      required: [input, output, cacheRead, cacheWrite, total, costUsd]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        cacheWrite: { type: integer, format: int64 }
        total: { type: integer, format: int64, description: All four counts added }
        costUsd: { type: number, format: double }

    TicketSpendList:
      type: object
      required: [days, total, tickets]
      properties:
        days: { type: integer }
        total: { $ref: '#/components/schemas/TokenSpend' }
        tickets:
          type: array
          description: Costliest first; partial runs have no cost, so ties fall back to tokens
          items: { $ref: '#/components/schemas/TicketSpendRow' }

    TicketSpendRow:
      type: object
      description: One ticket's spend within the period (not its lifetime spend)
      required: [key, title, kind, state, calls, topStage, spend]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { $ref: '#/components/schemas/TicketKind' }
        state: { $ref: '#/components/schemas/TicketState' }
        repoName: { type: string }
        calls: { type: integer, description: Claude invocations in the period }
        topStage:
          type: string
          enum: [analyze, coding, retry, helper, learn, review, preview]
          description: The stage that cost the most
        spend: { $ref: '#/components/schemas/TokenSpend' }

    StageSpend:
      type: object
      description: Spend for one stage and model; on a ticket, in the order the stage first ran
      required: [stage, model, calls, turns, partial, spend]
      properties:
        stage:
          type: string
          enum: [analyze, coding, retry, helper, learn, review, preview]
          description: 'retry is fix attempts after failed checks and requested changes'
        model: { type: string }
        calls: { type: integer, description: Claude invocations }
        turns: { type: integer }
        partial:
          type: boolean
          description: A run was cut off, so its tokens are counted from the messages seen and its cost is unknown
        spend: { $ref: '#/components/schemas/TokenSpend' }

    Question:
      type: object
      required: [id, position, text, options, multiple, note]
      properties:
        id: { type: integer, format: int64 }
        position: { type: integer }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        multiple:
          type: boolean
          description: Several options may be chosen; the answer then lists the chosen ones, one per line
        answer: { type: string }
        note: { type: string }
        draft: { $ref: '#/components/schemas/AnswerDraft' }

    AnswerDraft:
      type: object
      description: What someone typed but has not sent yet (see saveAnswerDraft)
      required: [answer, note, attachments, updatedAt]
      properties:
        answer: { type: string, description: 'As the answer would be sent; may be empty' }
        note: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        updatedAt: { type: string, format: date-time }

    Attachment:
      type: object
      required: [id, name, contentType, size, purpose, url, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, description: Bytes }
        purpose:
          type: string
          enum: [pending, ticket, answer, retry, feedback]
          description: 'pending = uploaded, not attached yet; ticket = the task description; answer = an answer (see questionId); retry = a retry note; feedback = requested changes'
        questionId: { type: integer, format: int64 }
        image: { type: boolean, description: 'A picture clients can show in place' }
        url: { type: string, description: 'Where to load the file, relative to the API base' }
        createdAt: { type: string, format: date-time }

    Analysis:
      type: object
      required: [summary, plan]
      properties:
        summary: { type: string }
        plan:
          type: array
          items: { type: string }
        complexity:
          type: string
          enum: [simple, complex]
          description: The analysis's rating; picks the review model on auto
        footprint: { $ref: '#/components/schemas/Footprint' }
        approaches:
          type: array
          description: Ways to do the work that the analysis weighed; exactly one is chosen
          items: { $ref: '#/components/schemas/Approach' }
        outOfScope:
          type: array
          description: What the work will deliberately not do
          items: { type: string }
        ship: { $ref: '#/components/schemas/ShipNotes' }
        defect: { type: boolean, description: 'The work fixes broken behaviour; with proveFixes on it must prove the fix' }
        acceptance:
          type: array
          description: What the finished work must do, as checks
          items:
            type: object
            required: [id, criterion, check]
            properties:
              id: { type: string }
              criterion: { type: string }
              check: { type: string, enum: [ui, api, test, manual] }
        patterns:
          type: array
          description: For each file the work changes, the existing code it follows (copy, adapt) or that it is new
          items: { $ref: '#/components/schemas/Pattern' }
        reuse:
          type: array
          description: Existing helpers the work must use instead of writing its own
          items:
            type: object
            required: [name, where]
            properties:
              name: { type: string }
              where: { type: string }
              for: { type: string }
        testPlan:
          type: array
          description: Tests the work must add or change
          items:
            type: object
            required: [file, what]
            properties:
              file: { type: string }
              what: { type: string }
        edgeCases:
          type: array
          description: Inputs and failures the work must handle
          items: { type: string }
        repro:
          type: object
          description: How the analysis reproduced the reported bug
          required: [reproduced]
          properties:
            reproduced: { type: boolean }
            command: { type: string }
            output: { type: string }
            why: { type: string }
        secondOpinion: { $ref: '#/components/schemas/SecondOpinion' }

    Pattern:
      type: object
      required: [file, kind, like]
      properties:
        file: { type: string }
        kind: { type: string, enum: [copy, adapt, new] }
        like: { type: string, description: 'The existing file to follow; for a new pattern, the one to take conventions from (may be empty)' }
        layer: { type: string }
        why: { type: string }
        place: { type: string }
        precedent: { type: boolean, description: 'A new pattern other code will copy; the author is asked about it' }

    Approach:
      type: object
      required: [title, sketch, pros, cons, chosen]
      properties:
        title: { type: string }
        sketch: { type: string }
        pros:
          type: array
          items: { type: string }
        cons:
          type: array
          items: { type: string }
        fit: { type: string, description: 'How it fits the repository brief and the team rules, or what it bends' }
        chosen: { type: boolean }
        why: { type: string, description: 'For the chosen approach, why it beats the others; for the others, why not' }

    ShipNotes:
      type: object
      description: How the change ships; absent fields do not apply
      properties:
        migrations: { type: string }
        compatibility: { type: string }
        rollout: { type: string }
        rollback: { type: string }

    Finding:
      type: object
      required: [severity, category, title]
      properties:
        severity: { type: string, enum: [blocker, major, minor, nit] }
        category:
          type: string
          enum: [correctness, security, performance, tests, rules, architecture, scope, maintainability, accuracy, completeness, other]
        file: { type: string, description: Path relative to the repository }
        line: { type: integer }
        title: { type: string }
        detail: { type: string }
        suggestion: { type: string, description: 'What to change, written to be sent back as feedback' }
        confidence: { type: number, description: "How sure the reviewer was, 0 to 1; absent when it did not say" }
        pass: { type: string, description: 'The specialist pass that found it (security, failures, tests, types), empty for the main review' }
        adopted: { type: boolean, description: "A person put it in their feedback" }

    CodeReview:
      type: object
      required: [revision, model, modelReason, verdict, summary, findings, strengths, createdAt]
      description: >-
        agnts's review of the latest result, advice beside the human review.
        It reviewed an older revision when revision is below the ticket's.
      properties:
        revision: { type: integer }
        model: { $ref: '#/components/schemas/Model' }
        modelReason: { type: string, description: Why this model reviewed it }
        verdict: { type: string, enum: [looks_good, has_concerns, needs_changes] }
        summary: { type: string }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        strengths:
          type: array
          items: { type: string }
        deep: { type: boolean, description: The review ran the specialist passes }
        dropped: { type: integer, description: Findings left out for low confidence or as duplicates }
        createdAt: { type: string, format: date-time }

    ShotRef:
      type: object
      required: [runId, shotId]
      properties:
        runId: { type: integer, format: int64 }
        shotId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }

    PreviewInput:
      type: object
      properties:
        compare: { type: boolean, description: Also capture the default branch; kept for later previews of the ticket }

    PreviewShot:
      type: object
      required: [id, name, route, viewport, side, url]
      properties:
        id: { type: string }
        name: { type: string }
        route: { type: string }
        viewport: { type: string, enum: [desktop, phone] }
        side: { type: string, enum: [after, before] }
        note: { type: string }
        width: { type: integer }
        height: { type: integer }
        consoleErrors: { type: integer }
        url: { type: string, description: 'Where to load the PNG, relative to the API base' }

    PreviewIssue:
      type: object
      required: [severity, description]
      properties:
        severity: { type: string, enum: [high, medium, low] }
        description: { type: string }
        shotId: { type: string }

    TicketPreview:
      type: object
      required: [runId, revision, model, compare, status, summary, shots, issues, createdAt]
      description: >-
        Screenshots of the running app at the latest result, advice beside
        the human review. It shows an older revision when revision is below
        the ticket's.
      properties:
        runId: { type: integer, format: int64 }
        revision: { type: integer }
        model: { $ref: '#/components/schemas/Model' }
        compare: { type: boolean, description: Before shots were taken too }
        status: { type: string, enum: [ok, partial, failed], description: 'failed: the app did not start' }
        summary: { type: string }
        shots:
          type: array
          items: { $ref: '#/components/schemas/PreviewShot' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/PreviewIssue' }
        acceptance: { $ref: '#/components/schemas/Acceptance' }
        createdAt: { type: string, format: date-time }

    CheckStep:
      type: object
      required: [name, command, exitCode, durationMs]
      properties:
        name: { type: string }
        command: { type: string }
        exitCode: { type: integer }
        durationMs: { type: integer, format: int64 }
        timedOut: { type: boolean }
        output: { type: string }

    FileChange:
      type: object
      required: [path, add, del, diff]
      properties:
        repo: { type: string, description: "The repository's folder, for a ticket in several; path is relative to the repository" }
        repoId: { type: integer, format: int64 }
        path: { type: string }
        add: { type: integer }
        del: { type: integer }
        diff: { type: string }

    Result:
      type: object
      required: [summary, notes, checks, files, createdAt]
      properties:
        summary: { type: string }
        notes:
          type: array
          items: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/CheckStep' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileChange' }
        report: { type: string, description: 'The Markdown report, for report kinds' }
        deviations:
          type: array
          description: Where the work departed from the chosen approach or the plan, and why
          items: { type: string }
        redFlags:
          type: array
          description: "Lines agnts's scan of the change flagged for the reviewer: skipped tests, removed assertions, silenced linters and the like"
          items: { $ref: '#/components/schemas/RedFlag' }
        proof: { $ref: '#/components/schemas/Proof' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        createdAt: { type: string, format: date-time }

    RedFlag:
      type: object
      required: [kind, path, text]
      properties:
        kind: { type: string, enum: [secret, env_file, skipped_test, removed_assertion, deleted_test, silenced_lint, check_config, swallowed_error, rule_violation, debug_leftover, todo, new_dependency] }
        path: { type: string }
        line: { type: integer, description: Line in the new file; absent for the whole file }
        text: { type: string }

    TicketDetail:
      type: object
      required: [ticket, questions, attachments]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        attachments:
          type: array
          description: Files attached to the task, its answers and retry notes, oldest first
          items: { $ref: '#/components/schemas/Attachment' }
        analysis: { $ref: '#/components/schemas/Analysis' }
        result: { $ref: '#/components/schemas/Result' }
        childKey: { type: string, description: 'The code task that implements this report, if any' }
        followUps: { $ref: '#/components/schemas/FollowUps' }
        relations: { $ref: '#/components/schemas/Relations' }
        review: { $ref: '#/components/schemas/CodeReview' }
        preview: { $ref: '#/components/schemas/TicketPreview' }
        history:
          type: array
          items: { $ref: '#/components/schemas/HistoryItem' }
        maxTurns: { type: integer }
        effectiveModels: { $ref: '#/components/schemas/StageModels' }
        spendByStage:
          type: array
          description: Empty until a Claude run is recorded
          items: { $ref: '#/components/schemas/StageSpend' }

    Event:
      type: object
      required: [id, ticketKey, step, type, level, origin, message, data, createdAt]
      properties:
        id: { type: integer, format: int64 }
        ticketKey: { type: string }
        runId: { type: integer, format: int64 }
        step: { type: string }
        type: { type: string }
        level: { type: string, enum: [debug, info, warn, error] }
        origin: { type: string, enum: [system, web, mobile, mcp, telegram, webhook, assistant, chat] }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
        durationMs: { type: integer, format: int64 }
        user: { type: string, description: The person behind the event; absent for agnts }
        createdAt: { type: string, format: date-time }

    AnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, format: int64 }
              answer: { type: string, minLength: 1, maxLength: 5000, description: 'For a multiple-choice question, the chosen options, one per line' }
              note: { type: string, maxLength: 5000 }
              attachments:
                type: array
                maxItems: 10
                description: Uploads to attach to this answer
                items: { type: integer, format: int64 }

    AnswerDraftRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, format: int64 }
              answer: { type: string, maxLength: 5000, description: 'As in AnswersRequest; may be empty' }
              note: { type: string, maxLength: 5000 }
              attachments:
                type: array
                maxItems: 10
                description: Pending uploads the answer will attach; they stay pending
                items: { type: integer, format: int64 }

    Model:
      type: string
      pattern: '^(haiku|sonnet|opus|codex:[a-z0-9][a-z0-9._-]{0,63}|muse:[a-z0-9][a-z0-9._-]{0,63}|tier:(light|strong))$'
      description: 'muse:<model> for Muse Code (muse:spark, muse:wonder), a Claude model (haiku, sonnet, opus), codex:<model> for Codex CLI, or a tier (tier:light, tier:strong): the light or strong model of the module the run lands on. listModels says which this server offers.'

    ReviewModel:
      type: string
      pattern: '^(auto|haiku|sonnet|opus|codex:[a-z0-9][a-z0-9._-]{0,63}|muse:[a-z0-9][a-z0-9._-]{0,63}|tier:(light|strong))$'
      description: 'auto: the stronger model (muse:wonder, opus) for complex tickets, the lighter one otherwise'

    ModelCatalog:
      type: object
      required: [providers, primary, models]
      properties:
        providers:
          type: array
          description: The coding modules you may use (an Admin chooses them); empty when none
          items: { type: string, enum: [muse, claude, codex] }
        primary: { type: string, enum: [muse, claude, codex], description: 'Your default module; settings naming a module you may not use run on its models' }
        models:
          type: array
          items:
            type: object
            required: [id, label, provider, strong]
            properties:
              id: { $ref: '#/components/schemas/Model' }
              label: { type: string }
              provider: { type: string, enum: [muse, claude, codex] }
              strong: { type: boolean, description: 'The stronger, dearer tier' }
              inputPerMillionUSD: { type: number }
              outputPerMillionUSD: { type: number }
        modules:
          type: array
          description: 'The modules you may use, in your order, each with its own light and strong model (absent when the module has none, like Codex without AGNTS_CODEX_MODELS)'
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, enum: [muse, claude, codex] }
              label: { type: string }
              light: { $ref: '#/components/schemas/Model' }
              strong: { $ref: '#/components/schemas/Model' }
        tiers:
          type: array
          description: 'Tiers a setting may name instead of a model: the run lands on the light or strong model of whichever module can run it'
          items:
            type: object
            required: [id, label, strong]
            properties:
              id: { $ref: '#/components/schemas/Model' }
              label: { type: string }
              strong: { type: boolean }

    MuseLogin:
      type: object
      description: A Meta sign-in in progress (OAuth device flow, like `muse login`)
      required: [id, userCode, verificationUri, expiresAt, status]
      properties:
        id: { type: string }
        userCode: { type: string, description: The code to confirm on Meta's page }
        verificationUri: { type: string }
        verificationUriComplete: { type: string, description: The page with the code filled in }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, connected, denied, expired, failed] }
        error: { type: string }
        account: { type: string }

    FreeCredits:
      type: object
      description: Free credits an Admin gave a person (1 credit = $0.01)
      required: [limit, used, remaining]
      properties:
        limit: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        remaining: { type: integer, format: int64 }
        setAt: { type: string, format: date-time }

    CreditUsage:
      type: object
      description: What a person spent on agnts's Muse key (free and bought credits together) and the monthly limit an Admin set (1 credit = $0.01)
      required: [monthLimit, monthUsed, totalUsed]
      properties:
        monthLimit: { type: integer, format: int64, description: 'Credits per calendar month (UTC); 0 is no limit' }
        monthUsed: { type: integer, format: int64, description: Credits spent this calendar month }
        totalUsed: { type: integer, format: int64, description: Credits spent ever }
        setAt: { type: string, format: date-time }

    StageModels:
      type: object
      required: [analyze, coding, retry, helper]
      properties:
        analyze: { $ref: '#/components/schemas/Model' }
        coding: { $ref: '#/components/schemas/Model' }
        retry: { $ref: '#/components/schemas/Model' }
        helper: { $ref: '#/components/schemas/Model' }
        learn: { $ref: '#/components/schemas/Model' }
        review: { $ref: '#/components/schemas/ReviewModel' }
        preview: { $ref: '#/components/schemas/Model' }
        chat: { $ref: '#/components/schemas/Model' }
        documents: { $ref: '#/components/schemas/Model' }
        teamChat: { $ref: '#/components/schemas/Model' }

    TicketRepo:
      type: object
      required: [repoId]
      properties:
        repoId: { type: integer, format: int64 }

    TicketReposInput:
      type: object
      description: Give repoIds (the first is the primary) or groupId
      properties:
        repoIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }

    TicketRepoState:
      type: object
      description: >-
        The ticket's work in one of its repositories: its branch, commit and
        pull request. The first is the primary repository.
      required: [repoId, repoName, folder, role, branch, headSha, prUrl, ciFixes, state, files]
      properties:
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        role: { type: string, description: 'Its role in the group, as people named it (backend, web)' }
        folder: { type: string, description: 'Its folder in the run, /workspace/<folder>; empty when the ticket has one repository' }
        branch: { type: string }
        headSha: { type: string }
        prNumber: { type: integer }
        prUrl: { type: string }
        ciFixes: { type: integer, description: Rounds a red CI check on its pull request sent the ticket back to coding }
        state:
          type: string
          enum: [pending, unchanged, pushed, merged, dropped]
          description: 'pending = not pushed yet; unchanged = the work did not change it (no pull request); pushed; merged; dropped = its pull request was closed without a merge'
        mergedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        pushError: { type: string, description: Why its last push failed; a retry pushes it again }
        canRenameBranch: { type: boolean, description: 'Its branch was never pushed and can still be renamed (ticket detail only)' }
        commits:
          type: array
          description: 'The commits agnts made on its branch whose messages can still change (editCommitMessage), newest first (ticket detail only)'
          items: { $ref: '#/components/schemas/BranchCommit' }
        files: { type: integer, description: Files its change touches }
        archived: { type: boolean, description: The repository is archived }

    BranchCommit:
      type: object
      required: [sha, message]
      properties:
        sha: { type: string }
        message: { type: string, description: 'The whole message: the subject line, then the body after a blank line' }

    RepoGroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    RepoGroupMember:
      type: object
      required: [repoId, repoName, role, archived]
      properties:
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        role: { type: string }
        archived: { type: boolean, description: 'Archived: tickets made from the group leave it out' }

    RepoGroup:
      type: object
      required: [id, name, description, instructions, taskPrefix, branchTemplate, commitTemplate, prTemplate, members, warnings, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        instructions: { type: string, description: 'How the repositories fit together; added to every prompt of its tickets' }
        taskPrefix: { type: string, description: 'Key prefix of tasks made from the group; empty uses the first repository''s' }
        branchTemplate: { type: string, description: 'Names the branches of the group''s tickets in every member, replacing each repository''s own; empty keeps theirs' }
        commitTemplate: { type: string, description: 'Writes the commit messages of the group''s tickets in every member, replacing each repository''s own; empty keeps theirs' }
        prTemplate: { type: string, description: 'Titles the pull requests of the group''s tickets in every member, replacing each repository''s own; empty keeps theirs' }
        members:
          type: array
          items: { $ref: '#/components/schemas/RepoGroupMember' }
        warnings:
          type: array
          description: What the repositories share uneasily in one run container (a build variable both set)
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RepoGroupInput:
      type: object
      required: [name, members]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        instructions: { type: string, maxLength: 20000 }
        taskPrefix: { type: string, maxLength: 10 }
        branchTemplate: { type: string, maxLength: 100, description: 'Branch name template (as a repository''s); must contain {key} or {number}. Empty keeps each repository''s own' }
        commitTemplate: { type: string, maxLength: 200, description: 'Commit message template (as a repository''s); must contain {subject} or {title}. Empty keeps each repository''s own' }
        prTemplate: { type: string, maxLength: 200, description: 'Pull request title template (as a repository''s); must contain {subject} or {title}. Empty keeps each repository''s own' }
        members:
          type: array
          minItems: 1
          maxItems: 20
          description: In order; the first is the primary repository of the group's tickets
          items:
            type: object
            required: [repoId]
            properties:
              repoId: { type: integer, format: int64 }
              role: { type: string, maxLength: 40 }

    ModelOverrides:
      type: object
      properties:
        analyze: { $ref: '#/components/schemas/Model' }
        coding: { $ref: '#/components/schemas/Model' }
        retry: { $ref: '#/components/schemas/Model' }
        review: { $ref: '#/components/schemas/Model' }
        preview: { $ref: '#/components/schemas/Model' }

    HistoryItem:
      type: object
      required: [at, state, message, origin]
      properties:
        at: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/TicketState' }
        message: { type: string }
        origin: { type: string }
        user: { type: string, description: The person behind it; absent for agnts }

    TaskCreate:
      type: object
      required: [title, priority, afterApprove, start]
      properties:
        repoId: { type: integer, format: int64, description: 'Omit for a task without a repository (report kinds or auto)' }
        repoIds:
          type: array
          minItems: 1
          maxItems: 20
          description: 'Several repositories instead of repoId; the first is the primary. Give one of repoId, repoIds and groupId.'
          items: { type: integer, format: int64 }
        groupId: { type: integer, format: int64, description: "A repository group: the task works in its repositories (copied now)" }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        ticketNumber: { type: string, maxLength: 64, pattern: '^([A-Za-z0-9][A-Za-z0-9._-]*)?$', description: "The team's number for the work (AMANAT-2288), used in branch and commit names" }
        priority: { type: string, enum: [low, medium, high] }
        afterApprove: { type: string, enum: [pr, main] }
        start:
          type: string
          enum: [ask, code, queue]
          description: ask = analyse and ask first, code = no questions, queue = keep until started
        followUps: { $ref: '#/components/schemas/FollowUpsMode' }
        attachments:
          type: array
          maxItems: 10
          description: Uploads to attach to the description
          items: { type: integer, format: int64 }

    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        ticketNumber: { type: string, maxLength: 64, pattern: '^([A-Za-z0-9][A-Za-z0-9._-]*)?$', description: "The team's number for the work (AMANAT-2288), used in branch and commit names; empty clears it, absent keeps it" }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, medium, high] }
        afterApprove: { type: string, enum: [pr, main] }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        attachments:
          type: array
          maxItems: 10
          description: 'The files the description should have: the task''s files to keep and new uploads. Left out keeps them; files not listed are deleted.'
          items: { type: integer, format: int64 }

    SwaggerSuiteInput:
      type: object
      properties:
        fromTicket: { type: string, maxLength: 64, description: 'Create: the Swagger test ticket whose test to keep' }
        name: { type: string, maxLength: 100 }
        schedule: { type: string, enum: ['off', hourly, daily, weekly], description: 'off runs only by hand or the deploy hook' }
        hour: { type: integer, minimum: 0, maximum: 23, description: 'UTC hour of daily and weekly runs (weekly: Mondays)' }
        enabled: { type: boolean }
        token: { type: string, maxLength: 8192, writeOnly: true, description: 'A new token for the suite; left out keeps it (a new suite takes the ticket''s)' }

    SwaggerSuite:
      type: object
      required: [id, name, baseUrl, operations, writeEnabled, authKind, hasToken, schedule, hour, enabled, hookSet, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        specUrl: { type: string }
        baseUrl: { type: string }
        operations: { type: integer, description: 'How many endpoints it tests' }
        writeEnabled: { type: boolean }
        authKind: { $ref: '#/components/schemas/ApiAuthKind' }
        hasToken: { type: boolean }
        repoId: { type: integer, format: int64 }
        schedule: { type: string, enum: ['off', hourly, daily, weekly] }
        hour: { type: integer }
        enabled: { type: boolean }
        hookSet: { type: boolean, description: 'A deploy hook URL exists' }
        lastRunAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
        lastTicketKey: { type: string }
        createdAt: { type: string, format: date-time }

    SwaggerSpecInput:
      type: object
      description: >-
        Give url, or spec (the uploaded or pasted file's text). A spec URL
        behind auth takes auth: the token goes with the fetch to the spec's
        host only and is not stored; the answer's specRef then stands for the
        spec. A URL that answers 401 or 403 without it fails with the error
        code spec_needs_auth.
      properties:
        url: { type: string, maxLength: 2000 }
        spec: { type: string, maxLength: 5242880 }
        auth: { $ref: '#/components/schemas/SwaggerAuthInput' }
        login:
          type: object
          description: 'The login and password that open the spec URL (HTTP Basic); used instead of auth. Not stored. A URL that asks for one fails with spec_needs_login.'
          required: [username, password]
          properties:
            username: { type: string, maxLength: 200 }
            password: { type: string, maxLength: 1000, writeOnly: true }

    SwaggerSpec:
      type: object
      required: [operations, servers, securitySchemes, choices]
      properties:
        specRef: { type: string, description: 'An uploaded spec, or one fetched with a token, kept for an hour: pass it to createSwaggerTest' }
        url: { type: string, description: 'Where the spec was found (a docs page leads to its spec)' }
        title: { type: string }
        version: { type: string }
        format: { type: string, description: '"swagger 2.0" or "openapi 3.x"' }
        servers:
          type: array
          items: { $ref: '#/components/schemas/SwaggerServer' }
        operations:
          type: array
          items: { $ref: '#/components/schemas/SwaggerOperation' }
        securitySchemes:
          type: array
          items: { $ref: '#/components/schemas/SwaggerSecurityScheme' }
        choices:
          type: array
          description: The specs a docs page offers; read the chosen one's url
          items:
            type: object
            required: [url]
            properties:
              name: { type: string }
              url: { type: string }

    SwaggerServer:
      type: object
      required: [url]
      properties:
        url: { type: string, description: 'Variables filled with their defaults; relative URLs resolved against the spec URL' }
        description: { type: string }
        variables:
          type: array
          items:
            type: object
            required: [name, default]
            properties:
              name: { type: string }
              default: { type: string }
              enum: { type: array, items: { type: string } }

    SwaggerOperation:
      type: object
      required: [method, path, default]
      properties:
        method: { type: string }
        path: { type: string }
        operationId: { type: string }
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        deprecated: { type: boolean }
        sideEffect: { type: string, description: 'Why a GET probably changes something (logout, export, send ...); such operations start unticked' }
        security: { type: array, items: { type: string } }
        default: { type: boolean, description: 'Ticked in the form by default' }

    SwaggerSecurityScheme:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        scheme: { type: string }
        in: { type: string }
        param: { type: string }
        authKind: { $ref: '#/components/schemas/ApiAuthKind' }

    ApiAuthKind:
      type: string
      enum: [none, bearer, header, query, basic]

    SwaggerTestCreate:
      type: object
      description: >-
        Tick operations to test exactly those, or leave them out and say in
        notes which endpoints to test: the run then sees the whole spec and
        tests only what the notes name. One of the two is required.
      required: [baseUrl]
      properties:
        title: { type: string, maxLength: 200, description: 'Defaults to "Swagger test: <API> on <host>"' }
        specUrl: { type: string, maxLength: 2000, description: 'The URL readSwaggerSpec read (served from its cache)' }
        specRef: { type: string, maxLength: 100, description: 'An uploaded spec, from readSwaggerSpec' }
        baseUrl: { type: string, maxLength: 2000 }
        operations:
          type: array
          maxItems: 500
          items: { type: string, maxLength: 1000, description: 'METHOD /path' }
        writeEnabled: { type: boolean, description: 'Send POST, PUT, PATCH and DELETE too; off by default' }
        notProduction: { type: boolean, description: 'Confirms the base URL is not production; required with writeEnabled' }
        auth: { $ref: '#/components/schemas/SwaggerAuthInput' }
        repoId: { type: integer, format: int64, description: 'Optional: the API''s repository, to explain failures' }
        notes: { type: string, maxLength: 20000, description: 'What to test: which endpoints, cases or data. Without operations, it decides the scope.' }
        rateLimit: { type: integer, minimum: 0, maximum: 20, description: 'Requests a second (0: 5)' }
        maxRequests: { type: integer, minimum: 0, maximum: 1000, description: 'Requests per run (0: 300)' }
        priority: { type: string, enum: [low, medium, high] }
        start: { type: string, enum: [code, queue], description: 'code starts now; queue keeps it until started' }

    SwaggerAuthInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ApiAuthKind' }
        name: { type: string, maxLength: 100, description: 'The header or query parameter of an API key' }
        value: { type: string, maxLength: 8192, writeOnly: true, description: 'The token (user:password for basic). Sealed, never returned, deleted when the ticket closes' }

    SwaggerRerunInput:
      type: object
      properties:
        token: { type: string, maxLength: 8192, writeOnly: true, description: 'A new token; required for a closed test with auth' }

    SwaggerTestView:
      type: object
      required: [baseUrl, operations, writeEnabled, authKind, hasToken, rateLimit, maxRequests]
      properties:
        specUrl: { type: string }
        baseUrl: { type: string }
        operations: { type: array, items: { type: string } }
        writeEnabled: { type: boolean }
        authKind: { $ref: '#/components/schemas/ApiAuthKind' }
        authName: { type: string }
        hasToken: { type: boolean, description: 'A sealed token is stored (never returned)' }
        rateLimit: { type: integer }
        maxRequests: { type: integer }
        suiteId: { type: integer, format: int64 }

    ApiCounts:
      type: object
      required: [passed, failed, skipped, blocked]
      properties:
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        blocked: { type: integer }

    ApiCase:
      type: object
      required: [id, operation, case, verdict, requests, source]
      properties:
        id: { type: string }
        operation: { type: string }
        case: { type: string }
        expected: { type: string }
        verdict: { type: string, enum: [pass, fail, skipped, blocked] }
        reason: { type: string }
        requests: { type: array, items: { type: string } }
        source: { type: string, enum: [claude, schema], description: 'schema: agnts''s own check of the response against the spec' }

    ApiRequestRow:
      type: object
      required: [id, method, url, status, ms]
      properties:
        id: { type: string }
        case: { type: string }
        auth: { type: string, description: 'default, none or wrong' }
        method: { type: string }
        url: { type: string }
        status: { type: integer, description: '0 when no response came back' }
        ms: { type: integer, format: int64 }
        error: { type: string }
        truncated: { type: boolean }

    ApiExchange:
      allOf:
        - $ref: '#/components/schemas/ApiRequestRow'
        - type: object
          properties:
            requestHeaders: { type: object, additionalProperties: { type: string } }
            requestBody: { type: string }
            responseHeaders: { type: object, additionalProperties: { type: string } }
            responseBody: { type: string }
            at: { type: string, format: date-time }

    SwaggerResults:
      type: object
      required: [test, cases, requests, notes, newFailures]
      properties:
        test: { $ref: '#/components/schemas/SwaggerTestView' }
        runId: { type: integer, format: int64, description: 'Absent until a run finished' }
        createdAt: { type: string, format: date-time }
        status: { type: string }
        summary: { type: string }
        counts: { $ref: '#/components/schemas/ApiCounts' }
        cases:
          type: array
          items: { $ref: '#/components/schemas/ApiCase' }
        requests:
          type: array
          items: { $ref: '#/components/schemas/ApiRequestRow' }
        notes: { type: array, items: { type: string }, description: 'What agnts dropped or added while checking' }
        previous: { $ref: '#/components/schemas/ApiCounts' }
        newFailures: { type: array, items: { type: string }, description: 'Cases failing now that did not fail in the run before' }

    EventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        nextBefore: { type: integer, format: int64 }

    StepDuration:
      type: object
      required: [state, count]
      properties:
        state: { $ref: '#/components/schemas/TicketState' }
        avgMs: { type: integer, format: int64 }
        count: { type: integer }

    EventSummary:
      type: object
      required: [runsStarted, reachedReview, avgTurns, stops, errors, steps]
      properties:
        runsStarted: { type: integer }
        reachedReview: { type: integer }
        avgTurns: { type: integer }
        stops: { type: integer }
        errors: { type: integer }
        steps:
          type: array
          items: { $ref: '#/components/schemas/StepDuration' }

    UsageWindow:
      type: object
      properties:
        utilization: { type: number, format: double, description: 0 to 1 }
        resetsAt: { type: string, format: date-time }

    Usage:
      type: object
      required: [fiveHour, sevenDay, status, paused, pauseAbove, refreshing]
      properties:
        fiveHour: { $ref: '#/components/schemas/UsageWindow' }
        sevenDay: { $ref: '#/components/schemas/UsageWindow' }
        status: { type: string, enum: [allowed, allowed_warning, rejected, unknown] }
        updatedAt: { type: string, format: date-time }
        paused: { type: boolean, description: New runs are held back }
        pausedUntil: { type: string, format: date-time }
        pauseAbove: { type: integer }
        refreshing: { type: boolean }
        provider: { type: string, enum: [muse, claude], description: The module whose account this is }
        connected: { type: boolean, description: 'An account of this module is connected for you (in per-member mode, your own; else the workspace''s). False: nothing to read.' }
        account: { type: string, description: The account's label }

    GitSettings:
      type: object
      required: [authorName, authorEmail, coAuthor, prTitle, draft]
      properties:
        authorName: { type: string, maxLength: 200 }
        authorEmail: { type: string, maxLength: 200 }
        coAuthor: { type: boolean, description: Add a Co-authored-by agnts line }
        prTitle: { type: string, maxLength: 200, description: 'Pull request title template, with the commit template''s placeholders {number} {key} {type} {scope} {subject} {title}; must contain {subject} or {title}. A repository''s or group''s own replaces it' }
        draft: { type: boolean }

    Settings:
      type: object
      required: [models, maxTurns, timeoutMin, allow, deny, askFirst, autoResume, pauseAbove, parallel, git]
      properties:
        models: { $ref: '#/components/schemas/StageModels' }
        maxTurns: { type: integer, minimum: 20, maximum: 200 }
        runBudget: { type: integer, format: int64, minimum: 0, maximum: 1000000, description: 'The most one run on credits may spend, in credits (1 credit = $0.01); 0 leaves the server cap' }
        timeoutMin: { type: integer, minimum: 10, maximum: 120 }
        allow:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
        deny:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
        askFirst: { type: boolean }
        autoResume: { type: boolean }
        switchModules: { type: boolean, description: "When a call's module cannot run (no usable account, its limit reached, not enabled for the person), run it on the person's next module, on the model of the same tier; off waits for the module" }
        autoLearn: { type: boolean, description: Learn from every pushed ticket }
        autoReview: { type: boolean, description: Review every result while it waits for review }
        autoPreview: { type: boolean, description: Take screenshots of every UI change in repositories with a preview command }
        visualCheck: { type: boolean, description: Coding runs may start the app and look at the pages they changed }
        autoBrief: { type: boolean, description: 'Survey a repository without a brief when its first ticket is analysed, and refresh the brief after merges' }
        publicDocuments: { type: boolean, description: 'Let documents have public links; off makes every public link of the workspace stop working' }
        selfReview: { type: boolean, description: "Send blocker and major findings of agnts's code review back to the coder once per revision, before a person reviews" }
        reflect: { type: boolean, description: 'Learn from change requests and rejections: suggest rules, which apply once someone adopts them' }
        egressAllow:
          type: array
          maxItems: 50
          description: 'Hosts run containers may reach besides the built-in list, such as a staging API; .example.com matches subdomains'
          items: { type: string, maxLength: 253 }
        suggestFollowUps: { type: boolean, description: 'Runs suggest follow-up tickets (off by default; a ticket can override it)' }
        maxTicketRepos: { type: integer, minimum: 1, maximum: 20, description: 'How many repositories one ticket, and one repository group, may have (6 by default)' }
        pullReviews: { $ref: '#/components/schemas/PullReviewSettings' }
        prComments: { $ref: '#/components/schemas/PRCommentSettings' }
        ci: { $ref: '#/components/schemas/CISettings' }
        logWatch: { $ref: '#/components/schemas/LogWatchSettings' }
        guard: { $ref: '#/components/schemas/GuardSettings' }
        stalls:
          type: string
          pattern: '^(off|log|act)$'
          description: 'What agnts does when a run looks stuck: nothing, note it on the ticket, or also tell Claude to step back (once per run)'
        proveFixes: { type: boolean, description: 'Bug fixes need a test that fails before the change and passes after it; agnts checks it' }
        methodSkills: { type: boolean, description: "Coding runs get agnts's method skills: add one more of something the way the repository does, follow its style, reuse before writing, change a schema safely" }
        deepReview:
          type: string
          pattern: '^(off|auto|always)$'
          description: 'Specialist passes in the code review (security, silent failures, tests, types); auto: large or complex work'
        learnFromRuns: { type: boolean, description: 'Suggest tips from runs that had trouble (failed checks, a stall)' }
        effort: { $ref: '#/components/schemas/EffortSettings' }
        recheckComplex: { type: boolean, description: "The coding model re-checks the analysis of a ticket the analysis model rated complex, before any code is written" }
        baselineChecks: { type: boolean, description: 'Run the checks on the commit a ticket starts from before its first coding run: what fails there is not the ticket''s to fix' }
        secondOpinion:
          type: string
          maxLength: 80
          description: 'A model that critiques the chosen approach of complex tickets (codex:<model> or a Claude model); empty turns it off'
        pauseAbove: { type: integer, minimum: 50, maximum: 100 }
        parallel: { type: integer, minimum: 1, maximum: 3 }
        git: { $ref: '#/components/schemas/GitSettings' }
        notify: { $ref: '#/components/schemas/NotifySettings' }

    GuardSettings:
      type: object
      required: [profile, disabled, factCheck]
      description: How strict agnts-guard, the hooks inside every run, is
      properties:
        profile: { $ref: '#/components/schemas/GuardProfile' }
        disabled:
          type: array
          maxItems: 20
          description: Guard hooks turned off
          items: { $ref: '#/components/schemas/GuardHook' }
        factCheck: { type: integer, minimum: 0, maximum: 100, description: 'Percent of strict-profile tickets whose runs must state facts before the first edit of each file (A/B)' }

    GuardProfile:
      type: string
      enum: [minimal, standard, strict]

    GuardHook:
      type: string
      enum: ['pre:secret', 'pre:redflags', 'pre:rules', 'pre:fact-check', 'pre:destructive', 'post:edit-check', 'stop:gate', 'session:progress']

    EditCheck:
      type: object
      required: [name, globs, cmd]
      properties:
        name: { type: string, maxLength: 80 }
        globs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        cmd: { type: string, maxLength: 2000, description: '{file} is the edited file, {dir} its directory, both relative to the repository' }
        every: { type: integer, minimum: 0, maximum: 3600, description: 'Seconds between runs; 0 runs it after every edit' }

    CoverageConfig:
      type: object
      properties:
        enabled: { type: boolean }
        command: { type: string, maxLength: 2000, description: 'Runs the tests with coverage; empty uses the one agnts derives' }
        report: { type: string, maxLength: 500, description: 'The report the command writes (Go profile or lcov), in the repository or under /agnts/out/' }
        threshold: { type: integer, minimum: 0, maximum: 100 }

    AgentConfigFinding:
      type: object
      required: [path, kind, severity, text]
      properties:
        path: { type: string }
        line: { type: integer }
        kind: { type: string, enum: [hidden_unicode, agent_instruction, exfiltration, encoded_blob, hooks, mcp_server] }
        severity: { type: string, enum: [high, medium, info] }
        text: { type: string }

    AgentConfigScan:
      type: object
      required: [scannedAt, findings]
      description: "What agnts found in the repository's instructions for AI agents (CLAUDE.md, AGENTS.md, .claude/, .mcp.json)"
      properties:
        scannedAt: { type: string, format: date-time }
        findings:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigFinding' }

    RepoHarnessInput:
      type: object
      properties:
        guardProfile:
          type: string
          enum: ['', minimal, standard, strict]
          description: Empty follows the workspace
        secretAllow:
          type: array
          maxItems: 50
          description: 'Path globs where example credentials are expected, besides testdata/, fixtures/ and *.example'
          items: { type: string, maxLength: 200 }
        editChecks:
          type: array
          maxItems: 20
          nullable: true
          description: 'Per-file checks after each edit; null uses the ones agnts derives from the toolchains'
          items: { $ref: '#/components/schemas/EditCheck' }
        editChecksOff: { type: boolean }
        layersBlock: { type: boolean, description: "An import the approved architecture does not allow is a blocker agnts's review sends back, not only a red flag" }
        coverage: { $ref: '#/components/schemas/CoverageConfig' }
        acceptance: { type: boolean, description: "Check the ticket's acceptance criteria in the running app after the preview" }

    RepoHarness:
      allOf:
        - $ref: '#/components/schemas/RepoHarnessInput'
        - type: object
          properties:
            derivedEditChecks:
              type: array
              description: The per-file checks agnts derives from the toolchains
              items: { $ref: '#/components/schemas/EditCheck' }
            derivedCoverage:
              type: object
              description: The coverage command agnts derives; empty when it knows none
              properties:
                command: { type: string }
                report: { type: string }
            agentConfig: { $ref: '#/components/schemas/AgentConfigScan' }

    StarterPack:
      type: object
      required: [pack, name, rules, offered]
      properties:
        pack: { type: string }
        name: { type: string }
        rules: { type: integer }
        offered: { type: boolean, description: "Its rules are already among the repository's rules or suggestions" }

    RuleEnforce:
      type: object
      required: ['on', action]
      description: 'agnts-guard checks the rule while Claude works: file (edits of matching files, or added lines matching the pattern), bash (commands), diff (the finished change, on the server)'
      properties:
        'on': { type: string, enum: [file, bash, diff] }
        paths:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        pattern: { type: string, maxLength: 500, description: A regular expression (RE2) }
        action: { type: string, enum: [block, warn] }
        message: { type: string, maxLength: 1000 }

    TryEnforceInput:
      type: object
      required: [enforce]
      properties:
        enforce: { $ref: '#/components/schemas/RuleEnforce' }
        repoId: { type: integer, format: int64, description: Leave out to check every repository }

    TryEnforceResult:
      type: object
      required: [checked, tickets, hits]
      properties:
        checked: { type: integer, description: Changes looked at }
        tickets:
          type: array
          items: { type: string }
        hits:
          type: array
          items:
            type: object
            required: [ticket, path, text]
            properties:
              ticket: { type: string }
              path: { type: string }
              line: { type: integer }
              text: { type: string }
        note: { type: string }

    Proof:
      type: object
      required: [status, tests]
      description: 'Evidence that a bug fix fixes the bug: reproducing tests run before and after the change'
      properties:
        status: { type: string, enum: [proven, not_reproduced, still_failing, inconclusive, no_test, error] }
        base: { type: string, description: The commit the change started from }
        why: { type: string }
        tests:
          type: array
          items: { $ref: '#/components/schemas/ProofTest' }

    ProofTest:
      type: object
      required: [file, name, command, status, before, after]
      properties:
        file: { type: string }
        name: { type: string }
        command: { type: string }
        status: { type: string }
        before: { $ref: '#/components/schemas/ProofRun' }
        after: { $ref: '#/components/schemas/ProofRun' }

    ProofRun:
      type: object
      required: [exit, output, ms]
      properties:
        exit: { type: integer }
        output: { type: string }
        ms: { type: integer, format: int64 }

    Coverage:
      type: object
      required: [covered, total, percent, files]
      description: "How much of the change's added lines the tests ran"
      properties:
        covered: { type: integer }
        total: { type: integer }
        percent: { type: number }
        threshold: { type: integer }
        error: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, covered, total, uncovered]
            properties:
              path: { type: string }
              covered: { type: integer }
              total: { type: integer }
              uncovered:
                type: array
                items:
                  type: object
                  required: [from, to]
                  properties:
                    from: { type: integer }
                    to: { type: integer }

    Acceptance:
      type: object
      required: [status, summary, criteria]
      description: "The check of the ticket's acceptance criteria in the running app"
      properties:
        status: { type: string, enum: [ok, partial, failed] }
        summary: { type: string }
        criteria:
          type: array
          items:
            type: object
            required: [id, criterion, verdict]
            properties:
              id: { type: string }
              criterion: { type: string }
              verdict: { type: string, enum: [pass, fail, unknown] }
              evidence: { type: string }
              steps:
                type: array
                items: { type: string }
              shots:
                type: array
                description: Screenshot ids in the preview
                items: { type: string }

    EffortSettings:
      type: object
      description: "How hard runs think (Claude Code's --effort); empty leaves Claude Code's default"
      required: [analyze, coding, review, complex]
      properties:
        analyze: { type: string, enum: ['', low, medium, high] }
        coding: { type: string, enum: ['', low, medium, high] }
        review: { type: string, enum: ['', low, medium, high] }
        complex: { type: string, enum: ['', low, medium, high], description: 'For the coding and review of complex tickets, and the re-check of their analysis; empty keeps the stage effort' }

    SecondOpinion:
      type: object
      required: [model, agrees, summary]
      description: "Another model's read of the approach a complex ticket's analysis chose"
      properties:
        model: { type: string }
        agrees: { type: boolean }
        summary: { type: string }
        concerns:
          type: array
          items: { type: string }
        alternative: { type: string }
        error: { type: string }

    TrackerUpdate:
      type: object
      description: >-
        A newer version of the issue from the tracker, which arrived after
        agnts started on the ticket. agnts keeps working from the version it
        started with until you restart the ticket with this one or keep the
        current one.
      required: [title, description, at]
      properties:
        title: { type: string }
        description: { type: string }
        at: { type: string, format: date-time, description: When agnts saw it }

    CIStatus:
      type: string
      enum: [triage, open, fixing, fixed, resolved, flaky, infra, muted, regression]
      description: >-
        triage: new, waiting for a re-run; open: confirmed, no ticket working on it;
        fixing: a ticket works on it; fixed: the fix is merged, waiting for a green run;
        resolved: green again; flaky: passed on re-run; infra: the runner or the network,
        not the code; muted: ignored; regression: failed again after the fix was merged

    CIOccurrence:
      type: object
      required: [runId, url, sha, job, at]
      properties:
        runId: { type: integer, format: int64 }
        url: { type: string }
        sha: { type: string }
        job: { type: string }
        at: { type: string, format: date-time }
        flaky: { type: boolean, description: Passed when re-run }

    CIFailure:
      type: object
      description: CI failures of one job with the same fingerprint on one branch
      required: [id, repoId, repo, branch, workflow, job, title, class, status, count, flakyCount, firstSeenAt, lastSeenAt, firstSha, lastSha, occurrences, ticketKey, prNumber]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repo: { type: string }
        branch: { type: string, description: 'The branch, or pr/<number> for a failure on someone else''s pull request' }
        workflow: { type: string }
        job: { type: string }
        title: { type: string }
        class: { type: string, description: 'code, test, config, dependency, infra, flaky, report, or empty while unknown' }
        status: { $ref: '#/components/schemas/CIStatus' }
        count: { type: integer }
        flakyCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        firstSha: { type: string }
        lastSha: { type: string }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/CIOccurrence' }
        ticketKey: { type: string, description: 'The ticket fixing it, or empty' }
        ticketState: { $ref: '#/components/schemas/TicketState' }
        fixedSha: { type: string }
        fixedAt: { type: string, format: date-time }
        prNumber: { type: integer, description: 'Someone else''s pull request (diagnosis comment only), 0 otherwise' }
        sample: { type: string, description: 'Redacted log excerpt (single reads only)' }

    CIWatch:
      type: object
      required: [enabled, branches, ignore, prs]
      properties:
        enabled: { type: boolean }
        branches:
          type: array
          maxItems: 20
          description: Globs of extra watched branches; the default branch is always watched
          items: { type: string, maxLength: 200 }
        ignore:
          type: array
          maxItems: 50
          description: Globs of workflow or job names never watched
          items: { type: string, maxLength: 200 }
        prs:
          type: string
          maxLength: 20
          description: "Failures on other people's pull requests: off (ignore) or comment (post one diagnosis comment)"
        autoFix: { type: boolean, nullable: true, description: 'Overrides the workspace setting for this repository; null follows it' }
        problem: { type: string, readOnly: true, description: 'Why agnts cannot read this repository''s CI with the current token, or empty' }

    CISettings:
      type: object
      required: [autoFix, maxAutoPerDay, retryFlaky, feedbackRounds, infraPatterns]
      properties:
        autoFix: { type: boolean, description: 'Open a ticket for every confirmed failure on a watched branch; off, failures wait for Fix it' }
        maxAutoPerDay: { type: integer, minimum: 0, maximum: 50, description: Automatic CI tickets a day at most }
        retryFlaky: { type: boolean, description: Re-run the failed jobs of a new failure once before believing it }
        feedbackRounds: { type: integer, minimum: 0, maximum: 5, description: "How many times a red check sends one of agnts's pull requests back to coding; 0 turns it off" }
        infraPatterns:
          type: array
          maxItems: 50
          description: Extra regular expressions that mark a failure as infra (not the code)
          items: { type: string, maxLength: 300 }

    LogSeverity:
      type: string
      enum: [low, medium, high, critical]

    LogFindingStatus:
      type: string
      enum: [open, reported, fixing, fixed, resolved, muted, regression]
      description: 'open: seen, nothing done yet (below the threshold, or off); reported: shown and notified; fixing: a ticket works on it; fixed: the fix merged; resolved: quiet after the fix; muted: ignored; regression: back after the fix'

    LogMode:
      type: string
      enum: [off, report, ticket]

    LogFields:
      type: object
      description: Where a source keeps the parts of an entry; empty fields fall back to the usual names
      properties:
        message: { type: string, maxLength: 120 }
        timestamp: { type: string, maxLength: 120 }
        level: { type: string, maxLength: 120 }
        service: { type: string, maxLength: 120 }
        revision: { type: string, maxLength: 120 }
        traceUrl: { type: string, maxLength: 1000, description: 'Link to a trace in the tracing UI (Tempo, Jaeger), with {traceId} where the id goes' }

    LogScope:
      type: object
      description: 'What a source reads: a Loki base selector, an Elasticsearch index pattern, Graylog streams'
      properties:
        selector: { type: string, maxLength: 500 }
        index: { type: string, maxLength: 300 }
        streams:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }

    LogAuthInput:
      type: object
      required: [kind]
      description: Credentials; sealed when saved and never returned
      properties:
        kind: { type: string, enum: [none, basic, bearer, apikey, aws] }
        user: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 500 }
        token: { type: string, maxLength: 4000 }
        tenant: { type: string, maxLength: 200, description: "Loki's X-Scope-OrgID" }

    LogService:
      type: object
      required: [name, selector, repoIds, enabled]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, maxLength: 120 }
        selector: { type: string, maxLength: 500, description: 'Loki: a matcher like {app="api"}; Elasticsearch: the service field''s value; Graylog: a stream id' }
        repoIds:
          type: array
          maxItems: 20
          description: The repositories the service runs on; none means its findings are only reported
          items: { type: integer, format: int64 }
        groupId: { type: integer, format: int64, nullable: true }
        enabled: { type: boolean }

    LogSourceInput:
      type: object
      required: [name, kind, environment, enabled]
      properties:
        id: { type: integer, format: int64, description: For a test of a saved source }
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [loki, elasticsearch, opensearch, graylog, datadog, cloudwatch, splunk, push] }
        environment: { type: string, enum: [production, staging, development] }
        address: { type: string, maxLength: 500, description: 'https://loki.example.com, or http:// on a private network; empty for push' }
        auth: { $ref: '#/components/schemas/LogAuthInput' }
        caPem: { type: string, maxLength: 20000 }
        scope: { $ref: '#/components/schemas/LogScope' }
        fields: { $ref: '#/components/schemas/LogFields' }
        pollSeconds: { type: integer, minimum: 5, maximum: 300, description: 'How often agnts reads it (15 by default)' }
        enabled: { type: boolean }

    LogSource:
      type: object
      required: [id, name, kind, environment, address, authKind, hasAuth, caPem, scope, fields, pollSeconds, enabled, status, lastError, dropped, hasPushToken, services, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [loki, elasticsearch, opensearch, graylog, datadog, cloudwatch, splunk, push] }
        environment: { type: string }
        address: { type: string }
        authKind: { type: string }
        authUser: { type: string }
        authTenant: { type: string }
        hasAuth: { type: boolean }
        caPem: { type: string }
        scope: { $ref: '#/components/schemas/LogScope' }
        fields: { $ref: '#/components/schemas/LogFields' }
        pollSeconds: { type: integer }
        enabled: { type: boolean }
        status: { type: string, enum: [new, ok, behind, failing, auth_failed] }
        lastError: { type: string }
        lastReadAt: { type: string, format: date-time }
        gapFrom: { type: string, format: date-time, description: Start of a range not read after a long outage }
        gapTo: { type: string, format: date-time }
        dropped: { type: integer, format: int64, description: Entries skipped over the per-minute cap }
        networkId: { type: integer, format: int64, description: The private network the last read went through }
        hasPushToken: { type: boolean }
        pushUrl: { type: string, description: Where a push source's shipper sends }
        services:
          type: array
          items: { $ref: '#/components/schemas/LogService' }
        createdAt: { type: string, format: date-time }

    LogSourceTest:
      type: object
      required: [version, fields, labels, sample, network, latencyMs]
      properties:
        version: { type: string }
        fields: { $ref: '#/components/schemas/LogFields' }
        labels:
          type: array
          items: { type: string }
        sample: { type: string, description: 'The newest entry, redacted' }
        newest: { type: string, format: date-time }
        network: { type: string, description: 'The private network used, or empty for a direct connection' }
        latencyMs: { type: integer, format: int64 }

    LogPushToken:
      type: object
      required: [token, url]
      properties:
        token: { type: string }
        url: { type: string }

    LogOccurrence:
      type: object
      required: [at, sourceId, service, count]
      properties:
        at: { type: string, format: date-time }
        sourceId: { type: integer, format: int64 }
        service: { type: string }
        revision: { type: string }
        count: { type: integer }

    LogFinding:
      type: object
      required: [id, service, repoIds, repos, category, detector, class, severity, title, remediation, status, reason, count, hourCount, firstSeenAt, lastSeenAt, revision, route, secretMask, occurrences, ticketKey]
      properties:
        id: { type: integer, format: int64 }
        service: { type: string }
        repoIds:
          type: array
          items: { type: integer, format: int64 }
        repos:
          type: array
          items: { type: string }
        category: { type: string, enum: [error, security] }
        detector: { type: string }
        class: { type: string, description: 'code, config, infra, dependency, leak, exposure, weakness, attack or noise' }
        severity: { $ref: '#/components/schemas/LogSeverity' }
        title: { type: string }
        remediation: { type: string }
        status: { $ref: '#/components/schemas/LogFindingStatus' }
        reason: { type: string, description: Why a finding that could have been a ticket is only reported }
        count: { type: integer, format: int64 }
        hourCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revision: { type: string }
        route: { type: string }
        secretMask: { type: string, description: 'A leaked secret''s first and last characters; never the value' }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/LogOccurrence' }
        reportedAt: { type: string, format: date-time }
        ticketKey: { type: string }
        ticketState: { $ref: '#/components/schemas/TicketState' }
        fixedSha: { type: string }
        fixedAt: { type: string, format: date-time }
        sample: { type: string, description: 'Redacted log excerpt (single reads only)' }
        traceId: { type: string, description: 'The trace the sample came from, when the logs carry one (single reads only)' }
        traceUrl: { type: string, description: "The trace in the source's tracing UI, when the source has a trace link (single reads only)" }

    LogPattern:
      type: object
      required: [name, pattern, category, severity]
      properties:
        name: { type: string, maxLength: 80 }
        pattern: { type: string, maxLength: 500, description: 'A regular expression (RE2, case-insensitive)' }
        category: { type: string, enum: [error, security] }
        severity: { $ref: '#/components/schemas/LogSeverity' }

    LogOverride:
      type: object
      properties:
        repoId: { type: integer, format: int64 }
        service: { type: string, maxLength: 200, description: '<source name>/<service name>' }
        errors: { $ref: '#/components/schemas/LogMode' }
        security: { $ref: '#/components/schemas/LogMode' }

    LogWatchSettings:
      type: object
      required: [errors, security, alwaysNotifyLeaks, minSeverity, threshold, maxAutoPerDay, attackTicketAfter, resolveAfterDays, digest, triagePerDay, patterns, overrides]
      properties:
        errors: { $ref: '#/components/schemas/LogMode' }
        security: { $ref: '#/components/schemas/LogMode' }
        alwaysNotifyLeaks: { type: boolean, description: 'Notify a high-severity secret leak even when Security is off' }
        minSeverity: { $ref: '#/components/schemas/LogSeverity' }
        threshold: { type: integer, minimum: 1, maximum: 1000, description: 'Occurrences within the hour before a plain error acts' }
        maxAutoPerDay: { type: integer, minimum: 0, maximum: 50, description: Automatic log tickets a day at most }
        attackTicketAfter: { type: integer, minimum: 0, maximum: 50, description: 'Bursts of the same attack within 7 days before a hardening ticket; 0 never' }
        resolveAfterDays: { type: integer, minimum: 1, maximum: 30 }
        digest: { type: boolean, description: One daily summary instead of a message per finding }
        triagePerDay: { type: integer, minimum: 0, maximum: 500, description: 'Model triage calls a day for new findings; 0 off' }
        patterns:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LogPattern' }
        overrides:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/LogOverride' }

    PullReviewSettings:
      type: object
      description: Reviews of the pull requests waiting for you on GitHub or GitLab
      required: [enabled, reviewRequested, skipDrafts, rereview, mergeMethod]
      properties:
        enabled: { type: boolean, description: 'Unused: reviews start from the pull request, and open reviews are kept up to date always' }
        reviewRequested: { type: boolean, description: 'Also take pull requests whose review is requested from you, not only those assigned to you' }
        all: { type: boolean, description: "Take every open pull request in your repositories, yours included, whether or not it waits for you; left out, it stays as it is" }
        skipDrafts: { type: boolean, description: Leave draft pull requests alone until they are ready }
        rereview: { type: boolean, description: "Unused: reviewing again after new commits is your call, from the pull request" }
        mergeMethod: { type: string, enum: [merge, squash, rebase], description: How an accepted pull request is merged }

    PullRequest:
      type: object
      description: The pull request (GitLab merge request) a review ticket reviews, as of the last sync
      required: [number, url, title, author, headRef, headSha, baseRef, draft, state, login, why]
      properties:
        number: { type: integer, description: 'The pull request number (GitLab: the IID)' }
        url: { type: string }
        title: { type: string }
        author: { type: string, description: Git host username of the author }
        headRef: { type: string, description: The branch it comes from }
        headSha: { type: string, description: Its newest commit on the git host }
        baseRef: { type: string, description: The branch it goes into }
        draft: { type: boolean }
        state: { type: string, enum: [open, closed, merged] }
        login: { type: string, description: The git host user it waits for; their reviewer profile shapes its reviews }
        why: { type: string, enum: [assigned, review_requested, open, own, manual], description: 'open: taken because it is open in the repository (all); own: the token''s user opened it (all); manual: asked for from the pull request page' }
        additions: { type: integer }
        deletions: { type: integer }
        updatedAt: { type: string, format: date-time }
        postedSha: { type: string, description: "The reviewed commit whose review agnts last posted on the pull request" }
        postedAt: { type: string, format: date-time, description: When agnts last posted its review on the pull request }

    PRCommentSettings:
      type: object
      description: How agnts takes part in pull request conversations
      required: [attribution, learnFromComments, resolveFixed, autoAddress]
      properties:
        attribution: { type: boolean, description: 'Add "via agnts · <person>" to comments written through agnts (they all go out as the git host token''s user)' }
        learnFromComments: { type: boolean, description: "Keep the comments you write on others' pull requests on the git host as notes on how you review" }
        resolveFixed: { type: boolean, description: "Resolve a reviewer's thread once agnts pushed the fix and answered it" }
        autoAddress: { type: boolean, description: "Send the unresolved threads back to the ticket when a reviewer requests changes on agnts's pull request (the fix still waits for your approval)" }

    PullItem:
      type: object
      description: A pull request (GitLab merge request) in a repository's list
      required: [number, url, title, author, headRef, headSha, baseRef, draft, state, why, updatedAt, own]
      properties:
        number: { type: integer, description: 'The pull request number (GitLab: the IID)' }
        url: { type: string }
        title: { type: string }
        author: { type: string }
        headRef: { type: string }
        headSha: { type: string }
        baseRef: { type: string }
        draft: { type: boolean }
        state: { type: string, enum: [open, closed, merged] }
        why: { type: string, description: 'Why it waits for the token''s user: assigned, review_requested, open or own (taken because it is open, all), or empty; manual for a review someone asked for from the pull request page' }
        updatedAt: { type: string, format: date-time }
        ticketKey: { type: string, description: "agnts's ticket for it: its own change, or its review" }
        own: { type: boolean, description: "It is agnts's own change" }

    PullDetail:
      type: object
      required: [repoId, repoName, provider, pull, files, own]
      properties:
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        provider: { type: string, enum: [github, gitlab] }
        pull: { $ref: '#/components/schemas/PullItem' }
        body: { type: string, description: 'The description, Markdown' }
        login: { type: string, description: 'The git host token''s user: who comments made here appear from' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileChange' }
        filesError: { type: string, description: Why the files could not be read }
        ticketKey: { type: string }
        own: { type: boolean }
        ticketState: { $ref: '#/components/schemas/TicketState' }
        reviewedSha: { type: string, description: 'The commit agnts reviewed, for a review ticket' }
        afterApprove: { type: string, enum: [pr, main, none] }
        reviews:
          type: array
          description: "agnts's reviews of it, newest first"
          items: { $ref: '#/components/schemas/PullReviewRef' }
        drafts:
          type: array
          description: "The draft comments of agnts's newest review of it"
          items: { $ref: '#/components/schemas/ReviewDraft' }

    PullComment:
      type: object
      required: [id, author, body, createdAt, updatedAt, mine, system, agnts]
      properties:
        id: { type: string, description: 'Opaque: pass it back to edit or delete' }
        author: { type: string }
        avatarUrl: { type: string }
        body: { type: string, description: 'Markdown, as the git host stores it' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        url: { type: string }
        mine: { type: boolean, description: "Written by the git host token's user, who may edit and delete it" }
        system: { type: boolean, description: 'A note the git host wrote ("added 2 commits")' }
        agnts: { type: boolean, description: agnts posted it }

    PullThread:
      type: object
      required: [id, kind, outdated, resolvable, resolved, comments]
      properties:
        id: { type: string, description: 'Opaque: pass it back to reply or resolve' }
        kind: { type: string, enum: [general, inline, review] }
        path: { type: string }
        line: { type: integer, description: Line in the new file }
        oldLine: { type: integer, description: 'Line in the old file, for a removed line' }
        startLine: { type: integer, description: First line of a range }
        diffHunk: { type: string }
        commitSha: { type: string }
        outdated: { type: boolean, description: The line changed since the thread started }
        resolvable: { type: boolean }
        resolved: { type: boolean }
        reviewState: { type: string, description: 'A review''s verdict: APPROVED, CHANGES_REQUESTED or COMMENTED' }
        sent: { type: boolean, description: "On agnts's own pull request: sent back to the ticket as feedback, with no newer comment since" }
        replied: { type: boolean, description: agnts answered it after pushing the fix }
        comments:
          type: array
          items: { $ref: '#/components/schemas/PullComment' }

    NewPullComment:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 60000 }
        path: { type: string, maxLength: 1000, description: 'The file, for a comment on a line' }
        line: { type: integer, minimum: 0, description: Line in the new file (an added or unchanged line) }
        oldLine: { type: integer, minimum: 0, description: 'Line in the old file: a removed line, or with line an unchanged one' }
        startLine: { type: integer, minimum: 0, description: 'First line of a range (GitHub)' }
        headSha: { type: string, maxLength: 64, description: The commit the line is in; the newest when empty }

    PostReviewInput:
      type: object
      properties:
        summary: { type: boolean, default: true, description: Post the summary (verdict and every finding) }
        findings:
          type: array
          maxItems: 200
          description: Indexes of the findings to post on their lines; left out, every finding on a line of the diff
          items: { type: integer, minimum: 0 }
        requestChanges: { type: boolean, description: 'Post it as a request for changes (GitHub)' }

    ReviewDraft:
      type: object
      description: "A comment of a pull request review kept in agnts: agnts's summary or one of its findings, or a person's own comment. Only accepted ones are published"
      required: [id, kind, key, body, edited, state, headSha, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [summary, finding, comment] }
        key: { type: string, description: "Which finding it is across re-reviews (file and title)" }
        severity: { type: string, description: 'A finding''s severity; for the summary, the verdict' }
        category: { type: string }
        title: { type: string }
        confidence: { type: number }
        pass: { type: string }
        path: { type: string }
        line: { type: integer, description: 'Line in the new file; it may be outside the diff' }
        headSha: { type: string, description: The commit it is about }
        body: { type: string, description: 'Markdown: what is published' }
        edited: { type: boolean, description: A person rewrote it; re-reviews keep their text }
        state: { type: string, enum: [draft, accepted, publishing, dismissed, published, outdated] }
        dismissReason: { type: string }
        error: { type: string, description: Why its last publish failed }
        author: { type: string, description: 'Who wrote it (comment)' }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PublishedReview:
      type: object
      required: [ticket, summary, inline, still, resolved]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        summary: { type: string, enum: ['', posted, edited] }
        inline: { type: integer, description: Comments posted on their lines }
        still: { type: integer, description: "Findings agnts posted before that are still there (answered in their threads)" }
        resolved: { type: integer, description: "Findings agnts posted before that are gone (answered and resolved)" }

    ReviewPullList:
      type: object
      required: [pulls, errors]
      properties:
        pulls:
          type: array
          items: { $ref: '#/components/schemas/ReviewPullRow' }
        errors:
          type: array
          description: Repositories the git host did not answer for
          items: { type: string }

    ReviewPullRow:
      type: object
      description: An open pull request on the Reviews page
      required: [repoId, repoName, provider, pull]
      properties:
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        provider: { type: string, enum: [github, gitlab] }
        pull: { $ref: '#/components/schemas/PullItem' }
        review: { $ref: '#/components/schemas/PullReviewRef' }

    PullReviewRef:
      type: object
      description: One agnts review of a pull request (a review ticket)
      required: [key, state, createdAt, updatedAt]
      properties:
        key: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        headSha: { type: string, description: 'The commit it reviewed, once reviewed' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewSync:
      type: object
      description: What a sync of agnts's open reviews found
      required: [repos, open, created, rereview, closed, errors]
      properties:
        repos: { type: integer, description: Repositories with an open review }
        open: { type: integer, description: Open reviews checked }
        created: { type: integer, description: Always 0; reviews start from the pull request }
        rereview: { type: integer, description: Always 0; reviewing again is your call }
        closed: { type: integer, description: Reviews ended because the pull request was merged or closed on the git host }
        errors:
          type: array
          description: Repositories or pull requests that could not be read
          items: { type: string }

    ReviewerNote:
      type: object
      description: >-
        Something a person told agnts about one of its pull request
        reviews. Later reviews for the same git host user read it until it
        is folded into their profile.
      required: [id, login, kind, note, createdAt]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string, description: The git host user the review was for }
        username: { type: string, description: Who wrote it in agnts }
        repoName: { type: string }
        ticketKey: { type: string }
        pullTitle: { type: string }
        kind: { type: string, enum: [rereview, dismissed, manual, host_comment, draft] }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    ReviewerNoteInput:
      type: object
      required: [login, note]
      properties:
        login: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, minLength: 1, maxLength: 4000 }

    Reviewer:
      type: object
      description: What agnts learned about how one git host user reviews pull requests
      required: [login, profile, notesFolded, pending]
      properties:
        login: { type: string }
        profile: { type: string, description: Markdown; empty until a review folds notes in or someone writes it }
        notesFolded: { type: integer, description: Notes folded into the profile so far }
        updatedAt: { type: string, format: date-time }
        pending:
          type: array
          description: Notes the next review folds in, newest first
          items: { $ref: '#/components/schemas/ReviewerNote' }

    Reviewers:
      type: object
      required: [reviewers, notes]
      properties:
        reviewers:
          type: array
          items: { $ref: '#/components/schemas/Reviewer' }
        notes:
          type: array
          description: The newest notes of everyone, newest first
          items: { $ref: '#/components/schemas/ReviewerNote' }

    ReviewerProfileInput:
      type: object
      required: [profile]
      properties:
        profile: { type: string, maxLength: 8000, description: Markdown; empty clears it }

    NotifySettings:
      type: object
      required: [push, telegram, needsYou, stopped, done]
      properties:
        push: { type: boolean }
        telegram: { type: boolean }
        needsYou: { type: boolean }
        stopped: { type: boolean }
        done: { type: boolean }
        progress: { type: boolean, description: 'An agent finished a step (analysis, code); push only, silent' }
        lessons: { type: boolean, description: New lessons were found }
        review: { type: boolean, description: A code review finished }
        preview: { type: boolean, description: Preview screenshots are ready }
        previewPhotos: { type: boolean, description: Send phone screenshots to Telegram with the message }
        followUps: { type: boolean, description: Follow-up tickets were suggested }
        ci: { type: boolean, description: A watched branch went red }
        logs: { type: boolean, description: 'The log watcher found something, or a log source stopped' }

    Repository:
      type: object
      required: [id, name, kind, provider, cloneUrl, defaultBranch, buildCmd, lintCmd, testCmd, branchPrefix, taskPrefix, instructions, jiraProject, claudeMd, openTickets]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [jira, plane, side]
          description: jira when the repository has a Jira project key, plane when it has only a Plane project, else side. Every repository takes side-project tasks.
        provider: { type: string, enum: [github, gitlab] }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        buildCmd: { type: string }
        lintCmd: { type: string }
        testCmd: { type: string }
        branchPrefix: { type: string }
        branchTemplate: { type: string, description: 'How agnts names branches, with placeholders {prefix} {type} {key} {number} {slug} {user}; empty uses {prefix}{key}' }
        commitTemplate: { type: string, description: 'How agnts writes commit messages, with placeholders {number} {key} {type} {scope} {subject} {title}; empty uses KEY: Title' }
        prTemplate: { type: string, description: 'How agnts titles pull requests, with the commit template''s placeholders; empty uses the workspace''s PR title (Settings, Git)' }
        taskPrefix: { type: string }
        instructions: { type: string, description: Extra instructions added to every prompt }
        jiraProject: { type: string }
        planeProject: { type: string, description: 'Plane project identifier (WEB in WEB-123); empty when not linked' }
        claudeMd: { type: string, enum: [found, missing, unknown] }
        openTickets: { type: integer }
        deployWorkflow: { type: string }
        archivedAt: { type: string, format: date-time, description: Set while the repository is archived }
        preview: { $ref: '#/components/schemas/RepoPreview' }
        stack: { type: string, description: 'Toolchain names, comma-separated (go,node)' }
        toolchains:
          type: array
          description: Installed into every run container
          items: { $ref: '#/components/schemas/Toolchain' }
        toolchainsOverride: { type: boolean, description: Set by a person; detection leaves them alone }
        toolchainsDetectedAt: { type: string, format: date-time }
        toolchainNotes:
          type: array
          description: What detection could not handle
          items: { type: string }
        runnerImage: { type: string, description: 'Custom runner image (built FROM agnts-runner); empty uses the default' }
        memoryMb: { type: integer, description: 'Run container memory; 0 uses the server default' }
        buildEnvSet: { type: boolean }
        buildEnvNames:
          type: array
          description: Names of the build environment variables; the values are never returned
          items: { type: string }
        harness: { $ref: '#/components/schemas/RepoHarness' }
        groups:
          type: array
          description: The groups it is a member of
          items: { $ref: '#/components/schemas/RepoGroupRef' }

    RepositoryInput:
      type: object
      required: [name, cloneUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind:
          type: string
          enum: [jira, plane, side]
          deprecated: true
          description: Ignored; derived from jiraProject and planeProject.
        cloneUrl: { type: string, minLength: 1, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 100 }
        buildCmd: { type: string, maxLength: 500 }
        lintCmd: { type: string, maxLength: 500 }
        testCmd: { type: string, maxLength: 500 }
        branchPrefix: { type: string, maxLength: 50 }
        branchTemplate: { type: string, maxLength: 100, description: 'Branch name template; must contain {key} or {number}. Empty uses {prefix}{key}' }
        commitTemplate: { type: string, maxLength: 200, description: 'Commit message template; must contain {subject} or {title}. Empty uses KEY: Title' }
        prTemplate: { type: string, maxLength: 200, description: 'Pull request title template, with the commit template''s placeholders; must contain {subject} or {title}. Empty uses the workspace''s PR title' }
        taskPrefix: { type: string, maxLength: 8 }
        instructions: { type: string, maxLength: 20000 }
        jiraProject: { type: string, maxLength: 20 }
        planeProject: { type: string, maxLength: 12 }
        deployWorkflow: { type: string, maxLength: 200, description: 'GitHub workflow file run by Deploy, e.g. deploy.yml' }
        preview: { $ref: '#/components/schemas/RepoPreviewInput' }
        toolchains:
          type: array
          maxItems: 12
          description: Absent keeps the stored list
          items: { $ref: '#/components/schemas/Toolchain' }
        toolchainsOverride: { type: boolean, description: 'true: these toolchains were set by hand; detection keeps them' }
        runnerImage: { type: string, maxLength: 255 }
        memoryMb: { type: integer, minimum: 0, maximum: 65536 }
        buildEnv:
          type: string
          maxLength: 16384
          description: 'KEY=value lines given to every run (registry tokens); replaces the stored one, "" clears it, absent keeps it'

    Toolchain:
      type: object
      required: [tool, version]
      description: A language runtime or build tool, installed with mise as tool@version
      properties:
        tool: { type: string, maxLength: 40, description: 'mise tool name: go, node, python, rust, java, dotnet, ruby, ...' }
        version: { type: string, maxLength: 64, description: 'Exact, a prefix (20, 3.12), latest, lts or system' }
        source: { type: string, description: 'Where it was found: go.mod, .nvmrc, default, manual' }
        dir: { type: string, description: Subdirectory it was found in }

    RepoDetectInput:
      type: object
      properties:
        id: { type: integer, format: int64, description: A saved repository; the other fields are then optional }
        cloneUrl: { type: string, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 100 }
        deep: { type: boolean, description: Ask Claude when the file scan finds no commands }

    RepoDetection:
      type: object
      required: [toolchains, buildCmd, lintCmd, testCmd, notes, stack, source]
      properties:
        toolchains:
          type: array
          items: { $ref: '#/components/schemas/Toolchain' }
        buildCmd: { type: string }
        lintCmd: { type: string }
        testCmd: { type: string }
        notes:
          type: array
          items: { type: string }
        stack: { type: string }
        source: { type: string, enum: [files, claude], description: Whether Claude filled in what the file scan could not }

    RepoPreview:
      type: object
      required: [command, port, readyPath, routes, uiPaths, login, envSet, envNames]
      description: How agnts starts the app to take screenshots; an empty command turns previews off
      properties:
        command: { type: string }
        port: { type: integer }
        readyPath: { type: string }
        routes:
          type: array
          items: { type: string }
        uiPaths:
          type: array
          items: { type: string }
        login: { type: string }
        envSet: { type: boolean }
        envNames:
          type: array
          description: The names of the variables in the environment; the values are never returned
          items: { type: string }

    RepoPreviewInput:
      type: object
      properties:
        command: { type: string, maxLength: 1000 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        readyPath: { type: string, maxLength: 300 }
        routes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        uiPaths:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 300 }
        login: { type: string, maxLength: 2000 }
        env:
          type: string
          maxLength: 16384
          description: 'KEY=value lines; replaces the stored environment, "" clears it, absent keeps it'

    RepoMember:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        name: { type: string }
        avatarUrl: { type: string }
        url: { type: string, description: Profile page on the git host }
        role: { type: string, description: 'The host''s role name, e.g. admin, write (GitHub) or Maintainer, Developer (GitLab)' }

    RemoteRepository:
      type: object
      required: [fullName, cloneUrl, defaultBranch, private, added]
      properties:
        fullName: { type: string, description: 'owner/name, or group/sub/project on GitLab' }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        description: { type: string }
        updatedAt: { type: string, format: date-time }
        added: { type: boolean, description: Already added to agnts }

    Integration:
      type: object
      required: [provider, connected, settings]
      properties:
        provider: { type: string }
        connected: { type: boolean }
        checkedAt: { type: string, format: date-time }
        account: { type: string }
        tokenHint: { type: string, description: Last four characters }
        lastError: { type: string }
        settings:
          type: object
          additionalProperties: { type: string }
        webhookUrl: { type: string }
        webhookSecret: { type: string, description: 'GitHub and GitLab: secret to enter in the webhook settings' }
        webhookSecretSet: { type: boolean, description: 'Plane: a webhook secret is stored (deliveries are accepted)' }

    PlaneState:
      type: object
      required: [name, group, projects]
      properties:
        name: { type: string }
        group: { type: string, enum: [backlog, unstarted, started, completed, cancelled, triage] }
        projects:
          type: array
          description: Identifiers of the linked projects that have this state
          items: { type: string }

    ConnectResult:
      type: object
      required: [integration]
      properties:
        integration: { $ref: '#/components/schemas/Integration' }
        webhookSecret: { type: string, description: Shown once; paste it into the provider's webhook settings }

    DashboardCounts:
      type: object
      required: [needs, answers, reviews, stopped, running, queued]
      properties:
        needs: { type: integer }
        answers: { type: integer }
        reviews: { type: integer }
        stopped: { type: integer }
        running: { type: integer }
        queued: { type: integer }

    LiveRun:
      type: object
      required: [ticket, model, turns, maxTurns, lastMessage]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        model: { type: string }
        turns: { type: integer }
        maxTurns: { type: integer }
        lastMessage: { type: string }

    HourBucket:
      type: object
      required: [hour, agnts, you, problems]
      properties:
        hour: { type: integer }
        agnts: { type: integer }
        you: { type: integer }
        problems: { type: integer }

    WeekStats:
      type: object
      required: [picked, pushed, firstTryPct, avgTurns, avgWaitMin, stopped]
      properties:
        picked: { type: integer }
        pushed: { type: integer }
        firstTryPct: { type: integer }
        avgTurns: { type: integer }
        avgWaitMin: { type: integer }
        stopped: { type: integer }

    RepoActivity:
      type: object
      required: [repo, open]
      properties:
        repo: { $ref: '#/components/schemas/Repository' }
        open: { type: integer }
        latest: { $ref: '#/components/schemas/Ticket' }

    Dashboard:
      type: object
      required: [counts, waiting, live, pipeline, todayByHour, week, lastWeek, repos, recent, usage, parallel]
      properties:
        counts: { $ref: '#/components/schemas/DashboardCounts' }
        waiting:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        live:
          type: array
          items: { $ref: '#/components/schemas/LiveRun' }
        pipeline:
          type: object
          additionalProperties: { type: integer }
          description: Open tickets per state
        todayByHour:
          type: array
          items: { $ref: '#/components/schemas/HourBucket' }
        week: { $ref: '#/components/schemas/WeekStats' }
        lastWeek: { $ref: '#/components/schemas/WeekStats' }
        repos:
          type: array
          items: { $ref: '#/components/schemas/RepoActivity' }
        recent:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        usage: { $ref: '#/components/schemas/Usage' }
        parallel: { type: integer }

    DeviceRegistration:
      type: object
      required: [platform, fcmToken]
      properties:
        platform: { type: string, enum: [ios, android] }
        fcmToken: { type: string, minLength: 1, maxLength: 4096 }
        appVersion: { type: string, maxLength: 50 }

    McpStatus:
      type: object
      required: [url, staticToken, connections]
      properties:
        url: { type: string, description: The connector URL to add in Claude }
        staticToken: { type: boolean }
        connections: { type: integer, description: Claude connections authorised with OAuth }

    NetworkRoute:
      type: object
      description: A host (gitlab.corp.local), a domain (.corp.local) or a private range (10.20.0.0/16), with ports (80 and 443 when none).
      properties:
        host: { type: string, maxLength: 253 }
        cidr: { type: string, maxLength: 64 }
        ports:
          type: array
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 65535 }

    PrivateNetworkList:
      type: object
      required: [available, linkUrl, max, networks]
      properties:
        available: { type: boolean, description: The server runs the gateway (private networks can be used) }
        linkUrl: { type: string, description: Where agnts-link connects }
        max: { type: integer, description: How many networks a workspace may keep }
        networks:
          type: array
          items: { $ref: '#/components/schemas/PrivateNetwork' }

    PrivateNetwork:
      type: object
      required: [id, name, kind, enabled, routes, status, tokenSet, webhooks, pollMinutes, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [wireguard, openvpn, connector] }
        enabled: { type: boolean }
        summary: { type: string, description: 'The config without its keys, e.g. peer vpn.corp.com:51820' }
        routes:
          type: array
          items: { $ref: '#/components/schemas/NetworkRoute' }
        ca:
          type: object
          required: [subjects, notAfter]
          properties:
            subjects: { type: array, items: { type: string } }
            notAfter: { type: string, format: date-time }
        status:
          type: string
          enum: [connecting, up, error, disabled, gateway_down]
        lastError: { type: string }
        upAt: { type: string, format: date-time }
        handshakeAt: { type: string, format: date-time, description: "WireGuard's last handshake, or agnts-link's last heartbeat" }
        detail: { type: string }
        tokenSet: { type: boolean, description: An agnts-link token exists }
        webhooks:
          type: string
          enum: [relay, polling]
          description: relay — agnts-link forwards webhooks; polling — trackers reached through it are read every pollMinutes
        pollMinutes: { type: integer }
        updatedAt: { type: string, format: date-time }

    PrivateNetworkInput:
      type: object
      required: [name, kind, enabled, routes]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: 'Unique in the workspace, e.g. the company or office it reaches' }
        kind: { type: string, enum: [wireguard, openvpn, connector] }
        enabled: { type: boolean }
        config: { type: string, maxLength: 65536, description: The WireGuard or OpenVPN config; left out keeps the saved one }
        username: { type: string, maxLength: 256, description: OpenVPN auth-user-pass }
        password: { type: string, maxLength: 256, description: OpenVPN auth-user-pass; left out or empty keeps the saved one }
        routes:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/NetworkRoute' }
        caPem: { type: string, maxLength: 65536, description: 'Company CA certificates (PEM); "" removes them, left out keeps them' }

    PrivateNetworkSaved:
      type: object
      required: [network]
      properties:
        network: { $ref: '#/components/schemas/PrivateNetwork' }
        token: { type: string, description: 'A new agnts-link token, shown once' }

    NetworkTest:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: The connection was made }
        via: { type: string }
        network:
          type: object
          description: The network the routes pick for the target
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        resolved: { type: string, description: The address the name resolved to inside the tunnel }
        connectMs: { type: integer, format: int64 }
        error: { type: string }
        tls:
          type: object
          required: [verified]
          properties:
            verified: { type: boolean }
            subject: { type: string }
            issuer: { type: string }
            notAfter: { type: string, format: date-time }
            error: { type: string }

    NetworkActivity:
      type: object
      required: [today, refused, dials]
      properties:
        today: { type: integer, description: Connections in the last 24 hours }
        refused: { type: integer, description: 'Of those, refused or failed' }
        dials:
          type: array
          items:
            type: object
            required: [at, target, source, ok, bytesIn, bytesOut]
            properties:
              at: { type: string, format: date-time }
              target: { type: string }
              network: { type: integer, format: int64, description: 'The network that carried it (none: refused before one was picked, or since removed)' }
              ticket: { type: string }
              source: { type: string, description: 'run, server, test or webhook' }
              ok: { type: boolean }
              error: { type: string }
              bytesIn: { type: integer, format: int64 }
              bytesOut: { type: integer, format: int64 }

    CI:
      type: string
      enum: [ok, fail, run, pending, manual, skip, canceled, none]

    Branch:
      type: object
      required: [name, default, sha, message, author, ahead, behind, ci]
      properties:
        name: { type: string }
        default: { type: boolean }
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        ahead: { type: integer }
        behind: { type: integer }
        ci: { $ref: '#/components/schemas/CI' }
        ticketKey: { type: string }

    LocalBranch:
      type: object
      required: [name, sha, message, author, ahead, behind, status, unpushed]
      properties:
        name: { type: string }
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        ahead: { type: integer, description: Commits not on the default branch }
        behind: { type: integer, description: Default branch commits the branch lacks }
        status:
          type: string
          enum: [local, pushed, unpushed, differs]
          description: 'local: not on origin; pushed: origin has the same commit; unpushed: origin is behind; differs: origin has commits the local branch lacks'
        unpushed: { type: integer, description: Commits origin lacks (status unpushed) }
        ticketKey: { type: string }

    Commit:
      type: object
      required: [sha, message, author, add, del, ci]
      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        add: { type: integer }
        del: { type: integer }
        ci: { $ref: '#/components/schemas/CI' }
        url: { type: string }
        ticketKey: { type: string, description: "The first linked ticket's key, else the KEY-1 before the message's colon" }
        tickets:
          type: array
          description: The tickets the commit is linked to
          items: { $ref: '#/components/schemas/CommitTicket' }

    CommitTicket:
      type: object
      description: A ticket a commit is linked to (its branch or message has the ticket's number or key)
      required: [key, title, state]
      properties:
        key: { type: string }
        number: { type: string, description: "The team's number, when the ticket has one" }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }

    LinkedCommit:
      type: object
      required: [sha, shortSha, subject, author, branch, repoId, repo, url, committedAt, matchedOn]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string, description: "The message's first line" }
        author: { type: string }
        authorLogin: { type: string, description: 'The git host account, when known' }
        branch: { type: string, description: The branch it was first seen on }
        repoId: { type: integer, format: int64 }
        repo: { type: string }
        url: { type: string, description: The commit on the git host }
        committedAt: { type: string, format: date-time }
        matchedOn:
          type: array
          description: Where the ticket's number was found
          items: { type: string, enum: [branch, message] }

    LinkedCommits:
      type: object
      required: [commits, total]
      properties:
        commits:
          type: array
          items: { $ref: '#/components/schemas/LinkedCommit' }
        total: { type: integer, description: How many commits are linked in all }

    TreeEntry:
      type: object
      required: [name, path, type]
      properties:
        name: { type: string }
        path: { type: string, description: From the repository root }
        type: { type: string, enum: [dir, file, symlink, submodule] }
        size: { type: integer, format: int64, description: "Files only, when the git host gives it (GitLab does not)" }

    RepoTree:
      type: object
      required: [ref, path, entries]
      properties:
        ref: { type: string }
        path: { type: string, description: '"" for the root' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TreeEntry' }
        capped: { type: boolean, description: The directory has more entries than are listed }

    RepoFile:
      type: object
      required: [ref, path, size, binary, tooLarge, url]
      properties:
        ref: { type: string }
        path: { type: string }
        size: { type: integer, format: int64 }
        content: { type: string, description: Left out for binary files and files over 1 MB }
        binary: { type: boolean }
        tooLarge: { type: boolean }
        url: { type: string, description: The file on the git host }

    CommitPull:
      type: object
      required: [number, title, state, url]
      properties:
        number: { type: integer }
        title: { type: string }
        state: { type: string, enum: [open, merged, closed] }
        url: { type: string }

    CommitDetail:
      type: object
      required: [sha, message, author, add, del, parents, url, files, pipelines, pulls, provider]
      properties:
        sha: { type: string }
        message: { type: string, description: The full commit message }
        author: { type: string }
        authorEmail: { type: string }
        authorLogin: { type: string, description: "The git host account, when the author's email maps to one" }
        authorAvatar: { type: string }
        date: { type: string, format: date-time, description: Authored }
        committer: { type: string }
        committerEmail: { type: string }
        committedDate: { type: string, format: date-time }
        parents:
          type: array
          items: { type: string }
        url: { type: string }
        add: { type: integer }
        del: { type: integer }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileChange' }
        filesCapped: { type: boolean, description: More files changed than are listed }
        pipelines:
          type: array
          items: { $ref: '#/components/schemas/Pipeline' }
        pulls:
          type: array
          items: { $ref: '#/components/schemas/CommitPull' }
        ticketKey: { type: string, description: "The first linked ticket's key, else the KEY-1 before the message's colon" }
        tickets:
          type: array
          description: The tickets the commit is linked to
          items: { $ref: '#/components/schemas/CommitTicket' }
        provider: { type: string, enum: [github, gitlab] }

    Stage:
      type: object
      required: [id, name, status, durationMs, manual]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/CI' }
        durationMs: { type: integer, format: int64 }
        manual: { type: boolean }

    Pipeline:
      type: object
      required: [id, name, branch, sha, message, trigger, status, durationMs, url, stages]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        branch: { type: string }
        sha: { type: string }
        message: { type: string }
        trigger: { type: string }
        status: { $ref: '#/components/schemas/CI' }
        created: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        url: { type: string }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }

    Environment:
      type: object
      required: [name, sha, url]
      properties:
        name: { type: string }
        sha: { type: string }
        deployedAt: { type: string, format: date-time }
        url: { type: string }

    PeriodStats:
      type: object
      required: [picked, pushed, rejected, stopped, firstTry, afterChanges, agntsMin, waitMin, reviewMin, answerMin, turns, merged, closed, spend]
      properties:
        merged: { type: integer, description: agnts pull requests merged in the period }
        closed: { type: integer, description: agnts pull requests closed without a merge in the period }
        picked: { type: integer }
        pushed: { type: integer }
        rejected: { type: integer }
        stopped: { type: integer }
        firstTry: { type: integer }
        afterChanges: { type: integer }
        agntsMin: { type: number }
        waitMin: { type: number }
        reviewMin: { type: number }
        answerMin: { type: number }
        turns: { type: number }
        spend: { $ref: '#/components/schemas/TokenSpend' }

    DayStat:
      type: object
      required: [date, picked, pushed, rejected, stopped, agntsMin, waitMin, turns, spend]
      properties:
        date: { type: string, format: date }
        picked: { type: integer }
        pushed: { type: integer }
        rejected: { type: integer }
        stopped: { type: integer }
        agntsMin: { type: number }
        waitMin: { type: number }
        turns: { type: number }
        peakUsage: { type: number }
        spend: { $ref: '#/components/schemas/TokenSpend' }

    Analytics:
      type: object
      required: [days, current, previous, perDay, steps, stops, models, repos, hours, insights, spendByStage, quality]
      properties:
        days: { type: integer }
        quality:
          type: array
          description: How the tickets whose first coding run started in the period went, by prompt version, oldest first
          items: { $ref: '#/components/schemas/QualityStat' }
        skills:
          type: array
          description: "How agnts's method skills did on the tickets whose coding runs started in the period (replays included), by skill; an empty skill is the tickets that had none"
          items: { $ref: '#/components/schemas/SkillStat' }
        current: { $ref: '#/components/schemas/PeriodStats' }
        previous: { $ref: '#/components/schemas/PeriodStats' }
        perDay:
          type: array
          items: { $ref: '#/components/schemas/DayStat' }
        steps:
          type: object
          additionalProperties: { type: number }
          description: Average minutes per state
        stops:
          type: object
          additionalProperties: { type: integer }
          description: 'Stopped runs by reason: tests, limit, you, turns, other'
        models:
          type: array
          items:
            type: object
            required: [model, runs, reachedReview, avgTurns]
            properties:
              model: { type: string }
              runs: { type: integer }
              reachedReview: { type: integer }
              avgTurns: { type: number }
        repos:
          type: array
          items:
            type: object
            required: [repoId, name, kind, claudeMd, tickets, done, finished, avgTurns, agntsMin, merged, closed, asked, analyzed, ciFailures]
            properties:
              merged: { type: integer, description: Pull requests merged in the period }
              closed: { type: integer, description: Pull requests closed without a merge in the period }
              asked: { type: integer, description: Questions agnts asked in the period }
              analyzed: { type: integer, description: Tickets analysed in the period }
              ciFailures: { type: integer, description: CI failure groups that failed in the period }
              repoId: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              claudeMd: { type: string }
              tickets: { type: integer }
              done: { type: integer }
              finished: { type: integer }
              avgTurns: { type: number }
              agntsMin: { type: number }
        hours:
          type: array
          items: { type: integer }
          description: agnts's events per hour of day (server time zone)
        spendByStage:
          type: array
          items: { $ref: '#/components/schemas/StageSpend' }
          description: Spend of every ticket in the period by stage and model, costliest first
        insights:
          type: array
          items:
            type: object
            required: [kind, values]
            properties:
              kind: { type: string, enum: [claudeMd, waiting, stopsTests, stopsLimit, night, mergeRate, slowAnswers, followUpsNoise, flakyJob] }
              values:
                type: object
                additionalProperties: { type: string }

    Spread:
      type: object
      description: 'Typical (median) and slow (90th percentile) minutes; absent when nothing was measured'
      properties:
        p50: { type: number }
        p90: { type: number }

    DeliveryPeriod:
      type: object
      required: [opened, merged, closed, mergeMin, pushed, pushedMin, mergedTickets, mergedMin, questions, askedTickets, analyzedTickets, answerMin]
      properties:
        opened: { type: integer, description: Pull requests opened in the period }
        merged: { type: integer, description: 'Of those, merged so far' }
        closed: { type: integer, description: 'Of those, closed without a merge so far' }
        mergeMin: { $ref: '#/components/schemas/Spread' }
        pushed: { type: integer, description: Tickets that first reached done in the period }
        pushedMin: { $ref: '#/components/schemas/Spread' }
        mergedTickets: { type: integer, description: Tickets merged in the period }
        mergedMin: { $ref: '#/components/schemas/Spread' }
        questions: { type: integer }
        askedTickets: { type: integer, description: Tickets that asked the questions }
        analyzedTickets: { type: integer, description: Tickets analysed in the period }
        answerMin: { $ref: '#/components/schemas/Spread' }

    DeliveryDay:
      type: object
      required: [date, merged, closed]
      properties:
        date: { type: string, format: date }
        merged: { type: integer }
        closed: { type: integer }
        pushedMin: { type: number, description: Median minutes picked → pushed of the tickets pushed that day }
        mergedMin: { type: number, description: Median minutes picked → merged of the tickets merged that day }

    SlowTicket:
      type: object
      required: [key, title, cycleMin, agntsMin, answersMin, reviewMin, queueMin, merged]
      properties:
        key: { type: string }
        title: { type: string }
        cycleMin: { type: number, description: Minutes picked → pushed }
        agntsMin: { type: number }
        answersMin: { type: number }
        reviewMin: { type: number }
        queueMin: { type: number, description: 'The rest: queued, paused or retried' }
        merged: { type: boolean }

    StalePR:
      type: object
      required: [key, title, repo, url, openedAt]
      properties:
        key: { type: string }
        title: { type: string }
        repo: { type: string }
        url: { type: string }
        openedAt: { type: string, format: date-time }

    AnalyticsDelivery:
      type: object
      required: [days, current, previous, perDay, slowest, stale, unanswered]
      properties:
        days: { type: integer }
        current: { $ref: '#/components/schemas/DeliveryPeriod' }
        previous: { $ref: '#/components/schemas/DeliveryPeriod' }
        perDay:
          type: array
          items: { $ref: '#/components/schemas/DeliveryDay' }
        slowest:
          type: array
          description: The slowest tickets pushed in the period, and where their time went
          items: { $ref: '#/components/schemas/SlowTicket' }
        stale:
          type: array
          description: Pull requests still open after a week, oldest first
          items: { $ref: '#/components/schemas/StalePR' }
        unanswered: { type: integer, description: Questions waiting for an answer now }

    CIPeriod:
      type: object
      required: [seen, new, fixed, autoFixed, flaky, fixMin, ownFixes]
      properties:
        seen: { type: integer, description: Failure groups that failed in the period }
        new: { type: integer, description: First seen in the period }
        fixed: { type: integer }
        autoFixed: { type: integer, description: Fixed by an agnts ticket }
        flaky: { type: integer }
        fixMin: { $ref: '#/components/schemas/Spread' }
        ownFixes: { type: integer, description: "Times red CI sent agnts's own pull request back to coding" }

    CIDay:
      type: object
      required: [date, new, fixed]
      properties:
        date: { type: string, format: date }
        new: { type: integer }
        fixed: { type: integer }

    FlakyJob:
      type: object
      required: [id, repo, workflow, job, title, flaky, failures]
      properties:
        id: { type: integer, format: int64 }
        repo: { type: string }
        workflow: { type: string }
        job: { type: string }
        title: { type: string }
        flaky: { type: integer, description: Times it passed on re-run }
        failures: { type: integer }

    AnalyticsCI:
      type: object
      required: [days, watching, current, previous, byClass, perDay, flakiest, open]
      properties:
        days: { type: integer }
        watching: { type: boolean, description: CI watching is set up for at least one repository }
        current: { $ref: '#/components/schemas/CIPeriod' }
        previous: { $ref: '#/components/schemas/CIPeriod' }
        byClass:
          type: object
          additionalProperties: { type: integer }
          description: 'Failure groups seen in the period by class: code, test, config, dependency, infra, flaky, unknown'
        perDay:
          type: array
          items: { $ref: '#/components/schemas/CIDay' }
        flakiest:
          type: array
          items: { $ref: '#/components/schemas/FlakyJob' }
        open: { type: integer, description: Failure groups that need attention now }

    LearningPeriod:
      type: object
      required: [lessons, lessonsLearned, rulesSuggested, rulesAdopted, rulesManual, reflections, reflectionRules, followUps, accepted, dismissed, reviewerNotes]
      properties:
        lessons: { type: integer }
        lessonsLearned: { type: integer }
        rulesSuggested: { type: integer, description: Rules suggested from tickets }
        rulesAdopted: { type: integer, description: 'Of those, in use now' }
        rulesManual: { type: integer, description: Rules written by a person }
        reflections: { type: integer }
        reflectionRules: { type: integer, description: Rules the reflections suggested }
        followUps: { type: integer }
        accepted: { type: integer, description: Follow-ups accepted in the period }
        dismissed: { type: integer, description: Follow-ups dismissed in the period }
        reviewerNotes: { type: integer }

    LessonCount:
      type: object
      required: [category, created, learned]
      properties:
        category: { type: string }
        created: { type: integer }
        learned: { type: integer }

    FollowUpCount:
      type: object
      required: [name, suggested, accepted, dismissed]
      properties:
        name: { type: string }
        suggested: { type: integer }
        accepted: { type: integer }
        dismissed: { type: integer }

    ReviewerStat:
      type: object
      required: [login, rereview, dismissed, manual, repos]
      properties:
        login: { type: string }
        rereview: { type: integer }
        dismissed: { type: integer }
        manual: { type: integer }
        repos:
          type: array
          items: { type: string }

    AnalyticsLearning:
      type: object
      required: [days, current, previous, lessons, followUpTypes, followUpSources, reviewers]
      properties:
        days: { type: integer }
        current: { $ref: '#/components/schemas/LearningPeriod' }
        previous: { $ref: '#/components/schemas/LearningPeriod' }
        lessons:
          type: array
          items: { $ref: '#/components/schemas/LessonCount' }
        followUpTypes:
          type: array
          description: Follow-ups suggested in the period by type (prerequisite, split, unfinished, gap)
          items: { $ref: '#/components/schemas/FollowUpCount' }
        followUpSources:
          type: array
          description: Follow-ups suggested in the period by source (analyze, work, review, manual)
          items: { $ref: '#/components/schemas/FollowUpCount' }
        reviewers:
          type: array
          description: Reviewers with the most notes in the period
          items: { $ref: '#/components/schemas/ReviewerStat' }

    RepoBrief:
      type: object
      required: [repoId, repoName, body, bodySha, draft, draftSha, status, mergesSince, refreshAfter, error, updatedAt]
      description: >-
        What agnts knows about how a repository works. A survey writes the
        draft; once a person approves it, the body reaches every run of the
        repository's tickets as /agnts/context/brief.md.
      properties:
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        body: { type: string, description: 'The approved brief, Markdown; empty when there is none' }
        bodySha: { type: string, description: The commit the approved brief describes }
        draft: { type: string, description: 'The latest survey, waiting for approval; empty when there is none' }
        draftSha: { type: string }
        status: { type: string, enum: [idle, pending, surveying, failed] }
        mergesSince: { type: integer, description: Tickets merged since the brief was approved }
        refreshAfter: { type: integer, description: 'Merges after which agnts surveys again, when Settings allow' }
        error: { type: string, description: Why the last survey failed }
        surveyedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        architecture: { type: string, description: 'The approved architecture.json (layers and allowed imports, shared helpers, recipes), JSON text; runs read it and agnts checks changes against its layers. Empty when there is none' }
        architectureDraft: { type: string, description: 'The architecture the latest survey wrote, approved with the draft brief' }

    RepoBriefInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 40000 }
        architecture: { type: string, maxLength: 200000, description: 'Replaces the approved architecture.json when given; empty removes it' }

    BenchmarkRun:
      type: object
      required: [original]
      properties:
        original: { type: string }
        replay: { type: string, description: The replay ticket's key }
        error: { type: string, description: Why the ticket could not be replayed }

    ReplayReport:
      type: object
      required: [versions, replays]
      properties:
        versions:
          type: array
          description: Replays with a change, summed by the prompt version and coding model they ran with
          items: { $ref: '#/components/schemas/ReplayVersion' }
        benchmark:
          type: array
          description: The same, for the replays of tickets in the benchmark only
          items: { $ref: '#/components/schemas/ReplayVersion' }
        replays:
          type: array
          description: The newest replays first
          items: { $ref: '#/components/schemas/ReplayResult' }

    ReplayVersion:
      type: object
      required: [promptVersion, replays, checksPassed, reviewed, looksGood, avgOverlap, avgRecall, avgTurns, avgCostUsd, originalTurns, originalCostUsd]
      properties:
        promptVersion: { type: string }
        model: { type: string, description: The coding model of the replays }
        replays: { type: integer }
        merged: { type: integer, description: Replays scored against what the original merged as }
        avgLineRecall: { type: number, description: "Average share of the merged change's added lines the replays add too; absent when none was scored against a merge" }
        originalLineRecall: { type: number, description: "The same for the originals' own changes, to compare with" }
        checksPassed: { type: integer }
        reviewed: { type: integer, description: "Replays agnts's code review read" }
        looksGood: { type: integer, description: Reviews that found nothing to block }
        avgOverlap: { type: number, description: 'Average Jaccard index of the changed files, replay against original' }
        avgRecall: { type: number, description: "Average share of the original's files the replay changed too" }
        avgTurns: { type: number }
        avgCostUsd: { type: number }
        originalTurns: { type: number, description: 'Average turns of the originals, for comparison' }
        originalCostUsd: { type: number }

    ReplayResult:
      type: object
      required: [key, original, title, state, promptVersion, hasChange, checksPassed, files, originalFiles, overlap, recall, turns, originalTurns, costUsd, originalCostUsd, createdAt]
      properties:
        key: { type: string }
        original: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        promptVersion: { type: string }
        model: { type: string }
        benchmark: { type: boolean, description: The original is in the benchmark }
        against: { type: string, enum: [merged, agnts], description: "What the replay is scored against: what the original merged as, or the original's own change" }
        lineRecall: { type: number, description: "Share of the merged change's added lines the replay adds too; absent when scored against agnts" }
        originalLineRecall: { type: number, description: "The same for the original's own change" }
        hasChange: { type: boolean }
        checksPassed: { type: boolean }
        files:
          type: array
          items: { type: string }
        originalFiles:
          type: array
          items: { type: string }
        overlap: { type: number }
        recall: { type: number }
        verdict: { type: string, enum: [looks_good, has_concerns, needs_changes] }
        turns: { type: integer }
        originalTurns: { type: integer }
        costUsd: { type: number }
        originalCostUsd: { type: number }
        createdAt: { type: string, format: date-time }

    QualityStat:
      type: object
      required: [promptVersion, tickets, reachedReview, done, firstTry, rejected, changeRounds, fixAttempts, serious, redFlags, selfFixes]
      properties:
        promptVersion: { type: string, description: 'Empty for runs from before versions were recorded' }
        tickets: { type: integer, description: First coding run in the period }
        reachedReview: { type: integer }
        done: { type: integer }
        firstTry: { type: integer, description: Done without a person asking for changes }
        rejected: { type: integer }
        changeRounds: { type: number, description: 'Average change requests by a person, over the tickets that reached review' }
        ciRounds: { type: number, description: 'Average times red CI on the pull request sent the work back, over the tickets that reached review' }
        merged: { type: integer, description: Their pull requests merged }
        costUsd: { type: number, description: What all their runs cost }
        costPerMerged: { type: number, description: 'Cost over merged tickets; absent when none merged' }
        score: { type: number, description: '0–100: done first time 35%, merged 25%, no serious finding 20%, few change rounds 20%' }
        peopleEdited: { type: number, description: "Average share of agnts's lines people changed before merging; absent when no merge was recorded" }
        reverted: { type: integer, description: Tickets whose merged work people reverted }
        fixAttempts: { type: number, description: Average failing checks sent back to Claude }
        serious: { type: integer, description: Reviewed with a blocker or major finding at least once }
        footprintHit: { type: number, description: 'Average share of the changed files the analysis predicted; absent when none was measured' }
        redFlags: { type: integer, description: Red flags found in the diffs }
        selfFixes: { type: integer, description: "Findings of agnts's own review sent back to the coder" }
        guardBlocks: { type: integer, description: Actions agnts-guard refused in their coding runs }
        stopSaves: { type: integer, description: 'Tickets whose stop gate sent failing checks back and whose checks then passed first time' }
        stalls: { type: integer, description: Times their runs looked stuck }
        proofDue: { type: integer, description: Tickets with a proof of fix }
        proven: { type: integer, description: 'Of those, proven' }
        findings: { type: integer, description: Review findings shown on them }
        adopted: { type: integer, description: "Of those, put into a person's feedback" }
        tokens: { type: number, description: 'Average tokens of a done ticket, all stages' }
        factCheck: { type: integer, description: Tickets in the fact check group (A/B) }
        factCheckFirst: { type: integer, description: 'Of those, done without a person asking for changes' }

    SkillStat:
      type: object
      required: [skill, tickets, loaded, done, firstTry, loadedDone, loadedFirstTry, findings, tokens]
      properties:
        skill: { type: string, description: 'A method skill (agnts-method-…); empty for the tickets whose coding runs had no method skills' }
        tickets: { type: integer, description: Tickets with a coding run that had the skill }
        loaded: { type: integer, description: 'Of those, tickets where Claude loaded it' }
        done: { type: integer }
        firstTry: { type: integer, description: Done without a person asking for changes }
        loadedDone: { type: integer, description: 'Done, of the tickets where Claude loaded it' }
        loadedFirstTry: { type: integer, description: 'Done first try, of the tickets where Claude loaded it' }
        findings: { type: integer, description: 'Review findings the method skills target: architecture and maintainability, or any on a migration file' }
        tokens: { type: number, description: 'Average tokens of a done ticket, all stages' }

    LessonCategory:
      type: string
      enum: [pattern, architecture, algorithm, library, language, testing, security, performance, tooling, other]

    LessonLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    LessonBrief:
      type: object
      required: [id, repoId, repoName, ticketKey, slug, title, category, level, summary, quizCount, readMinutes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        ticketKey: { type: string }
        slug: { type: string, description: 'Concept id, unique per repository' }
        title: { type: string }
        category: { $ref: '#/components/schemas/LessonCategory' }
        level: { $ref: '#/components/schemas/LessonLevel' }
        summary: { type: string }
        quizCount: { type: integer }
        readMinutes: { type: integer, description: 'Estimated minutes to read the lesson and take its quiz' }
        learnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    LearnQueueItem:
      type: object
      required: [key, title, repoName, status, lessons, updatedAt]
      properties:
        key: { type: string }
        title: { type: string }
        repoName: { type: string }
        status:
          type: string
          enum: [running, pending, failed, none]
          description: 'none: the ticket was never learned from'
        lessons: { type: integer, description: Lessons it produced so far }
        updatedAt: { type: string, format: date-time }

    LessonList:
      type: object
      required: [items, total, unlearned]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LessonBrief' }
        total: { type: integer, description: 'All lessons, ignoring filters' }
        unlearned: { type: integer, description: 'Lessons not learned yet, ignoring filters' }

    LessonRef:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Relative to the repository root }
        line: { type: integer }
        note: { type: string }

    QuizQuestion:
      type: object
      required: [question, options, answer]
      properties:
        question: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: integer, description: Index of the correct option }
        explanation: { type: string }

    Link:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string, description: Always https }

    Lesson:
      type: object
      required: [id, repoId, repoName, ticketKey, slug, title, category, level, summary, explanation, whyHere, refs, quiz, reading, readMinutes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        ticketKey: { type: string }
        slug: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/LessonCategory' }
        level: { $ref: '#/components/schemas/LessonLevel' }
        summary: { type: string }
        explanation: { type: string, description: 'Plain text; paragraphs are separated by blank lines' }
        whyHere: { type: string, description: Why this change needed it }
        readMinutes: { type: integer, description: 'Estimated minutes to read the lesson and take its quiz' }
        refs:
          type: array
          items: { $ref: '#/components/schemas/LessonRef' }
        quiz:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        reading:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        learnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RuleStatus:
      type: string
      enum: [pending, analyzing, questions, ready, failed, suggested]
      description: >-
        Where Claude's review stands. Tickets follow a rule only when it is
        ready and enabled. A suggested rule is one agnts proposed from
        feedback: adopt it with a review or as written, or delete it to
        dismiss it (it is then not suggested again).

    RuleKind:
      type: string
      enum: [rule, context, tip]
      default: rule
      description: >-
        rule: an instruction tickets follow. context: business knowledge
        (a glossary, invariants, roles) that runs read as
        /agnts/context/business.md. tip: a practical lesson about working in
        a repository, learned from runs that had trouble; runs get tips as
        skills.

    RuleQuestion:
      type: object
      required: [index, text, options, round]
      properties:
        index: { type: integer, description: Position in the rule's questions; answers refer to it }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: string, description: Empty while the question is open }
        note: { type: string }
        round: { type: integer, description: The review round that asked it }

    Rule:
      type: object
      required: [id, title, body, enabled, status, kind, interpretation, clarified, text, questions, rounds, error, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/RuleKind' }
        sourceTicket: { type: string, description: 'For a rule agnts suggested: the ticket whose feedback taught it' }
        tag: { type: string, enum: [reuse, layer, tests, style, logic, other], description: 'For a rule agnts learned: what kind of lesson it is' }
        reason: { type: string, description: 'For a rule agnts suggested: which feedback shows it' }
        repoId: { type: integer, format: int64, description: Absent for a global rule }
        repoName: { type: string }
        title: { type: string }
        body: { type: string, description: The rule as written }
        enabled: { type: boolean }
        status: { $ref: '#/components/schemas/RuleStatus' }
        interpretation: { type: string, description: 'What Claude will do because of the rule' }
        clarified: { type: string, description: 'The rule rewritten with what the answers settled; empty when used as written' }
        text: { type: string, description: What tickets are given }
        questions:
          type: array
          items: { $ref: '#/components/schemas/RuleQuestion' }
        rounds: { type: integer, description: Question rounds so far }
        error: { type: string, description: Why the last review failed }
        enforce: { $ref: '#/components/schemas/RuleEnforce' }
        delivery: { type: string, enum: [prompt, skill], description: 'prompt: in every prompt; skill: a skill Claude loads when its description matches the work' }
        skillDescription: { type: string, description: 'When the rule applies, for its skill' }
        source: { type: string, description: 'Where it came from: empty (a person), reflect, run, promoted or pack:<language>' }
        confidence: { type: number, description: 'For a learned suggestion: 0.3 to 0.9, earned each time it is seen again' }
        evidence: { type: integer, description: How many times a learned suggestion was seen }
        lastSeen: { type: string, format: date-time }
        watching: { type: boolean, description: 'A learned suggestion with too little evidence to show yet' }
        analyzedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RuleInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        repoId: { type: integer, format: int64, description: Leave out for a rule every repository follows }
        enabled: { type: boolean, default: true }
        kind: { $ref: '#/components/schemas/RuleKind' }
        enforce: { $ref: '#/components/schemas/RuleEnforce' }
        removeEnforce: { type: boolean, description: Remove the enforcement; enforce left out keeps it }
        delivery: { type: string, enum: [prompt, skill], description: Left out keeps the rule's }

    RuleAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, answer]
            properties:
              index: { type: integer, minimum: 0 }
              answer: { type: string, maxLength: 2000 }
              note: { type: string, maxLength: 2000 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. unauthorized, bad_request
        message: { type: string }

    DocumentAccess:
      type: string
      description: 'What you may do: view reads and downloads; edit also changes the text, regenerates and links tickets; owner also shares, publishes, transfers and deletes'
      enum: [none, view, edit, owner]

    DocumentKind:
      type: string
      description: 'page: a document to read; slides: a deck to present, Markdown with a line --- between slides and "Notes:" starting a slide''s speaker notes'
      enum: [page, slides]

    DocumentSourceInput:
      type: object
      description: |
        What agnts makes the document from. report: one ticket's report (tickets has its key). tickets: chosen tickets,
        or a filter, with the period limiting by last update. commits: repositories' commits in a period (from is
        required), on branch (the default branch when empty), optionally by one author. pulls: repositories' pull
        requests by state and period, or chosen numbers in one repository. repo: one repository read in the sandbox.
        document: a page you can open (documentId), made into slides; only for slide decks. documentVersion is the
        version read: 0 or absent reads the current one, and the server records which. meeting: a meeting session's
        transcript and chat (sessionId), made into notes; only the meeting makes these, never a person.
      required: [kind]
      properties:
        kind: { type: string, enum: [report, tickets, commits, pulls, repo, document, meeting] }
        template: { type: string, enum: [status, release_notes, pr_review, repo_review, ticket_summary, presentation, blank, meeting_notes], description: 'Defaults by kind' }
        sessionId: { type: integer, format: int64, description: 'meeting: the session' }
        documentId: { type: integer, format: int64 }
        documentVersion: { type: integer, minimum: 0 }
        instruction: { type: string, maxLength: 2000 }
        tickets:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 64 }
        filter:
          type: object
          properties:
            states:
              type: array
              items: { type: string }
            kinds:
              type: array
              items: { type: string }
            repoId: { type: integer, format: int64 }
        repoIds:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
        branch: { type: string, maxLength: 255 }
        author: { type: string, maxLength: 255 }
        prState: { type: string, enum: [open, merged, all] }
        prNumbers:
          type: array
          maxItems: 30
          items: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    DocumentGeneration:
      type: object
      description: The latest time agnts wrote (or is writing) the document
      required: [id, status, error, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [queued, writing, done, failed] }
        error: { type: string }
        source: { $ref: '#/components/schemas/DocumentSourceInput' }
        requestedBy: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    DocumentSummary:
      type: object
      required: [id, kind, title, version, type, workspaceAccess, ownerId, ownerName, language, access, ticketCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        title: { type: string }
        version: { type: integer, description: 'The current version; 0 while agnts writes the first one' }
        type: { type: string, enum: [private, public] }
        workspaceAccess: { type: string, enum: [none, view, edit], description: Everyone in the workspace gets at least this }
        ownerId: { type: integer, format: int64 }
        ownerName: { type: string }
        language: { type: string, enum: [en, ru, uz] }
        access: { $ref: '#/components/schemas/DocumentAccess' }
        ticketCount: { type: integer }
        generation: { $ref: '#/components/schemas/DocumentGeneration' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }

    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required: [body]
          properties:
            body: { type: string, description: Markdown }
            publicUrl: { type: string, description: 'The public link, while the document is public' }
            source: { $ref: '#/components/schemas/DocumentSourceInput' }
            dataAsOf: { type: string, format: date-time, description: When agnts gathered the facts of the current AI version }
            derivedFrom:
              type: object
              description: The page a slide deck was made from; absent when there is none or you cannot open it
              required: [id, title, version, currentVersion]
              properties:
                id: { type: integer, format: int64 }
                title: { type: string }
                version: { type: integer, description: 'The version the current slides were made from; 0 while the first are being made' }
                currentVersion: { type: integer, description: The page's version now }

    DocumentConflict:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        current: { $ref: '#/components/schemas/Document' }

    DocumentInput:
      type: object
      required: [title]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 204800 }
        language: { type: string, enum: [en, ru, uz] }
        source: { $ref: '#/components/schemas/DocumentSourceInput' }
        linkTickets:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }

    DocumentSave:
      type: object
      required: [title, body, baseVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 204800 }
        baseVersion: { type: integer, minimum: 0, description: The version the edit started from }

    DocumentRegenerate:
      type: object
      properties:
        source: { $ref: '#/components/schemas/DocumentSourceInput' }

    DocumentVersion:
      type: object
      required: [version, title, source, note, createdAt]
      properties:
        version: { type: integer }
        title: { type: string }
        body: { type: string, description: 'Only when one version is asked for' }
        source: { type: string, enum: [human, ai, restore] }
        note: { type: string }
        authorId: { type: integer, format: int64 }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }

    DocumentGrant:
      type: object
      required: [userId, level]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        level: { type: string, enum: [view, edit] }
        createdAt: { type: string, format: date-time }

    DocumentSharing:
      type: object
      required: [type, workspaceAccess, grants, ownerId, publicAllowed]
      properties:
        type: { type: string, enum: [private, public] }
        publicUrl: { type: string }
        workspaceAccess: { type: string, enum: [none, view, edit] }
        ownerId: { type: integer, format: int64 }
        grants:
          type: array
          items: { $ref: '#/components/schemas/DocumentGrant' }
        publicAllowed: { type: boolean, description: Whether the workspace allows public documents }

    DocumentShareInput:
      type: object
      required: [type, workspaceAccess, grants]
      properties:
        type: { type: string, enum: [private, public] }
        workspaceAccess: { type: string, enum: [none, view, edit] }
        grants:
          type: array
          maxItems: 200
          items:
            type: object
            required: [userId, level]
            properties:
              userId: { type: integer, format: int64 }
              level: { type: string, enum: [view, edit] }

    SecretFindings:
      type: object
      required: [code, message, findings]
      properties:
        code: { type: string }
        message: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [line, excerpt]
            properties:
              line: { type: integer, description: 1-based line of the text }
              excerpt: { type: string, description: The line with the secret masked }

    DocumentTicket:
      type: object
      required: [key, number, title, state, kind, linkedAt]
      properties:
        key: { type: string }
        number: { type: string }
        title: { type: string }
        state: { type: string }
        kind: { type: string }
        linkedBy: { type: integer, format: int64, description: Absent when agnts linked it }
        linkedAt: { type: string, format: date-time }

    DocumentComment:
      type: object
      description: A comment. A thread's first comment is on a selection (quote, with prefix and suffix to tell repeats apart, and for slides the slide); replies have parentId.
      required: [id, authorName, authorKind, body, quote, prefix, suffix, version, mine, canResolve, canDelete, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        authorName: { type: string }
        authorKind: { type: string, enum: [member, guest, gone], description: gone when the member or guest no longer exists }
        authorVia: { type: string, enum: [name, google, account], description: 'How a guest said who they are: a typed name, Google, or their agnts account' }
        authorEmail: { type: string, description: 'The email Google or an account gave for a guest; members only see it' }
        body: { type: string }
        quote: { type: string }
        prefix: { type: string }
        suffix: { type: string }
        slide: { type: integer, description: 'The slide, from 0, for slides' }
        version: { type: integer, description: The document's version when it was written }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
        mine: { type: boolean, description: You wrote it }
        canResolve: { type: boolean, description: You may resolve or reopen this thread }
        canDelete: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        parentId: { type: integer, format: int64, description: The thread this replies to }
        quote: { type: string, maxLength: 4000, description: 'The selected text; required for a thread' }
        prefix: { type: string, maxLength: 1000 }
        suffix: { type: string, maxLength: 1000 }
        slide: { type: integer, minimum: 0 }

    DocumentCommentPatch:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        resolved: { type: boolean }

    PresenceInput:
      type: object
      properties:
        leaving: { type: boolean }

    DocumentViewer:
      type: object
      required: [kind, id, name, you]
      properties:
        kind: { type: string, enum: [member, guest] }
        id: { type: integer, format: int64 }
        name: { type: string }
        via: { type: string, enum: [name, google, account], description: How a guest said who they are }
        you: { type: boolean }

    DocumentPresence:
      type: object
      required: [viewers, commentsStamp]
      properties:
        viewers:
          type: array
          items: { $ref: '#/components/schemas/DocumentViewer' }
        commentsStamp: { type: string, description: Changes whenever the comments do; fetch them again when it moves }

    PublicDocumentInfo:
      type: object
      required: [kind, title]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        title: { type: string }
        googleClientId: { type: string, description: 'Shown when "Continue with Google" is on' }

    GuestJoin:
      type: object
      description: A name, or the ID token from Google's button. Neither, from someone signed in to agnts, joins as their account; without a session that is a 400.
      properties:
        name: { type: string, maxLength: 200 }
        googleCredential: { type: string, maxLength: 8000 }

    GuestSession:
      type: object
      required: [token, name, via]
      properties:
        token: { type: string, description: Send it as X-Guest-Token }
        name: { type: string }
        via: { type: string, enum: [name, google, account] }

    PublicDocument:
      type: object
      required: [kind, title, body, version, updatedAt]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        title: { type: string }
        body: { type: string, description: 'Markdown; a slide deck''s speaker notes are left out' }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    Meeting:
      type: object
      description: A meeting link and its settings. live is set while a call is going on.
      required: [id, code, link, title, description, hostName, kind, durationMin, timeZone, access, guests, locked, autoRecord, autoNotes, language, cohostIds, createdAt]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 'abc-defg-hij' }
        link: { type: string, description: 'The meeting''s public link' }
        title: { type: string }
        description: { type: string }
        hostId: { type: integer, format: int64 }
        hostName: { type: string }
        kind: { type: string, enum: [instant, scheduled] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        durationMin: { type: integer }
        timeZone: { type: string }
        access: { type: string, enum: [workspace, invited], description: 'workspace: every member joins; invited: only invitees, other members knock' }
        guests: { type: string, enum: ['off', knock, open], description: 'What people without a membership may do' }
        locked: { type: boolean }
        autoRecord: { type: boolean }
        autoNotes: { type: boolean }
        language: { type: string, enum: [auto, en, ru, uz] }
        cohostIds:
          type: array
          items: { type: integer, format: int64 }
        cancelledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        live: { $ref: '#/components/schemas/MeetingLive' }

    MeetingLive:
      type: object
      required: [sessionId, startedAt, inCall, recording, notes]
      properties:
        sessionId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        inCall: { type: integer, description: 'People in the call now' }
        recording: { type: boolean }
        notes: { type: boolean }

    MeetingDetail:
      allOf:
        - $ref: '#/components/schemas/Meeting'
        - type: object
          required: [invitees, canManage, canUpload, maxUploadMb]
          properties:
            invitees:
              type: array
              items: { $ref: '#/components/schemas/MeetingInvitee' }
            myRsvp: { type: string, enum: [none, yes, no, maybe], description: 'Set when you are invited' }
            canManage: { type: boolean, description: 'You may change, invite, cancel' }
            canUpload: { type: boolean, description: 'You may upload a recording of it (uploadMeetingRecording): you host it and this server hears uploads' }
            maxUploadMb: { type: integer, description: 'The largest recording that can be uploaded' }

    MeetingInvitee:
      type: object
      required: [id, email, name, rsvp]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64, description: 'A member; absent for an email address' }
        email: { type: string }
        name: { type: string }
        rsvp: { type: string, enum: [none, yes, no, maybe] }

    MeetingInput:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        kind: { type: string, enum: [instant, scheduled], description: 'instant when absent' }
        startsAt: { type: string, format: date-time }
        durationMin: { type: integer, minimum: 5, maximum: 720 }
        timeZone: { type: string, maxLength: 64, description: 'IANA, e.g. Asia/Tashkent' }
        access: { type: string, enum: [workspace, invited] }
        guests: { type: string, enum: ['off', knock, open] }
        autoRecord: { type: boolean }
        autoNotes: { type: boolean }
        language: { type: string, enum: [auto, en, ru, uz] }
        invite: { $ref: '#/components/schemas/MeetingInvites' }

    MeetingInvites:
      type: object
      properties:
        users:
          type: array
          maxItems: 200
          items: { type: integer, format: int64 }
        emails:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 254 }

    MeetingInviteesInput:
      type: object
      properties:
        add: { $ref: '#/components/schemas/MeetingInvites' }
        remove:
          type: array
          description: Invitee ids to uninvite
          items: { type: integer, format: int64 }

    MeetingSessionBrief:
      type: object
      required: [id, startedAt, notesStatus, notesError, uploaded]
      properties:
        id: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        notesStatus: { $ref: '#/components/schemas/MeetingNotesStatus' }
        notesError: { type: string }
        documentId: { type: integer, format: int64 }
        uploaded: { type: boolean, description: 'A recording a host uploaded, not a call' }

    MeetingNotesStatus:
      type: string
      description: 'none; recording (notes are on); queued, transcribing (Muse hears the audio), writing (Muse writes the notes); done; failed'
      enum: [none, recording, queued, transcribing, writing, done, failed]

    MeetingSessionSummary:
      type: object
      required: [id, meetingId, meetingCode, meetingTitle, startedAt, people, recordings, actionItems, notesStatus, notesError, documentTitle, uploaded]
      properties:
        id: { type: integer, format: int64 }
        meetingId: { type: integer, format: int64 }
        meetingCode: { type: string }
        meetingTitle: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        people: { type: integer }
        recordings: { type: integer }
        actionItems: { type: integer }
        notesStatus: { $ref: '#/components/schemas/MeetingNotesStatus' }
        notesError: { type: string }
        documentId: { type: integer, format: int64 }
        documentTitle: { type: string }
        uploaded: { type: boolean, description: 'A recording a host uploaded, not a call' }

    MeetingSessionDetail:
      type: object
      required: [id, meeting, startedAt, notesStatus, notesError, attendees, recordings, actionItems, messages, canManage, uploaded, people]
      properties:
        id: { type: integer, format: int64 }
        meeting: { $ref: '#/components/schemas/Meeting' }
        uploaded: { type: boolean, description: 'A recording a host uploaded, not a call: it has no attendance' }
        people:
          type: array
          description: 'An uploaded recording: the members the uploader said are in it'
          items: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        notesStatus: { $ref: '#/components/schemas/MeetingNotesStatus' }
        notesError: { type: string }
        documentId: { type: integer, format: int64 }
        attendees:
          type: array
          items: { $ref: '#/components/schemas/MeetingAttendee' }
        recordings:
          type: array
          items: { $ref: '#/components/schemas/MeetingRecording' }
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/MeetingActionItem' }
        messages: { type: integer, description: 'Chat messages' }
        canManage: { type: boolean }

    MeetingAttendee:
      type: object
      required: [person, name, guest, firstIn, seconds]
      properties:
        person: { type: string, description: 'u<id> or g<id>' }
        name: { type: string }
        guest: { type: boolean }
        email: { type: string, description: 'A guest''s, when Google or an invitation gave it' }
        firstIn: { type: string, format: date-time }
        lastOut: { type: string, format: date-time, description: 'Absent while still in the call' }
        seconds: { type: integer, format: int64 }

    MeetingRecording:
      type: object
      required: [id, startedAt, seconds, bytes, status]
      properties:
        id: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        seconds: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        status: { type: string, enum: [active, ready] }

    MeetingActionItem:
      type: object
      required: [id, position, text, who, due, quote, speaker, drafted, memberByHand]
      properties:
        id: { type: integer, format: int64 }
        position: { type: integer }
        text: { type: string }
        who: { type: string, description: 'As named in the meeting' }
        due: { type: string, description: 'As said' }
        atMs: { type: integer, description: 'When it was said, from the start of the call' }
        quote: { type: string }
        speaker: { type: string, description: 'Who said the line where it was taken, as the transcript names them; empty when it does not say' }
        memberId: { type: integer, format: int64, description: 'The member who takes it: matched from the name as said, or picked by hand; absent when nobody matched' }
        memberName: { type: string }
        memberByHand: { type: boolean, description: 'The member was picked by hand, not matched' }
        drafted: { type: boolean, description: 'Its draft ticket was made when the notes were written' }
        ticketKey: { type: string, description: 'The ticket made from it' }

    ActionItemMemberInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64, description: 'A member of the workspace' }

    ActionItemTicketInput:
      type: object
      properties:
        repoId: { type: integer, format: int64, description: 'The repository; absent lets agnts pick, or none' }
        start: { type: string, enum: [ask, code, queue], description: 'ask when absent' }

    MeetingMessage:
      type: object
      required: [id, person, name, body, at]
      properties:
        id: { type: integer, format: int64 }
        person: { type: string, description: 'u<id> or g<id>' }
        name: { type: string }
        body: { type: string }
        at: { type: string, format: date-time }

    MeetingSegment:
      type: object
      required: [startMs, endMs, name, text]
      properties:
        startMs: { type: integer }
        endMs: { type: integer }
        name: { type: string, description: 'Who spoke; empty when the audio did not say' }
        text: { type: string }

    MeetingTranscript:
      type: object
      required: [segments, speakers]
      properties:
        segments:
          type: array
          items: { $ref: '#/components/schemas/MeetingSegment' }
        speakers: { type: boolean, description: 'The segments name who spoke' }

    MeetingTranscriptHit:
      type: object
      required: [meetingId, meetingTitle, sessionId, startedAt, segment]
      properties:
        meetingId: { type: integer, format: int64 }
        meetingTitle: { type: string }
        sessionId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        segment: { $ref: '#/components/schemas/MeetingSegment' }

    MeetingTicketLink:
      type: object
      required: [meetingId, meetingTitle, meetingCode, ticketKey, quote, createdAt]
      properties:
        meetingId: { type: integer, format: int64 }
        meetingTitle: { type: string }
        meetingCode: { type: string }
        sessionId: { type: integer, format: int64 }
        ticketKey: { type: string }
        quote: { type: string }
        createdAt: { type: string, format: date-time }

    MeetingSettings:
      type: object
      required: [allowRecording, retentionDays, keepAudio, maxParticipants, draftTickets, available]
      properties:
        allowRecording: { type: boolean }
        retentionDays: { type: integer, description: 'Recordings, notes audio and transcripts are deleted after; 0 keeps them' }
        keepAudio: { type: boolean, description: 'Keep the audio of notes after it is heard' }
        maxParticipants: { type: integer }
        draftTickets: { type: boolean, description: 'Every action item becomes a held draft ticket on the member who took it when the notes are written' }
        available:
          type: object
          description: What this server can do
          required: [meetings, recording, notes, uploads, maxUploadMb]
          properties:
            meetings: { type: boolean }
            recording: { type: boolean }
            notes: { type: boolean }
            uploads: { type: boolean, description: 'Recordings can be uploaded and heard' }
            maxUploadMb: { type: integer, description: 'The largest recording that can be uploaded' }

    MeetingSettingsInput:
      type: object
      required: [allowRecording, retentionDays, keepAudio, maxParticipants]
      properties:
        allowRecording: { type: boolean }
        retentionDays: { type: integer, minimum: 0, maximum: 3650 }
        keepAudio: { type: boolean }
        maxParticipants: { type: integer, minimum: 2, maximum: 100 }
        draftTickets: { type: boolean, description: 'Absent keeps it as it is' }

    MeetingPrefs:
      type: object
      required: [reminderMinutes]
      properties:
        reminderMinutes: { type: integer, enum: [0, 5, 10, 15], description: '0 turns reminders off' }

    MeetingUsageDay:
      type: object
      required: [day, sessions, participantMinutes, recordingMinutes, recordingBytes, transcribedMinutes]
      properties:
        day: { type: string, format: date }
        sessions: { type: integer }
        participantMinutes: { type: integer, format: int64 }
        recordingMinutes: { type: integer, format: int64 }
        recordingBytes: { type: integer, format: int64 }
        transcribedMinutes: { type: integer, format: int64 }

    PublicMeeting:
      type: object
      required: [code, title, hostName, workspace, kind, cancelled, guests, member, inCall, recording, notes]
      properties:
        code: { type: string }
        title: { type: string }
        hostName: { type: string }
        workspace: { type: string, description: 'The workspace''s name' }
        kind: { type: string, enum: [instant, scheduled] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string }
        cancelled: { type: boolean }
        guests: { type: string, enum: ['off', knock, open] }
        live: { type: boolean }
        inCall: { type: integer }
        recording: { type: boolean, description: 'The call is being recorded' }
        notes: { type: boolean, description: 'agnts is taking notes of the call' }
        member: { type: boolean, description: 'You are signed in as a member of its workspace' }
        name: { type: string, description: 'Your name, when signed in' }
        googleClientId: { type: string, description: 'For "Continue with Google"' }

    MeetingJoinInput:
      type: object
      properties:
        name: { type: string, maxLength: 80, description: 'A guest''s name' }
        googleCredential: { type: string, maxLength: 4096, description: 'A Google ID token: the guest is who Google says' }
        invite: { type: string, maxLength: 100, description: 'The token of an invitation link (?i=)' }
        device: { type: string, maxLength: 16, description: 'The browser or phone: 4-16 letters and digits it keeps' }

    MeetingJoin:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [joined, waiting] }
        grant: { $ref: '#/components/schemas/MeetingGrant' }
        knockId: { type: integer, format: int64 }
        knockToken: { type: string, description: 'Send as X-Knock-Token when polling' }
        guestToken: { type: string, description: 'A new guest''s token: keep it and send it as X-Guest-Token next time' }
        guestName: { type: string }

    MeetingGrant:
      type: object
      required: [url, token, identity, role, rights, sessionId, name]
      properties:
        url: { type: string, description: 'The LiveKit server (wss://)' }
        token: { type: string, description: 'The LiveKit access token' }
        identity: { type: string }
        seat: { type: string, description: 'Send as X-Meeting-Seat with in-call requests' }
        role: { type: string, enum: [host, cohost, member, guest] }
        rights: { $ref: '#/components/schemas/MeetingRights' }
        sessionId: { type: integer, format: int64 }
        name: { type: string }

    MeetingRights:
      type: object
      required: [publish, screenShare, chat, admit, moderate, record, manageCohosts]
      properties:
        publish: { type: boolean }
        screenShare: { type: boolean }
        chat: { type: boolean }
        admit: { type: boolean }
        moderate: { type: boolean }
        record: { type: boolean }
        manageCohosts: { type: boolean }

    MeetingCall:
      type: object
      required: [meeting, sessionId, me, rights, canAdmit, people, knocks, recording, notes, recordingAvailable, notesAvailable, guestsQuiet]
      properties:
        meeting: { $ref: '#/components/schemas/Meeting' }
        sessionId: { type: integer, format: int64 }
        me: { $ref: '#/components/schemas/MeetingPerson' }
        rights: { $ref: '#/components/schemas/MeetingRights' }
        canAdmit: { type: boolean }
        people:
          type: array
          items: { $ref: '#/components/schemas/MeetingPerson' }
        knocks:
          type: array
          items: { $ref: '#/components/schemas/MeetingKnock' }
        recording: { type: boolean }
        notes: { type: boolean }
        notesStatus: { $ref: '#/components/schemas/MeetingNotesStatus' }
        recordingAvailable: { type: boolean }
        notesAvailable: { type: boolean }
        guestsQuiet: { type: boolean }
        workspace: { type: string, description: 'The workspace''s slug, for members' }

    MeetingPerson:
      type: object
      required: [key, name, role, identities, knocked]
      properties:
        key: { type: string, description: 'u<id> or g<id>' }
        name: { type: string }
        role: { type: string, enum: [host, cohost, member, guest] }
        identities:
          type: array
          description: Their connections (one per device)
          items: { type: string }
        email: { type: string, description: 'A guest''s, for hosts' }
        knocked: { type: boolean }

    MeetingKnock:
      type: object
      required: [id, name, guest, at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        guest: { type: boolean }
        at: { type: string, format: date-time }

    MeetingCallSettings:
      type: object
      properties:
        locked: { type: boolean }
        guests: { type: string, enum: ['off', knock, open] }
        guestsQuiet: { type: boolean, description: 'Guests can''t chat or share their screen' }
        recording: { type: boolean, description: 'Start or stop the video recording' }
        notes: { type: boolean, description: 'Start or stop taking notes' }

  responses:
    Preparing:
      description: The PDF is being made; ask again after Retry-After seconds
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RenderFailed:
      description: The PDF could not be made; the Markdown download still works
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: The git host returned an error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TicketOK:
      description: The ticket after the change
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ticket' }
    NotFound:
      description: No such ticket
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Your role does not allow this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: The plan does not include this; upgrade or buy credits
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: Not available on this server
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not allowed in the ticket's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in, or the credentials are wrong
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit; retry later
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
