            application/json:
              schema: { $ref: '#/components/schemas/LogFinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/log-finding:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: getTicketLogFinding
      summary: The log finding a log ticket fixes (404 for other tickets)
      tags: [logs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogFinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/ci:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: getTicketCIFailure
      summary: The CI failure a CI ticket fixes (404 for other tickets)
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIFailure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/ci-watch:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: getRepoCIWatch
      summary: How agnts watches this repository's CI, and whether the git token can read it
      tags: [ci]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIWatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putRepoCIWatch
      summary: Change how agnts watches this repository's CI
      tags: [ci]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CIWatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIWatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      summary: Your assistant conversations, newest first, each with its last message
      description: >-
        A conversation belongs to the person who started it; nobody else
        sees it. Kept for 30 days after its last message; a Code
        conversation stays while one of its tickets is open.
      tags: [assistant]
      parameters:
        - name: mode
          in: query
          description: Only Chat or only Code conversations
          schema: { $ref: '#/components/schemas/ChatMode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      operationId: startAssistantConversation
      x-viewer: true
      summary: Ask the assistant a question in a new conversation
      description: >-
        Stores the question and starts answering it from a read-only
        snapshot of the workspace. Answers take 10-30 seconds: the response
        has the answer pending; fetch the conversation again, or wait for
        the assistant_answered (or assistant_failed) event on the event
        stream. The assistant takes no actions itself: when asked to act it
        proposes them as actions on its answer, which you confirm.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantAsk' }
      responses:
        '202':
          description: The conversation, with its answer pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getAssistantConversation
      summary: One of your conversations with all its messages
      tags: [assistant]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      operationId: deleteAssistantConversation
      x-viewer: true
      summary: Delete one of your conversations
      tags: [assistant]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: askAssistant
      x-viewer: true
      summary: Ask a follow-up question in one of your conversations
      description: Answered after the conversation's earlier questions, with the last 6 messages as context.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantAsk' }
      responses:
        '202':
          description: The conversation, with the new answer pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/code:
    post:
      operationId: startCodeConversation
      summary: Start a Code conversation
      description: >-
        Code mode: pick the repositories (or an existing ticket with
        ticketKey) and say what you want done. The work runs as an ordinary
        ticket the conversation drives; its progress is the ticket's events
        (see getCodeTimeline). Owners and editors only.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeStart' }
      responses:
        '201':
          description: The conversation, with its first message and ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}/code:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: sendCodeMessage
      summary: Send a message in a Code conversation
      description: >-
        What it does depends on the current ticket's state, shown as routed:
        a new ticket when there is none or it is done; answers while it
        waits for answers; requested changes while it waits for review;
        continue or retry when it stopped. While a stage runs the message
        is queued and sent when the stage ends (a Muse run takes it at once:
        steered). Approve and reject are the ticket's own endpoints.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeSend' }
      responses:
        '200':
          description: The stored message, with what it did
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}/timeline:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getCodeTimeline
      summary: A Code conversation with its timeline
      description: >-
        Your messages and its tickets' events (the newest 600), oldest
        first, and the tool calls waiting for your decision. Live updates
        come on the event stream: the tickets' own events, code_message and
        code_approval.
      tags: [assistant]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeTimeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}/repos:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    put:
      operationId: setCodeRepos
      summary: Change the repositories of a Code conversation
      description: The next ticket works in them; the current one moves too while it has not started on code.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoChoice' }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}/ticket:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    put:
      operationId: attachCodeTicket
      summary: Make an existing ticket the one a Code conversation works on
      description: The next message goes to it. Another of your conversations that had it lets it go.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/conversations/{conversationId}/send-now:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: sendCodeQueuedNow
      summary: Stop the running stage and send the queued messages now
      tags: [assistant]
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/approvals/{approvalId}:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: decideCodeApproval
      summary: Allow or deny a tool call the agent asked you about
      description: >-
        A Muse run in one of your Code conversations wants to run a command
        a rule says to ask about (installing a dependency, say). It waits
        for your answer; with none in 5 minutes the call is denied.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties:
                allow: { type: boolean }
      responses:
        '200':
          description: The approval, decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /tickets/{key}/chat:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: getTicketChat
      summary: Your Code conversation that works on this ticket
      tags: [assistant]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversationId]
                properties:
                  conversationId: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assistant/transcribe:
    post:
      operationId: transcribeAssistantQuestion
      x-viewer: true
      summary: Turn a spoken question into text
      description: >-
        Muse Code hears the recording (`muse voice transcribe`) on the
        account your answers run on, and returns its words; ask them with
        startAssistantConversation or askAssistant as you would typed ones.
        The recording is 16-bit PCM WAV (16 kHz mono is plenty), at most 2
        minutes; it is not kept. One recording at a time per person.
      tags: [assistant]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The recording, WAV, at most 4 MB
      responses:
        '200':
          description: The words heard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantTranscript' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The recording is larger than 4 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/messages/{messageId}/rating:
    parameters:
      - $ref: '#/components/parameters/MessageID'
    put:
      operationId: rateAssistantAnswer
      x-viewer: true
      summary: Rate one of your answers (helpful or not), or take the rating back
      description: >-
        A rating, its comment, the answer and its question are shown to the
        workspace's owner. With share, the snapshot the answer was made from
        is kept with it so new prompts can be tried on the question.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantRating' }
      responses:
        '200':
          description: The answer with its rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/actions/{actionId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ActionID'
    post:
      operationId: confirmAssistantAction
      summary: Do an action the assistant proposed on one of your answers
      description: >-
        Runs the action once, as you. When agnts cannot do it now (the
        ticket moved on), the action comes back failed with the reason.
        Proposed actions expire after 30 minutes.
      tags: [assistant]
      responses:
        '200':
          description: The action, done or failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/actions/{actionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ActionID'
    post:
      operationId: cancelAssistantAction
      summary: Decline an action the assistant proposed
      tags: [assistant]
      responses:
        '200':
          description: The action, cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/stats:
    get:
      operationId: getAssistantStats
      x-role: owner
      summary: How the workspace's assistant did (questions, answer rate, time, ratings, tokens, per prompt version)
      tags: [assistant]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90], default: 7 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /assistant/rated:
    get:
      operationId: listAssistantRated
      x-role: owner
      summary: Rated answers with their questions, newest rating first
      tags: [assistant]
      parameters:
        - name: rating
          in: query
          required: false
          description: up or down; both when left out
          schema: { type: string, enum: [up, down] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistantRated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /documents:
    get:
      operationId: listDocuments
      summary: The documents you can open, most recently changed first
      description: |
        Your own documents, the ones shared with you (by a grant or the workspace default), and for the workspace
        owner every document. scope=deleted lists the trash: your own deleted documents (all of them for the workspace
        owner), restorable for 30 days.
      tags: [documents]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [all, mine, shared, deleted], default: all }
        - name: q
          in: query
          description: Words in the title
          schema: { type: string, maxLength: 200 }
        - name: ticket
          in: query
          description: Only documents linked to this ticket
          schema: { type: string, maxLength: 64 }
        - name: kind
          in: query
          description: Only pages, or only slide decks
          schema: { $ref: '#/components/schemas/DocumentKind' }
        - name: derivedFrom
          in: query
          description: Only the slide decks made from this page
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createDocument
      x-viewer: true
      summary: Create a document, written by you or by agnts from a source
      description: |
        Without a source the body is yours and becomes version 1. With a source, agnts gathers the facts (a ticket's
        report, tickets, commits, pull requests or a repository) and writes the body; the document starts at version 0
        and its generation shows the progress. Workspace viewers may create documents; they own what they create.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: getDocument
      summary: A document with your access to it; 404 when you cannot open it
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveDocument
      x-viewer: true
      summary: Save an edit as a new version (edit access)
      description: |
        baseVersion is the version the edit started from. When someone saved in between, the answer is 409 with the
        document as it is now, so the editor can show both texts. While agnts writes the body only the title changes.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentSave' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Someone saved in between, or agnts is writing the document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentConflict' }
    delete:
      operationId: deleteDocument
      x-viewer: true
      summary: Move a document to the trash (its owner); restorable for 30 days
      tags: [documents]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/undelete:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: undeleteDocument
      x-viewer: true
      summary: Take a document out of the trash (its owner or the workspace owner)
      tags: [documents]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/regenerate:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: regenerateDocument
      x-viewer: true
      summary: Have agnts write the document again (edit access); the result is a new version
      tags: [documents]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRegenerate' }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /documents/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: listDocumentVersions
      summary: Every version of a document, newest first, without their text
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
      - $ref: '#/components/parameters/DocumentVersionNo'
    get:
      operationId: getDocumentVersion
      summary: One version with its text
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/versions/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
      - $ref: '#/components/parameters/DocumentVersionNo'
    post:
      operationId: restoreDocumentVersion
      x-viewer: true
      summary: Make an earlier version the current one, as a new version (edit access)
      tags: [documents]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /documents/{id}/sharing:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: getDocumentSharing
      summary: Who can open a document, and its public link
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSharing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: shareDocument
      x-viewer: true
      summary: Set a document's type, workspace access and grants (its owner)
      description: |
        Grants replace the current ones. Workspace viewers can only be given view. Going public needs public documents
        on in Settings and a text without secrets: when the scan finds some, the answer is 422 with the lines. A
        document that goes public gets a new link; one made private loses its link at once.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentShareInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSharing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The document looks like it holds secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretFindings' }

  /documents/{id}/reset-link:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: resetDocumentLink
      x-viewer: true
      summary: Give a public document a new link; the old one stops working (its owner)
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSharing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/owner:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    put:
      operationId: setDocumentOwner
      x-viewer: true
      summary: Give a document to another member (its owner); the old owner keeps edit access
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/tickets:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: listDocumentTickets
      summary: The tickets linked to a document
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/tickets/{key}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: linkDocumentTicket
      summary: Link a ticket to a document (edit access on the document)
      tags: [documents]
      responses:
        '204': { description: Linked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unlinkDocumentTicket
      summary: Remove a link between a ticket and a document
      tags: [documents]
      responses:
        '204': { description: Unlinked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/download:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: downloadDocument
      summary: Download a version as Markdown or PDF (view access)
      description: |
        version 0 (the default) is the current one. The first PDF download of a version starts making it and answers
        202 with Retry-After; ask again then. A made PDF is kept: later downloads are instant.
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/DocumentFormat'
        - name: version
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: lang
          in: query
          description: The version translated into this language (translated first if needed); absent is as written
          schema: { $ref: '#/components/schemas/TranslationLanguage' }
      responses:
        '200':
          description: The file, as an attachment
          content:
            text/markdown:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '202': { $ref: '#/components/responses/Preparing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RenderFailed' }

  /documents/{id}/translate:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: translateDocument
      x-viewer: true
      summary: The current version translated into a language (view access)
      description: >-
        The title and each Markdown block are translated and stored on their
        own, so a later version only sends the blocks that changed. Blocks
        not yet translated are translated in this request, which can take a
        minute for a long document.
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateInput' }
      responses:
        '200':
          description: The translated version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTranslation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /documents/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: listDocumentComments
      summary: The comments on a document, oldest first (view access)
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentComment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addDocumentComment
      x-viewer: true
      summary: Comment on selected text, or reply to a comment (view access is enough)
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
      - $ref: '#/components/parameters/CommentID'
    patch:
      operationId: updateDocumentComment
      x-viewer: true
      summary: Edit your comment, or resolve or reopen a thread (its author, or edit access)
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommentPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteDocumentComment
      x-viewer: true
      summary: Delete a comment, and a thread's replies with it (its author, or the document's owner)
      tags: [documents]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/presence:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: documentPresence
      x-viewer: true
      summary: Say you have the document open (every 10 seconds) or are leaving; answers who is viewing it now
      tags: [documents]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresenceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPresence' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/documents:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listTicketDocuments
      summary: The documents linked to the ticket that you can open
      description: Documents you cannot open are neither listed nor counted.
      tags: [documents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTicketDocument
      x-viewer: true
      summary: Have agnts make a document from the ticket's report, linked to the ticket
      tags: [documents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction: { type: string, maxLength: 2000, description: 'How to write it: "for the client, no technical detail"' }
                language: { type: string, enum: [en, ru, uz] }
      responses:
        '201':
          description: Created; agnts is writing it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/documents/{token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      operationId: getPublicDocument
      summary: A public document, for a guest of its link
      description: Only the kind, title, text, version and last update. Needs the guest's token (401 guest_required without). Rate limited per address.
      tags: [documents]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/GuestToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDocument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/documents/{token}/download:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      operationId: downloadPublicDocument
      summary: Download a public document's current version
      description: The PDF is made ahead when the document is published or saved; until it is ready the answer is 202. Needs the guest's token.
      tags: [documents]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/DocumentFormat'
        - $ref: '#/components/parameters/GuestToken'
      responses:
        '200':
          description: The file, as an attachment
          content:
            text/markdown:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '202': { $ref: '#/components/responses/Preparing' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/RenderFailed' }

  /public/documents/{token}/info:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      operationId: getPublicDocumentInfo
      summary: What a public link opens, before the reader says who they are
      description: The kind and title only, and Google's client id when "Continue with Google" is on.
      tags: [documents]
      x-scope: user
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDocumentInfo' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/documents/{token}/guest:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    post:
      operationId: joinPublicDocument
      summary: Say who you are to open a public document; signed in, your account says it
      description: Answers the guest's secret token, sent afterwards as X-Guest-Token. It works only on this document, and only while it is public.
      tags: [documents]
      x-scope: user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestJoin' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/documents/{token}/comments:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/GuestToken'
    get:
      operationId: listPublicDocumentComments
      summary: The comments on a public document, for its guests
      tags: [documents]
      x-scope: user
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentComment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: addPublicDocumentComment
      summary: A guest comments on selected text, or replies
      tags: [documents]
      x-scope: user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/documents/{token}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/CommentID'
      - $ref: '#/components/parameters/GuestToken'
    patch:
      operationId: updatePublicDocumentComment
      summary: A guest edits their comment, or resolves or reopens their thread
      tags: [documents]
      x-scope: user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommentPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deletePublicDocumentComment
      summary: A guest deletes their comment
      tags: [documents]
      x-scope: user
      security: []
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/documents/{token}/presence:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
      - $ref: '#/components/parameters/GuestToken'
    post:
      operationId: publicDocumentPresence
      summary: A guest says they have the document open, or are leaving; answers who is viewing it now
      tags: [documents]
      x-scope: user
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresenceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPresence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /meetings:
    get:
      operationId: listMeetings
      x-viewer: true
      summary: The meetings you see
      description: 'upcoming: live ones first, then scheduled ones that have not ended; live: the live ones; mine: the ones you host; agenda: your own (you host, co-host, or are invited and have not declined) that are live or start within 36 hours and have not ended.'
      tags: [meetings]
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [upcoming, live, mine, agenda], default: upcoming }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Meeting' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      operationId: createMeeting
      summary: Make a meeting you host (instant or scheduled) and invite people
      description: Scheduled meetings' invitees get an email with the calendar event; members are told in agnts too.
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /meetings/past:
    get:
      operationId: listPastMeetingSessions
      x-viewer: true
      summary: Calls that happened, newest first, of the meetings you see
      tags: [meetings]
      parameters:
        - name: before
          in: query
          description: Page back from this start time
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingSessionSummary' }

  /meetings/search:
    get:
      operationId: searchMeetingTranscripts
      x-viewer: true
      summary: Find what was said in the meetings you see
      tags: [meetings]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingTranscriptHit' }

  /meetings/settings:
    get:
      operationId: getMeetingSettings
      x-viewer: true
      summary: The workspace's rules for meetings, and what this server can do
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSettings' }
    put:
      operationId: putMeetingSettings
      x-role: owner
      summary: Change the workspace's rules for meetings (the owner)
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingSettingsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /meetings/usage:
    get:
      operationId: getMeetingUsage
      x-role: owner
      summary: The workspace's use of meetings per day (people-minutes, recordings, transcribed audio)
      tags: [meetings]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingUsageDay' }

  /meetings/{meetingId}:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    get:
      operationId: getMeeting
      x-viewer: true
      summary: A meeting with its invitees
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateMeeting
      summary: Change a meeting (its hosts and the owner); a new time sends the invitees an update
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMeeting
      summary: Delete a meeting with its calls, recordings and transcripts (the host or the owner); notes documents stay
      tags: [meetings]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    post:
      operationId: cancelMeeting
      summary: Cancel a meeting; invitees get the cancellation in their calendar
      tags: [meetings]
      responses:
        '204': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/rsvp:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    put:
      operationId: answerMeeting
      x-viewer: true
      summary: Answer an invitation
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [yes, no, maybe] }
      responses:
        '204': { description: Answered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/invitees:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    post:
      operationId: changeMeetingInvitees
      summary: Invite more people, or uninvite (the meeting's hosts)
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingInviteesInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /meetings/{meetingId}/host:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    put:
      operationId: setMeetingHost
      summary: Hand a meeting to another member (the host or the owner)
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /meetings/{meetingId}/cohosts:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    put:
      operationId: setMeetingCohosts
      summary: Choose a meeting's co-hosts (the host)
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  maxItems: 50
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /meetings/{meetingId}/ring:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    post:
      operationId: ringMeeting
      x-viewer: true
      summary: Ring members into the meeting now (their phone and open agnts pages, for 30 seconds)
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: integer, format: int64 }
      responses:
        '204': { description: Ringing }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/sessions:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    get:
      operationId: listMeetingSessions
      x-viewer: true
      summary: The times a meeting was live, newest first
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingSessionBrief' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/uploads:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
    post:
      operationId: uploadMeetingRecording
      summary: Upload a recording of a meeting held elsewhere; only its sound is heard, for notes and draft tickets
      description: >-
        Hosts only. The file (video or audio: mp4, mov, m4v, webm, mkv, ogg, opus, oga, m4a, mp3, wav; at most
        the server's limit, 2 GB by default) becomes a new ended session of the meeting with notes on. agnts takes
        its first audio track out and deletes the file as sent before anything hears it: the picture is never
        analysed. The session's notes then go as a call's do (queued, transcribing, writing, done).
      tags: [meetings]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                startedAt: { type: string, format: date-time, description: 'When the meeting was held; absent is now. Send it before the file.' }
                people: { type: string, description: 'Comma-separated ids of the members in the recording. Send it before the file.' }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded; its notes are queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSessionBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: The file is over the limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /meetings/{meetingId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: getMeetingSession
      x-viewer: true
      summary: A call's attendance, recordings, notes and action items
      description: For the people who were in it, the meeting's invitees, its hosts and the owner.
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingSessionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: listMeetingSessionMessages
      x-viewer: true
      summary: A call's chat
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/sessions/{sessionId}/transcript:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
    get:
      operationId: getMeetingTranscript
      x-viewer: true
      summary: What was said, as Muse heard it
      tags: [meetings]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, txt, vtt], default: json }
      responses:
        '200':
          description: The transcript; txt and vtt as attachments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingTranscript' }
            text/plain:
              schema: { type: string }
            text/vtt:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/sessions/{sessionId}/recordings/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
      - name: mediaId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMeetingRecording
      x-viewer: true
      summary: Watch or download a call's recording (MP4; ranges for seeking)
      tags: [meetings]
      parameters:
        - name: download
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '206': { description: Part of the video }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMeetingRecording
      summary: Delete a recording now (the host or the owner)
      tags: [meetings]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /meetings/{meetingId}/sessions/{sessionId}/notes:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
    post:
      operationId: regenerateMeetingNotes
      summary: Have Muse write a call's notes again (the meeting's hosts)
      tags: [meetings]
      responses:
        '202': { description: Being written }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /meetings/{meetingId}/sessions/{sessionId}/action-items/{itemId}/ticket:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
      - name: itemId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: createActionItemTicket
      summary: Make a ticket of an action item, with the words of the meeting that show it
      tags: [meetings]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionItemTicketInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /meetings/{meetingId}/sessions/{sessionId}/action-items/{itemId}/member:
    parameters:
      - $ref: '#/components/parameters/MeetingID'
      - $ref: '#/components/parameters/SessionID'
      - name: itemId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setActionItemMember
      summary: Pick the member who takes an action item; its ticket becomes theirs too
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionItemMemberInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingActionItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/meetings:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listTicketMeetings
      x-viewer: true
      summary: The meetings a ticket was discussed in or made from
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingTicketLink' }
        '404': { $ref: '#/components/responses/NotFound' }

  /account/meetings:
    get:
      operationId: getMeetingPrefs
      x-scope: user
      summary: Your meeting reminders
      tags: [meetings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingPrefs' }
    put:
      operationId: putMeetingPrefs
      x-scope: user
      summary: Change your meeting reminders
      tags: [meetings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingPrefs' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingPrefs' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /public/meetings/{code}:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    get:
      operationId: getPublicMeeting
      summary: What anyone with the link sees before joining
      description: Title, host, times and whether it is live. Says whether the signed-in person is a member of its workspace.
      tags: [meetings]
      x-scope: user
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMeeting' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /public/meetings/{code}/join:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    post:
      operationId: joinMeeting
      summary: Join a meeting, or knock to be let in
      description: |
        Members of the meeting's workspace are recognised by their session; everyone else is a guest: by the name they
        type, Google, their agnts account, or an invitation link's token. A returning guest sends their guest token
        (X-Guest-Token) to stay the same guest. joined hands out the LiveKit grant and the seat for in-call requests;
        waiting hands out a knock to poll. Refusals are 403 with the reason as the code (locked, full, removed,
        guests_off, not_started, cancelled, denied).
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/GuestToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingJoinInput' }
      responses:
        '200':
          description: Joined or waiting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingJoin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/meetings/{code}/knocks/{knockId}:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
      - name: knockId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: waitMeetingKnock
      summary: Wait (up to 25 seconds) for a knock to be answered
      description: joined with the grant once let in, waiting while nobody answered, 403 denied or expired.
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/KnockToken'
      responses:
        '200':
          description: Joined or still waiting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingJoin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/meetings/{code}/call:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    get:
      operationId: getMeetingCall
      summary: The call as you see it in it - people, waiting room, what you may do
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingCall' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public/meetings/{code}/call/token:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    post:
      operationId: refreshMeetingToken
      summary: A new LiveKit token for your seat (to reconnect)
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public/meetings/{code}/call/messages:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    get:
      operationId: listMeetingCallMessages
      summary: The call's chat after a message
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
        - name: after
          in: query
          schema: { type: integer, format: int64, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeetingMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: sendMeetingMessage
      summary: Send a chat message to the call (no secrets; at most 30 a minute)
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeetingMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/meetings/{code}/call/knocks/{knockId}/{decision}:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
      - name: knockId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [admit, deny] }
    post:
      operationId: decideMeetingKnock
      summary: Let someone in, or turn them away
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/meetings/{code}/call/admit-all:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    post:
      operationId: admitAllMeetingKnocks
      summary: Let everyone waiting in
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /public/meetings/{code}/call/people/{person}/{action}:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
      - name: person
        in: path
        required: true
        description: u<user id> or g<guest id>
        schema: { type: string, pattern: '^[ug][0-9]+$' }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [mute, ask-unmute, remove, lower-hand, cohost, uncohost] }
    post:
      operationId: actOnMeetingPerson
      summary: 'Hosts: mute someone (source: microphone, camera or screen_share), ask them to unmute, remove them, lower their hand, make them co-host'
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [microphone, camera, screen_share] }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/meetings/{code}/call/mute-all:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    post:
      operationId: muteAllInMeeting
      summary: Mute everyone's microphone but yours (hosts)
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /public/meetings/{code}/call/settings:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    put:
      operationId: setMeetingCallSettings
      summary: 'Hosts: lock the meeting, change who may come in, quiet guests, record, take notes'
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeetingCallSettings' }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /public/meetings/{code}/call/end:
    parameters:
      - $ref: '#/components/parameters/MeetingCode'
    post:
      operationId: endMeetingCall
      summary: End the call for everyone (the host)
      tags: [meetings]
      x-scope: user
      security: []
      parameters:
        - $ref: '#/components/parameters/SeatToken'
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }


