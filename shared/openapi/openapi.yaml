openapi: 3.0.3
info:
  title: agnts API
  version: 0.1.0
  description: |
    REST API shared by the admin panel (Vue) and the mobile app (Flutter).
    Both clients are generated from this file with `make gen`.

    Web clients authenticate with the `hiro_session` cookie; mobile clients
    send the same session token as `Authorization: Bearer <token>`.
servers:
  - url: /api
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with password and TOTP code
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Web clients get the session cookie; mobile clients get the token in the body.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        '204': { description: Signed out }

  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /meta:
    get:
      operationId: getMeta
      summary: Server version and build information
      tags: [meta]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }

  /tickets:
    get:
      operationId: listTickets
      summary: Tickets, most recently active first
      tags: [tickets]
      parameters:
        - name: state
          in: query
          description: Only tickets in these states
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketState' }
          style: form
          explode: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{key}:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: getTicket
      summary: A ticket with its questions, analysis and latest result
      tags: [tickets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/events:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listTicketEvents
      summary: The ticket's log, oldest first; poll with `after` for live updates
      tags: [tickets]
      parameters:
        - name: after
          in: query
          description: Only events with a larger id
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{key}/answers:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: answerQuestions
      summary: Answer the ticket's questions; when all are answered, coding starts
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswersRequest' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/approve:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: approveTicket
      summary: Approve the reviewed work
      description: >-
        For a change, agnts pushes the branch and opens the pull request. For a
        report, the ticket is done; the report is posted to the tracker issue
        only when postReport is true.
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignees:
                  type: array
                  maxItems: 10
                  description: Git host usernames to assign the pull request to (changes only)
                  items: { type: string, minLength: 1, maxLength: 100 }
                postReport:
                  type: boolean
                  description: Post the approved report as a comment on the tracker issue (reports only)
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/request-changes:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: requestChanges
      summary: Send the ticket back to coding with feedback
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, minLength: 1, maxLength: 20000 }
                shots:
                  type: array
                  maxItems: 6
                  description: Preview screenshots the feedback points at; the coding run gets them
                  items: { $ref: '#/components/schemas/ShotRef' }
                attachments:
                  type: array
                  maxItems: 10
                  description: Uploads that go with the feedback (mockups, logs, screenshots); the coding run reads them
                  items: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/reject:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: rejectTicket
      summary: Stop work on the ticket for good
      tags: [tickets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/retry:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: retryTicket
      summary: Resume a failed or rate-limited ticket where it stopped
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 4000
                  description: How to get past the failure. The next coding run gets it with the error, like requested changes. Not allowed when the ticket resumes at pushing, since no Claude run follows.
                attachments:
                  type: array
                  maxItems: 10
                  description: Uploads that help get past the failure; the next coding run reads them. Same rule as note.
                  items: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/analyze:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: startTicket
      summary: Start a held ticket now (it is queued for the next free slot)
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/learn:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: learnFromTicket
      summary: Queue a learn run for a pushed ticket (again, if it already ran)
      tags: [learn]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/review:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: reviewTicket
      summary: Queue a code review of a ticket waiting for review (again, if one already ran)
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/preview:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: previewTicket
      summary: Queue a preview (screenshots of the running app) of a ticket waiting for review, again if one already ran
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewInput' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/preview/{runId}/shots/{shotId}:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: shotId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
    get:
      operationId: getPreviewShot
      summary: One preview screenshot, as PNG
      tags: [tickets]
      responses:
        '200':
          description: The screenshot; it never changes, so it may be cached
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/translate:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: translateTicket
      summary: Translate a ticket's texts (its own and what agnts wrote) into a language
      description: >-
        Translations are stored per text, so a text is sent to Claude only
        once per language; asking again, or for a later revision that keeps
        most texts, answers from the store. Texts not yet translated are
        translated in this request, which can take a minute.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslateInput' }
      responses:
        '200':
          description: Each text of the ticket with its translation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Translation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tickets/{key}/stop:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: stopTicket
      summary: Stop the running stage; the ticket moves to failed and can be retried
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/models:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketModels
      summary: Override models for this ticket; omit a stage to use the default
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelOverrides' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/repo:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketRepo
      summary: Link the ticket to a repository
      description: >-
        Allowed on a new ticket, or a failed or rate-limited one that has not
        pushed. A stopped ticket starts over from analysis on retry, since its
        analysis and branch belonged to the old repository.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketRepo' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/implement:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: implementTicket
      summary: Make the code task that carries out a done plan or bug investigation
      description: >-
        Creates a local code task linked back to the report (parentKey), with
        the approved report in its description. A report is implemented once.
        repoId is needed only when the report has no repository.
      tags: [tickets]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImplementInput' }
      responses:
        '201': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/follow-ups:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listFollowUps
      summary: Suggested follow-up tickets and the tickets made from them
      tags: [tickets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUps' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setFollowUps
      summary: Turn follow-up suggestions on or off for this ticket
      description: >-
        inherit follows Settings (suggestFollowUps). Suggestions add a little
        to every prompt of the ticket's runs, so they are off unless asked for.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FollowUpsSetting' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/follow-ups/accept:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: acceptFollowUps
      summary: Create tickets from chosen suggestions
      description: >-
        Each chosen suggestion becomes a queued (held) ticket, as a local task,
        a new Jira issue or a new Plane work item. Nothing runs until it is started. Items are
        handled one by one; each result says what happened to its suggestion.
        What the analysis suggested can be created at once; what the work or
        its review found waits until this ticket is done.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptFollowUps' }
      responses:
        '200':
          description: One result per item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptFollowUpsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/follow-ups/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: dismissFollowUp
      summary: Decline a suggestion; later runs will not suggest it again
      tags: [tickets]
      responses:
        '200':
          description: The dismissed suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{key}/review/findings/{index}/follow-up:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - name: index
        in: path
        required: true
        description: The finding's position in the newest code review
        schema: { type: integer, minimum: 0 }
    post:
      operationId: followUpFromFinding
      summary: Turn a code review finding into a follow-up suggestion
      description: No Claude run is involved.
      tags: [tickets]
      responses:
        '201':
          description: The new suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/relations:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    get:
      operationId: listRelations
      summary: The ticket's ordering constraints and what holds it back now
      tags: [tickets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addRelation
      summary: Make this ticket wait for another, or keep the two from running side by side
      description: >-
        depends_on: this ticket does not start coding until the other is
        merged (or rejected). conflicts: whichever of the two starts coding
        second waits until the first is merged. A dependency that would make
        two tickets wait for each other is refused (400). Adding a relation
        agnts proposed or someone dismissed makes it active.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationInput' }
      responses:
        '201':
          description: The relation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/relations/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - $ref: '#/components/parameters/RelationID'
    post:
      operationId: acceptRelation
      summary: Accept a relation agnts proposed; the queue follows it from now on
      tags: [tickets]
      responses:
        '200':
          description: The relation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/relations/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
      - $ref: '#/components/parameters/RelationID'
    post:
      operationId: dismissRelation
      summary: Dismiss a relation (run anyway); agnts does not propose it again
      tags: [tickets]
      responses:
        '200':
          description: The relation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/merged:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    post:
      operationId: markTicketMerged
      summary: Record that a done ticket's pull request was merged
      description: >-
        For setups without a git host webhook. Tickets waiting for this one
        may start coding.
      tags: [tickets]
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{key}/kind:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    put:
      operationId: setTicketKind
      summary: Change what the ticket produces
      description: >-
        Allowed on a new ticket, while agnts waits for answers, and on a failed
        or rate-limited one that has not pushed. auto lets the analysis pick
        the kind again; any other kind is final.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketKindInput' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file to attach to a task, an answer or a retry note
      description: >-
        The upload stays pending until the request that uses it (createTask,
        updateTask, answerQuestions, retryTicket, requestChanges) lists its id; pending uploads
        nobody used are deleted after a day. Pictures (PNG, JPEG, GIF, WebP)
        are shown in place; other files download. Claude reads every attached
        file, pictures and PDFs included.
      tags: [attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: At most 10 MB
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file is larger than 10 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attachments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getAttachment
      summary: An attached file's bytes
      tags: [attachments]
      responses:
        '200':
          description: The file; it never changes, so it may be cached
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAttachment
      summary: Delete an upload that nothing uses yet
      tags: [attachments]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks:
    post:
      operationId: createTask
      summary: Create a side-project task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{key}:
    parameters:
      - $ref: '#/components/parameters/TicketKey'
    patch:
      operationId: updateTask
      summary: Edit a task that has not started
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200': { $ref: '#/components/responses/TicketOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTask
      summary: Delete a task that has not started
      tags: [tasks]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events:
    get:
      operationId: listEvents
      summary: The global log, newest first, with filters and a cursor
      tags: [logs]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [all, state, tool, command, user, limit, problems], default: all }
        - name: key
          in: query
          description: Ticket key, or a prefix of one
          schema: { type: string, maxLength: 64 }
        - name: errors
          in: query
          schema: { type: boolean, default: false }
        - name: before
          in: query
          description: Only events with a smaller id (pagination)
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/summary:
    get:
      operationId: getEventSummary
      summary: Run statistics and time per step, for the Logs page
      tags: [logs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/export:
    get:
      operationId: exportEvents
      summary: Download the log (last 90 days) as JSON lines or CSV
      tags: [logs]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: A file download
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events/stream:
    get:
      operationId: streamEvents
      summary: Server-Sent Events with every new event row (resume with Last-Event-ID)
      tags: [logs]
      responses:
        '200':
          description: 'An event stream; each message is an Event as JSON, with id set to the event id'
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard:
    get:
      operationId: getDashboard
      summary: Everything the dashboard shows, in one call
      tags: [dashboard]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usage:
    get:
      operationId: getUsage
      summary: Plan usage from Claude Code's rate limit events
      tags: [usage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usage/refresh:
    post:
      operationId: refreshUsage
      summary: Start a tiny Claude run to read fresh limits; a usage_updated event follows
      tags: [usage]
      responses:
        '202':
          description: Refresh started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /usage/tickets:
    get:
      operationId: getTicketSpend
      summary: Tickets that used the most of the plan in a period, by Claude Code's cost estimate
      tags: [usage]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketSpendList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /repos:
    get:
      operationId: listRepos
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRepo
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /repos/detect:
    post:
      operationId: detectRepo
      summary: Work out a repository's toolchains and check commands
      description: |
        Reads the default branch (of a saved repository by id, or of any
        clone URL) and returns what it needs, without saving. With deep,
        Claude also reads the README and CI files when the file scan finds
        nothing; that takes a minute and uses the Claude plan.
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoDetectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoDetection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: getRepo
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRepo
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    put:
      operationId: updateIntegration
      summary: Change an integration's settings (never its token)
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/{provider}/connect:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: connectIntegration
      summary: Save a token (and settings), check it against the provider, and connect
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 8, maxLength: 4096 }
                webhookSecret:
                  type: string
                  maxLength: 200
                  description: 'Plane: the secret Plane shows when you create the webhook. Empty keeps the stored one.'
                settings:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{provider}/test:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: testIntegration
      tags: [integrations]
      responses:
        '200':
          description: Result of the check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/{provider}/disconnect:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: disconnectIntegration
      summary: Forget the token
      tags: [integrations]
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/{provider}/repos:
    parameters:
      - $ref: '#/components/parameters/Provider'
    get:
      operationId: listRemoteRepos
      summary: Repositories the connected GitHub or GitLab token can reach, for import
      tags: [integrations]
      responses:
        '200':
          description: OK, most recently updated first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemoteRepository' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /integrations/jira/sync:
    post:
      operationId: syncJira
      summary: Pick up labelled Jira issues now
      tags: [integrations]
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [found, created]
                properties:
                  found: { type: integer }
                  created: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/plane/sync:
    post:
      operationId: syncPlane
      summary: Pick up labelled Plane work items now
      tags: [integrations]
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [found, created]
                properties:
                  found: { type: integer }
                  created: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/plane/webhook-secret:
    put:
      operationId: setPlaneWebhookSecret
      summary: Store the secret Plane generated for the agnts webhook
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /integrations/plane/states:
    get:
      operationId: listPlaneStates
      summary: States of the Plane projects linked to repositories, for the status mapping
      tags: [integrations]
      responses:
        '200':
          description: States, by name, with the projects that have them
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaneState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /docs/{page}:
    get:
      operationId: getPageDoc
      summary: The "How this page works" text, as Markdown
      tags: [docs]
      parameters:
        - name: page
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z-]*$', maxLength: 32 }
        - name: lang
          in: query
          schema: { type: string, enum: [en, ru, uz], default: en }
      responses:
        '200':
          description: Markdown
          content:
            text/markdown:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices:
    post:
      operationId: registerDevice
      summary: Register this phone for push notifications (call again when the token changes)
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '204': { description: Registered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/unregister:
    post:
      operationId: unregisterDevice
      summary: Stop push notifications to this phone (on sign-out)
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /oauth/consent:
    get:
      operationId: getConsent
      summary: Details of a pending Claude connection request, for the consent page
      tags: [mcp]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clientName, redirectHost]
                properties:
                  clientName: { type: string }
                  redirectHost: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: decideConsent
      summary: Approve or deny a Claude connection; returns where to send the browser
      tags: [mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, redirectUri, codeChallenge, codeChallengeMethod, approve]
              properties:
                clientId: { type: string }
                redirectUri: { type: string }
                codeChallenge: { type: string }
                codeChallengeMethod: { type: string }
                state: { type: string }
                resource: { type: string }
                approve: { type: boolean }
      responses:
        '200':
          description: Redirect target
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-settings:
    get:
      operationId: getMcpSettings
      summary: The MCP connector URL and current connections
      tags: [mcp]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-settings/token:
    post:
      operationId: rotateMcpToken
      summary: Create a new static MCP bearer token (shown once; the old one stops working)
      tags: [mcp]
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-settings/revoke:
    post:
      operationId: revokeMcp
      summary: Disconnect every Claude connection and delete the static token
      tags: [mcp]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lessons:
    get:
      operationId: listLessons
      summary: Lessons agnts learned from pushed tickets, newest first
      tags: [learn]
      parameters:
        - name: repo
          in: query
          schema: { type: integer, format: int64 }
        - name: ticket
          in: query
          schema: { type: string, maxLength: 64 }
        - name: status
          in: query
          description: new (not learned yet), learned, or all (default)
          schema: { type: string, enum: [new, learned, all] }
        - name: q
          in: query
          description: Search in titles and summaries
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lessons/queue:
    get:
      operationId: getLearnQueue
      summary: Done tickets whose learn run is running, queued, failed or never happened
      tags: [learn]
      responses:
        '200':
          description: Running first, then queued in run order, then failed and never learned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearnQueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lessons/{id}:
    parameters:
      - $ref: '#/components/parameters/LessonID'
    get:
      operationId: getLesson
      summary: One lesson with its explanation, code references, quiz and reading
      tags: [learn]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{id}/learned:
    parameters:
      - $ref: '#/components/parameters/LessonID'
    put:
      operationId: markLessonLearned
      summary: Mark a lesson learned
      tags: [learn]
      responses:
        '200':
          description: The lesson after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unmarkLessonLearned
      summary: Mark a lesson as not learned yet
      tags: [learn]
      responses:
        '200':
          description: The lesson after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules:
    get:
      operationId: listRules
      summary: Every rule, global ones first, then by repository
      tags: [rules]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRule
      summary: Add a rule; Claude reviews it before tickets follow it
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Created and queued for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rules/{id}:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    get:
      operationId: getRule
      tags: [rules]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRule
      summary: Edit a rule. Changing its text or repository starts a new review; turning it on or off does not.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRule
      tags: [rules]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules/{id}/answers:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    put:
      operationId: answerRule
      summary: Answer every open question of a rule; Claude then reviews it again
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleAnswers' }
      responses:
        '200':
          description: Answers saved, review queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: acceptRule
      summary: Apply a rule as written, skipping its open questions or a failed review
      tags: [rules]
      responses:
        '200':
          description: The rule after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rules/{id}/review:
    parameters:
      - $ref: '#/components/parameters/RuleID'
    post:
      operationId: reviewRule
      summary: Have Claude review a rule again, keeping its answers
      tags: [rules]
      responses:
        '200':
          description: Queued for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics:
    get:
      operationId: getAnalytics
      summary: Throughput, quality, time and plan statistics for a period
      tags: [analytics]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /repos/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: archiveRepo
      summary: Archive the repository; it keeps its history but takes no new tickets or tasks
      tags: [repos]
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: unarchiveRepo
      summary: Restore an archived repository
      tags: [repos]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repos/{id}/local-branches:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoLocalBranches
      summary: Branches in agnts's own clones on the server, and whether origin has them
      tags: [repos]
      responses:
        '200':
          description: OK, newest commit first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocalBranch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/members:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoMembers
      summary: People with access to the repository on its git host
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RepoMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/branches:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoBranches
      summary: Branches with their tip, ahead/behind the default branch and checks
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/commits:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoCommits
      summary: Commits on the default branch, newest first, 50 per page; a shorter page is the last
      tags: [repos]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Commit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/pipelines:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoPipelines
      summary: CI runs with their stages, newest first, 20 per page; a shorter page is the last
      tags: [repos]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pipeline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/environments:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: listRepoEnvironments
      summary: Deployment environments and what runs there
      tags: [repos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /repos/{id}/deploy:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    post:
      operationId: deployRepo
      summary: Start a deployment (GitLab manual job, or the GitHub deploy workflow). Never available from MCP.
      tags: [repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId: { type: integer, format: int64, description: GitLab manual job to start }
                ref: { type: string, description: 'GitHub: branch to deploy (default branch if empty)' }
      responses:
        '202': { description: Started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    RepoID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [jira, plane, github, claude, telegram, gitlab] }
    RuleID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LessonID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RelationID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TicketKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$', maxLength: 64 }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hiro_session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    LoginRequest:
      type: object
      required: [username, password, code, client]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }
        code:
          type: string
          description: Six-digit code from the authenticator app
          pattern: '^[0-9]{6}$'
        client:
          type: string
          enum: [web, mobile]

    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
        token:
          type: string
          description: Session token, returned only when client is mobile

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }

    Meta:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    TicketState:
      type: string
      enum: [new, analyzing, waiting_for_answers, coding, testing, waiting_for_review, pushing, done, rejected, failed, rate_limited]

    TicketKind:
      type: string
      enum: [code, test, plan, analysis, bug]
      description: >-
        What the work produces. code and test make a change (diff, checks,
        pull request); plan, analysis and bug write a Markdown report.

    TicketKindChoice:
      type: string
      enum: [auto, code, test, plan, analysis, bug]
      description: A kind, or auto for agnts to pick one during analysis

    ImplementInput:
      type: object
      properties:
        repoId: { type: integer, format: int64, description: 'Where to implement it; defaults to the report''s repository' }
        start:
          type: string
          enum: [code, queue]
          description: 'code = start now without questions (default), queue = keep until started'

    Footprint:
      type: object
      description: What the analysis predicts the work will change; the queue compares footprints
      required: [files]
      properties:
        files:
          type: array
          items: { type: string }
        modules:
          type: array
          items: { type: string }
        provides:
          type: array
          description: What the change adds that other work could use
          items: { type: string }
        consumes:
          type: array
          description: What the change needs that may not exist yet
          items: { type: string }
        migrations: { type: boolean }

    Blocker:
      type: object
      required: [key, title, state, type]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        type: { $ref: '#/components/schemas/RelationType' }

    RelationType:
      type: string
      enum: [depends_on, conflicts]
      description: 'depends_on: one waits for the other to merge; conflicts: both change the same code, so they do not run side by side'

    RelationInput:
      type: object
      required: [otherKey, type]
      properties:
        otherKey: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/RelationType' }

    Relation:
      type: object
      required: [id, type, direction, source, status, confidence, reason, basis, files, other, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/RelationType' }
        direction:
          type: string
          enum: [waits_for, waited_by, conflicts]
          description: 'From the ticket asked about: it waits for other, other waits for it, or they conflict'
        source:
          type: string
          enum: [jira, plane, user, agnts, rule, git]
          description: 'Who found it: a Jira link, a Plane relation, a person, the analysis, overlapping footprints, or the finished diffs (when nobody predicted it)'
        status:
          type: string
          enum: [active, proposed, dismissed]
          description: Only active relations hold the queue; proposed ones wait for a person
        confidence: { type: number, format: double }
        reason: { type: string }
        basis:
          type: string
          description: 'For rule and git relations: files, migrations, lockfile, codegen, i18n or diff'
        files:
          type: array
          description: Files both tickets change, when known
          items: { type: string }
        other: { $ref: '#/components/schemas/RelatedTicket' }
        confirmedAt: { type: string, format: date-time, description: When the finished changes proved the conflict real }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RelatedTicket:
      type: object
      required: [key, title, state, landed]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        landed: { type: boolean, description: 'Its change is merged (or it was rejected): it holds nothing back' }

    Relations:
      type: object
      required: [items, blockedBy]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        blockedBy:
          type: array
          description: What holds the ticket's coding back right now
          items: { $ref: '#/components/schemas/Blocker' }

    FollowUpsMode:
      type: string
      enum: [inherit, 'on', 'off']
      description: 'Follow-up suggestions for one ticket: inherit follows Settings'

    FollowUpsSetting:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/FollowUpsMode' }

    FollowUpSuggestion:
      type: object
      required: [id, source, type, revision, title, description, serves, kind, priority, status, ready, createdAt]
      properties:
        id: { type: integer, format: int64 }
        source:
          type: string
          enum: [analyze, work, review, manual]
          description: 'The run that suggested it; manual = made from a review finding'
        type:
          type: string
          enum: [prerequisite, split, unfinished, gap]
          description: How it serves the parent ticket
        revision: { type: integer, description: "The parent's revision when it was suggested" }
        title: { type: string }
        description: { type: string }
        serves: { type: string, description: How it helps finish the parent ticket }
        kind: { $ref: '#/components/schemas/TicketKind' }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, accepted, dismissed] }
        ready: { type: boolean, description: 'A ticket can be made from it now (open, and the parent is done unless the analysis suggested it)' }
        childKey: { type: string, description: 'The ticket made from it' }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    FollowUpTicket:
      type: object
      required: [key, title, state, kind, source]
      properties:
        key: { type: string }
        title: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        kind: { $ref: '#/components/schemas/TicketKind' }
        source: { type: string, enum: [jira, plane, local] }
        held: { type: boolean }

    FollowUps:
      type: object
      required: [enabled, suggestions, children]
      properties:
        enabled: { type: boolean, description: "This ticket's runs suggest follow-ups" }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/FollowUpSuggestion' }
        children:
          type: array
          description: Tickets made from the suggestions
          items: { $ref: '#/components/schemas/FollowUpTicket' }

    AcceptFollowUp:
      type: object
      required: [id]
      description: A suggestion to create, with optional edits
      properties:
        id: { type: integer, format: int64 }
        target:
          type: string
          enum: [local, jira, plane]
          description: 'local = an agnts task (default), jira = a new issue in the Jira project, plane = a new work item in the Plane project'
        title: { type: string, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        kind: { $ref: '#/components/schemas/TicketKind' }
        priority: { type: string, enum: [low, medium, high] }
        repoId: { type: integer, format: int64, description: "Defaults to the parent ticket's repository" }

    AcceptFollowUps:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AcceptFollowUp' }

    AcceptFollowUpResult:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        ticket: { $ref: '#/components/schemas/Ticket' }
        error: { type: string, description: 'Why no ticket was made from this suggestion' }

    AcceptFollowUpsResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AcceptFollowUpResult' }

    TranslationLanguage:
      type: string
      description: A language agnts can translate into
      enum: [en, ru, uz, kk, tr, de, es, fr, zh, ja, ko, ar]

    TranslateInput:
      type: object
      required: [lang]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }

    Translation:
      type: object
      required: [lang, items]
      properties:
        lang: { $ref: '#/components/schemas/TranslationLanguage' }
        items:
          type: array
          description: Each text as the ticket page shows it, and its translation
          items:
            type: object
            required: [source, text]
            properties:
              source: { type: string }
              text: { type: string }

    TicketKindInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/TicketKindChoice' }

    Ticket:
      type: object
      required: [key, source, title, description, priority, state, revision, turns, branch, prUrl, kind, kindAuto, createdAt, updatedAt]
      properties:
        key: { type: string }
        source: { type: string, enum: [jira, plane, local] }
        repoId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        state: { $ref: '#/components/schemas/TicketState' }
        resumeState: { $ref: '#/components/schemas/TicketState' }
        revision: { type: integer }
        turns: { type: integer }
        branch: { type: string }
        prNumber: { type: integer }
        prUrl: { type: string }
        assignees:
          type: array
          description: Git host usernames the pull request is (or will be) assigned to
          items: { type: string }
        afterApprove: { type: string, enum: [pr, main] }
        held: { type: boolean, description: Kept in the queue until started }
        askFirst: { type: boolean }
        kind: { $ref: '#/components/schemas/TicketKind' }
        kindAuto: { type: boolean, description: 'agnts picks the kind; the analysis may still change it' }
        postReport: { type: boolean, description: 'The approved report is posted to the tracker issue' }
        parentKey: { type: string, description: 'The plan or bug investigation this ticket implements' }
        followUpOf: { type: string, description: 'The ticket that suggested this one as a follow-up' }
        suggestFollowUps: { $ref: '#/components/schemas/FollowUpsMode' }
        openSuggestions: { type: integer, description: 'Follow-up suggestions waiting for a decision' }
        blockedBy:
          type: array
          description: >-
            The tickets holding this one's coding back right now (it is in
            coding with no commit yet). Absent when nothing does.
          items: { $ref: '#/components/schemas/Blocker' }
        repoName: { type: string }
        models: { $ref: '#/components/schemas/ModelOverrides' }
        since: { type: string, format: date-time, description: When the ticket entered its current state }
        stopReason: { type: string, description: Why it failed or paused }
        mergedAt: { type: string, format: date-time }
        learnState:
          type: string
          enum: [none, pending, done, failed]
          description: The learn run after push; pending also while it runs
        reviewState:
          type: string
          enum: [none, pending, running, done, failed]
          description: The code review agnts runs beside the human review
        previewState:
          type: string
          enum: [none, pending, running, done, failed]
          description: The screenshots agnts takes beside the human review
        previewCompare: { type: boolean, description: Previews of this ticket also capture the default branch (before shots) }
        canPreview: { type: boolean, description: The ticket's repository has a preview command }
        spend: { $ref: '#/components/schemas/TokenSpend' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TokenSpend:
      type: object
      description: >-
        Tokens Claude used (on a ticket: all its runs; absent until one is
        recorded). costUsd is what Claude Code reports the same work
        would cost on the API; on a Claude plan it is an estimate, not a charge.
      required: [input, output, cacheRead, cacheWrite, total, costUsd]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        cacheWrite: { type: integer, format: int64 }
        total: { type: integer, format: int64, description: All four counts added }
        costUsd: { type: number, format: double }

    TicketSpendList:
      type: object
      required: [days, total, tickets]
      properties:
        days: { type: integer }
        total: { $ref: '#/components/schemas/TokenSpend' }
        tickets:
          type: array
          description: Costliest first; partial runs have no cost, so ties fall back to tokens
          items: { $ref: '#/components/schemas/TicketSpendRow' }

    TicketSpendRow:
      type: object
      description: One ticket's spend within the period (not its lifetime spend)
      required: [key, title, kind, state, calls, topStage, spend]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { $ref: '#/components/schemas/TicketKind' }
        state: { $ref: '#/components/schemas/TicketState' }
        repoName: { type: string }
        calls: { type: integer, description: Claude invocations in the period }
        topStage:
          type: string
          enum: [analyze, coding, retry, helper, learn, review, preview]
          description: The stage that cost the most
        spend: { $ref: '#/components/schemas/TokenSpend' }

    StageSpend:
      type: object
      description: Spend for one stage and model; on a ticket, in the order the stage first ran
      required: [stage, model, calls, turns, partial, spend]
      properties:
        stage:
          type: string
          enum: [analyze, coding, retry, helper, learn, review, preview]
          description: 'retry is fix attempts after failed checks and requested changes'
        model: { type: string }
        calls: { type: integer, description: Claude invocations }
        turns: { type: integer }
        partial:
          type: boolean
          description: A run was cut off, so its tokens are counted from the messages seen and its cost is unknown
        spend: { $ref: '#/components/schemas/TokenSpend' }

    Question:
      type: object
      required: [id, position, text, options, multiple, note]
      properties:
        id: { type: integer, format: int64 }
        position: { type: integer }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        multiple:
          type: boolean
          description: Several options may be chosen; the answer then lists the chosen ones, one per line
        answer: { type: string }
        note: { type: string }

    Attachment:
      type: object
      required: [id, name, contentType, size, purpose, url, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, description: Bytes }
        purpose:
          type: string
          enum: [pending, ticket, answer, retry, feedback]
          description: 'pending = uploaded, not attached yet; ticket = the task description; answer = an answer (see questionId); retry = a retry note; feedback = requested changes'
        questionId: { type: integer, format: int64 }
        image: { type: boolean, description: 'A picture clients can show in place' }
        url: { type: string, description: 'Where to load the file, relative to the API base' }
        createdAt: { type: string, format: date-time }

    Analysis:
      type: object
      required: [summary, plan]
      properties:
        summary: { type: string }
        plan:
          type: array
          items: { type: string }
        complexity:
          type: string
          enum: [simple, complex]
          description: The analysis's rating; picks the review model on auto
        footprint: { $ref: '#/components/schemas/Footprint' }

    Finding:
      type: object
      required: [severity, category, title]
      properties:
        severity: { type: string, enum: [blocker, major, minor, nit] }
        category:
          type: string
          enum: [correctness, security, performance, tests, rules, maintainability, accuracy, completeness, other]
        file: { type: string, description: Path relative to the repository }
        line: { type: integer }
        title: { type: string }
        detail: { type: string }
        suggestion: { type: string, description: 'What to change, written to be sent back as feedback' }

    CodeReview:
      type: object
      required: [revision, model, modelReason, verdict, summary, findings, strengths, createdAt]
      description: >-
        agnts's review of the latest result, advice beside the human review.
        It reviewed an older revision when revision is below the ticket's.
      properties:
        revision: { type: integer }
        model: { $ref: '#/components/schemas/Model' }
        modelReason: { type: string, description: Why this model reviewed it }
        verdict: { type: string, enum: [looks_good, has_concerns, needs_changes] }
        summary: { type: string }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        strengths:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    ShotRef:
      type: object
      required: [runId, shotId]
      properties:
        runId: { type: integer, format: int64 }
        shotId: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }

    PreviewInput:
      type: object
      properties:
        compare: { type: boolean, description: Also capture the default branch; kept for later previews of the ticket }

    PreviewShot:
      type: object
      required: [id, name, route, viewport, side, url]
      properties:
        id: { type: string }
        name: { type: string }
        route: { type: string }
        viewport: { type: string, enum: [desktop, phone] }
        side: { type: string, enum: [after, before] }
        note: { type: string }
        width: { type: integer }
        height: { type: integer }
        consoleErrors: { type: integer }
        url: { type: string, description: 'Where to load the PNG, relative to the API base' }

    PreviewIssue:
      type: object
      required: [severity, description]
      properties:
        severity: { type: string, enum: [high, medium, low] }
        description: { type: string }
        shotId: { type: string }

    TicketPreview:
      type: object
      required: [runId, revision, model, compare, status, summary, shots, issues, createdAt]
      description: >-
        Screenshots of the running app at the latest result, advice beside
        the human review. It shows an older revision when revision is below
        the ticket's.
      properties:
        runId: { type: integer, format: int64 }
        revision: { type: integer }
        model: { $ref: '#/components/schemas/Model' }
        compare: { type: boolean, description: Before shots were taken too }
        status: { type: string, enum: [ok, partial, failed], description: 'failed: the app did not start' }
        summary: { type: string }
        shots:
          type: array
          items: { $ref: '#/components/schemas/PreviewShot' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/PreviewIssue' }
        createdAt: { type: string, format: date-time }

    CheckStep:
      type: object
      required: [name, command, exitCode, durationMs]
      properties:
        name: { type: string }
        command: { type: string }
        exitCode: { type: integer }
        durationMs: { type: integer, format: int64 }
        timedOut: { type: boolean }
        output: { type: string }

    FileChange:
      type: object
      required: [path, add, del, diff]
      properties:
        path: { type: string }
        add: { type: integer }
        del: { type: integer }
        diff: { type: string }

    Result:
      type: object
      required: [summary, notes, checks, files, createdAt]
      properties:
        summary: { type: string }
        notes:
          type: array
          items: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/CheckStep' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileChange' }
        report: { type: string, description: 'The Markdown report, for report kinds' }
        createdAt: { type: string, format: date-time }

    TicketDetail:
      type: object
      required: [ticket, questions, attachments]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        attachments:
          type: array
          description: Files attached to the task, its answers and retry notes, oldest first
          items: { $ref: '#/components/schemas/Attachment' }
        analysis: { $ref: '#/components/schemas/Analysis' }
        result: { $ref: '#/components/schemas/Result' }
        childKey: { type: string, description: 'The code task that implements this report, if any' }
        followUps: { $ref: '#/components/schemas/FollowUps' }
        relations: { $ref: '#/components/schemas/Relations' }
        review: { $ref: '#/components/schemas/CodeReview' }
        preview: { $ref: '#/components/schemas/TicketPreview' }
        history:
          type: array
          items: { $ref: '#/components/schemas/HistoryItem' }
        maxTurns: { type: integer }
        effectiveModels: { $ref: '#/components/schemas/StageModels' }
        spendByStage:
          type: array
          description: Empty until a Claude run is recorded
          items: { $ref: '#/components/schemas/StageSpend' }

    Event:
      type: object
      required: [id, ticketKey, step, type, level, origin, message, data, createdAt]
      properties:
        id: { type: integer, format: int64 }
        ticketKey: { type: string }
        runId: { type: integer, format: int64 }
        step: { type: string }
        type: { type: string }
        level: { type: string, enum: [debug, info, warn, error] }
        origin: { type: string, enum: [system, web, mobile, mcp, telegram, webhook] }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
        durationMs: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    AnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, format: int64 }
              answer: { type: string, minLength: 1, maxLength: 5000, description: 'For a multiple-choice question, the chosen options, one per line' }
              note: { type: string, maxLength: 5000 }
              attachments:
                type: array
                maxItems: 10
                description: Uploads to attach to this answer
                items: { type: integer, format: int64 }

    Model:
      type: string
      enum: [haiku, sonnet, opus]

    ReviewModel:
      type: string
      enum: [auto, haiku, sonnet, opus]
      description: 'auto: opus for complex tickets, sonnet otherwise'

    StageModels:
      type: object
      required: [analyze, coding, retry, helper]
      properties:
        analyze: { $ref: '#/components/schemas/Model' }
        coding: { $ref: '#/components/schemas/Model' }
        retry: { $ref: '#/components/schemas/Model' }
        helper: { $ref: '#/components/schemas/Model' }
        learn: { $ref: '#/components/schemas/Model' }
        review: { $ref: '#/components/schemas/ReviewModel' }
        preview: { $ref: '#/components/schemas/Model' }

    TicketRepo:
      type: object
      required: [repoId]
      properties:
        repoId: { type: integer, format: int64 }

    ModelOverrides:
      type: object
      properties:
        analyze: { $ref: '#/components/schemas/Model' }
        coding: { $ref: '#/components/schemas/Model' }
        retry: { $ref: '#/components/schemas/Model' }
        review: { $ref: '#/components/schemas/Model' }
        preview: { $ref: '#/components/schemas/Model' }

    HistoryItem:
      type: object
      required: [at, state, message, origin]
      properties:
        at: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/TicketState' }
        message: { type: string }
        origin: { type: string }

    TaskCreate:
      type: object
      required: [title, priority, afterApprove, start]
      properties:
        repoId: { type: integer, format: int64, description: 'Omit for a task without a repository (report kinds or auto)' }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, medium, high] }
        afterApprove: { type: string, enum: [pr, main] }
        start:
          type: string
          enum: [ask, code, queue]
          description: ask = analyse and ask first, code = no questions, queue = keep until started
        followUps: { $ref: '#/components/schemas/FollowUpsMode' }
        attachments:
          type: array
          maxItems: 10
          description: Uploads to attach to the description
          items: { type: integer, format: int64 }

    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, medium, high] }
        afterApprove: { type: string, enum: [pr, main] }
        kind: { $ref: '#/components/schemas/TicketKindChoice' }
        attachments:
          type: array
          maxItems: 10
          description: 'The files the description should have: the task''s files to keep and new uploads. Left out keeps them; files not listed are deleted.'
          items: { type: integer, format: int64 }

    EventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        nextBefore: { type: integer, format: int64 }

    StepDuration:
      type: object
      required: [state, count]
      properties:
        state: { $ref: '#/components/schemas/TicketState' }
        avgMs: { type: integer, format: int64 }
        count: { type: integer }

    EventSummary:
      type: object
      required: [runsStarted, reachedReview, avgTurns, stops, errors, steps]
      properties:
        runsStarted: { type: integer }
        reachedReview: { type: integer }
        avgTurns: { type: integer }
        stops: { type: integer }
        errors: { type: integer }
        steps:
          type: array
          items: { $ref: '#/components/schemas/StepDuration' }

    UsageWindow:
      type: object
      properties:
        utilization: { type: number, format: double, description: 0 to 1 }
        resetsAt: { type: string, format: date-time }

    Usage:
      type: object
      required: [fiveHour, sevenDay, status, paused, pauseAbove, refreshing]
      properties:
        fiveHour: { $ref: '#/components/schemas/UsageWindow' }
        sevenDay: { $ref: '#/components/schemas/UsageWindow' }
        status: { type: string, enum: [allowed, allowed_warning, rejected, unknown] }
        updatedAt: { type: string, format: date-time }
        paused: { type: boolean, description: New runs are held back }
        pausedUntil: { type: string, format: date-time }
        pauseAbove: { type: integer }
        refreshing: { type: boolean }

    GitSettings:
      type: object
      required: [authorName, authorEmail, coAuthor, prTitle, draft]
      properties:
        authorName: { type: string, maxLength: 200 }
        authorEmail: { type: string, maxLength: 200 }
        coAuthor: { type: boolean, description: Add a Co-authored-by agnts line }
        prTitle: { type: string, maxLength: 200, description: '{key} and {title} are replaced' }
        draft: { type: boolean }

    Settings:
      type: object
      required: [models, maxTurns, timeoutMin, allow, deny, askFirst, autoResume, pauseAbove, parallel, git]
      properties:
        models: { $ref: '#/components/schemas/StageModels' }
        maxTurns: { type: integer, minimum: 20, maximum: 200 }
        timeoutMin: { type: integer, minimum: 10, maximum: 120 }
        allow:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
        deny:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
        askFirst: { type: boolean }
        autoResume: { type: boolean }
        autoLearn: { type: boolean, description: Learn from every pushed ticket }
        autoReview: { type: boolean, description: Review every result while it waits for review }
        autoPreview: { type: boolean, description: Take screenshots of every UI change in repositories with a preview command }
        visualCheck: { type: boolean, description: Coding runs may start the app and look at the pages they changed }
        egressAllow:
          type: array
          maxItems: 50
          description: 'Hosts run containers may reach besides the built-in list, such as a staging API; .example.com matches subdomains'
          items: { type: string, maxLength: 253 }
        suggestFollowUps: { type: boolean, description: 'Runs suggest follow-up tickets (off by default; a ticket can override it)' }
        pauseAbove: { type: integer, minimum: 50, maximum: 100 }
        parallel: { type: integer, minimum: 1, maximum: 3 }
        git: { $ref: '#/components/schemas/GitSettings' }
        notify: { $ref: '#/components/schemas/NotifySettings' }

    NotifySettings:
      type: object
      required: [push, telegram, needsYou, stopped, done]
      properties:
        push: { type: boolean }
        telegram: { type: boolean }
        needsYou: { type: boolean }
        stopped: { type: boolean }
        done: { type: boolean }
        lessons: { type: boolean, description: New lessons were found }
        review: { type: boolean, description: A code review finished }
        preview: { type: boolean, description: Preview screenshots are ready }
        previewPhotos: { type: boolean, description: Send phone screenshots to Telegram with the message }
        followUps: { type: boolean, description: Follow-up tickets were suggested }

    Repository:
      type: object
      required: [id, name, kind, provider, cloneUrl, defaultBranch, buildCmd, lintCmd, testCmd, branchPrefix, taskPrefix, instructions, jiraProject, claudeMd, openTickets]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [jira, plane, side]
          description: jira when the repository has a Jira project key, plane when it has only a Plane project, else side. Every repository takes side-project tasks.
        provider: { type: string, enum: [github, gitlab] }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        buildCmd: { type: string }
        lintCmd: { type: string }
        testCmd: { type: string }
        branchPrefix: { type: string }
        taskPrefix: { type: string }
        instructions: { type: string, description: Extra instructions added to every prompt }
        jiraProject: { type: string }
        planeProject: { type: string, description: 'Plane project identifier (WEB in WEB-123); empty when not linked' }
        claudeMd: { type: string, enum: [found, missing, unknown] }
        openTickets: { type: integer }
        deployWorkflow: { type: string }
        archivedAt: { type: string, format: date-time, description: Set while the repository is archived }
        preview: { $ref: '#/components/schemas/RepoPreview' }
        stack: { type: string, description: 'Toolchain names, comma-separated (go,node)' }
        toolchains:
          type: array
          description: Installed into every run container
          items: { $ref: '#/components/schemas/Toolchain' }
        toolchainsOverride: { type: boolean, description: Set by a person; detection leaves them alone }
        toolchainsDetectedAt: { type: string, format: date-time }
        toolchainNotes:
          type: array
          description: What detection could not handle
          items: { type: string }
        runnerImage: { type: string, description: 'Custom runner image (built FROM agnts-runner); empty uses the default' }
        memoryMb: { type: integer, description: 'Run container memory; 0 uses the server default' }
        buildEnvSet: { type: boolean }
        buildEnvNames:
          type: array
          description: Names of the build environment variables; the values are never returned
          items: { type: string }

    RepositoryInput:
      type: object
      required: [name, cloneUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind:
          type: string
          enum: [jira, plane, side]
          deprecated: true
          description: Ignored; derived from jiraProject and planeProject.
        cloneUrl: { type: string, minLength: 1, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 100 }
        buildCmd: { type: string, maxLength: 500 }
        lintCmd: { type: string, maxLength: 500 }
        testCmd: { type: string, maxLength: 500 }
        branchPrefix: { type: string, maxLength: 50 }
        taskPrefix: { type: string, maxLength: 8 }
        instructions: { type: string, maxLength: 20000 }
        jiraProject: { type: string, maxLength: 20 }
        planeProject: { type: string, maxLength: 12 }
        deployWorkflow: { type: string, maxLength: 200, description: 'GitHub workflow file run by Deploy, e.g. deploy.yml' }
        preview: { $ref: '#/components/schemas/RepoPreviewInput' }
        toolchains:
          type: array
          maxItems: 12
          description: Absent keeps the stored list
          items: { $ref: '#/components/schemas/Toolchain' }
        toolchainsOverride: { type: boolean, description: 'true: these toolchains were set by hand; detection keeps them' }
        runnerImage: { type: string, maxLength: 255 }
        memoryMb: { type: integer, minimum: 0, maximum: 65536 }
        buildEnv:
          type: string
          maxLength: 16384
          description: 'KEY=value lines given to every run (registry tokens); replaces the stored one, "" clears it, absent keeps it'

    Toolchain:
      type: object
      required: [tool, version]
      description: A language runtime or build tool, installed with mise as tool@version
      properties:
        tool: { type: string, maxLength: 40, description: 'mise tool name: go, node, python, rust, java, dotnet, ruby, ...' }
        version: { type: string, maxLength: 64, description: 'Exact, a prefix (20, 3.12), latest, lts or system' }
        source: { type: string, description: 'Where it was found: go.mod, .nvmrc, default, manual' }
        dir: { type: string, description: Subdirectory it was found in }

    RepoDetectInput:
      type: object
      properties:
        id: { type: integer, format: int64, description: A saved repository; the other fields are then optional }
        cloneUrl: { type: string, maxLength: 500 }
        defaultBranch: { type: string, maxLength: 100 }
        deep: { type: boolean, description: Ask Claude when the file scan finds no commands }

    RepoDetection:
      type: object
      required: [toolchains, buildCmd, lintCmd, testCmd, notes, stack, source]
      properties:
        toolchains:
          type: array
          items: { $ref: '#/components/schemas/Toolchain' }
        buildCmd: { type: string }
        lintCmd: { type: string }
        testCmd: { type: string }
        notes:
          type: array
          items: { type: string }
        stack: { type: string }
        source: { type: string, enum: [files, claude], description: Whether Claude filled in what the file scan could not }

    RepoPreview:
      type: object
      required: [command, port, readyPath, routes, uiPaths, login, envSet, envNames]
      description: How agnts starts the app to take screenshots; an empty command turns previews off
      properties:
        command: { type: string }
        port: { type: integer }
        readyPath: { type: string }
        routes:
          type: array
          items: { type: string }
        uiPaths:
          type: array
          items: { type: string }
        login: { type: string }
        envSet: { type: boolean }
        envNames:
          type: array
          description: The names of the variables in the environment; the values are never returned
          items: { type: string }

    RepoPreviewInput:
      type: object
      properties:
        command: { type: string, maxLength: 1000 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        readyPath: { type: string, maxLength: 300 }
        routes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        uiPaths:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 300 }
        login: { type: string, maxLength: 2000 }
        env:
          type: string
          maxLength: 16384
          description: 'KEY=value lines; replaces the stored environment, "" clears it, absent keeps it'

    RepoMember:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        name: { type: string }
        avatarUrl: { type: string }
        url: { type: string, description: Profile page on the git host }
        role: { type: string, description: 'The host''s role name, e.g. admin, write (GitHub) or Maintainer, Developer (GitLab)' }

    RemoteRepository:
      type: object
      required: [fullName, cloneUrl, defaultBranch, private, added]
      properties:
        fullName: { type: string, description: 'owner/name, or group/sub/project on GitLab' }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        description: { type: string }
        updatedAt: { type: string, format: date-time }
        added: { type: boolean, description: Already added to agnts }

    Integration:
      type: object
      required: [provider, connected, settings]
      properties:
        provider: { type: string }
        connected: { type: boolean }
        checkedAt: { type: string, format: date-time }
        account: { type: string }
        tokenHint: { type: string, description: Last four characters }
        lastError: { type: string }
        settings:
          type: object
          additionalProperties: { type: string }
        webhookUrl: { type: string }
        webhookSecret: { type: string, description: 'GitHub and GitLab: secret to enter in the webhook settings' }
        webhookSecretSet: { type: boolean, description: 'Plane: a webhook secret is stored (deliveries are accepted)' }

    PlaneState:
      type: object
      required: [name, group, projects]
      properties:
        name: { type: string }
        group: { type: string, enum: [backlog, unstarted, started, completed, cancelled, triage] }
        projects:
          type: array
          description: Identifiers of the linked projects that have this state
          items: { type: string }

    ConnectResult:
      type: object
      required: [integration]
      properties:
        integration: { $ref: '#/components/schemas/Integration' }
        webhookSecret: { type: string, description: Shown once; paste it into the provider's webhook settings }

    DashboardCounts:
      type: object
      required: [needs, answers, reviews, stopped, running, queued]
      properties:
        needs: { type: integer }
        answers: { type: integer }
        reviews: { type: integer }
        stopped: { type: integer }
        running: { type: integer }
        queued: { type: integer }

    LiveRun:
      type: object
      required: [ticket, model, turns, maxTurns, lastMessage]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        model: { type: string }
        turns: { type: integer }
        maxTurns: { type: integer }
        lastMessage: { type: string }

    HourBucket:
      type: object
      required: [hour, agnts, you, problems]
      properties:
        hour: { type: integer }
        agnts: { type: integer }
        you: { type: integer }
        problems: { type: integer }

    WeekStats:
      type: object
      required: [picked, pushed, firstTryPct, avgTurns, avgWaitMin, stopped]
      properties:
        picked: { type: integer }
        pushed: { type: integer }
        firstTryPct: { type: integer }
        avgTurns: { type: integer }
        avgWaitMin: { type: integer }
        stopped: { type: integer }

    RepoActivity:
      type: object
      required: [repo, open]
      properties:
        repo: { $ref: '#/components/schemas/Repository' }
        open: { type: integer }
        latest: { $ref: '#/components/schemas/Ticket' }

    Dashboard:
      type: object
      required: [counts, waiting, live, pipeline, todayByHour, week, lastWeek, repos, recent, usage, parallel]
      properties:
        counts: { $ref: '#/components/schemas/DashboardCounts' }
        waiting:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        live:
          type: array
          items: { $ref: '#/components/schemas/LiveRun' }
        pipeline:
          type: object
          additionalProperties: { type: integer }
          description: Open tickets per state
        todayByHour:
          type: array
          items: { $ref: '#/components/schemas/HourBucket' }
        week: { $ref: '#/components/schemas/WeekStats' }
        lastWeek: { $ref: '#/components/schemas/WeekStats' }
        repos:
          type: array
          items: { $ref: '#/components/schemas/RepoActivity' }
        recent:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        usage: { $ref: '#/components/schemas/Usage' }
        parallel: { type: integer }

    DeviceRegistration:
      type: object
      required: [platform, fcmToken]
      properties:
        platform: { type: string, enum: [ios, android] }
        fcmToken: { type: string, minLength: 1, maxLength: 4096 }
        appVersion: { type: string, maxLength: 50 }

    McpStatus:
      type: object
      required: [url, staticToken, connections]
      properties:
        url: { type: string, description: The connector URL to add in Claude }
        staticToken: { type: boolean }
        connections: { type: integer, description: Claude connections authorised with OAuth }

    CI:
      type: string
      enum: [ok, fail, run, pending, manual, skip, canceled, none]

    Branch:
      type: object
      required: [name, default, sha, message, author, ahead, behind, ci]
      properties:
        name: { type: string }
        default: { type: boolean }
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        ahead: { type: integer }
        behind: { type: integer }
        ci: { $ref: '#/components/schemas/CI' }
        ticketKey: { type: string }

    LocalBranch:
      type: object
      required: [name, sha, message, author, ahead, behind, status, unpushed]
      properties:
        name: { type: string }
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        ahead: { type: integer, description: Commits not on the default branch }
        behind: { type: integer, description: Default branch commits the branch lacks }
        status:
          type: string
          enum: [local, pushed, unpushed, differs]
          description: 'local: not on origin; pushed: origin has the same commit; unpushed: origin is behind; differs: origin has commits the local branch lacks'
        unpushed: { type: integer, description: Commits origin lacks (status unpushed) }
        ticketKey: { type: string }

    Commit:
      type: object
      required: [sha, message, author, add, del, ci]
      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        date: { type: string, format: date-time }
        add: { type: integer }
        del: { type: integer }
        ci: { $ref: '#/components/schemas/CI' }
        url: { type: string }
        ticketKey: { type: string }

    Stage:
      type: object
      required: [id, name, status, durationMs, manual]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/CI' }
        durationMs: { type: integer, format: int64 }
        manual: { type: boolean }

    Pipeline:
      type: object
      required: [id, name, branch, sha, message, trigger, status, durationMs, url, stages]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        branch: { type: string }
        sha: { type: string }
        message: { type: string }
        trigger: { type: string }
        status: { $ref: '#/components/schemas/CI' }
        created: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        url: { type: string }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }

    Environment:
      type: object
      required: [name, sha, url]
      properties:
        name: { type: string }
        sha: { type: string }
        deployedAt: { type: string, format: date-time }
        url: { type: string }

    PeriodStats:
      type: object
      required: [picked, pushed, rejected, stopped, firstTry, afterChanges, agntsMin, waitMin, reviewMin, answerMin, turns, spend]
      properties:
        picked: { type: integer }
        pushed: { type: integer }
        rejected: { type: integer }
        stopped: { type: integer }
        firstTry: { type: integer }
        afterChanges: { type: integer }
        agntsMin: { type: number }
        waitMin: { type: number }
        reviewMin: { type: number }
        answerMin: { type: number }
        turns: { type: number }
        spend: { $ref: '#/components/schemas/TokenSpend' }

    DayStat:
      type: object
      required: [date, picked, pushed, rejected, stopped, agntsMin, waitMin, turns, spend]
      properties:
        date: { type: string, format: date }
        picked: { type: integer }
        pushed: { type: integer }
        rejected: { type: integer }
        stopped: { type: integer }
        agntsMin: { type: number }
        waitMin: { type: number }
        turns: { type: number }
        peakUsage: { type: number }
        spend: { $ref: '#/components/schemas/TokenSpend' }

    Analytics:
      type: object
      required: [days, current, previous, perDay, steps, stops, models, repos, hours, insights, spendByStage]
      properties:
        days: { type: integer }
        current: { $ref: '#/components/schemas/PeriodStats' }
        previous: { $ref: '#/components/schemas/PeriodStats' }
        perDay:
          type: array
          items: { $ref: '#/components/schemas/DayStat' }
        steps:
          type: object
          additionalProperties: { type: number }
          description: Average minutes per state
        stops:
          type: object
          additionalProperties: { type: integer }
          description: 'Stopped runs by reason: tests, limit, you, turns, other'
        models:
          type: array
          items:
            type: object
            required: [model, runs, reachedReview, avgTurns]
            properties:
              model: { type: string }
              runs: { type: integer }
              reachedReview: { type: integer }
              avgTurns: { type: number }
        repos:
          type: array
          items:
            type: object
            required: [repoId, name, kind, claudeMd, tickets, done, finished, avgTurns, agntsMin]
            properties:
              repoId: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              claudeMd: { type: string }
              tickets: { type: integer }
              done: { type: integer }
              finished: { type: integer }
              avgTurns: { type: number }
              agntsMin: { type: number }
        hours:
          type: array
          items: { type: integer }
          description: agnts's events per hour of day (server time zone)
        spendByStage:
          type: array
          items: { $ref: '#/components/schemas/StageSpend' }
          description: Spend of every ticket in the period by stage and model, costliest first
        insights:
          type: array
          items:
            type: object
            required: [kind, values]
            properties:
              kind: { type: string, enum: [claudeMd, waiting, stopsTests, stopsLimit, night] }
              values:
                type: object
                additionalProperties: { type: string }

    LessonCategory:
      type: string
      enum: [pattern, architecture, algorithm, library, language, testing, security, performance, tooling, other]

    LessonLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    LessonBrief:
      type: object
      required: [id, repoId, repoName, ticketKey, slug, title, category, level, summary, quizCount, readMinutes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        ticketKey: { type: string }
        slug: { type: string, description: 'Concept id, unique per repository' }
        title: { type: string }
        category: { $ref: '#/components/schemas/LessonCategory' }
        level: { $ref: '#/components/schemas/LessonLevel' }
        summary: { type: string }
        quizCount: { type: integer }
        readMinutes: { type: integer, description: 'Estimated minutes to read the lesson and take its quiz' }
        learnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    LearnQueueItem:
      type: object
      required: [key, title, repoName, status, lessons, updatedAt]
      properties:
        key: { type: string }
        title: { type: string }
        repoName: { type: string }
        status:
          type: string
          enum: [running, pending, failed, none]
          description: 'none: the ticket was never learned from'
        lessons: { type: integer, description: Lessons it produced so far }
        updatedAt: { type: string, format: date-time }

    LessonList:
      type: object
      required: [items, total, unlearned]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LessonBrief' }
        total: { type: integer, description: 'All lessons, ignoring filters' }
        unlearned: { type: integer, description: 'Lessons not learned yet, ignoring filters' }

    LessonRef:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Relative to the repository root }
        line: { type: integer }
        note: { type: string }

    QuizQuestion:
      type: object
      required: [question, options, answer]
      properties:
        question: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: integer, description: Index of the correct option }
        explanation: { type: string }

    Link:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string, description: Always https }

    Lesson:
      type: object
      required: [id, repoId, repoName, ticketKey, slug, title, category, level, summary, explanation, whyHere, refs, quiz, reading, readMinutes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64 }
        repoName: { type: string }
        ticketKey: { type: string }
        slug: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/LessonCategory' }
        level: { $ref: '#/components/schemas/LessonLevel' }
        summary: { type: string }
        explanation: { type: string, description: 'Plain text; paragraphs are separated by blank lines' }
        whyHere: { type: string, description: Why this change needed it }
        readMinutes: { type: integer, description: 'Estimated minutes to read the lesson and take its quiz' }
        refs:
          type: array
          items: { $ref: '#/components/schemas/LessonRef' }
        quiz:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        reading:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        learnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RuleStatus:
      type: string
      enum: [pending, analyzing, questions, ready, failed]
      description: 'Where Claude''s review stands. Tickets follow a rule only when it is ready and enabled.'

    RuleQuestion:
      type: object
      required: [index, text, options, round]
      properties:
        index: { type: integer, description: Position in the rule's questions; answers refer to it }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        answer: { type: string, description: Empty while the question is open }
        note: { type: string }
        round: { type: integer, description: The review round that asked it }

    Rule:
      type: object
      required: [id, title, body, enabled, status, interpretation, clarified, text, questions, rounds, error, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        repoId: { type: integer, format: int64, description: Absent for a global rule }
        repoName: { type: string }
        title: { type: string }
        body: { type: string, description: The rule as written }
        enabled: { type: boolean }
        status: { $ref: '#/components/schemas/RuleStatus' }
        interpretation: { type: string, description: 'What Claude will do because of the rule' }
        clarified: { type: string, description: 'The rule rewritten with what the answers settled; empty when used as written' }
        text: { type: string, description: What tickets are given }
        questions:
          type: array
          items: { $ref: '#/components/schemas/RuleQuestion' }
        rounds: { type: integer, description: Question rounds so far }
        error: { type: string, description: Why the last review failed }
        analyzedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RuleInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        repoId: { type: integer, format: int64, description: Leave out for a rule every repository follows }
        enabled: { type: boolean, default: true }

    RuleAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, answer]
            properties:
              index: { type: integer, minimum: 0 }
              answer: { type: string, maxLength: 2000 }
              note: { type: string, maxLength: 2000 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. unauthorized, bad_request
        message: { type: string }

  responses:
    BadGateway:
      description: The git host returned an error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TicketOK:
      description: The ticket after the change
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ticket' }
    NotFound:
      description: No such ticket
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not allowed in the ticket's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not signed in, or the credentials are wrong
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit hit; retry later
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
