  if(act === "analytics"){ view.page = "analytics"; render(); window.scrollTo(0,0); return; }
  if(act === "export-csv"){ toast("CSV export works in the real app"); return; }
  if(act === "logs"){ view.page = "logs"; render(); window.scrollTo(0,0); return; }
  if(act === "open-logs"){ logView = {...logView, type:"all", key:a.dataset.key, errors:false, limit:60}; view.page = "logs"; render(); window.scrollTo(0,0); return; }
  if(act === "errors-only"){ logView.errors = !logView.errors; render(); return; }
  if(act === "clear-log-filters"){ logView = {...logView, type:"all", key:"", errors:false, limit:60}; render(); return; }
  if(act === "more-logs"){ logView.limit += 60; render(); return; }
  if(act === "export"){
    const data = JSON.stringify(filteredEvents().map(e=>({...e, time:new Date(e.ts).toISOString(), detail: e.detail ? JSON.parse(e.detail) : null})), null, 2);
    if(navigator.clipboard){ navigator.clipboard.writeText(data).then(()=>toast(`Copied ${filteredEvents().length} events as JSON`), ()=>toast("Copy failed. In the real app this downloads a file")); }
    else toast("In the real app this downloads a JSON file");
    return;
  }
  if(act === "tasks"){ view.page = "tasks"; render(); window.scrollTo(0,0); return; }
  if(act === "new-task"){ openDrawer("task", {project: view.project!=="all" ? view.project : projects[0].id, title:"", desc:"", priority:"Medium", after:"main", start:"ask"}); return; }
  if(act === "add-project"){ openDrawer("project", {name:"", repo:"", prefix:"", test:"make test"}); return; }
  if(act === "drawer-close"){ closeDrawer(); return; }
  if(act === "save-project"){
    const d = drawer.data, name = d.name.trim(), repo = d.repo.trim();
    const prefix = (d.prefix.trim() || name.replace(/[^A-Za-z]/g,"").slice(0,3)).toUpperCase();
    if(!name || !repo){ drawer.err = "Add a name and a clone URL."; renderDrawer(); return; }
    if(projects.some(p=>p.prefix===prefix)){ drawer.err = `The prefix ${prefix} is already used. Pick another one.`; renderDrawer(); return; }
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-" + Date.now().toString(36).slice(-3);
    const colors = ["#0F766E","#B45309","#BE185D","#4D7C0F","#1D4ED8","#9333EA"];
    const repoName = repo.split("/").pop().replace(/\.git$/,"") || repo;
    projects.push({id, name, repo:repoName, prefix, next:1, color:colors[projects.length % colors.length], test:d.test.trim() || "make test"});
    const back = drawer.back; drawer = back;
    if(drawer){ drawer.data.project = id; renderDrawer(); } else renderDrawer();
    render(); toast(`Repository ${name} added`); return;
  }
  if(act === "save-task"){
    const d = drawer.data, title = d.title.trim();
    if(!title){ drawer.err = "Give the task a title."; renderDrawer(); document.getElementById("f-title").focus(); return; }
    if(drawer.edit){
      const t = find(drawer.edit); Object.assign(t, {title, desc:d.desc.trim(), priority:d.priority, after:d.after}); t.history.push([now(),"You edited the task","you"]);
      drawer = null; renderDrawer(); render(); toast("Task updated"); return;
    }
    const p = projects.find(x=>x.id===d.project);
    const t = {key:`${p.prefix}-${p.next++}`, source:"local", project:p.id, title, desc:d.desc.trim(), priority:d.priority, repo:p.repo, after:d.after, updated:now(),
      state:"new", revision:1, turns:0, duration:"", plan:[], questions:[], result:null, history:[[now(),"You created this task","you"]]};
    tickets.unshift(t); drawer = null; renderDrawer();
    view.from = "tasks"; view.page = "detail"; view.key = t.key;
    if(d.start === "ask") analyze(t);
    else if(d.start === "code"){ setState(t, "coding", "Started without questions", "you"); code(t); }
    render(); window.scrollTo(0,0); toast(`${t.key} created`); return;
  }
  if(act === "refresh"){ usage.updatedAt = Date.now(); render(); toast("Plan usage refreshed"); return; }
  if(act === "sync"){ toast("Synced. No new tickets with the hiro label"); return; }
  if(act === "docs"){ docsOpen = true; renderDocs(); return; }
  if(act === "docs-close"){ docsOpen = false; renderDocs(); const g = document.querySelector(".guide-btn"); if(g) g.focus(); return; }
  if(act === "lang-toggle"){ setLangOpen(!langOpen, !langOpen && e.detail === 0); return; }
  if(act === "theme"){ prefs.theme = effectiveTheme() === "dark" ? "light" : "dark"; savePrefs(); applyTheme(); if(view.page==="settings") render(); toast(prefs.theme === "dark" ? "Night mode on" : "Day mode on"); return; }
  if(act === "repos"){ view.page = "repos"; render(); window.scrollTo(0,0); return; }
  if(act === "settings"){ view.page = "settings"; draftSettings = null; render(); window.scrollTo(0,0); return; }
  if(act === "add-repo"){ openDrawer("repo", {kind:"jira", name:"", url:"", jira:"PAY", branch:"main", build:"go build ./...", lint:"golangci-lint run", test:"go test ./...", claudeMd:false}); return; }
  if(act === "save-repo"){
    const d = drawer.data;
    if(d.kind!=="side" && !(d.name||"").trim()){ drawer.err = "Give the repository a name."; renderDrawer(); return; }
    if(!(d.url||"").trim()){ drawer.err = "Add a clone URL."; renderDrawer(); return; }
    if(d.kind==="side"){ const p = projects.find(x=>"p:"+x.id===drawer.edit); Object.assign(p, {url:d.url, branch:d.branch, build:d.build, lint:d.lint, test:d.test}); }
    else if(drawer.edit){ Object.assign(repos.find(r=>r.id===drawer.edit), {name:d.name.trim(), url:d.url.trim(), jira:(d.jira||"").toUpperCase(), branch:d.branch, build:d.build, lint:d.lint, test:d.test}); }
    else repos.push({id:d.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-"), name:d.name.trim(), url:d.url.trim(), jira:(d.jira||"").toUpperCase(), branch:d.branch, build:d.build, lint:d.lint, test:d.test, claudeMd:false});
    const added = !drawer.edit; drawer = null; renderDrawer(); render(); toast(added ? "Repository added" : "Repository saved"); return;
  }
  if(act === "draft-claudemd"){ toast("In the real app this creates a task to draft CLAUDE.md"); return; }
  if(act === "save-settings"){ settings = JSON.parse(JSON.stringify(draftSettings)); render(); toast("Settings saved"); return; }
  if(act === "discard-settings"){ draftSettings = null; render(); toast("Changes discarded"); return; }
  if(act === "reset-demo"){
    Object.values(timers).forEach(clearTimeout);
    tickets = seed(); usage = seedUsage(); projects = seedProjects(); events = seedEvents(tickets); repos = seedRepos(); settings = seedSettings(); draftSettings = null;
    evSeq = events.reduce((m,e)=>Math.max(m,e.id),0); for(const k in logs) delete logs[k];
    view = {page:"dashboard", filter:"needs", key:null, from:"dashboard", project:"all"}; render(); startRuns(); toast("Demo reset"); return;
  }
  if(["jira","openpr","profile"].includes(act)){ toast("Not part of this demo"); return; }
  if(!t) return;
  if(act === "analyze") analyze(t);
  if(act === "start"){ const ex = $("extra"); t.extra = ex ? ex.value.trim() : ""; setState(t, "coding", "You answered and started the run", "you"); t.turns = 0; code(t); }
  if(act === "stop"){ clearTimeout(timers[t.key]); t.failedAt = 2; t.error = "You stopped this run. The branch is kept so you can retry with new instructions."; setState(t, "failed", "You stopped the run", "you"); toast("Run stopped"); }
  if(act === "approve") push(t);
  if(act === "changes"){ const fb = $("feedback").value.trim(); if(!fb){ toast("Write what to change first"); $("feedback").focus(); return; } t.revision++; setState(t, "coding", `You requested changes: ${fb}`, "you"); code(t, fb); }
  if(act === "reject"){ clearTimeout(timers[t.key]); setState(t, "rejected", "You rejected the changes. Branch discarded", "you"); toast(`${t.key} rejected`); }
  if(act === "retry"){ const n = $("retryNote").value.trim(); if(!n){ toast("Add instructions so hiro tries something different"); $("retryNote").focus(); return; } t.revision++; if(!t.plan.length) t.plan = ["Apply your instructions"]; setState(t, "coding", `You retried with: ${n}`, "you"); code(t, n); }
  if(act === "resume"){ setState(t, "coding", "You resumed the run", "you"); code(t); }
  if(act === "edit-task"){ openDrawer("task", {project:t.project, title:t.title, desc:t.desc, priority:t.priority, after:t.after||"main", start:"queue"}, t.key); return; }
  if(act === "delete-task"){ tickets = tickets.filter(x=>x!==t); view.page = "tasks"; render(); toast(`${t.key} deleted`); return; }
  if(act === "requeue"){ t.revision = 1; setState(t, "new", "Sent back to queue", "you"); }
  render();
});
document.addEventListener("click", e => { if(langOpen && !e.target.closest("#langSeg")) setLangOpen(false); }, true);
document.addEventListener("keydown", e => {
  if(langOpen){
    if(e.key === "Escape"){ e.preventDefault(); setLangOpen(false, false); return; }
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){ const items = [...document.querySelectorAll("#langDd .lang-opt")]; if(items.length){ e.preventDefault(); let i = items.indexOf(document.activeElement); i = e.key === "ArrowDown" ? (i+1) % items.length : (i-1+items.length) % items.length; items[i].focus(); } return; }
  }
  if(e.key === "Escape" && docsOpen){ docsOpen = false; renderDocs(); const g = document.querySelector(".guide-btn"); if(g) g.focus(); return; }
  if(e.key === "Escape" && drawer){ closeDrawer(); return; }
});
document.addEventListener("keydown", e => { const ev = e.target.closest && e.target.closest("tr[data-ev]"); if(ev && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); ev.click(); return; } const r = e.target.closest && e.target.closest("tr[data-k]"); if(r && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openTicket(r.dataset.k); } });
document.addEventListener("input", e => {
  if(e.target.dataset && e.target.dataset.cfg && draftSettings){ draftSettings[e.target.dataset.cfg] = e.target.value; return; }
  if(e.target.dataset && e.target.dataset.igIn && draftSettings){ setP(draftSettings.integ, e.target.dataset.igIn, e.target.value); return; }
  if(e.target.id === "lk"){ logView.key = e.target.value; logView.limit = 60; const pos = e.target.selectionStart; render(); const el = $("lk"); el.focus(); el.setSelectionRange(pos,pos); return; }
  if(e.target.id === "q"){ query = e.target.value; if(!["list","tasks"].includes(view.page)) view.page = "list"; render(); $("q").focus(); return; }
  if(e.target.dataset && e.target.dataset.fld && drawer){ drawer.data[e.target.dataset.fld] = e.target.value; if(drawer.err){ drawer.err = ""; const er = document.querySelector("#drawer .ferr"); if(er) er.remove(); } return; }
  const n = e.target.dataset && e.target.dataset.note; if(n !== undefined){ find(view.key).questions[+n].note = e.target.value; save(); }
});
setInterval(() => { const a = $("ago"); if(a) a.textContent = agoText(usage.updatedAt); renderPill(); }, 30000);

function startRuns(){ tickets.forEach(t => {
  if(t.state === "analyzing") analyze(t);
  else if(t.state === "coding" || t.state === "testing"){ logs[t.key] = [[now(),"Reading internal/outbox/relay.go"],[now(),"Adding attempts and next_attempt_at columns"]]; code(t, null, true); }
  else if(t.state === "pushing") push(t);
}); }
document.addEventListener("change", e => {
  if(e.target.dataset && e.target.dataset.cfg && view.page === "settings"){ const y = window.scrollY; render(); window.scrollTo(0, y); }
  if(e.target.dataset && e.target.dataset.igSel && draftSettings){ setP(draftSettings.integ, e.target.dataset.igSel, e.target.value); render(); }
  if(e.target.dataset && e.target.dataset.igIn && draftSettings){ render(); }
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id && e.target.id.startsWith("add-")){ e.preventDefault(); const b = document.querySelector(`[data-chip-add="${e.target.id.slice(4)}"]`); if(b) b.click(); } });
startRuns();
renderChrome();
render();
})();
</script>
</body>
</html>
