<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --ink:#16181D; --ink-2:#555A63; --ink-3:#6B6F78; --ink-nav:#2B2E35;
  --line:#E4E2DC; --line-2:#EFEDE8; --line-3:#D2CFC6; --line-4:#D9D6CE; --hover:#F2F1ED; --row-hover:#FAF9F6; --field:#FAFAF8;
  --primary:#2E46A8; --primary-h:#25398C; --on-primary:#FFFFFF; --primary-soft:#E9ECF8; --primary-ink:#26398C; --ring:#DCE2F5; --help:#F3F5FC;
  --ok:#1F7A4D; --ok-soft:#E3F2EA; --ok-ink:#1A6B43;
  --warn:#C98A14; --warn-soft:#FBEFD9; --warn-ink:#8A510A;
  --bad:#B3261E; --bad-soft:#FBE4E2; --bad-ink:#A3241B;
  --gray-soft:#EFEEEA; --gray-ink:#4A4E57;
  --code:#16181D; --code-ink:#E9E7E1; --code-dim:#9AA0A8; --code-add:rgba(46,160,103,.22); --code-del:rgba(214,64,52,.24); --code-hunk:rgba(125,150,235,.18);
  --mark:#16181D; --mark-ink:#F4F3EF;
  --shadow:rgba(22,24,29,.35);
  --display:'Bricolage Grotesque','Noto Sans','Segoe UI',sans-serif;
  --sans:'Atkinson Hyperlegible Next','Noto Sans','Segoe UI',system-ui,sans-serif;
  --mono:'Atkinson Hyperlegible Mono','Noto Sans',ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --surface:#1B1D23; --ink:#ECEBE6; --ink-2:#B4B6BC; --ink-3:#8E9199; --ink-nav:#D6D7DB;
    --line:#2C2F37; --line-2:#24272E; --line-3:#3A3E46; --line-4:#3A3E46; --hover:#24272E; --row-hover:#20232A; --field:#16181D;
    --primary:#8299EC; --primary-h:#9AAEF1; --on-primary:#0F1220; --primary-soft:#232B4A; --primary-ink:#B5C3F3; --ring:#2F3A66; --help:#1D2340;
    --ok:#5CC28E; --ok-soft:#183626; --ok-ink:#7FD3A6;
    --warn:#F0B95A; --warn-soft:#3A2C12; --warn-ink:#F0B95A;
    --bad:#F08A80; --bad-soft:#3D1C1A; --bad-ink:#F08A80;
    --gray-soft:#2A2C33; --gray-ink:#C4C6CB;
    --code:#0D0E11; --mark:#ECEBE6; --mark-ink:#16181D; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1B1D23; --ink:#ECEBE6; --ink-2:#B4B6BC; --ink-3:#8E9199; --ink-nav:#D6D7DB;
  --line:#2C2F37; --line-2:#24272E; --line-3:#3A3E46; --line-4:#3A3E46; --hover:#24272E; --row-hover:#20232A; --field:#16181D;
  --primary:#8299EC; --primary-h:#9AAEF1; --on-primary:#0F1220; --primary-soft:#232B4A; --primary-ink:#B5C3F3; --ring:#2F3A66; --help:#1D2340;
  --ok:#5CC28E; --ok-soft:#183626; --ok-ink:#7FD3A6;
  --warn:#F0B95A; --warn-soft:#3A2C12; --warn-ink:#F0B95A;
  --bad:#F08A80; --bad-soft:#3D1C1A; --bad-ink:#F08A80;
  --gray-soft:#2A2C33; --gray-ink:#C4C6CB;
  --code:#0D0E11; --mark:#ECEBE6; --mark-ink:#16181D; --shadow:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit; color:inherit}
*:focus,*:focus-visible{outline:none}
button:focus-visible,a:focus-visible{box-shadow:0 0 0 3px var(--ring)}
/* Inputs inside a component (search boxes) never show their own ring: the component shows it */
.search input,.search input:focus,.search input:focus-visible,
.mini-search input,.mini-search input:focus,.mini-search input:focus-visible{outline:none; box-shadow:none; border:0}
.search input::-webkit-search-decoration,.search input::-webkit-search-cancel-button{-webkit-appearance:none}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

.shell{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh}
.side{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden}
.brandbox{display:flex; align-items:center; gap:10px; padding:18px 24px 14px; border-bottom:1px solid var(--line-2)}
.brand-name{font-family:var(--display); font-weight:700; font-size:20px; line-height:1}
.brand-sub{font-size:12.5px; color:var(--ink-3)}
.navscroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:4px 14px 14px; display:flex; flex-direction:column; gap:4px}
.grp{font-size:12.5px; font-weight:700; color:var(--ink-3); margin:16px 10px 4px}
.nav-a{display:flex; align-items:center; gap:11px; width:100%; min-height:40px; padding:0 10px; border:0; border-radius:9px; background:none; color:var(--ink-nav); font-size:15px; text-align:left; cursor:pointer}
.nav-a svg{flex:none; width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--ink-3)}
.nav-a:hover{background:var(--hover)}
.nav-a.on{background:var(--primary-soft); color:var(--ink); font-weight:700}
.nav-a.on svg{color:var(--primary)}
.cnt{margin-left:auto; min-width:22px; height:22px; border-radius:11px; background:var(--primary); color:var(--on-primary); font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 6px}
.cnt.dim{background:var(--gray-soft); color:var(--gray-ink)}
.me{flex:none; padding:10px 14px; border-top:1px solid var(--line)}
.av{flex:none; width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; background:#2E46A8}

.main{min-width:0; display:flex; flex-direction:column}
.top{display:flex; align-items:center; gap:14px; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap}
.search{flex:1 1 260px; max-width:440px; display:flex; align-items:center; gap:8px; border:1px solid var(--line-4); border-radius:10px; padding:0 12px; min-height:40px; background:var(--field); transition:border-color .15s, box-shadow .15s}
.search svg{width:17px; height:17px; stroke:var(--ink-3); fill:none; stroke-width:2; stroke-linecap:round}
.search input{border:0; background:none; outline:none; width:100%; font-size:14.5px}
.search:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.top-right{margin-left:auto; display:flex; align-items:center; gap:10px}
.limit-pill{display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 12px; border-radius:17px; border:1px solid var(--line); background:var(--field); font-size:13.5px; font-weight:700; color:var(--ink-2); cursor:pointer}
.limit-pill .mini{width:46px; height:6px; border-radius:3px; background:var(--line-2); overflow:hidden}
.limit-pill .mini span{display:block; height:100%; background:var(--primary)}

.content{padding:24px 28px 56px; display:flex; flex-direction:column; gap:22px; width:100%; max-width:1280px}
.ph{display:flex; justify-content:space-between; gap:16px; align-items:flex-end; flex-wrap:wrap}
.ph h1{margin:0; font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-0.02em; line-height:1.15}
.ph p{margin:4px 0 0; color:var(--ink-2); font-size:15.5px; max-width:64ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px}
.card h2{margin:0; font-size:17px; font-weight:700}
.card .sub{margin:2px 0 0; color:var(--ink-3); font-size:14px}
.ch{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.g4{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr)); gap:16px}
.stat .lbl{font-size:14px; color:var(--ink-2)}
.stat .val{font-family:var(--display); font-size:32px; font-weight:700; margin:6px 0 2px; font-variant-numeric:tabular-nums}
.stat .note{font-size:13.5px; color:var(--ink-2)}

.badge{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:12px; font-size:12.5px; font-weight:700; white-space:nowrap}
.badge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.b-ok{background:var(--ok-soft); color:var(--ok-ink)} .b-warn{background:var(--warn-soft); color:var(--warn-ink)} .b-bad{background:var(--bad-soft); color:var(--bad-ink)} .b-info{background:var(--primary-soft); color:var(--primary-ink)} .b-gray{background:var(--gray-soft); color:var(--gray-ink)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:0 15px; border-radius:9px; border:1px solid var(--line-3); background:var(--surface); color:var(--ink); font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:background-color .18s, border-color .18s, box-shadow .18s, transform .18s}
.btn:hover{border-color:var(--ink); box-shadow:0 6px 14px -8px var(--shadow); transform:translateY(-1px)}
.btn:active{transform:none; box-shadow:none}
.btn-p{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.btn-p:hover{background:var(--primary-h); border-color:var(--primary-h)}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.btn-d{color:var(--bad-ink)} .btn-s{min-height:34px; padding:0 11px; font-size:13.5px}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none}
.back-btn{display:inline-flex; align-items:center; gap:6px; border:0; background:none; color:var(--primary); font-weight:700; font-size:14.5px; cursor:pointer; padding:4px 0; align-self:flex-start}
.back-btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}

.tw{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:14.5px}
.tbl th{text-align:left; font-size:12.5px; font-weight:700; color:var(--ink-3); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:12px; border-bottom:1px solid var(--line-2); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--row-hover)}
.tkey{font-family:var(--mono); font-size:13.5px; color:var(--ink-3)}
.ttitle{font-weight:700; color:var(--ink)}
.muted{color:var(--ink-3)}
.empty{padding:28px 8px; color:var(--ink-2); text-align:center}

.tabs{display:flex; gap:6px; flex-wrap:wrap}
.tab{min-height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--line-4); background:var(--surface); font-size:14px; font-weight:700; cursor:pointer; color:var(--ink-2); transition:background-color .18s, border-color .18s, color .18s}
.tab:hover{border-color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}

.help{display:flex; gap:10px; align-items:flex-start; background:var(--help); border:1px solid var(--ring); border-radius:12px; padding:12px 14px; font-size:14.5px; color:var(--primary-ink)}
.help svg{flex:none; width:18px; height:18px; margin-top:2px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round}
.help.warn{background:var(--warn-soft); border-color:transparent; color:var(--warn-ink)}
.help.bad{background:var(--bad-soft); border-color:transparent; color:var(--bad-ink)}
.help.ok{background:var(--ok-soft); border-color:transparent; color:var(--ok-ink)}
.help p{margin:0}

.cfg-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
.cfg-side{display:flex; flex-direction:column; gap:16px; position:sticky; top:88px}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:0; font-size:14.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0; font-weight:700; text-align:right; overflow-wrap:anywhere}

/* Progress track */
.track{overflow-x:auto; margin:4px -4px 0; padding:4px}
.track ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6,minmax(84px,1fr)); min-width:520px}
.stop{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
.stop::before{content:""; position:absolute; top:12px; left:-50%; width:100%; height:2px; background:var(--line)}
.stop:first-child::before{display:none}
.stop.done::before,.stop.active::before,.stop.error::before{background:var(--primary)}
.mark{position:relative; z-index:1; width:26px; height:26px; border-radius:50%; background:var(--surface); border:2px solid var(--line-3); display:grid; place-items:center}
.stop.gate .mark{border-radius:6px; transform:rotate(45deg); width:22px; height:22px; margin:2px 0}
.stop.done .mark{background:var(--primary); border-color:var(--primary)}
.stop.done .mark svg{width:13px; height:13px; stroke:var(--on-primary); fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.stop.gate.done .mark svg{transform:rotate(-45deg)}
.stop.active .mark{border-color:var(--primary); background:var(--primary-soft)}
.stop.active:not(.gate) .mark::after{content:""; width:8px; height:8px; border-radius:50%; background:var(--primary); animation:pulse 1.2s ease-in-out infinite}
.stop.gate.active .mark{background:var(--warn); border-color:var(--warn)}
.stop.error .mark{background:var(--bad-soft); border-color:var(--bad)}
.stop .lbl{font-size:13px; color:var(--ink-3); font-weight:600}
.stop.active .lbl,.stop.error .lbl{color:var(--ink); font-weight:700}
.stop.gate.active .lbl{color:var(--warn-ink)}
@keyframes pulse{50%{transform:scale(.55); opacity:.6}}

/* Stage content */
.sec{margin-top:20px}
.sec h3{margin:0 0 10px; font-size:13.5px; font-weight:700; color:var(--ink-3)}
.plan{margin:0; padding-left:20px; max-width:72ch}
.plan li{margin:4px 0}
.q{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:0 0 10px}
.q p{margin:0 0 10px; font-weight:700; max-width:72ch}
.q .tabs{margin-bottom:10px}
.ans{display:flex; flex-direction:column; gap:2px; padding:10px 0; border-bottom:1px solid var(--line-2)}
.ans:last-child{border-bottom:0}
.ans .qq{color:var(--ink-2); font-size:14px}
textarea{width:100%; min-height:64px; resize:vertical; border:1px solid var(--line-3); border-radius:9px; background:var(--surface); padding:10px 12px; line-height:1.45; font-size:14.5px; transition:border-color .15s, box-shadow .15s}
textarea:hover{border-color:#B9B5AB}
textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center}
.hint{font-size:13.5px; color:var(--ink-3)}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:0}
.facts div{background:var(--field); border:1px solid var(--line-2); border-radius:10px; padding:10px 12px}
.facts dt{font-size:13px; color:var(--ink-3)}
.facts dd{margin:2px 0 0; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums}
.facts dd.ok{color:var(--ok-ink)} .facts dd.bad{color:var(--bad-ink)}
.summary p{margin:0 0 8px; max-width:72ch}

.log{font-family:var(--mono); font-size:13px; background:var(--code); color:var(--code-ink); border-radius:10px; padding:12px 14px; max-height:300px; overflow:auto; line-height:1.7}
.log div{white-space:pre-wrap; word-break:break-word}
.log .t{color:var(--code-dim); margin-right:10px}
.log .cur::after{content:"▍"; animation:blink 1s steps(1) infinite; color:#8FA4F0}
@keyframes blink{50%{opacity:0}}
.file{border:1px solid var(--line); border-radius:10px; margin:0 0 10px; overflow:hidden}
.file summary{list-style:none; cursor:pointer; padding:10px 14px; display:flex; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:13.5px; background:var(--field)}
.file summary::-webkit-details-marker{display:none}
.file summary:hover{background:var(--hover)}
.n{font-family:var(--sans); font-size:13px; white-space:nowrap; font-weight:700}
.n .a{color:var(--ok-ink)} .n .d{color:var(--bad-ink); margin-left:6px}
.diff{overflow-x:auto; background:var(--code); color:var(--code-ink)}
.diff pre{margin:0; font-family:var(--mono); font-size:13px; line-height:1.6; min-width:max-content; padding:6px 0}
.diff span{display:block; padding:0 14px}
.diff .add{background:var(--code-add)} .diff .del{background:var(--code-del)} .diff .hunk{background:var(--code-hunk); color:#B9C6F5}

/* Timeline */
.tl{display:flex; flex-direction:column; margin:0; padding:0; list-style:none}
.tl li{display:grid; grid-template-columns:52px 14px minmax(0,1fr); gap:10px; font-size:14px; padding-bottom:12px; position:relative}
.tl time{color:var(--ink-3); font-variant-numeric:tabular-nums; font-size:13.5px}
.tl .dot{width:10px; height:10px; border-radius:50%; margin-top:6px; background:var(--line-3)}
.tl .dot.you{background:var(--warn)}
.tl .dot.ok{background:var(--ok)}

/* Plan usage */
.bar{height:8px; border-radius:4px; background:var(--line-2); overflow:hidden}
.bar>span{display:block; height:100%; border-radius:4px; background:var(--primary); transition:width .4s ease}
.bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)}
.lim{display:flex; flex-direction:column; gap:6px; padding:10px 0}
.lim + .lim{border-top:1px solid var(--line-2)}
.lim-h{display:flex; justify-content:space-between; gap:12px; font-size:14.5px}
.lim-h b{font-variant-numeric:tabular-nums}
.lim-h b.warn{color:var(--warn-ink)} .lim-h b.bad{color:var(--bad-ink)}
.lim .hint{font-size:13px}

/* Drawer + form (Usta patterns) */
.gd-back{position:fixed; inset:0; z-index:60; background:rgba(22,24,29,.32); border:0; cursor:default; animation:gdFade .2s ease both}
.gd{position:fixed; top:0; right:0; bottom:0; z-index:61; width:min(520px,100%); background:var(--surface); box-shadow:-20px 0 50px -20px var(--shadow); display:flex; flex-direction:column; animation:gdIn .28s cubic-bezier(.2,.7,.2,1) both; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.gd-h{flex:none; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:22px 24px 16px; border-bottom:1px solid var(--line-2)}
.gd-h h2{margin:0; font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-0.01em}
.gd-h p{margin:2px 0 0; color:var(--ink-3); font-size:14px}
.gd-b{flex:1; overflow-y:auto; padding:18px 24px 24px; display:flex; flex-direction:column; gap:18px}
.gd-f{flex:none; display:flex; gap:10px; justify-content:flex-end; padding:14px 24px; border-top:1px solid var(--line-2); flex-wrap:wrap}
.x-btn{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:none}
.x-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round}
.x-btn:hover{background:var(--hover)}
@keyframes gdIn{from{transform:translateX(24px); opacity:0} to{transform:none; opacity:1}}
@keyframes gdFade{from{opacity:0} to{opacity:1}}
.field{display:flex; flex-direction:column; gap:6px; font-size:14px}
.field > label, .field > .flbl{font-weight:700; color:var(--ink)}
.field .fhelp{font-size:13px; color:var(--ink-3)}
.field input[type=text]{min-height:42px; border:1px solid var(--line-3); border-radius:9px; padding:0 12px; background:var(--surface); font-size:15px; transition:border-color .15s, box-shadow .15s; width:100%}
.field input[type=text]:hover{border-color:#B9B5AB}
.field input[type=text]:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.field textarea{min-height:110px}
.ferr{color:var(--bad-ink); font-size:13px; font-weight:700}
.seg{display:inline-flex; background:var(--hover); border-radius:10px; padding:3px; gap:3px; flex-wrap:wrap; align-self:flex-start}
.seg-b{border:0; background:none; min-height:36px; padding:0 12px; border-radius:8px; font-size:14px; font-weight:700; color:var(--gray-ink); cursor:pointer; transition:background-color .15s, color .15s, box-shadow .15s}
.seg-b:hover{color:var(--ink)}
.seg-b[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(22,24,29,.15)}
.opt{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; background:var(--surface); text-align:left; width:100%}
.opt:hover{border-color:var(--line-3)}
.opt[aria-pressed="true"]{border-color:var(--primary); background:var(--help); box-shadow:0 0 0 1px var(--primary)}
.opt .rd{flex:none; width:18px; height:18px; border-radius:50%; border:2px solid var(--line-3); margin-top:2px; display:grid; place-items:center}
.opt[aria-pressed="true"] .rd{border-color:var(--primary)}
.opt[aria-pressed="true"] .rd::after{content:""; width:8px; height:8px; border-radius:50%; background:var(--primary)}
.opt b{display:block} .opt span.d{font-size:13.5px; color:var(--ink-2)}
.opts{display:flex; flex-direction:column; gap:8px}
.proj-dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:7px; vertical-align:1px}
.src{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:6px; font-size:12px; font-weight:700; background:var(--gray-soft); color:var(--gray-ink)}
.src.local{background:#F0E8F8; color:#5E3790}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .src.local{background:#2E2340; color:#CDB4EE} }
:root[data-theme="dark"] .src.local{background:#2E2340; color:#CDB4EE}

/* Logs */
.tl-bars{display:flex; flex-direction:column; gap:12px}
.tb{display:grid; grid-template-columns:200px minmax(0,1fr) 80px; gap:12px; align-items:center; font-size:14.5px}
.tb .bar{height:10px}
.tb .bar.you>span{background:var(--warn)}
.tb b{text-align:right; font-variant-numeric:tabular-nums}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--ink-3); margin-top:12px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.mini-search{display:flex; align-items:center; gap:6px; border:1px solid var(--line-4); border-radius:18px; padding:0 12px; min-height:36px; background:var(--field)}
.mini-search input{border:0; background:none; outline:none; font-size:14px; width:150px}
.mini-search:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.sw{position:relative; width:40px; height:24px; border-radius:12px; border:0; background:#C9C5BB; cursor:pointer; flex:none; padding:0; transition:background-color .2s}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .2s}
.sw[aria-checked="true"]{background:var(--bad)} .sw[aria-checked="true"]::after{left:19px}
.swl{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink-2)}
.ev td{font-size:14px; padding:9px 12px}
.ev .ts{font-family:var(--mono); font-size:13px; color:var(--ink-3); white-space:nowrap}
.ev .msg{max-width:520px}
.ev.lv-error td{background:var(--bad-soft)}
.ev-detail td{background:var(--field); padding:0 12px 12px}
.ev-detail pre{margin:0; font-family:var(--mono); font-size:12.5px; background:var(--code); color:var(--code-ink); border-radius:8px; padding:10px 12px; overflow-x:auto}
.live{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ok-ink)}
.live::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 1.4s ease-in-out infinite}
.rl{border:1px solid var(--line); border-radius:10px; margin:0 0 8px; overflow:hidden}
.rl summary{list-style:none; cursor:pointer; padding:10px 14px; display:flex; justify-content:space-between; gap:12px; font-weight:700; background:var(--field)}
.rl summary::-webkit-details-marker{display:none}
.rl summary:hover{background:var(--hover)}
.rl summary span.hint{font-weight:400}
.rl ol{list-style:none; margin:0; padding:6px 14px 10px}
.rl li{display:grid; grid-template-columns:70px 86px minmax(0,1fr); gap:10px; padding:5px 0; font-size:13.5px; border-bottom:1px solid var(--line-2); align-items:center}
.rl li:last-child{border-bottom:0}
.rl .ts{font-family:var(--mono); font-size:12.5px; color:var(--ink-3)}
@media (max-width:700px){ .tb{grid-template-columns:1fr 70px} .tb .bar{grid-column:1 / -1; order:3} }

/* Settings (Usta patterns) */
.cfg-row{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line-2); flex-wrap:wrap}

.cfg-row > div:first-child{min-width:220px; flex:1 1 260px}
.cfg-lbl{font-weight:700; color:var(--ink)}
.cfg-help{font-size:13.5px; color:var(--ink-3); max-width:60ch}
.cfg-in{min-height:42px; width:280px; max-width:100%; border:1px solid var(--line-3); border-radius:10px; padding:0 12px; font-size:15px; background:var(--surface); transition:border-color .15s, box-shadow .15s}
.cfg-in:hover{border-color:#B9B5AB} .cfg-in:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.cfg-in.mono{font-family:var(--mono); font-size:14px}
.step{display:inline-flex; align-items:center; border:1px solid var(--line-3); border-radius:10px; overflow:hidden; background:var(--surface)}
.step button{width:40px; height:40px; border:0; background:var(--surface); font-size:18px; font-weight:700; cursor:pointer; color:var(--ink)}
.step button:hover{background:var(--hover)}
.step span{min-width:78px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; border-left:1px solid var(--line-2); border-right:1px solid var(--line-2); line-height:40px; padding:0 6px}
.sw.on-ok[aria-checked="true"]{background:var(--ok)}
.chips{display:flex; flex-wrap:wrap; gap:6px; max-width:420px; justify-content:flex-end}
.chip{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 6px 0 10px; border-radius:15px; background:var(--hover); border:1px solid var(--line); font-size:13px; font-family:var(--mono)}
.chip button{width:20px; height:20px; border-radius:10px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-3)}
.chip button:hover{background:var(--line); color:var(--bad-ink)}
.chip button svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round}
.chip-add{display:inline-flex; gap:6px}
.chip-add input{min-height:30px; width:150px; border:1px solid var(--line-3); border-radius:15px; padding:0 10px; font-family:var(--mono); font-size:13px; background:var(--surface)}
.chip-add input:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.conn{display:inline-flex; align-items:center; gap:8px; font-weight:700}
.savebar{position:sticky; bottom:16px; z-index:6; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; background:#16181D; color:#fff; border-radius:14px; padding:12px 14px 12px 20px; box-shadow:0 18px 40px -16px rgba(22,24,29,.5); animation:gdIn .25s cubic-bezier(.2,.7,.2,1) both}
.savebar .btn{background:transparent; color:#fff; border-color:#4A4E57}
.savebar .btn-p{background:#fff; color:#16181D; border-color:#fff}
.anchor-nav{display:flex; flex-direction:column; gap:2px}
.anchor-nav a{color:var(--ink-2); text-decoration:none; padding:7px 10px; border-radius:8px; font-weight:600; font-size:14.5px}
.anchor-nav a:hover{background:var(--hover); color:var(--ink)}
section[id]{scroll-margin-top:84px}
.repo-ok{color:var(--ok-ink); font-weight:700} .repo-miss{color:var(--warn-ink); font-weight:700}

.lang-menu{position:relative}
.lang-btn{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-size:13px; font-weight:700; cursor:pointer; transition:background-color .15s, border-color .15s}
.lang-btn:hover,.lang-btn[aria-expanded="true"]{background:var(--hover); border-color:var(--line-3); color:var(--ink)}
.lang-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.lang-dd{position:absolute; top:calc(100% + 6px); right:0; z-index:30; min-width:180px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 16px 36px -14px var(--shadow); animation:ddIn .14s ease both}
@keyframes ddIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.lang-opt{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:38px; padding:0 10px; border:0; border-radius:8px; background:none; font-size:14.5px; color:var(--ink); cursor:pointer; text-align:left}
.lang-opt:hover,.lang-opt:focus-visible{background:var(--hover); box-shadow:none}
.lang-opt[aria-checked="true"]{font-weight:700}
.lang-opt .code{font-size:12px; font-weight:700; color:var(--ink-3)}
.lang-opt svg{width:16px; height:16px; stroke:var(--primary); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.theme-btn{color:var(--ink-2)} .theme-btn svg{width:18px; height:18px; stroke-width:1.9}


.side-usage{display:flex; flex-direction:column; gap:6px; width:100%; margin-top:6px; padding:10px 10px 9px; border:1px solid var(--line-2); border-radius:10px; background:var(--field); text-align:left; cursor:pointer; transition:background-color .15s, border-color .15s}
.side-usage:hover{background:var(--hover); border-color:var(--line)}
.su-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink-2)}
.su-h b{font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums}
.su-h b.warn{color:var(--warn-ink)} .su-h b.bad{color:var(--bad-ink)}
.side-usage .bar{height:6px}
.su-f{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 8px; font-size:12.5px; color:var(--ink-3)}
.su-f span:last-child{white-space:nowrap}
.su-f span:last-child{font-variant-numeric:tabular-nums}

.ph-title{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.guide-btn{display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 12px 0 8px; border-radius:16px; border:1px solid var(--ring); background:var(--help); color:var(--primary-ink); font-size:13.5px; font-weight:700; cursor:pointer; transition:background-color .15s, border-color .15s, transform .15s}
.guide-btn:hover{border-color:var(--primary); transform:translateY(-1px)}
.guide-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.docs-kicker{margin:0 0 2px; font-size:13px; font-weight:700; color:var(--primary-ink)}
.docs-intro{margin:0; color:var(--ink-2); font-size:15px; line-height:1.55}
.gd-item{display:grid; gap:4px; padding:14px 0; border-bottom:1px solid var(--line-2); font-size:14.5px; line-height:1.55}
.gd-item:last-child{border-bottom:0}
.gd-item span{color:var(--ink-2)}

/* Dashboard + analytics */
.g6{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:16px}
.dash-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start}
.span2{grid-column:span 2} .span3{grid-column:1 / -1}
@media (max-width:1180px){ .dash-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .span2{grid-column:1 / -1} }
@media (max-width:760px){ .dash-grid{grid-template-columns:1fr} }
.chart{width:100%; height:auto; display:block}
.chart .ax{font-size:11px; fill:var(--ink-3); font-family:var(--sans)}
.donut-wrap{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.donut{width:150px; flex:none}
.dn-v{font-family:var(--display); font-size:24px; font-weight:700; fill:var(--ink)}
.dn-s{font-size:11.5px; fill:var(--ink-3); font-family:var(--sans)}
.dn-legend{flex:1; min-width:160px}
.dn-legend div,.pipe-l div{display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:center; padding:5px 0; font-size:14px; border-bottom:1px solid var(--line-2)}
.dn-legend div:last-child,.pipe-l div:last-child{border-bottom:0}
.dn-legend i,.pipe-l i{width:10px; height:10px; border-radius:3px}
.dn-legend b,.pipe-l b{font-variant-numeric:tabular-nums}
.delta{display:inline-block; font-family:var(--sans); font-size:12.5px; font-weight:700; padding:2px 7px; border-radius:10px; vertical-align:middle; margin-left:4px; line-height:1.4}
.delta.up{background:var(--ok-soft); color:var(--ok-ink)} .delta.down{background:var(--bad-soft); color:var(--bad-ink)} .delta.flat{background:var(--gray-soft); color:var(--gray-ink)}
.stat .val .delta{font-size:12.5px}
.kpi-btn{display:block; width:100%; text-align:left; cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .15s}
.kpi-btn:hover{border-color:var(--line-3); box-shadow:0 10px 24px -16px var(--shadow); transform:translateY(-1px)}
.mini-kv{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-2); font-size:14.5px}
.mini-kv:last-of-type{border-bottom:0}
.mini-kv b{font-variant-numeric:tabular-nums; white-space:nowrap}
.stackbar{display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--line-2); margin:2px 0 12px}
.stackbar span{display:block; height:100%}
.run-row{display:block; width:100%; text-align:left; border:1px solid var(--line-2); border-radius:12px; padding:12px 14px; background:var(--field); cursor:pointer; margin-bottom:8px; transition:border-color .15s}
.run-row:hover{border-color:var(--line-3)}
.run-row:last-child{margin-bottom:0}
.rr-top{display:flex; gap:10px; align-items:center}
.rr-top .ttitle{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rr-meta{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; color:var(--ink-3); margin:8px 0 6px}
.rr-log{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.recent{list-style:none; margin:0; padding:0}
.recent li{display:grid; grid-template-columns:42px 96px minmax(0,1fr); gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line-2); font-size:13.5px; cursor:pointer}
.recent li:last-child{border-bottom:0}
.recent li:hover .rc-m{color:var(--ink)}
.recent time{color:var(--ink-3); font-variant-numeric:tabular-nums; font-size:13px}
.rc-m{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hb .hb-r{display:grid; grid-template-columns:minmax(110px,170px) 1fr 70px; gap:10px; align-items:center; padding:6px 0; font-size:14px}
.hb .hb-r b{text-align:right; font-variant-numeric:tabular-nums}
.hb .bar{height:10px; margin:0}
.insights{display:flex; flex-direction:column; gap:10px}

/* Integrations */
.integ-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:16px}
.integ-card{display:flex; flex-direction:column}
.integ-card .actions{margin-top:auto; padding-top:14px}
.ic-h{display:flex; align-items:center; gap:12px}
.ic-h h2{margin:0 0 4px}
.ptile{flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:12px; color:#fff}
.ptile svg{width:55%; height:55%; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ph-row{display:flex; gap:14px; align-items:center}
.soon{display:flex; flex-wrap:wrap; gap:8px}
.soon span{padding:6px 12px; border-radius:16px; background:var(--gray-soft); color:var(--gray-ink); font-weight:700; font-size:13.5px}
.perm{display:grid; grid-template-columns:150px 1fr auto; gap:6px 14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-2)}
.perm:last-child{border-bottom:0}
.pk{font-weight:700}
.perm .pr{display:flex; gap:10px; align-items:center; justify-self:end}
@media (max-width:700px){ .perm{grid-template-columns:1fr} .perm .pr{justify-self:start} }
.steps-l{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.steps-l li{display:flex; gap:10px; align-items:center; color:var(--ink-3); font-weight:600}
.steps-l li.now,.steps-l li.done{color:var(--ink)}
.sd{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-3); display:inline-flex; align-items:center; justify-content:center; flex:none}
.steps-l li.done .sd{background:var(--ok); border-color:var(--ok)}
.steps-l li.done .sd svg{width:12px; height:12px; stroke:#fff; fill:none; stroke-width:3}
.steps-l li.now .sd{border-color:var(--primary); border-top-color:transparent; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jql{margin:0; font-family:var(--mono); font-size:13px; background:var(--code); color:var(--code-ink); border-radius:10px; padding:12px 14px; overflow-x:auto; white-space:pre}
select.cfg-in{appearance:none; -webkit-appearance:none; padding-right:34px; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%); background-position:calc(100% - 18px) 18px, calc(100% - 13px) 18px; background-size:5px 5px; background-repeat:no-repeat; cursor:pointer; width:220px}

/* Repository page */
.ci{display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; vertical-align:0; background:var(--line-3)}
.ci-ok{background:var(--ok)} .ci-fail{background:var(--bad)} .ci-run{background:var(--primary); animation:pulse 1.2s infinite} .ci-manual{background:var(--warn)} .ci-pending,.ci-skip,.ci-none{background:transparent; border:2px solid var(--line-3)}
.br{font-family:var(--mono); font-size:13px; background:var(--gray-soft); color:var(--ink); padding:2px 7px; border-radius:6px; white-space:nowrap}
.sha{font-family:var(--mono); font-size:12.5px; color:var(--ink-3)}
.au{display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-size:13.5px}
.au-av{width:22px; height:22px; border-radius:50%; color:#fff; font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none}
.cm-day{font-size:13px; font-weight:700; color:var(--ink-3); margin:16px 0 8px}
.cm-day:first-of-type{margin-top:0}
.cm-list{border:1px solid var(--line); border-radius:12px; overflow:hidden}
.cm{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line-2)}
.cm:last-child{border-bottom:0}
.cm[data-k]{cursor:pointer} .cm[data-k]:hover{background:var(--row-hover)}
.cm-m{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cm-meta{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-top:5px; font-size:13px}
.cm-r{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.env-grid{display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:16px; align-items:start}
@media (max-width:1100px){ .env-grid{grid-template-columns:1fr 1fr} .env-grid .help{grid-column:1 / -1} }
.pp{border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden}
.pp-h{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; padding:12px 14px; border:0; background:none; text-align:left; cursor:pointer}
.pp-h:hover{background:var(--row-hover)}
.pp-id{font-family:var(--mono); font-weight:700; font-size:13.5px}
.pp-m{min-width:0; display:flex; flex-direction:column; gap:4px}
.pp-m > span:first-child{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pp-sub{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:13px; color:var(--ink-3)}
.pp-r{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-weight:700; font-size:13.5px; white-space:nowrap}
.stg{display:flex; align-items:center; flex-wrap:wrap; gap:6px 0; padding:0 14px 12px}
.stg-ln{width:18px; height:2px; background:var(--line-3); margin:0 4px}

function seedEvents(tks){
  const E = []; let id = 0;
  const d0 = new Date(); d0.setHours(0,0,0,0); const T0 = d0.getTime();
  const J = (o) => JSON.stringify(o, null, 2);
  function gen(t, dayOff, hh, mm, o){
    let ts = T0 + dayOff*86400000 + (hh*60+mm)*60000, turn = 0, util = o.util || 0.2;
    const ev = (step, type, msg, detail, level, dur) => E.push({id:++id, ts, key:t.key, step, type, level:level||(type==="error"?"error":"info"), msg, detail:detail?J(detail):null, dur:dur||null});
    const wait = (sec) => { ts += sec*1000; };
    let st = "new";
    const move = (to, msg, you) => { ev(STEP_OF[to==="failed"||to==="rate_limited"?st:to] || "Pickup", you?"user":"state", msg, {from:st, to}); st = to; };
    const local = t.source === "local", test = o.test || "go test ./...";
    const files = (t.result && t.result.files.map(f=>f.path)) || ["src/main.ts"];
    move("new", local ? "You created this task" : "Picked up from Jira (label: hiro)", local);
    if(o.upTo === "new") return;
    wait(60); move("analyzing", "Started analysis");
    ev("Analyze","command",`claude -p --permission-mode plan --model sonnet --output-format stream-json`, {container:`hiro-${t.key.toLowerCase()}-a1`, mode:"read-only"});
    wait(4); ev("Analyze","tool","Read CLAUDE.md",{tool:"Read",path:"CLAUDE.md",turn:++turn});
    wait(6); ev("Analyze","tool",`Grep "${t.title.split(" ").slice(-2).join(" ")}"`,{tool:"Grep",matches:7,turn:++turn});
    for(const f of files.slice(0,2)){ wait(5); ev("Analyze","tool",`Read ${f}`,{tool:"Read",path:f,turn:++turn}); }
    wait(9); util += 0.01; ev("Analyze","limit",`Session ${Math.round(util*100)}%, allowed`,{type:"rate_limit_event",rate_limit_info:{status:"allowed",unifiedWindows:{five_hour:{utilization:+util.toFixed(2)},seven_day:{utilization:0.18}}}});
    const qn = t.questions.length;
    if(qn || o.questions){
      move("waiting_for_answers", `Asked ${qn||o.questions} question${(qn||o.questions)===1?"":"s"}`);
      ev("Your answers","state","Analysis finished",{turns:turn, plan_steps:t.plan.length},null,40000);
      if(o.upTo === "answers") return;
      wait(o.answerWait || 1500);
    }
    move("coding", qn ? `You answered ${qn} question${qn===1?"":"s"} and started the run` : "No questions, started the run", !!qn);
    ev("Coding","command",`claude -p --model sonnet --output-format stream-json --max-turns 80`,{container:`hiro-${t.key.toLowerCase()}-r1`, branch:`hiro/${t.key.toLowerCase()}`});
    const steps = t.plan.length ? t.plan : ["Implement the change"];
    for(let i=0;i<steps.length;i++){
      wait(20 + i*7); ev("Coding","tool",`Edit ${files[i % files.length]}`,{tool:"Edit",path:files[i % files.length],plan_step:steps[i],turn:(turn+=2)});
      if(i===1){ wait(15); ev("Coding","tool",`Bash ${test.split(" ")[0]} ${test.includes("go")?"vet ./...":"run typecheck"}`,{tool:"Bash",exit:0,turn:++turn}); }
      if(o.rateLimit && i===1){
        wait(10); ev("Coding","limit","Session 100%, rejected",{type:"rate_limit_event",rate_limit_info:{status:"rejected",rateLimitType:"five_hour",unifiedWindows:{five_hour:{utilization:1.0},seven_day:{utilization:0.31}}}},"error");
        move("rate_limited","Paused at plan limit"); return;
      }
    }
    util += 0.06; wait(5); ev("Coding","limit",`Session ${Math.round(util*100)}%, allowed`,{type:"rate_limit_event",rate_limit_info:{status:"allowed",unifiedWindows:{five_hour:{utilization:+util.toFixed(2)},seven_day:{utilization:0.2}}}});
    if(o.upTo === "coding") return;
    move("testing","Coding finished, running checks");
    const tries = o.failTests ? 3 : 1;
    for(let k=0;k<tries;k++){
      wait(8); ev("Tests","command", local ? "Build" : "go build ./...", {exit:0}, null, 8200);
      wait(6); ev("Tests","command", local ? "Lint" : "golangci-lint run", {exit:0, issues:0}, null, 6100);
      wait(35);
      if(o.failTests){
        ev("Tests","error",`${test} failed: TestStatementExport_Large timed out after 30s`,{cmd:test, exit:1, failed:["TestStatementExport_Large"], attempt:k+1},null,34800);
        if(k<2){ wait(90); ev("Tests","tool","Edit internal/statement/export.go",{tool:"Edit",attempt:k+2,turn:(turn+=3)}); }
      } else ev("Tests","command",`${test}: ${o.passed||40} passed`,{cmd:test, exit:0, passed:o.passed||40, failed:0},null,34800);
    }
    if(o.failTests){ wait(3); move("failed","Stopped after 3 failed test runs"); return; }
    wait(3); move("waiting_for_review","Tests passed, waiting for your review");
    if(o.upTo === "review") return;
    wait(o.reviewWait || 2400);
    if(o.reject){ move("rejected","You rejected the changes", true); return; }
    move("pushing","You approved the changes", true);
    wait(3); ev("Push","command","git commit --author \"Rustambek Abdusalomov\"",{exit:0});
    wait(4);
    if(local && t.after==="main"){ ev("Push","command","git push origin main",{exit:0}); wait(2); move("done","Pushed to main"); return; }
    ev("Push","command",`git push origin hiro/${t.key.toLowerCase()}`,{exit:0});
    wait(3); ev("Push","command",`gh pr create --head hiro/${t.key.toLowerCase()}`,{exit:0, pr:t.pr||0});
    if(!local){ wait(2); ev("Push","command","Jira: transition to In Review",{status:200}); }
    wait(1); move("done",`PR #${t.pr} opened`);
  }
  const by = (k) => tks.find(t=>t.key===k);
  const plan = [
    ["PAY-198",-3,14,10,{reject:true, reviewWait:3600, passed:22}],
    ["PAY-203",-1,10,5,{reviewWait:5400, answerWait:0, passed:51}],
    ["MK-12",-1,16,20,{test:"make test", reviewWait:1800, passed:33}],
    ["PAY-227",0,8,40,{failTests:true}],
    ["PAY-230",0,7,5,{rateLimit:true, util:0.93}],
    ["PAY-214",0,9,12,{upTo:"review", answerWait:1680, passed:48}],
    ["PAY-219",0,10,2,{upTo:"answers"}],
    ["PAY-221",0,10,20,{upTo:"coding", answerWait:240}],
    ["PAY-225",0,10,31,{upTo:"new"}],
    ["GYM-7",0,11,38,{upTo:"answers", test:"npm test"}],
    ["GYM-8",0,11,52,{upTo:"new"}]
  ];
  for(const [k,dd,h,m,o] of plan){ const t = by(k); if(t) gen(t,dd,h,m,o); }
  return E.sort((a,b)=>a.ts-b.ts).map((e,i)=>({...e, id:i+1}));
}

// Durations: "6m 12s", "1h 0m", "2d 3h", "25s"
const U = {ru:{d:"д",h:"ч",m:"мин",s:"с"}, uz:{d:"kun",h:"soat",m:"daq",s:"son"}};
const durRe = /\b(\d+)([dhms])\b/g;
const isDur = /^(\d+[dhms])( \d+[dhms])*$/;
function dur(lang, txt){ return txt.replace(durRe, (_, n, u) => n + " " + U[lang][u]); }
const R = (n, a, b, c) => plRu(+n, a, b, c);

function patterns(L){
  const ru = L === "ru";
  const D = (t) => dur(L, t);
  return [
    [isDur, m => D(m[0])],
    [/^Session (\d+)%$/, m => ru ? `Сессия ${m[1]}%` : `Sessiya ${m[1]}%`],
    [/^Session (\d+)%, (allowed warning|allowed|rejected)$/, m => (ru ? `Сессия ${m[1]}%, ` : `Sessiya ${m[1]}%, `) + ({"allowed":ru?"разрешено":"ruxsat","allowed warning":ru?"предупреждение":"ogohlantirish","rejected":ru?"отклонено":"rad etildi"})[m[2]]],
    [/^Plan session usage (\d+) percent$/, m => ru ? `Использовано ${m[1]}% сессии` : `Sessiyaning ${m[1]}% sarflangan`],
    [/^Session usage is (\d+)% now\.$/, m => ru ? `Сейчас использовано ${m[1]}% сессии.` : `Hozir sessiyaning ${m[1]}% sarflangan.`],
    [/^Resets in (.+)$/, m => ru ? `Сброс через ${D(m[1])}` : `${D(m[1])}dan keyin yangilanadi`],
    [/^Resets (.+)$/, m => ru ? `Сброс: ${m[1]}` : `Yangilanish: ${m[1]}`],
    [/^Updated (\d+) min ago$/, m => ru ? `Обновлено ${m[1]} мин назад` : `${m[1]} daqiqa oldin yangilandi`],
    [/^Updated (\d+)h ago$/, m => ru ? `Обновлено ${m[1]} ч назад` : `${m[1]} soat oldin yangilandi`],
    [/^Yest\. (\d\d:\d\d)$/, m => (ru ? "Вчера " : "Kecha ") + m[1]],
    [/^(\d+) tickets?$/, m => ru ? `${m[1]} ${R(m[1],"тикет","тикета","тикетов")}` : `${m[1]} ta tiket`],
    [/^(\d+) questions? before coding$/, m => ru ? `${m[1]} ${R(m[1],"вопрос","вопроса","вопросов")} до разработки` : `Kod yozishdan oldin ${m[1]} ta savol`],
    [/^(\d+) questions? left to answer$/, m => ru ? `Осталось ответить: ${m[1]}` : `Javob berilmagan: ${m[1]} ta`],
    [/^Asked (\d+) questions?$/, m => ru ? `Задано ${m[1]} ${R(m[1],"вопрос","вопроса","вопросов")}` : `${m[1]} ta savol berildi`],
    [/^You answered (\d+) questions? and started the run$/, m => ru ? `Вы ответили на ${m[1]} ${R(m[1],"вопрос","вопроса","вопросов")} и запустили работу` : `${m[1]} ta savolga javob berib, ishni boshladingiz`],
    [/^(\d+) events?, grouped by step$/, m => ru ? `${m[1]} ${R(m[1],"событие","события","событий")}, по шагам` : `${m[1]} ta hodisa, bosqichlar boʻyicha`],
    [/^(\d+) events?(?:, ([\dhmsd ]+))?(,)?$/, m => (ru ? `${m[1]} ${R(m[1],"событие","события","событий")}` : `${m[1]} ta hodisa`) + (m[2] ? ", " + D(m[2]) : "") + (m[3] || "")],
    [/^(\d+) errors?$/, m => ru ? `${m[1]} ${R(m[1],"ошибка","ошибки","ошибок")}` : `${m[1]} ta xato`],
    [/^(\d+) events?, newest first\. Select a row to see its raw data\.$/, m => ru ? `${m[1]} ${R(m[1],"событие","события","событий")}, сначала новые. Нажмите на строку, чтобы увидеть исходные данные.` : `${m[1]} ta hodisa, avval yangilari. Xom maʼlumotni koʻrish uchun qatorni bosing.`],
    [/^(\d+) error events in total$/, m => ru ? `Всего событий с ошибками: ${m[1]}` : `Jami xato hodisalari: ${m[1]}`],
    [/^(\d+) of (\d+) runs passed tests$/, m => ru ? `${m[1]} из ${m[2]} запусков прошли тесты` : `${m[2]} ta ishdan ${m[1]} tasi testdan oʻtdi`],
    [/^Show (\d+) more$/, m => ru ? `Показать ещё ${m[1]}` : `Yana ${m[1]} tasini koʻrsatish`],
    [/^(\d+) passed$/, m => ru ? `${m[1]} прошло` : `${m[1]} ta oʻtdi`],
    [/^(\d+) passed, (\d+) failed$/, m => ru ? `${m[1]} прошло, ${m[2]} упало` : `${m[1]} ta oʻtdi, ${m[2]} ta yiqildi`],
    [/^(\d+) files, \+(\d+) −(\d+)$/, m => ru ? `${m[1]} ${R(m[1],"файл","файла","файлов")}, +${m[2]} −${m[3]}` : `${m[1]} ta fayl, +${m[2]} −${m[3]}`],
    [/^(\d+) min$/, m => ru ? `${m[1]} мин` : `${m[1]} daq`],
    [/^(\d+) seconds$/, m => ru ? `${m[1]} секунд` : `${m[1]} soniya`],
    [/^Open (\S+) in Jira$/, m => ru ? `Открыть ${m[1]} в Jira` : `${m[1]} ni Jira'da ochish`],
    [/^Open pull request #(\d+)$/, m => ru ? `Открыть пул-реквест #${m[1]}` : `Pull request #${m[1]} ni ochish`],

    [/^Approved and pushed\. PR #(\d+) opened$/, m => ru ? `Одобрено и отправлено. Открыт PR #${m[1]}` : `Tasdiqlandi va yuborildi. PR #${m[1]} ochildi`],
    [/^Approved\. PR #(\d+) opened$/, m => ru ? `Одобрено. Открыт PR #${m[1]}` : `Tasdiqlandi. PR #${m[1]} ochildi`],
    [/^Pull request #(\d+) is open on (\S+?), and the Jira ticket is in In Review\.$/, m => ru ? `Пул-реквест #${m[1]} открыт в ${m[2]}, тикет Jira в статусе In Review.` : `Pull request #${m[1]} ${m[2]} da ochiq, Jira tiketi In Review holatida.`],
    [/^Pull request #(\d+) is open on (\S+?)\.$/, m => ru ? `Пул-реквест #${m[1]} открыт в ${m[2]}.` : `Pull request #${m[1]} ${m[2]} da ochiq.`],
    [/^Committed as you and pushed to main on (\S+)\.$/, m => ru ? `Закоммичено от вашего имени и отправлено в main репозитория ${m[1]}.` : `Sizning nomingizdan commit qilinib, ${m[1]} ning main branchiga yuborildi.`],
    [/^Nothing has left the server yet\. Approving commits as you, pushes (\S+), opens a pull request and moves the Jira ticket to In Review\.$/, m => ru ? `Пока ничего не покинуло сервер. При одобрении будет коммит от вашего имени, отправка ${m[1]}, пул-реквест и перевод тикета Jira в In Review.` : `Hozircha serverdan hech narsa chiqmadi. Tasdiqlasangiz, sizning nomingizdan commit qilinadi, ${m[1]} yuboriladi, pull request ochiladi va Jira tiketi In Review'ga oʻtadi.`],
    [/^Nothing has left the server yet\. Approving commits as you, pushes (\S+) and opens a pull request\.$/, m => ru ? `Пока ничего не покинуло сервер. При одобрении будет коммит от вашего имени, отправка ${m[1]} и пул-реквест.` : `Hozircha serverdan hech narsa chiqmadi. Tasdiqlasangiz, sizning nomingizdan commit qilinadi, ${m[1]} yuboriladi va pull request ochiladi.`],
    [/^Nothing has left the server yet\. Approving commits as you and pushes straight to main\.$/, () => ru ? "Пока ничего не покинуло сервер. При одобрении будет коммит от вашего имени и отправка сразу в main." : "Hozircha serverdan hech narsa chiqmadi. Tasdiqlasangiz, sizning nomingizdan commit qilinib, toʻgʻridan-toʻgʻri main'ga yuboriladi."],
    [/^Working in a fresh container on (\S+)\. You review the diff before anything is pushed\.$/, m => ru ? `Работает в новом контейнере на ветке ${m[1]}. Вы проверите изменения до отправки.` : `${m[1]} branchida yangi konteynerda ishlamoqda. Yuborishdan oldin oʻzgarishlarni tekshirasiz.`],
    [/^Looking through (\S+) to build a plan\.$/, m => ru ? `Изучает ${m[1]}, чтобы составить план.` : `Reja tuzish uchun ${m[1]} ni koʻrib chiqmoqda.`],
    [/^Read-only access to (\S+)$/, m => ru ? `Доступ к ${m[1]} только на чтение` : `${m[1]} ga faqat oʻqish uchun kirish`],
    [/^The branch was discarded( and the ticket went back to you in Jira)?\.$/, m => ru ? (m[1] ? "Ветка удалена, тикет вернулся к вам в Jira." : "Ветка удалена.") : (m[1] ? "Branch oʻchirildi, tiket Jira'da sizga qaytdi." : "Branch oʻchirildi.")],
    [/^(Coding|Review the changes|Running tests), revision (\d+)$/, m => ({"Coding":ru?"Разработка":"Kod yozish","Review the changes":ru?"Проверьте изменения":"Oʻzgarishlarni tekshiring","Running tests":ru?"Идут тесты":"Testlar ishlamoqda"})[m[1]] + (ru ? `, ревизия ${m[2]}` : `, ${m[2]}-reviziya`)],

const mql = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

function applyTheme(){
  const root = document.documentElement;

const LOCALE = {en:"en-GB", ru:"ru-RU", uz:"uz-Latn-UZ"};
function locDate(d, o){
  if(prefs.lang !== "uz") return d.toLocaleDateString(LOCALE[prefs.lang], o);
  const WL = ["yakshanba","dushanba","seshanba","chorshanba","payshanba","juma","shanba"], WS = ["Yak","Du","Se","Cho","Pa","Ju","Sha"];
  const ML = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"], MS = ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
  if(o.weekday === "short" && !o.day) return WS[d.getDay()];
  if(o.weekday === "long"){ const w = WL[d.getDay()]; return w[0].toUpperCase() + w.slice(1) + ", " + d.getDate() + "-" + ML[d.getMonth()]; }
  return d.getDate() + "-" + (o.month === "short" ? MS[d.getMonth()] : ML[d.getMonth()]);
}

/* Translation: UI is written in English; after each render the DOM is translated.
   Ticket content, code, commands and logs written by tools stay as they are. */
function tr(str){
  if(prefs.lang === "en" || !str) return str;
  const D = I18N[prefs.lang]; if(!D) return str;
  const lead = str.match(/^\s*/)[0], trail = str.match(/\s*$/)[0], core = str.trim();
  if(!core) return str;
  if(Object.prototype.hasOwnProperty.call(D.exact, core)) return lead + D.exact[core] + trail;
  for(const [re, fn] of D.re){ const m = core.match(re); if(m) return lead + (typeof fn === "function" ? fn(m) : core.replace(re, fn)) + trail; }
  return str;
}
const NO_TR = ".diff,.log,pre,.tkey,.chip,.ttitle-raw,input,textarea,code,.notr";
function translateDom(root){
  if(prefs.lang === "en" || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p = n.parentElement; if(!p || p.closest(NO_TR)) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){ const t = tr(n.nodeValue); if(t !== n.nodeValue) n.nodeValue = t; }
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el => {
    for(const a of ["placeholder","aria-label","title"]){ const v = el.getAttribute(a); if(v){ const t = tr(v); if(t !== v) el.setAttribute(a, t); } }
  });
}
function plRu(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10; return (a > 10 && a < 20) ? many : b === 1 ? one : (b >= 2 && b <= 4) ? few : many; }

/* ---------- Plan usage ---------- */
function lvl(u){ return u >= 1 ? "bad" : u >= 0.8 ? "warn" : ""; }
function resetText(ms){
  const d = ms - Date.now(); if(d <= 0) return "Resetting now";
  const h = Math.floor(d/3600000), m = Math.floor(d%3600000/60000);
  if(h >= 24){ const dt = new Date(ms); return "Resets " + locDate(dt, {weekday:"short"}) + " " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0"); }
  return `Resets in ${h ? h+"h " : ""}${m}m`;
}
function agoText(ms){ const m = Math.round((Date.now()-ms)/60000); return m < 1 ? "Updated just now" : m < 60 ? `Updated ${m} min ago` : `Updated ${Math.floor(m/60)}h ago`; }
function usageCard(){
  const row = (name, w) => { const p = Math.min(100, Math.round(w.u*100)), l = lvl(w.u);
    return `<div class="lim"><div class="lim-h"><span>${name}</span><b class="${l}">${p}%</b></div><div class="bar ${l}"><span style="width:${p}%"></span></div><span class="hint">${resetText(w.resetsAt)}</span></div>`; };
  const warn = usage.five_hour.u >= 0.8 ? `<div class="help warn" style="margin-top:8px">${svg("info")}<p>Session usage is above 80%. New runs may pause before they finish.</p></div>` : "";
  return `<section class="card" aria-label="Plan usage"><div class="ch"><div><h2>Plan usage</h2><p class="sub" id="ago">${agoText(usage.updatedAt)}</p></div><button class="btn btn-s" data-act="refresh">Refresh</button></div>
    ${row("Current session", usage.five_hour)}${row("This week", usage.seven_day)}${warn}
    <p class="hint" style="margin:10px 0 0">Read from Claude Code's rate limit events. Includes your own Claude use on this account.</p></section>`;
}
function rollWindows(){
  const n = Date.now();
  if(n >= usage.five_hour.resetsAt){ usage.five_hour.u = 0; usage.five_hour.resetsAt = n + 5*3600000; usage.updatedAt = n; }
  if(n >= usage.seven_day.resetsAt){ usage.seven_day.u = 0; usage.seven_day.resetsAt = n + 7*86400000; usage.updatedAt = n; }
}
function renderPill(){
  rollWindows();
  const pillEl = $("pill");
  const p = Math.min(100, Math.round(usage.five_hour.u*100)), l = lvl(usage.five_hour.u);
  const color = l==="bad" ? "var(--bad)" : l==="warn" ? "var(--warn)" : "var(--primary)";
  const w = Math.min(100, Math.round(usage.seven_day.u*100));
  pillEl.innerHTML = `<span class="su-h"><span>Current session</span><b class="${l}">${p}%</b></span>
    <span class="bar ${l}"><span style="width:${p}%"></span></span>
    <span class="su-f"><span>${resetText(usage.five_hour.resetsAt)}</span><span>${tr("This week")} ${w}%</span></span>`;
  pillEl.setAttribute("aria-label", `Plan session usage ${p} percent`);

function bumpUsage(d, t){
  usage.five_hour.u = Math.min(1, usage.five_hour.u + d);
  usage.seven_day.u = Math.min(1, usage.seven_day.u + d/5);
  usage.updatedAt = Date.now(); renderPill();
  const pct = Math.round(usage.five_hour.u*100);

}

/* ---------- Logs ---------- */
function fmtDur(ms){
  if(ms == null) return "";
  const sec = Math.round(ms/1000);
  if(sec < 60) return sec + "s";
  const m = Math.floor(sec/60), h = Math.floor(m/60);
  if(h >= 24) return Math.floor(h/24) + "d " + (h%24) + "h";
  if(h) return h + "h " + (m%60) + "m";
  return m + "m " + (sec%60) + "s";
}
function fmtTs(ts){
  const d = new Date(ts), t0 = new Date(); t0.setHours(0,0,0,0);
  const hms = [d.getHours(), d.getMinutes(), d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
  if(ts >= t0.getTime()) return hms;
  if(ts >= t0.getTime() - 86400000) return "Yest. " + hms.slice(0,5);
  return locDate(d, {weekday:"short"}) + " " + hms.slice(0,5);
}
function typeBadge(e){ const [l,c] = TYPES[e.type] || ["Event","b-gray"]; return `<span class="badge ${e.level==="warn" && e.type==="limit" ? "b-warn" : c}">${l}</span>`; }

/* Time spent in each state, from consecutive state transitions */
function stateDurations(){
  const acc = {}, by = {};
  for(const e of events){ if(e.type!=="state" && e.type!=="user") continue; if(!e.detail) continue; let d; try{ d = JSON.parse(e.detail); }catch(x){ continue; } if(!d.to) continue; (by[e.key] ||= []).push({ts:e.ts, to:d.to}); }
  for(const k in by){
    const L = by[k];
    for(let i=0;i<L.length;i++){
      const cur = L[i], next = L[i+1];
      if(cur.to === "done" || cur.to === "rejected") continue;
      if(!next) continue; // step still in progress: only finished steps count toward averages
      const end = next.ts;
      if(end <= cur.ts) continue;
      (acc[cur.to] ||= []).push(end - cur.ts);
    }
  }
  const avg = (k) => acc[k] && acc[k].length ? acc[k].reduce((a,b)=>a+b,0)/acc[k].length : null;
  return [["Analyze","analyzing",false],["Waiting for your answers","waiting_for_answers",true],["Coding","coding",false],["Tests","testing",false],["Waiting for your review","waiting_for_review",true],["Push","pushing",false]].map(([l,k,you])=>({l, you, v:avg(k), n:(acc[k]||[]).length}));
}
function logStats(){
  const runs = events.filter(e => (e.type==="state"||e.type==="user") && e.detail && e.detail.includes('"to": "coding"') && !e.msg.startsWith("You requested")).length;
  const reviews = events.filter(e => e.detail && e.detail.includes('"to": "waiting_for_review"')).length;
  const stops = events.filter(e => e.detail && (e.detail.includes('"to": "failed"') || e.detail.includes('"to": "rate_limited"'))).length;
  const withTurns = tickets.filter(t=>t.turns>0);
  const avgTurns = withTurns.length ? Math.round(withTurns.reduce((a,t)=>a+t.turns,0)/withTurns.length) : 0;
  return {runs, reviews, stops, avgTurns, errors: events.filter(e=>e.level==="error").length};
}
function filteredEvents(){
  const k = logView.key.trim().toLowerCase();
  return events.filter(e =>
    (logView.type==="all" || e.type===logView.type || (logView.type==="problems" && (e.level!=="info"))) &&
    (!logView.errors || e.level==="error") &&
    (!k || e.key.toLowerCase().includes(k))
  ).slice().reverse();
}
function logsPage(){
  const st = logStats(), durs = stateDurations();

      ${open ? `<tr class="ev-detail"><td colspan="6">${e.detail ? `<pre>${esc(e.detail)}</pre>` : `<p class="hint" style="margin:0">No extra data for this event.</p>`}</td></tr>` : ""}`;

    </div>
    <section class="card"><div class="ch"><div><h2>Where the time goes</h2><p class="sub">Average time spent in each step, across all tickets and tasks</p></div></div>
      <div class="tl-bars">${durs.map(d=>`<div class="tb"><span>${d.l} <span class="hint">${d.n ? "("+d.n+")" : ""}</span></span><div class="bar ${d.you?"you":""}"><span style="width:${d.v ? Math.max(2, d.v/max*100) : 0}%"></span></div><b>${d.v ? fmtDur(d.v) : "No data"}</b></div>`).join("")}</div>
      <div class="legend"><span><i style="background:var(--primary)"></i>hiro working</span><span><i style="background:var(--warn)"></i>Waiting on you</span></div></section>
    <section class="card"><div class="ch"><div><h2>Events</h2><p class="sub">${list.length} event${list.length===1?"":"s"}, newest first. Select a row to see its raw data.</p></div></div>
      <div class="filters">

        ${logView.key || logView.type!=="all" || logView.errors ? `<button class="btn btn-s" data-act="clear-log-filters">Clear filters</button>` : ""}
      </div>
      ${shown.length ? `<div class="tw"><table class="tbl"><thead><tr><th>Time</th><th>Ticket</th><th>Step</th><th>Type</th><th>Event</th><th>Duration</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="empty">No events match these filters.</p>`}
      ${list.length > shown.length ? `<div class="actions" style="justify-content:center"><button class="btn" data-act="more-logs">Show ${Math.min(60, list.length-shown.length)} more</button></div>` : ""}
    </section>`;
}
function runLogCard(t){
  const ev = events.filter(e=>e.key===t.key);
  if(!ev.length) return "";
  const groups = [];
  for(const e of ev){ const g = groups[groups.length-1]; if(g && g.step===e.step) g.items.push(e); else groups.push({step:e.step, items:[e]}); }
  return `<section class="card"><div class="ch"><div><h2>Run log</h2><p class="sub">${ev.length} events, grouped by step</p></div><button class="btn btn-s" data-act="open-logs" data-key="${t.key}">Open in Logs</button></div>
    ${groups.map((g,i)=>{
      const span = g.items[g.items.length-1].ts - g.items[0].ts, errs = g.items.filter(e=>e.level==="error").length;
      return `<details class="rl" ${i===groups.length-1?"open":""}><summary><span>${g.step}</span><span class="hint">${g.items.length} event${g.items.length===1?"":"s"}${span>0?", "+fmtDur(span):""}${errs?`, <b style="color:var(--bad-ink)">${errs} error${errs===1?"":"s"}</b>`:""}</span></summary>
        <ol>${g.items.map(e=>`<li><span class="ts">${fmtTs(e.ts).replace(/^Yest\. /,"")}</span><span>${typeBadge(e)}</span><span style="${e.level==="error"?"color:var(--bad-ink);font-weight:700":""}">${esc(e.msg)}${e.dur?` <span class="hint">${fmtDur(e.dur)}</span>`:""}</span></li>`).join("")}</ol></details>`;
    }).join("")}</section>`;
}

    <div class="sec"><dl class="facts"><div><dt>Model</dt><dd>${MODELS[t.curModel || modelFor(t, t.revision>1 ? "retry" : "coding")].name}</dd></div><div><dt>Turns</dt><dd id="turns">${t.turns}</dd></div><div><dt>Turn limit</dt><dd>${settings.maxTurns}</dd></div><div><dt>Session usage</dt><dd id="sess">${Math.round(usage.five_hour.u*100)}%</dd></div></dl></div>
    <div class="sec"><h3>Live log</h3>${logBlock(t)}</div>
    <div class="actions"><button class="btn btn-d" data-act="stop">Stop run</button></div>`;
  if(st === "waiting_for_review"){
    const r = t.result, add = r.files.reduce((a,f)=>a+f.add,0), del = r.files.reduce((a,f)=>a+f.del,0);
    return `<h2>Review the changes${t.revision>1?", revision "+t.revision:""}</h2><p class="sub">Nothing has left the server yet. ${!isLocal(t) ? `Approving commits as you, pushes ${br}, opens a pull request and moves the Jira ticket to In Review.` : t.after==="main" ? "Approving commits as you and pushes straight to main." : `Approving commits as you, pushes ${br} and opens a pull request.`}</p>
    <div class="sec"><dl class="facts">
      <div><dt>Tests</dt><dd class="${r.tests.failed?"bad":"ok"}">${r.tests.passed} passed${r.tests.failed?", "+r.tests.failed+" failed":""}</dd></div>
      <div><dt>Lint</dt><dd class="ok">${r.lint}</dd></div>
      <div><dt>Changed</dt><dd>${r.files.length} files, +${add} −${del}</dd></div>
      <div><dt>Time</dt><dd>${t.duration||"5m 30s"}</dd></div></dl></div>
    <div class="sec"><h3>What hiro did</h3><div class="summary">${r.summary.map(p=>`<p>${esc(p)}</p>`).join("")}</div></div>
    <div class="sec"><h3>Diff</h3>${diffBlock(r.files)}</div>
    ${modelPicker(t, ["retry"])}
    <div class="sec"><h3>Feedback</h3><textarea id="feedback" placeholder="Describe what to change. Required for Request changes."></textarea></div>
    <div class="actions"><button class="btn btn-p" data-act="approve">Approve and push</button><button class="btn" data-act="changes">Request changes</button><button class="btn btn-d" data-act="reject">Reject</button></div>`;
  }
  if(st === "pushing") return `<h2>Pushing</h2><p class="sub">Committing as you and opening the pull request.</p><div class="sec">${logBlock(t)}</div>`;
  if(st === "done"){
    if(isLocal(t) && t.after === "main") return `<h2>Pushed</h2><div class="sec"><div class="help ok">${svg("check")}<p>Committed as you and pushed to main on ${esc(t.repo)}.</p></div></div>`;
    return `<h2>Pushed</h2><div class="sec"><div class="help ok">${svg("check")}<p>Pull request #${t.pr} is open on ${br}${isLocal(t)?".":", and the Jira ticket is in In Review."}</p></div></div>
    <div class="actions"><button class="btn" data-act="openpr">Open pull request #${t.pr}</button></div>`;
  }
  if(st === "rejected") return `<h2>Rejected</h2><p class="sub">The branch was discarded${isLocal(t)?".":" and the ticket went back to you in Jira."}</p><div class="actions"><button class="btn" data-act="requeue">Send back to queue</button></div>`;
  if(st === "failed") return `<h2>hiro stopped</h2><div class="sec"><div class="help bad">${svg("info")}<p>${esc(t.error)}</p></div></div>
    <div class="sec"><h3>What should hiro try?</h3><textarea id="retryNote" placeholder="For example: streaming is fine, target is under 10 seconds for 100k rows"></textarea></div>
    ${modelPicker(t, ["retry"])}
    <div class="actions"><button class="btn btn-p" data-act="retry">Retry with these instructions</button><button class="btn btn-d" data-act="reject">Take it myself</button></div>`;
  if(st === "rate_limited") return `<h2>Paused at plan limit</h2><div class="sec"><div class="help warn">${svg("info")}<p>${esc(t.error)}</p></div></div>
    <div class="actions"><button class="btn btn-p" data-act="resume">Resume run</button><span class="hint">Session usage is ${Math.round(usage.five_hour.u*100)}% now.</span></div>`;
  return "";
}

/* ---------- Simulation ---------- */
function inferType(text){ return /^(claude |git |go |golangci|Build|Lint|Opening pull|Moving Jira|npm |make |.*: all passed|.*passed$)/.test(text) ? "command" : "tool"; }
function addLog(t, text){ (logs[t.key] ||= []).push([now(), text]); const ty = inferType(text); logEvent(t, ty, text, {detail: ty==="command" ? {cmd:text, exit:0} : {tool: /^Applying|^Resuming/.test(text) ? "Edit" : "Read", turn:t.turns}}); }
function setState(t, s, hist, kind){
  const from = t.state, step = (s==="failed"||s==="rate_limited") ? STEP_OF[from] : STEP_OF[s];
  t.state = s; t.updated = now(); if(hist) t.history.push([now(), hist, kind||""]);
  logEvent(t, kind==="you" ? "user" : "state", hist || `Moved to ${STATE[s].label.toLowerCase()}`, {step, detail:{from, to:s}, level: s==="failed" ? "error" : "info"});
}
function runSteps(t, steps, done){
  clearTimeout(timers[t.key]); let i = 0;
  const tick = () => {
    if(i >= steps.length){ done(); render(); return; }
    const s = steps[i++];
    if(s.state){ const from = t.state; t.state = s.state; logEvent(t, "state", "Coding finished, running checks", {detail:{from, to:s.state}}); }
    if(s.log) addLog(t, s.log);
    if(s.turn){ t.turns += s.turn; bumpUsage(0.004*s.turn*((MODELS[t.curModel]||MODELS.sonnet).w), t); }
    const viewing = view.page==="detail" && view.key===t.key;
    if(viewing && !s.state && $("log")){
      const lg = $("log"); lg.querySelectorAll(".cur").forEach(e=>e.classList.remove("cur"));
      const d = document.createElement("div"); d.className = "cur"; d.innerHTML = `<span class="t">${now()}</span>${esc(s.log)}`;
      lg.appendChild(d); lg.scrollTop = lg.scrollHeight;
      if($("turns")) $("turns").textContent = t.turns;
      if($("sess")) $("sess").textContent = Math.round(usage.five_hour.u*100)+"%";
      save();
    } else if(view.page !== "detail" || viewing || s.state) render();
    timers[t.key] = setTimeout(tick, s.wait || 700);
  };
  tick();
}
function analyze(t){
  if(isLocal(t)) prepLocal(t, true);
  logs[t.key] = []; setState(t, "analyzing", "Started analysis");
  t.curModel = modelFor(t, "analyze");
  runSteps(t, [{log:`claude -p --permission-mode plan --model ${t.curModel}`, wait:500},{log:"Reading ticket and acceptance criteria", wait:800, turn:1},{log:`Searching ${t.repo} for related code`, wait:900, turn:1},{log:"Reading CLAUDE.md and project conventions", wait:800},{log:"Drafting plan", wait:900, turn:1}], () => {
    if(t.questions.length){ setState(t, "waiting_for_answers", `Asked ${t.questions.length} question${t.questions.length===1?"":"s"}`); toast(`${t.key} needs your answers`); }
    else { setState(t, "coding", "No questions, started the run"); code(t); }
  });
}
function code(t, feedback, keepLog){
  if(!keepLog) logs[t.key] = feedback ? (logs[t.key]||[]) : [];
  if(isLocal(t)) prepLocal(t, false);
  t.state = "coding";
  t.curModel = modelFor(t, feedback ? "retry" : "coding");
  const steps = [{log:`claude -p --model ${t.curModel} --max-turns ${settings.maxTurns}`, wait:500}].concat(feedback
    ? [{log:"Resuming session with your feedback", turn:1, wait:900},{log:`Applying: ${feedback.slice(0,90)}`, turn:2, wait:1100},{log:"Updating tests", turn:2, wait:900}]
    : t.plan.map(p => ({log:p, turn:2+Math.floor(Math.random()*3), wait:1000})));
  if(isLocal(t)){ const tc = projOf(t)?.test || "make test"; steps.push({state:"testing", log:"Build ok", wait:700},{log:"Lint: no issues", wait:800},{log:`${tc}: all passed`, turn:1, wait:1200}); }
  else { const rp = repos.find(r=>r.name===t.repo) || {build:"go build ./...", lint:"golangci-lint run", test:"go test ./..."};
    steps.push({state:"testing", log:`${rp.build} ok`, wait:700},{log:`${rp.lint}: no issues`, wait:800},{log:`${rp.test}: all passed`, turn:1, wait:1200}); }
  runSteps(t, steps, () => {
    if(!t.result){
      const ans = t.questions.filter(q=>q.answer).map(q=>q.answer.toLowerCase());
      t.result = {summary:[`Implemented: ${t.title}.`, ans.includes("add tests") || !isLocal(t) ? "Added tests for the new behavior." : "No new tests, as you asked. Existing tests still pass.", "Followed the existing structure of the project."],
        tests:{passed:18+Math.floor(Math.random()*30), failed:0}, lint:"Clean",
        files:[{path:"src/features/"+t.key.toLowerCase()+".ts", add:42, del:3, diff:`@@ -0,0 +1,6 @@\n+// ${t.title}\n+export function feature() {\n+  // implementation generated for the demo\n+}\n`},{path:"src/features/index.ts", add:1, del:0, diff:`@@ -4,3 +4,4 @@\n export * from "./auth";\n+export * from "./${t.key.toLowerCase()}";`}]};
    }
    if(feedback) t.result.summary = t.result.summary.filter(s=>!s.startsWith("Revision")).concat([`Revision ${t.revision}: ${feedback}`]);
    t.duration = feedback ? "2m 05s" : "5m 48s";
    setState(t, "waiting_for_review", "Tests passed, waiting for your review"); toast(`${t.key} is ready for review`);
  });
}
function push(t){
  logs[t.key] = []; setState(t, "pushing", "You approved the changes", "you");
  if(isLocal(t) && t.after === "main"){
    runSteps(t, [{log:"git commit as Rustambek Abdusalomov", wait:700},{log:"git rebase origin/main", wait:700},{log:"git push origin main", wait:900}], () => {
      setState(t, "done", "Pushed to main", "ok"); toast(`${t.key} pushed to main`);
    });
    return;
  }
  const steps = [{log:`claude -p --model ${modelFor(t,"helper")}: write PR description`, wait:700},{log:"git commit as Rustambek Abdusalomov", wait:700},{log:`git push origin hiro/${t.key.toLowerCase()}`, wait:900},{log:"Opening pull request", wait:800}];
  if(!isLocal(t)) steps.push({log:"Moving Jira ticket to In Review", wait:600});
  runSteps(t, steps, () => {
    t.pr = isLocal(t) ? 60 + Math.floor(Math.random()*20) : 480 + Math.floor(Math.random()*40); setState(t, "done", isLocal(t) ? `PR #${t.pr} opened` : `PR #${t.pr} opened, Jira moved to In Review`, "ok"); toast(`Pushed. PR #${t.pr} is open`);
  });
}

  const f = e.target.closest("[data-f]"); if(f){ view = {...view, page:"list", filter:f.dataset.f, key:null}; render(); window.scrollTo(0,0); return; }

  const igg = e.target.closest("[data-ig-seg]"); if(igg && draftSettings){ setP(draftSettings.integ, igg.dataset.igSeg, igg.dataset.val); render(); return; }
  const igc = e.target.closest("[data-ig-chip]"); if(igc && draftSettings){ const pth = igc.dataset.igChip, arr = (getP(draftSettings.integ, pth) || []).slice(), v = igc.dataset.val; const ix = arr.indexOf(v); if(ix >= 0) arr.splice(ix,1); else arr.push(v); setP(draftSettings.integ, pth, arr); render(); return; }
  const iga = e.target.closest("[data-ig-acc]"); if(iga && draftSettings){ const acc = draftSettings.integ[iga.dataset.igAcc].access; acc[iga.dataset.val] = acc[iga.dataset.val] === false; render(); return; }
