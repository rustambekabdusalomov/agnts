name: hiro_mobile
description: hiro mobile app for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.0
  go_router: ^18.0.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.0
  dio: ^5.11.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  hiro_api:
    path: packages/hiro_api
  flutter_svg: ^2.3.0
  highlighting: ^0.9.0+11.8.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  # The demo's type (mobile.html): static cuts of the Google Fonts, OFL licensed.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700

# App icon: hiro's mark, as in the admin sidebar. After `flutter create`
# (see README), run `dart run flutter_launcher_icons` to write every size.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#16181D"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
