<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agnts mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --ink:#16181D; --ink-2:#555A63; --ink-3:#6B6F78; --ink-nav:#2B2E35;
  --line:#E4E2DC; --line-2:#EFEDE8; --line-3:#D2CFC6; --line-4:#D9D6CE; --hover:#F2F1ED; --row-hover:#FAF9F6; --field:#FAFAF8;
  --primary:#2E46A8; --primary-h:#25398C; --on-primary:#FFFFFF; --primary-soft:#E9ECF8; --primary-ink:#26398C; --ring:#DCE2F5; --help:#F3F5FC;
  --ok:#1F7A4D; --ok-soft:#E3F2EA; --ok-ink:#1A6B43;
  --warn:#C98A14; --warn-soft:#FBEFD9; --warn-ink:#8A510A;
  --bad:#B3261E; --bad-soft:#FBE4E2; --bad-ink:#A3241B;
  --gray-soft:#EFEEEA; --gray-ink:#4A4E57;
  --code:#16181D; --code-ink:#E9E7E1; --code-dim:#9AA0A8; --code-add:rgba(46,160,103,.22); --code-del:rgba(214,64,52,.24); --code-hunk:rgba(125,150,235,.18);
  --mark:#16181D; --mark-ink:#F4F3EF;
  --shadow:rgba(22,24,29,.35);
  --display:'Bricolage Grotesque','Noto Sans','Segoe UI',sans-serif;
  --sans:'Atkinson Hyperlegible Next','Noto Sans','Segoe UI',system-ui,sans-serif;
  --mono:'Atkinson Hyperlegible Mono','Noto Sans',ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --surface:#1B1D23; --ink:#ECEBE6; --ink-2:#B4B6BC; --ink-3:#8E9199; --ink-nav:#D6D7DB;
    --line:#2C2F37; --line-2:#24272E; --line-3:#3A3E46; --line-4:#3A3E46; --hover:#24272E; --row-hover:#20232A; --field:#16181D;
    --primary:#8299EC; --primary-h:#9AAEF1; --on-primary:#0F1220; --primary-soft:#232B4A; --primary-ink:#B5C3F3; --ring:#2F3A66; --help:#1D2340;
    --ok:#5CC28E; --ok-soft:#183626; --ok-ink:#7FD3A6;
    --warn:#F0B95A; --warn-soft:#3A2C12; --warn-ink:#F0B95A;
    --bad:#F08A80; --bad-soft:#3D1C1A; --bad-ink:#F08A80;
    --gray-soft:#2A2C33; --gray-ink:#C4C6CB;
    --code:#0D0E11; --mark:#ECEBE6; --mark-ink:#16181D; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1B1D23; --ink:#ECEBE6; --ink-2:#B4B6BC; --ink-3:#8E9199; --ink-nav:#D6D7DB;
  --line:#2C2F37; --line-2:#24272E; --line-3:#3A3E46; --line-4:#3A3E46; --hover:#24272E; --row-hover:#20232A; --field:#16181D;
  --primary:#8299EC; --primary-h:#9AAEF1; --on-primary:#0F1220; --primary-soft:#232B4A; --primary-ink:#B5C3F3; --ring:#2F3A66; --help:#1D2340;
  --ok:#5CC28E; --ok-soft:#183626; --ok-ink:#7FD3A6;
  --warn:#F0B95A; --warn-soft:#3A2C12; --warn-ink:#F0B95A;
  --bad:#F08A80; --bad-soft:#3D1C1A; --bad-ink:#F08A80;
  --gray-soft:#2A2C33; --gray-ink:#C4C6CB;
  --code:#0D0E11; --mark:#ECEBE6; --mark-ink:#16181D; --shadow:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0; height:100%}
body{background:var(--page); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit; color:inherit}
*:focus{outline:none}
button:focus-visible,a:focus-visible{box-shadow:0 0 0 3px var(--ring)}
:root{--page:#E9E8E3; --tabh:64px}
:root[data-theme="dark"]{--page:#0B0C0F}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--page:#0B0C0F} }

/* Phone frame on desktop, full screen on phones */
.stagewrap{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:28px 16px}
.phone{position:relative; width:390px; height:844px; max-height:calc(100vh - 80px); min-height:640px; border-radius:50px; background:var(--bg); overflow:hidden; box-shadow:0 0 0 11px #121317, 0 0 0 12px #3A3E46, 0 40px 90px -30px rgba(0,0,0,.55); isolation:isolate}
.caption{font-size:13.5px; color:var(--ink-3); text-align:center; max-width:390px}
.caption b{color:var(--ink-2)}
.sbar{position:absolute; top:0; left:0; right:0; height:50px; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:6px 30px 0 34px; font-weight:700; font-size:15px; pointer-events:none}
.sbar .island{position:absolute; left:50%; top:11px; width:118px; height:33px; transform:translateX(-50%); background:#000; border-radius:20px}
.sbar .icons{display:flex; gap:6px; align-items:center}
.sbar svg{width:18px; height:14px; fill:currentColor}
.home{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:var(--ink); opacity:.85; z-index:45; pointer-events:none}
.app{position:absolute; inset:0; display:flex; flex-direction:column; padding-top:50px}
@media (max-width:520px){
  .stagewrap{padding:0; display:block; min-height:0}
  .phone{width:100%; height:100vh; height:100dvh; max-height:none; min-height:0; border-radius:0; box-shadow:none}
  .sbar,.home,.caption{display:none}
  .app{padding-top:env(safe-area-inset-top,0px)}
}

/* Screens */
.view{flex:1; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding-bottom:24px}
.view::-webkit-scrollbar{width:0}
.hdr{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:8px 20px 14px}
.hdr h1{margin:0; font-family:var(--display); font-weight:700; font-size:32px; letter-spacing:-0.02em; line-height:1.05}
.hdr h1.long{font-size:25px; line-height:1.15}
.hdr .sub{margin:4px 0 0; color:var(--ink-3); font-size:14px}
.hdr-actions{display:flex; gap:8px; padding-bottom:2px}
.ibtn{width:40px; height:40px; border-radius:20px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2); flex:none}
.ibtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.ibtn:active{background:var(--hover)}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; padding:18px 20px 8px; font-size:13.5px; font-weight:700; color:var(--ink-3)}
.sec-h b{color:var(--ink); font-size:13.5px}
.pad{padding:0 16px}
.stack{display:flex; flex-direction:column; gap:10px}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px}
.tcard{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; cursor:pointer; transition:transform .12s ease, background-color .12s}
.tcard:active{transform:scale(.985); background:var(--hover)}
.tcard .top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px}
.tcard .key{font-family:var(--mono); font-size:12.5px; color:var(--ink-3)}
.tcard .ttl{font-weight:700; font-size:16px; line-height:1.3}
.tcard .meta{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; color:var(--ink-3); flex-wrap:wrap}
.tcard .act{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line-2); font-size:13.5px; font-weight:700; color:var(--primary-ink)}
.tcard .act.warn{color:var(--warn-ink)} .tcard .act.bad{color:var(--bad-ink)}
.tcard .act svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; margin-left:auto}
.live-line{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--ink-2); min-width:0}
.live-line span.txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:12.5px}
.pulse{flex:none; width:8px; height:8px; border-radius:50%; background:var(--primary); animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.55); opacity:.6}}
.dot{display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:6px; vertical-align:0}
.src{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:6px; font-size:11.5px; font-weight:700; background:var(--gray-soft); color:var(--gray-ink)}
.src.local{background:#F0E8F8; color:#5E3790}
:root[data-theme="dark"] .src.local{background:#2E2340; color:#CDB4EE}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .src.local{background:#2E2340; color:#CDB4EE} }

.badge{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:12px; font-size:12px; font-weight:700; white-space:nowrap}
.badge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.b-ok{background:var(--ok-soft); color:var(--ok-ink)} .b-warn{background:var(--warn-soft); color:var(--warn-ink)} .b-bad{background:var(--bad-soft); color:var(--bad-ink)} .b-info{background:var(--primary-soft); color:var(--primary-ink)} .b-gray{background:var(--gray-soft); color:var(--gray-ink)}

/* Usage strip */
.usage{display:block; width:100%; text-align:left; cursor:pointer}
.u-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14px; font-weight:700; color:var(--ink-2)}
.u-row b{font-family:var(--display); font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums}
.u-row b.warn{color:var(--warn-ink)} .u-row b.bad{color:var(--bad-ink)}
.bar{height:8px; border-radius:4px; background:var(--line-2); overflow:hidden; margin:8px 0 6px}
.bar>span{display:block; height:100%; border-radius:4px; background:var(--primary); transition:width .4s}
.bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)}
.u-foot{display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--ink-3); flex-wrap:wrap}

/* Chips + search */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; min-height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--line-4); background:var(--surface); font-size:14px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.chip .n{opacity:.7; margin-left:4px}
.search{display:flex; align-items:center; gap:8px; margin:0 16px 12px; border:1px solid var(--line-4); border-radius:12px; padding:0 12px; min-height:44px; background:var(--surface)}
.search svg{width:18px; height:18px; stroke:var(--ink-3); fill:none; stroke-width:2; stroke-linecap:round; flex:none}
.search input{border:0; outline:none; background:none; width:100%; font-size:16px; box-shadow:none}
.search:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.empty{padding:36px 24px; text-align:center; color:var(--ink-3)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:4px}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:48px; padding:0 18px; border-radius:14px; border:1px solid var(--line-3); background:var(--surface); color:var(--ink); font-size:15.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:transform .1s, background-color .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.btn-d{color:var(--bad-ink)}
.btn-s{min-height:38px; padding:0 14px; font-size:14px; border-radius:11px}
.btn:disabled{opacity:.45; transform:none}
.btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.fab{position:absolute; right:18px; bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px)); z-index:20; width:58px; height:58px; border-radius:20px; border:0; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 30px -10px rgba(46,70,168,.6); cursor:pointer}
.fab svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round}
.fab:active{transform:scale(.95)}

/* Tab bar */
.tabbar{flex:none; display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); position:relative; z-index:10}
.phone:not(.real) .tabbar{padding-bottom:22px}
.tab{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:none; padding:6px 0; font-size:11px; font-weight:700; color:var(--ink-3); cursor:pointer; min-width:0}
.tab span.l{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px}
.tab svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--primary)}
.tab .bdg{position:absolute; top:2px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--surface)}

/* Detail */
.navbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 10px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.back{display:inline-flex; align-items:center; gap:2px; border:0; background:none; color:var(--primary); font-size:16px; font-weight:700; cursor:pointer; padding:8px 6px; min-height:40px}
.back svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.navbar .ttl{font-family:var(--mono); font-size:14px; color:var(--ink-2); position:absolute; left:50%; transform:translateX(-50%)}
.d-head{padding:6px 20px 0}
.d-head .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; font-size:13px; color:var(--ink-3)}
.d-head h1{margin:0 0 8px; font-family:var(--display); font-weight:700; font-size:25px; line-height:1.15; letter-spacing:-0.01em}
.d-head p{margin:0; color:var(--ink-2); font-size:15px}
.track{display:grid; grid-template-columns:repeat(6,1fr); margin:18px 16px 4px; padding:14px 6px 12px; background:var(--surface); border:1px solid var(--line); border-radius:18px}
.stop{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.stop::before{content:""; position:absolute; top:10px; left:-50%; width:100%; height:2px; background:var(--line)}
.stop:first-child::before{display:none}
.stop.done::before,.stop.active::before,.stop.error::before{background:var(--primary)}
.mark{position:relative; z-index:1; width:22px; height:22px; border-radius:50%; background:var(--surface); border:2px solid var(--line-3); display:grid; place-items:center}
.stop.gate .mark{border-radius:5px; transform:rotate(45deg); width:18px; height:18px; margin:2px 0}
.stop.done .mark{background:var(--primary); border-color:var(--primary)}
.stop.done .mark svg{width:11px; height:11px; stroke:var(--on-primary); fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.stop.gate.done .mark svg{transform:rotate(-45deg)}
.stop.active .mark{border-color:var(--primary); background:var(--primary-soft)}
.stop.active:not(.gate) .mark::after{content:""; width:7px; height:7px; border-radius:50%; background:var(--primary); animation:pulse 1.2s infinite}
.stop.gate.active .mark{background:var(--warn); border-color:var(--warn)}
.stop.error .mark{background:var(--bad-soft); border-color:var(--bad)}
.stop .lbl{font-size:10.5px; line-height:1.15; color:var(--ink-3); font-weight:700; max-width:58px}
.stop.active .lbl,.stop.error .lbl{color:var(--ink)}
.stop.gate.active .lbl{color:var(--warn-ink)}
.block{margin:14px 16px 0}
.block h2{margin:0 0 4px; font-size:18px; font-weight:700}
.block .sub{margin:0 0 4px; color:var(--ink-3); font-size:14px}
.h3{margin:18px 0 8px; font-size:13px; font-weight:700; color:var(--ink-3)}
.plan{margin:0; padding-left:20px} .plan li{margin:4px 0}
details.fold{border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden; margin-top:10px}
details.fold > summary{list-style:none; cursor:pointer; padding:14px 16px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:10px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:""; width:8px; height:8px; border-right:2px solid var(--ink-3); border-bottom:2px solid var(--ink-3); transform:rotate(45deg); margin-top:-4px; transition:transform .15s}
details.fold[open] > summary::after{transform:rotate(-135deg); margin-top:4px}
details.fold > summary .hint{font-weight:400; margin-left:auto}
details.fold .in{padding:0 16px 14px}
.q{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:10px}
.q p{margin:0 0 10px; font-weight:700}
.opts{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.opt{min-height:38px; padding:0 14px; border-radius:19px; border:1px solid var(--line-4); background:var(--surface); font-size:14px; font-weight:700; color:var(--ink-2); cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
textarea,.inp{width:100%; border:1px solid var(--line-3); border-radius:12px; background:var(--surface); padding:11px 12px; font-size:16px; line-height:1.4; transition:border-color .15s, box-shadow .15s}
textarea{min-height:70px; resize:vertical}
.inp{min-height:46px}
textarea:focus,.inp:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--ring)}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 0}
.facts div{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
.facts dt{font-size:12.5px; color:var(--ink-3)}
.facts dd{margin:2px 0 0; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums}
.facts dd.ok{color:var(--ok-ink)} .facts dd.bad{color:var(--bad-ink)}
.log{font-family:var(--mono); font-size:12px; background:var(--code); color:var(--code-ink); border-radius:14px; padding:12px; max-height:260px; overflow:auto; line-height:1.65}
.log div{white-space:pre-wrap; word-break:break-word}
.log .t{color:var(--code-dim); margin-right:8px}
.log .cur::after{content:"▍"; animation:blink 1s steps(1) infinite; color:#8FA4F0}
@keyframes blink{50%{opacity:0}}
.file{border:1px solid var(--line); border-radius:14px; margin-top:8px; overflow:hidden; background:var(--surface)}
.file summary{list-style:none; cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; font-family:var(--mono); font-size:12.5px}
.file summary::-webkit-details-marker{display:none}
.file summary span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left}
.n{font-family:var(--sans); font-size:12.5px; white-space:nowrap; font-weight:700}
.n .a{color:var(--ok-ink)} .n .d{color:var(--bad-ink); margin-left:5px}
.diff{overflow-x:auto; background:var(--code); color:var(--code-ink)}
.diff pre{margin:0; font-family:var(--mono); font-size:11.5px; line-height:1.6; min-width:max-content; padding:6px 0}
.diff span{display:block; padding:0 12px}
.diff .add{background:var(--code-add)} .diff .del{background:var(--code-del)} .diff .hunk{background:var(--code-hunk); color:#B9C6F5}
.summary p{margin:0 0 8px}
.help{display:flex; gap:10px; align-items:flex-start; border-radius:14px; padding:12px 14px; font-size:14.5px; background:var(--help); color:var(--primary-ink); border:1px solid var(--ring)}
.help svg{flex:none; width:18px; height:18px; margin-top:2px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round}
.help p{margin:0}
.help.warn{background:var(--warn-soft); color:var(--warn-ink); border-color:transparent}
.help.bad{background:var(--bad-soft); color:var(--bad-ink); border-color:transparent}

// Durations: "6m 12s", "1h 0m", "2d 3h", "25s"
const U = {ru:{d:"д",h:"ч",m:"мин",s:"с"}, uz:{d:"kun",h:"soat",m:"daq",s:"son"}};
const durRe = /\b(\d+)([dhms])\b/g;
const isDur = /^(\d+[dhms])( \d+[dhms])*$/;
function dur(lang, txt){ return txt.replace(durRe, (_, n, u) => n + " " + U[lang][u]); }
const R = (n, a, b, c) => plRu(+n, a, b, c);

function patterns(L){
  const ru = L === "ru";

    [/^Yest\. (\d\d:\d\d)$/, m => (ru ? "Вчера " : "Kecha ") + m[1]],
    [/^(\d+) tickets?$/, m => ru ? `${m[1]} ${R(m[1],"тикет","тикета","тикетов")}` : `${m[1]} ta tiket`],
    [/^(\d+) questions? before coding$/, m => ru ? `${m[1]} ${R(m[1],"вопрос","вопроса","вопросов")} до разработки` : `Kod yozishdan oldin ${m[1]} ta savol`],
    [/^(\d+) questions? left to answer$/, m => ru ? `Осталось ответить: ${m[1]}` : `Javob berilmagan: ${m[1]} ta`],

    [/^(\d+) events?, grouped by step$/, m => ru ? `${m[1]} ${R(m[1],"событие","события","событий")}, по шагам` : `${m[1]} ta hodisa, bosqichlar boʻyicha`],
    [/^(\d+) events?(?:, ([\dhmsd ]+))?(,)?$/, m => (ru ? `${m[1]} ${R(m[1],"событие","события","событий")}` : `${m[1]} ta hodisa`) + (m[2] ? ", " + D(m[2]) : "") + (m[3] || "")],

    [/^Nothing has left the server yet\. Approving commits as you, pushes (\S+) and opens a pull request\.$/, m => ru ? `Пока ничего не покинуло сервер. При одобрении будет коммит от вашего имени, отправка ${m[1]} и пул-реквест.` : `Hozircha serverdan hech narsa chiqmadi. Tasdiqlasangiz, sizning nomingizdan commit qilinadi, ${m[1]} yuboriladi va pull request ochiladi.`],

    [/^Working in a fresh container on (\S+)\. You review the diff before anything is pushed\.$/, m => ru ? `Работает в новом контейнере на ветке ${m[1]}. Вы проверите изменения до отправки.` : `${m[1]} branchida yangi konteynerda ishlamoqda. Yuborishdan oldin oʻzgarishlarni tekshirasiz.`],
    [/^Looking through (\S+) to build a plan\.$/, m => ru ? `Изучает ${m[1]}, чтобы составить план.` : `Reja tuzish uchun ${m[1]} ni koʻrib chiqmoqda.`],
    [/^Read-only access to (\S+)$/, m => ru ? `Доступ к ${m[1]} только на чтение` : `${m[1]} ga faqat oʻqish uchun kirish`],
    [/^The branch was discarded( and the ticket went back to you in Jira)?\.$/, m => ru ? (m[1] ? "Ветка удалена, тикет вернулся к вам в Jira." : "Ветка удалена.") : (m[1] ? "Branch oʻchirildi, tiket Jira'da sizga qaytdi." : "Branch oʻchirildi.")],
    [/^(Coding|Review the changes|Running tests), revision (\d+)$/, m => ({"Coding":ru?"Разработка":"Kod yozish","Review the changes":ru?"Проверьте изменения":"Oʻzgarishlarni tekshiring","Running tests":ru?"Идут тесты":"Testlar ishlamoqda"})[m[1]] + (ru ? `, ревизия ${m[2]}` : `, ${m[2]}-reviziya`)],
    [/^rev (\d+)$/, m => ru ? `рев. ${m[1]}` : `${m[1]}-rev.`],
    [/^Back to (.+)$/, m => (ru ? "Назад: " : "Orqaga: ") + (I18N[L].exact[m[1].replace(/^./, c=>c.toUpperCase())] || m[1]).toLowerCase()],
    [/^All repositories (\d+)$/, m => (ru ? "Все репозитории " : "Barcha repozitoriylar ") + m[1]],
    [/^(.+?), tests: (.+?), (\d+) open$/, m => ru ? `${m[1]}, тесты: ${m[2]}, открыто: ${m[3]}` : `${m[1]}, testlar: ${m[2]}, ochiq: ${m[3]}`],
    [/^(\d+) repositor(?:y has|ies have) no CLAUDE\.md\. (.+)$/, m => ru ? `${m[1]} ${R(m[1],"репозиторий","репозитория","репозиториев")} без CLAUDE.md. agnts всё равно работает, но тратит больше шагов, чтобы разобраться. Добавьте файл со структурой проекта, соглашениями и командами тестов.` : `${m[1]} ta repozitoriyda CLAUDE.md yoʻq. agnts baribir ishlaydi, lekin yoʻl topish uchun koʻproq qadam sarflaydi. Loyiha tuzilmasi, qoidalari va test buyruqlari yozilgan fayl qoʻshing.`],

    [/^Details for question (\d+)$/, m => ru ? `Детали к вопросу ${m[1]}` : `${m[1]}-savolga tafsilot`],

    [/^You retried with: (.+)$/, m => (ru ? "Вы повторили с указаниями: " : "Koʻrsatma bilan qayta urindingiz: ") + m[1]],
    [/^Moved to (.+)$/, m => (ru ? "Переход: " : "Holat: ") + (I18N[L].exact[m[1].replace(/^./, c=>c.toUpperCase())] || m[1]).toLowerCase()],
    [/^Find where this belongs in (\S+)$/, m => ru ? `Найти, где это должно быть в ${m[1]}` : `${m[1]} da buning oʻrnini topish`],
    [/^Implement: (.+)$/, m => (ru ? "Реализовать: " : "Amalga oshirish: ") + m[1]],
    [/^Implemented: (.+)$/, m => (ru ? "Реализовано: " : "Amalga oshirildi: ") + m[1]],
    [/^Run the tests \((.+)\)$/, m => (ru ? `Запустить тесты (${m[1]})` : `Testlarni ishga tushirish (${m[1]})`)],
    [/^Revision (\d+): (.+)$/, m => (ru ? `Ревизия ${m[1]}: ` : `${m[1]}-reviziya: `) + m[2]],
    [/^Should "(.+)" come with automated tests, or is a manual check enough for now\?$/, m => ru ? `Нужны ли для «${m[1]}» автотесты, или пока хватит ручной проверки?` : `«${m[1]}» uchun avtotestlar kerakmi yoki hozircha qoʻlda tekshirish yetarlimi?`],
    [/^The prefix (\S+) is already used\. Pick another one\.$/, m => ru ? `Префикс ${m[1]} уже занят. Выберите другой.` : `${m[1]} prefiksi band. Boshqasini tanlang.`],
    [/^(\S+) needs your answers$/, m => ru ? `${m[1]}: нужны ваши ответы` : `${m[1]}: javoblaringiz kerak`],
    [/^(\S+) is ready for review$/, m => ru ? `${m[1]} готов к ревью` : `${m[1]} tekshiruvga tayyor`],

    [/^Copied (\d+) events as JSON$/, m => ru ? `Скопировано событий в JSON: ${m[1]}` : `${m[1]} ta hodisa JSON sifatida nusxalandi`],

const PREF_KEY = "agnts-prefs";
let prefs = {theme:"light", lang:"en"};
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch(e){}

const LOCALE = {en:"en-GB", ru:"ru-RU", uz:"uz-Latn-UZ"};
function locDate(d, o){
  if(prefs.lang !== "uz") return d.toLocaleDateString(LOCALE[prefs.lang], o);
  const WL = ["yakshanba","dushanba","seshanba","chorshanba","payshanba","juma","shanba"], WS = ["Yak","Du","Se","Cho","Pa","Ju","Sha"];
  const ML = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"], MS = ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
  if(o.weekday === "short" && !o.day) return WS[d.getDay()];
  if(o.weekday === "long"){ const w = WL[d.getDay()]; return w[0].toUpperCase() + w.slice(1) + ", " + d.getDate() + "-" + ML[d.getMonth()]; }
  return d.getDate() + "-" + (o.month === "short" ? MS[d.getMonth()] : ML[d.getMonth()]);
}

/* Translation: UI is written in English; after each render the DOM is translated.
   Ticket content, code, commands and logs written by tools stay as they are. */
function tr(str){
  if(prefs.lang === "en" || !str) return str;
  const D = I18N[prefs.lang]; if(!D) return str;
  const lead = str.match(/^\s*/)[0], trail = str.match(/\s*$/)[0], core = str.trim();
  if(!core) return str;
  if(Object.prototype.hasOwnProperty.call(D.exact, core)) return lead + D.exact[core] + trail;
  for(const [re, fn] of D.re){ const m = core.match(re); if(m) return lead + (typeof fn === "function" ? fn(m) : core.replace(re, fn)) + trail; }
  return str;
}
const NO_TR = ".diff,.log,pre,.tkey,.ttitle-raw,input,textarea,code,.notr";
function translateDom(root){
  if(prefs.lang === "en" || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p = n.parentElement; if(!p || p.closest(NO_TR)) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){ const t = tr(n.nodeValue); if(t !== n.nodeValue) n.nodeValue = t; }
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el => {
    for(const a of ["placeholder","aria-label","title"]){ const v = el.getAttribute(a); if(v){ const t = tr(v); if(t !== v) el.setAttribute(a, t); } }
  });
}
function plRu(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10; return (a > 10 && a < 20) ? many : b === 1 ? one : (b >= 2 && b <= 4) ? few : many; }

function lvl(u){ return u >= 1 ? "bad" : u >= 0.8 ? "warn" : ""; }
function resetText(ms){
  const d = ms - Date.now(); if(d <= 0) return "Resetting now";
  const h = Math.floor(d/3600000), m = Math.floor(d%3600000/60000);
  if(h >= 24){ const dt = new Date(ms); return "Resets " + locDate(dt, {weekday:"short"}) + " " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0"); }
  return `Resets in ${h ? h+"h " : ""}${m}m`;
}
function agoText(ms){ const m = Math.round((Date.now()-ms)/60000); return m < 1 ? "Updated just now" : m < 60 ? `Updated ${m} min ago` : `Updated ${Math.floor(m/60)}h ago`; }
function rollWindows(){
  const n = Date.now();
  if(n >= usage.five_hour.resetsAt){ usage.five_hour.u = 0; usage.five_hour.resetsAt = n + 5*3600000; usage.updatedAt = n; }
  if(n >= usage.seven_day.resetsAt){ usage.seven_day.u = 0; usage.seven_day.resetsAt = n + 7*86400000; usage.updatedAt = n; }
}
function bumpUsage(d, t){
  usage.five_hour.u = Math.min(1, usage.five_hour.u + d);
  usage.seven_day.u = Math.min(1, usage.seven_day.u + d/5);
  usage.updatedAt = Date.now(); renderPill();
  const pct = Math.round(usage.five_hour.u*100);
  if(t && pct - lastLimitPct >= 2){ lastLimitPct = pct; const st = usage.five_hour.u >= 1 ? "rejected" : usage.five_hour.u >= 0.8 ? "allowed_warning" : "allowed";
    logEvent(t, "limit", `Session ${pct}%, ${st.replace("_"," ")}`, {level: st==="allowed" ? "info" : "warn", detail:{type:"rate_limit_event", rate_limit_info:{status:st, unifiedWindows:{five_hour:{utilization:+usage.five_hour.u.toFixed(2)}, seven_day:{utilization:+usage.seven_day.u.toFixed(2)}}}}}); }
}

}


/* ---------- Logs ---------- */
function fmtDur(ms){
  if(ms == null) return "";
  const sec = Math.round(ms/1000);
  if(sec < 60) return sec + "s";
  const m = Math.floor(sec/60), h = Math.floor(m/60);
  if(h >= 24) return Math.floor(h/24) + "d " + (h%24) + "h";
  if(h) return h + "h " + (m%60) + "m";
  return m + "m " + (sec%60) + "s";
}
function fmtTs(ts){
  const d = new Date(ts), t0 = new Date(); t0.setHours(0,0,0,0);
  const hms = [d.getHours(), d.getMinutes(), d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
  if(ts >= t0.getTime()) return hms;
  if(ts >= t0.getTime() - 86400000) return "Yest. " + hms.slice(0,5);
  return locDate(d, {weekday:"short"}) + " " + hms.slice(0,5);
}
function typeBadge(e){ const [l,c] = TYPES[e.type] || ["Event","b-gray"]; return `<span class="badge ${e.level==="warn" && e.type==="limit" ? "b-warn" : c}">${l}</span>`; }

/* Time spent in each state, from consecutive state transitions */
function stateDurations(){
  const acc = {}, by = {};
  for(const e of events){ if(e.type!=="state" && e.type!=="user") continue; if(!e.detail) continue; let d; try{ d = JSON.parse(e.detail); }catch(x){ continue; } if(!d.to) continue; (by[e.key] ||= []).push({ts:e.ts, to:d.to}); }
  for(const k in by){
    const L = by[k];
    for(let i=0;i<L.length;i++){
      const cur = L[i], next = L[i+1];
      if(cur.to === "done" || cur.to === "rejected") continue;
      if(!next) continue; // step still in progress: only finished steps count toward averages
      const end = next.ts;
      if(end <= cur.ts) continue;
      (acc[cur.to] ||= []).push(end - cur.ts);
    }
  }
  const avg = (k) => acc[k] && acc[k].length ? acc[k].reduce((a,b)=>a+b,0)/acc[k].length : null;
  return [["Analyze","analyzing",false],["Waiting for your answers","waiting_for_answers",true],["Coding","coding",false],["Tests","testing",false],["Waiting for your review","waiting_for_review",true],["Push","pushing",false]].map(([l,k,you])=>({l, you, v:avg(k), n:(acc[k]||[]).length}));
}
function logStats(){
  const runs = events.filter(e => (e.type==="state"||e.type==="user") && e.detail && e.detail.includes('"to": "coding"') && !e.msg.startsWith("You requested")).length;
  const reviews = events.filter(e => e.detail && e.detail.includes('"to": "waiting_for_review"')).length;
  const stops = events.filter(e => e.detail && (e.detail.includes('"to": "failed"') || e.detail.includes('"to": "rate_limited"'))).length;
  const withTurns = tickets.filter(t=>t.turns>0);
  const avgTurns = withTurns.length ? Math.round(withTurns.reduce((a,t)=>a+t.turns,0)/withTurns.length) : 0;
  return {runs, reviews, stops, avgTurns, errors: events.filter(e=>e.level==="error").length};
}
function filteredEvents(){
  const k = logView.key.trim().toLowerCase();
  return events.filter(e =>
    (logView.type==="all" || e.type===logView.type || (logView.type==="problems" && (e.level!=="info"))) &&
    (!logView.errors || e.level==="error") &&
    (!k || e.key.toLowerCase().includes(k))
  ).slice().reverse();
}

 list:{title:"Списки тикетов", intro:"Всё, чем занимается agnts, разложено по статусам. Фильтры в боковой панели ведут в этот же список.", items:[

 detail:{title:"Страница тикета", intro:"Путь одного тикета от получения до отправки. Шкала вверху показывает, где он сейчас. Шаги-ромбы — это места, где agnts ждёт вас.", items:[

  ["Модели для этого тикета","Замените модель по умолчанию только для этого тикета, например Opus для сложного изменения или Haiku для небольшого."],
  ["Лог в реальном времени","Пока agnts работает, видно каждый шаг, модель, число шагов и использование сессии. «Остановить запуск» прерывает работу и сохраняет ветку."],
  ["Ревью","Прочитайте, что сделал agnts, проверьте тесты и изменения. «Одобрить и отправить» делает коммит от вашего имени. «Запросить изменения» передаёт ваш комментарий в ту же сессию. «Отклонить» удаляет ветку."],

 tasks:{title:"Задачи", intro:"Задачи — для репозиториев вне Jira, например ваших личных проектов. Они проходят те же шаги, что и тикеты Jira.", items:[

const GUIDE_LBL = {en:"How this page works", ru:"Как устроена страница", uz:"Sahifa qanday ishlaydi"};
/* ---------- Charts (inline SVG, theme-aware) ---------- */
function chartBars(series, opts){
  // series: [{label, values:[...], color}] stacked; labels: x labels
  const W = opts.w || 640, H = opts.h || 190, pl = 32, pr = 8, pt = 10, pb = 24;
  const n = opts.labels.length, max = Math.max(1, ...opts.labels.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0)));
  const top = Math.ceil(max / 4) * 4 || 4, bw = (W-pl-pr)/n, gap = Math.min(6, bw*0.25);
  let g = "";
  for(let k=0;k<=4;k++){ const y = pt + (H-pt-pb)*(1-k/4); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line-2)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${Math.round(top*k/4)}</text>`; }
  opts.labels.forEach((lb,i)=>{

function push(t){

/* ---- Dashboard + Analytics (mobile) ---- */
let anPeriod = 30;
function kcard(lbl, val, note, act, extra){ return `<button class="card kc" ${act}><span class="lbl">${lbl}</span><span class="val">${val}</span>${extra||""}<span class="note">${note}</span></button>`; }
function scrHome(){

  const nA = needs.filter(x=>x.t.state==="waiting_for_answers").length, nR = needs.filter(x=>x.t.state==="waiting_for_review").length, nS = needs.length-nA-nR;
  const wk = periodStats(7,0), pw = periodStats(7,7);

  const pipe = [["In queue",["new"],"var(--line-3)"],["Analyze",["analyzing"],"#7F95E8"],["Your answers",["waiting_for_answers"],"var(--warn)"],["Coding",["coding","testing"],"var(--primary)"],["Your review",["waiting_for_review"],"var(--warn)"],["Stopped",["failed","rate_limited"],"var(--bad)"]].map(([lb,st,c])=>({lb,c,n:tickets.filter(t=>st.includes(t.state)).length}));
  const pT = pipe.reduce((a,x)=>a+x.n,0) || 1;
  const recent = events.filter(e=>e.ts <= Date.now()).sort((a,b)=>b.ts-a.ts).slice(0,6);
  return hdr(`${greet}, Rustam`, locDate(new Date(), {weekday:"long", day:"numeric", month:"long"})) + `
    <div class="kgrid">

      ${kcard("Running now", run.length, `${settings.parallel} at a time allowed`, 'data-go="tickets:running"')}
      ${kcard("Pushed this week", `${wk.pushed}${delta(wk.pushed, pw.pushed, true)}`, `vs ${pw.pushed} last week`, 'data-go="analytics"')}
      ${kcard("Plan session", `<span class="${l}">${p}%</span>`, resetText(usage.five_hour.resetsAt), 'data-go="more"', `<span class="bar ${l}" style="margin:6px 0 4px"><span style="width:${p}%"></span></span>`)}
    </div>
    <div class="sec-h"><span>Waiting on you</span><b>${needs.length}</b></div>
    <div class="pad stack">${needs.length ? needs.map(({t,since})=>tcard(t, true, since)).join("") : `<div class="help ok">${mi("check")}<p>Nothing is waiting on you. agnts will show tickets here when it needs answers or a review.</p></div>`}</div>
    ${run.length ? `<div class="sec-h"><span>Live runs</span><b>${run.length}</b></div><div class="pad stack">${run.map(t=>tcard(t,false)).join("")}</div>` : ""}
    <div class="sec-h"><span>Pipeline</span></div>
    <div class="pad"><div class="card"><div class="stackbar">${pipe.filter(x=>x.n).map(x=>`<span style="width:${x.n/pT*100}%;background:${x.c}"></span>`).join("")}</div>
      <div class="pipe-l">${pipe.map(x=>`<div><i style="background:${x.c}"></i><span>${x.lb}</span><b>${x.n}</b></div>`).join("")}</div></div></div>
    <div class="sec-h"><span>Today by hour</span></div>
    <div class="pad"><div class="card">${chartBars([{label:"agnts", values:byH.map(x=>x[0]), color:"var(--primary)"},{label:"You", values:byH.map(x=>x[1]), color:"var(--warn)"},{label:"Errors", values:byH.map(x=>x[2]), color:"var(--bad)"}], {labels:byH.map((_,i)=>String(i).padStart(2,"0")), maxLabels:6, w:340, h:180, aria:"Events today by hour"})}
      ${legend([["var(--primary)","agnts working"],["var(--warn)","Your actions"],["var(--bad)","Warnings and errors"]])}</div></div>
    <div class="sec-h"><span>This week</span><span>Compared with last week</span></div>
    <div class="pad"><div class="card">
      <div class="mini-kv"><span>Tickets picked up</span><b>${wk.picked}${delta(wk.picked, pw.picked, true)}</b></div>
      <div class="mini-kv"><span>Approved on first try</span><b>${pct(wk.firstTry,wk.pushed)}%${delta(pct(wk.firstTry,wk.pushed), pct(pw.firstTry,pw.pushed), true)}</b></div>
      <div class="mini-kv"><span>Average turns</span><b>${Math.round(wk.turns)}${delta(wk.turns, pw.turns, false)}</b></div>
      <div class="mini-kv"><span>Waiting on you, average</span><b>${fmtMin(wk.waitMin)}${delta(wk.waitMin, pw.waitMin, false)}</b></div>
      <div class="mini-kv"><span>Stopped runs</span><b>${wk.stopped}${delta(wk.stopped, pw.stopped, false)}</b></div></div></div>
    <div class="sec-h"><span>Recent activity</span><button class="link-btn" data-go="analytics:events">Events</button></div>
    <div class="pad"><div class="list"><ul class="feed">${recent.map(e=>`<li><button class="fe lv-${e.level}" data-open="${e.key}"><span class="ts">${fmtTs(e.ts).replace(/^Yest\. /,"").slice(0,5)}</span><span class="ln"><span class="notr">${e.key}</span>${typeBadge(e)}</span><span class="msg">${esc(e.msg)}</span></button></li>`).join("")}</ul></div></div>`;
}
function scrAnalytics(){
  const sub = `<div class="pad" style="margin-bottom:12px"><div class="seg full">${[["analytics","Analytics"],["events","Events"]].map(([v,l])=>`<button class="seg-b" data-asub="${v}" aria-pressed="${mv.asub===v}">${l}</button>`).join("")}</div></div>`;
  if(mv.asub === "events") return hdr("Analytics") + sub + scrActivity(true);
  const P = anPeriod, cur = periodStats(P,0), prev = periodStats(P,P);
  const labels = cur.days.map(d=>dayLabel(d.date, P)), ml = P > 30 ? 4 : P > 7 ? 5 : 7;
  const success = pct(cur.pushed, cur.picked), first = pct(cur.firstTry, cur.pushed);
  const outcomes = [{label:"Approved on first try", v:cur.firstTry, color:"var(--ok)"},{label:"Approved after changes", v:cur.changes, color:"#7F95E8"},{label:"Rejected", v:cur.rejected, color:"var(--line-3)"},{label:"Stopped", v:cur.stopped, color:"var(--bad)"}];
  const steps = [{l:"Analyze", v:4.2},{l:"Waiting for your answers", v:cur.answerMin, cls:"warn"},{l:"Coding", v:cur.agntsMin*0.7},{l:"Tests", v:cur.agntsMin*0.3},{l:"Waiting for your review", v:cur.reviewMin, cls:"warn"},{l:"Push", v:0.4}];
  const stopRows = [{l:"Tests kept failing", v:cur.stops.tests, cls:"bad"},{l:"Plan limit reached", v:cur.stops.limit, cls:"warn"},{l:"Stopped by you", v:cur.stops.you},{l:"Turn limit reached", v:cur.stops.turns}].sort((a,b)=>b.v-a.v);
  const MS = {haiku:{ok:72, turns:27, use:2.1}, sonnet:{ok:84, turns:22, use:5.5}, opus:{ok:91, turns:17, use:10.4}};
  const allR = allReposM();
  const repoRows = Object.entries(cur.repos).map(([name,n])=>{ const info = allR.find(r=>r.name===name) || {}, md = info.claudeMd !== false, r = rng(name.length*131+P);
    return {name, n, md, color:info.color, ok:Math.round(Math.min(0.97,(md?0.84:0.66)+r()*0.08)*100), turns:Math.round((md?19:29)+r()*5)}; }).sort((a,b)=>b.n-a.n);
  const hours = Array.from({length:24},(_,h)=>{ const r = rng(h*977+P*31); const shape = 0.18 + 0.55*Math.exp(-((h-11)**2)/6) + 0.65*Math.exp(-((h-15.5)**2)/7) + (h>=22||h<=2 ? 0.2 : 0); return Math.round((shape*26 + r()*6) * P/30); });
  const noMd = repoRows.filter(r=>!r.md && r.n), withMd = repoRows.filter(r=>r.md && r.n);
  const avgT = (rows) => rows.length ? rows.reduce((a,r)=>a+r.turns*r.n,0)/rows.reduce((a,r)=>a+r.n,0) : 0;
  const mdGain = noMd.length && withMd.length ? Math.round((1-avgT(withMd)/avgT(noMd))*100) : 0;
  const waitShare = pct(cur.waitMin, cur.waitMin + cur.agntsMin);
  const T = (en, ru, uz) => ({en, ru, uz})[prefs.lang], names = noMd.map(r=>r.name).join(", ");
  const insights = [
    mdGain > 0 ? T(`Repositories with a CLAUDE.md finish in ${mdGain}% fewer turns. Adding one to ${names} is the quickest win.`, `Репозитории с CLAUDE.md завершают работу за ${mdGain}% меньше шагов. Добавить его в ${names} — самый быстрый выигрыш.`, `CLAUDE.md bor repozitoriylar ishni ${mdGain}% kamroq qadamda tugatadi. Uni ${names} ga qoʻshish eng tez natija beradi.`) : null,
    T(`${waitShare}% of a ticket's total time is spent waiting on you. Reviews take the longest, about ${fmtMin(cur.reviewMin)} on average.`, `${waitShare}% всего времени тикета уходит на ожидание вас. Дольше всего ждут ревью — в среднем ${tr(fmtMin(cur.reviewMin))}.`, `Tiket umumiy vaqtining ${waitShare}% sizni kutish bilan oʻtadi. Eng uzoq kutiladigani tekshiruv — oʻrtacha ${tr(fmtMin(cur.reviewMin))}.`)
  ].filter(Boolean);
  return hdr("Analytics") + sub + `
    <div class="pad"><div class="seg full">${[[7,"7 days"],[30,"30 days"],[90,"90 days"]].map(([v,lb])=>`<button class="seg-b" data-period="${v}" aria-pressed="${anPeriod===v}">${lb}</button>`).join("")}</div>
      <p class="hint-s">Changes are compared with the previous ${P} days. Green means better.</p></div>
    <div class="kgrid">
      ${kcard("Tickets pushed", `${cur.pushed}${delta(cur.pushed, prev.pushed, true)}`, `of ${cur.picked} picked up`, "")}
      ${kcard("Success rate", `${success}%${delta(success, pct(prev.pushed, prev.picked), true)}`, "Pushed out of picked up", "")}
      ${kcard("Approved on first try", `${first}%${delta(first, pct(prev.firstTry, prev.pushed), true)}`, "No changes requested", "")}
      ${kcard("agnts time per ticket", `${fmtMin(cur.agntsMin)}${delta(cur.agntsMin, prev.agntsMin, false)}`, "Analyze, coding and tests", "")}
      ${kcard("Waiting on you", `${fmtMin(cur.waitMin)}${delta(cur.waitMin, prev.waitMin, false)}`, "Average per ticket", "")}
      ${kcard("Average turns", `${Math.round(cur.turns)}${delta(cur.turns, prev.turns, false)}`, "Per ticket", "")}
    </div>
    <div class="sec-h"><span>Throughput</span></div>
    <div class="pad"><div class="card"><p class="csub">Tickets picked up and how they ended, per day</p>${chartBars([{label:"Pushed", values:cur.days.map(d=>d.pushed), color:"var(--primary)"},{label:"Rejected", values:cur.days.map(d=>d.rejected), color:"var(--line-3)"},{label:"Stopped", values:cur.days.map(d=>d.stopped), color:"var(--bad)"}], {labels, maxLabels:ml, w:340, h:190, aria:"Throughput per day"})}
      ${legend([["var(--primary)","Pushed"],["var(--line-3)","Rejected"],["var(--bad)","Stopped"]])}</div></div>
    <div class="sec-h"><span>Outcomes</span></div>
    <div class="pad"><div class="card donut-wrap">${donut(outcomes, `${success}%`, "pushed")}<div class="dn-legend">${outcomes.map(o=>`<div><i style="background:${o.color}"></i><span>${o.label}</span><b>${o.v}</b></div>`).join("")}</div></div></div>
    <div class="sec-h"><span>Speed</span></div>
    <div class="pad"><div class="card"><p class="csub">Average minutes per ticket: agnts working versus waiting on you</p>${chartLines([{label:"agnts working", values:cur.days.map(d=>d.agntsMin), color:"var(--primary)", area:true},{label:"Waiting on you", values:cur.days.map(d=>d.waitMin), color:"var(--warn)"}], {labels, maxLabels:ml, w:340, h:200, fmt:(v)=>tr(fmtMin(v)), aria:"Minutes per ticket"})}
      ${legend([["var(--primary)","agnts working"],["var(--warn)","Waiting on you"]])}</div></div>
    <div class="sec-h"><span>Where the time goes</span></div>
    <div class="pad"><div class="card">${hbars(steps, fmtMin)}</div></div>
    <div class="sec-h"><span>Why runs stop</span><span>${cur.stopped}</span></div>
    <div class="pad"><div class="card">${hbars(stopRows)}</div></div>
    <div class="sec-h"><span>Models</span></div>
    <div class="pad"><div class="list">${["sonnet","opus","haiku"].map(k=>`<div class="li static"><span class="lt"><b class="notr">${MODELS[k].name}</b><small>${pct(cur.models[k], cur.runs)}% of runs, ${MS[k].ok}% reached review, ${MS[k].turns} turns, ~${MS[k].use}% plan per run</small></span><span class="rv">${cur.models[k]}</span></div>`).join("")}</div></div>
    <div class="sec-h"><span>By repository</span></div>
    <div class="pad"><div class="list">${repoRows.map(r=>`<div class="li static"><span class="lt"><span class="notr">${r.color?`<span class="dot" style="background:${r.color}"></span>`:""}${esc(r.name)}</span><small>${r.n} tickets, ${r.turns} turns, CLAUDE.md ${r.md ? "found" : "missing"}</small></span><span class="rv ${r.ok>=80?"ok":"warn"}">${r.ok}%</span></div>`).join("")}</div></div>
    <div class="sec-h"><span>Activity by hour</span></div>
    <div class="pad"><div class="card">${chartBars([{label:"Events", values:hours, color:"#7F95E8"}], {labels:hours.map((_,i)=>String(i).padStart(2,"0")), maxLabels:6, w:340, h:170, aria:"Activity by hour"})}</div></div>
    <div class="sec-h"><span>Insights</span></div>
    <div class="pad stack notr">${insights.map(x=>`<div class="help">${mi("info")}<p>${x}</p></div>`).join("")}</div>`;
}
function allReposM(){ return repos.map(r=>({name:r.name, claudeMd:r.claudeMd})).concat(projects.map(p=>({name:p.repo, claudeMd:p.claudeMd!==false, color:p.color}))); }

function mConnect(){
  const id = mv.integ, tok = ($("mg-token")||{}).value || "", url = ($("mg-url")||{}).value;
  if(id === "gitlab" && !/^https:\/\//.test(url||"")){ mIgErr = tr("Use an https:// address."); render(); return; }
  if(tok.trim().length < 8){ mIgErr = tr("Paste a valid access token."); render(); return; }
  mIgErr = "";
  if(id === "jira"){ Object.assign(settings.integ.jira, {connected:true, token:tok.trim().slice(-4), checked:Date.now(), site:$("mg-site").value, email:$("mg-email").value}); save(); render(); toast("Jira connected"); return; }
  ($("mg-token")).blur(); mConnecting = {step:0}; render();
  const tick = () => { mConnecting.step++; if(mConnecting.step < 3){ render(); setTimeout(tick, 700); return; }
    mConnecting = null; Object.assign(settings.integ[id], {connected:true, token:tok.trim().slice(-4), checked:Date.now(), url, account:"rustambek", expires:new Date(Date.now()+365*86400000).toISOString().slice(0,10), perms:{api:true, read_repository:true, write_repository:true}});
    save(); render(); toast(`${PROV[id].name} connected`); };
  setTimeout(tick, 700);
}

function mtrack(t){
  const s = STATE[t.state]; let idx = s.stop, err = false;
  if(idx === null){ idx = t.failedAt; err = true; }
  return `<div class="track" aria-label="Progress">${STOPS.map((st,i)=>{
    let c = ""; if(idx === -2) c = i===0 ? "done" : ""; else if(i < idx || idx === 6) c = "done"; else if(i === idx) c = err ? "error" : "active";
    return `<div class="stop ${st.gate?"gate":""} ${c}"><span class="mark">${c==="done"?mi("check"):""}</span><span class="lbl">${st.label}</span></div>`;
  }).join("")}</div>`;
}
function mlog(t){ const L = logs[t.key] || []; return `<div class="log" id="log">${L.map((l,i)=>`<div class="${i===L.length-1?"cur":""}"><span class="t">${l[0]}</span>${esc(l[1])}</div>`).join("") || `<div class="cur"><span class="t">${now()}</span>Starting</div>`}</div>`; }
function mdiff(files){ return files.map((f,i)=>`<details class="file" ${i===0?"open":""}><summary><span>${esc(f.path)}</span><span class="n"><span class="a">+${f.add}</span><span class="d">−${f.del}</span></span></summary><div class="diff"><pre>${f.diff.split("\n").map(l=>{ const c = l.startsWith("@@")?"hunk":l.startsWith("+")?"add":l.startsWith("-")?"del":""; return `<span class="${c}">${esc(l)||" "}</span>`; }).join("")}</pre></div></details>`).join(""); }
function modelRows(t, stages){
  return `<div class="h3">Models for this ticket</div><div class="list">${stages.map(id=>{ const st = STAGES.find(x=>x.id===id), cur = (t.models && t.models[id]) || "default";
    return `<button class="li" data-tmodel="${id}"><span class="lt">${st.label}</span><span class="rv">${cur==="default" ? `Default (${MODELS[settings.models[id]].name})` : `<span class="notr">${MODELS[cur].name}</span>`}</span><span class="chev"></span></button>`; }).join("")}</div>`;
}
function dStage(t){
  const st = t.state, br = "agnts/"+t.key.toLowerCase();
  if(st === "new") return `<div class="block"><h2>Waiting in queue</h2><p class="sub">agnts reads the ticket and the related code, then comes back with a plan and questions. Nothing is changed in this step.</p>${modelRows(t,["analyze","coding"])}</div>`;
  if(st === "analyzing") return `<div class="block"><h2>Reading the code</h2><p class="sub">Looking through ${esc(t.repo)} to build a plan.</p><div class="h3">Live log</div>${mlog(t)}</div>`;
  if(st === "waiting_for_answers") return `<div class="block"><h2>${t.questions.length} question${t.questions.length===1?"":"s"} before coding</h2><p class="sub">Pick an option or write your own answer. Answers go into the coding prompt with the plan.</p>
    ${t.plan.length ? `<details class="fold"><summary>Plan<span class="hint">${t.plan.length}</span></summary><div class="in"><ol class="plan notr-soft">${t.plan.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></div></details>` : ""}
    ${t.questions.map((q,i)=>`<div class="q"><p>${esc(q.q)}</p><div class="opts">${q.options.map(o=>`<button class="opt" data-q="${i}" data-opt="${esc(o)}" aria-pressed="${q.answer===o}">${esc(o)}</button>`).join("")}</div>
      <textarea data-note="${i}" rows="2" placeholder="Add details (optional)" aria-label="Details for question ${i+1}">${esc(q.note)}</textarea></div>`).join("")}
    <div class="h3">Extra instructions</div><textarea id="extra" placeholder="Anything agnts didn't ask about, like files to avoid or naming conventions">${esc(t.extra||"")}</textarea>
    ${modelRows(t,["coding","retry"])}</div>`;
  if(st === "coding" || st === "testing") return `<div class="block"><h2>${st==="coding"?"Coding":"Running tests"}${t.revision>1?", revision "+t.revision:""}</h2><p class="sub">Working in a fresh container on ${br}. You review the diff before anything is pushed.</p>
    <dl class="facts"><div><dt>Model</dt><dd class="notr">${MODELS[t.curModel || modelFor(t,"coding")].name}</dd></div><div><dt>Turns</dt><dd id="turns">${t.turns}</dd></div><div><dt>Turn limit</dt><dd>${settings.maxTurns}</dd></div><div><dt>Session usage</dt><dd id="sess">${Math.round(usage.five_hour.u*100)}%</dd></div></dl>
    <div class="h3">Live log</div>${mlog(t)}</div>`;
  if(st === "waiting_for_review"){ const r = t.result, add = r.files.reduce((a,f)=>a+f.add,0), del = r.files.reduce((a,f)=>a+f.del,0);
    return `<div class="block"><h2>Review the changes${t.revision>1?", revision "+t.revision:""}</h2>
    <dl class="facts"><div><dt>Tests</dt><dd class="${r.tests.failed?"bad":"ok"}">${r.tests.passed} passed</dd></div><div><dt>Lint</dt><dd class="ok">${r.lint}</dd></div><div><dt>Changed</dt><dd>${r.files.length} files, +${add} −${del}</dd></div><div><dt>Time</dt><dd>${t.duration||"5m 30s"}</dd></div></dl>
    <div class="h3">What agnts did</div><div class="summary">${r.summary.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    <div class="h3">Diff</div>${mdiff(r.files)}</div>`; }
  if(st === "pushing") return `<div class="block"><h2>Pushing</h2><p class="sub">Committing as you and opening the pull request.</p><div class="h3">Live log</div>${mlog(t)}</div>`;
  if(st === "done"){ const main = isLocal(t) && t.after === "main";
    return `<div class="block"><div class="help ok">${mi("check")}<p>${main ? `Committed as you and pushed to main on ${esc(t.repo)}.` : `Pull request #${t.pr} is open on ${br}${isLocal(t)?".":", and the Jira ticket is in In Review."}`}</p></div></div>`; }
  if(st === "rejected") return `<div class="block"><h2>Rejected</h2><p class="sub">The branch was discarded${isLocal(t)?".":" and the ticket went back to you in Jira."}</p></div>`;
  if(st === "failed") return `<div class="block"><h2>agnts stopped</h2><div class="help bad" style="margin-top:8px">${mi("info")}<p>${esc(t.error)}</p></div></div>`;
  if(st === "rate_limited") return `<div class="block"><h2>Paused at plan limit</h2><div class="help warn" style="margin-top:8px">${mi("info")}<p>${esc(t.error)}</p></div><p class="sub" style="margin-top:10px">Session usage is ${Math.round(usage.five_hour.u*100)}% now.</p></div>`;
  return "";
}
function dBar(t){
  const st = t.state;
  if(st === "new") return `${isLocal(t) ? `<button class="btn btn-d icon" data-act="delete" aria-label="Delete task">${mi("trash")}</button>` : ""}<button class="btn btn-p" data-act="analyze">Analyze ticket</button>`;
  if(st === "waiting_for_answers"){ const left = t.questions.filter(q=>!q.answer).length; return `<span class="hint">${left ? left+" question"+(left===1?"":"s")+" left to answer" : "All questions answered"}</span><button class="btn btn-p" data-act="start" ${left?"disabled":""} style="flex:none">Start coding</button>`; }
  if(st === "coding" || st === "testing") return `<button class="btn btn-d" data-act="stop">Stop run</button>`;
  if(st === "analyzing" || st === "pushing") return `<span class="hint">agnts is working. You'll get a notification when it needs you.</span>`;
  if(st === "waiting_for_review") return `<button class="btn btn-d icon" data-act="reject" aria-label="Reject">${mi("close")}</button><button class="btn" data-act="changes">Request changes</button><button class="btn btn-p" data-act="approve">Approve</button>`;
  if(st === "done") return t.pr && !(isLocal(t) && t.after==="main") ? `<button class="btn" data-act="openpr">Open pull request #${t.pr}</button>` : "";
  if(st === "rejected") return `<button class="btn" data-act="requeue">Send back to queue</button>`;
  if(st === "failed") return `<button class="btn btn-d" data-act="reject">Take it myself</button><button class="btn btn-p" data-act="retry">Retry</button>`;
  if(st === "rate_limited") return `<button class="btn btn-p" data-act="resume">Resume run</button>`;
  return "";
}

    </div>`;
}

  if(mv.repo && !mv.key) return DOCS[L].repo;
  if(mv.repos && !mv.key) return DOCS[L].repos;
  if(mv.key) return DOCS[L].detail;
  if(mv.tab === "tickets"){ const d = DOCS[L].list; return {...d, intro:({en:"Every ticket and task agnts is handling. Use the chips to filter by status.", ru:"Все тикеты и задачи, которыми занимается agnts. Фильтруйте по статусу с помощью кнопок.", uz:"agnts shugʻullanayotgan barcha tiket va vazifalar. Holat boʻyicha tugmalar orqali saralang."})[L]}; }
  if(mv.tab === "tasks") return DOCS[L].tasks;
  if(mv.tab === "home") return DOCS[L].dashboard;
  if(mv.tab === "analytics") return mv.asub === "events" ? MDOCS[L].activity : DOCS[L].analytics;
  return MDOCS[L][mv.tab];
}
function renderSheet(){
  const el = $("sheet");

    b = `<div class="notr"><p class="docs-intro">${doc.intro}</p>${doc.items.map(([x,y])=>`<div class="gd-item"><b>${x}</b><span>${y}</span></div>`).join("")}</div>`; }
  if(sheet.type === "lang"){ h = `<h2>Language</h2>`;
    b = `<div class="list notr">${LANGS.map(([v,c,full])=>`<button class="li" data-lang="${v}"><span class="lt">${full}</span>${prefs.lang===v?`<span style="color:var(--primary)">${mi("check").replace('<svg','<svg width="20" height="20" style="stroke:currentColor;fill:none;stroke-width:2.6"')}</span>`:`<span class="rv">${c}</span>`}</button>`).join("")}</div>`; }
  if(sheet.type === "model"){ const st = STAGES.find(x=>x.id===d.stage), t = d.key && find(d.key);
    const cur = t ? ((t.models && t.models[d.stage]) || "default") : settings.models[d.stage];

    h = `<div><h2>${st.label}</h2><p>${t ? "Override the defaults from Settings for this ticket only." : "Pick which model runs each step. Haiku uses the least of your plan, Opus the most."}</p></div>`;
    b = `<div class="choices">${opts.map(([v,l])=>`<button class="choice" data-pick="${v}" aria-pressed="${cur===v}"><span class="rd"></span><span><b>${l}</b>${v==="haiku"?`<span class="d">Uses the least of your plan</span>`:v==="opus"?`<span class="d">Strongest, uses the most of your plan</span>`:v==="sonnet"?`<span class="d">Balanced for most tickets</span>`:""}</span></button>`).join("")}</div>`; }
  if(sheet.type === "changes" || sheet.type === "retry"){ const t = find(d.key), cur = (t.models && t.models.retry) || "default";
    h = `<div><h2>${sheet.type==="changes" ? "What should agnts change?" : "What should agnts try?"}</h2><p>Your feedback goes into the same session, so agnts keeps everything it already knows.</p></div>`;
    b = `<textarea id="fb" rows="5" placeholder="${sheet.type==="changes" ? "Describe what to change. Required for Request changes." : "For example: streaming is fine, target is under 10 seconds for 100k rows"}">${esc(d.text||"")}</textarea>
      <div class="fld"><span class="fl">Model for this retry</span><div class="seg full">${[["default","Default"]].concat(Object.entries(MODELS).map(([k,m])=>[k,m.name.split(" ")[0]])).map(([v,l])=>`<button class="seg-b" data-rm="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div></div>
      ${sheet.err ? `<span class="ferr">${sheet.err}</span>` : ""}`;
    f = `<button class="btn" data-act="sheet-close">Cancel</button><button class="btn btn-p" data-act="${sheet.type==="changes"?"send-changes":"send-retry"}">Send</button>`; }
  if(sheet.type === "newtask"){
    h = `<div><h2>New task</h2><p>For your side projects. Not synced to Jira.</p></div>`;
    b = `<div class="fld"><span class="fl">Repository</span><div class="opts">${projects.map(p=>`<button class="opt" data-nt="project" data-val="${p.id}" aria-pressed="${d.project===p.id}"><span class="dot" style="background:${p.color}"></span><span class="notr">${esc(p.name)}</span></button>`).join("")}</div></div>
      <div class="fld"><label for="nt-title">Title</label><input class="inp" id="nt-title" data-ntf="title" value="${esc(d.title)}" placeholder="For example: Add a rest timer between sets"></div>
      <div class="fld"><label for="nt-desc">What should be done</label><textarea id="nt-desc" data-ntf="desc" rows="4" placeholder="Describe the result you want. The clearer this is, the fewer questions agnts asks.">${esc(d.desc)}</textarea></div>
      <div class="fld"><span class="fl">Priority</span><div class="seg full">${["Low","Medium","High"].map(v=>`<button class="seg-b" data-nt="priority" data-val="${v}" aria-pressed="${d.priority===v}">${v}</button>`).join("")}</div></div>

      ${sheet.err ? `<span class="ferr">${sheet.err}</span>` : ""}`;
    f = `<button class="btn" data-act="sheet-close">Cancel</button><button class="btn btn-p" data-act="create-task">${d.start==="queue" ? "Create task" : "Create and start"}</button>`; }
  if(sheet.type === "repos"){ h = `<div><h2>Repositories</h2><p>Manage repositories and their commands in the admin panel.</p></div>`;
    b = `<div class="list">${repos.map(r=>`<div class="li static"><span class="lt notr">${esc(r.name)}<small>${esc(r.test)}</small></span><span class="src">Jira ${esc(r.jira)}</span></div>`).join("")}${projects.map(p=>`<div class="li static"><span class="lt notr"><span class="dot" style="background:${p.color}"></span>${esc(p.repo)}<small>${esc(p.test)}</small></span><span class="src local notr">${esc(p.name)}</span></div>`).join("")}</div>`; }
  el.innerHTML = `<button class="sheet-back" data-act="sheet-close" aria-label="Close"></button>

  translateDom(el);
}
function openSheet(type, data){ sheet = {type, data, err:""}; renderSheet(); }
function closeSheet(){ sheet = null; renderSheet(); }

/* ---- Notifications ---- */
let bannerT = null;
function notify(t, s){
  const kind = ["waiting_for_answers","waiting_for_review"].includes(s) ? "needs" : ["failed","rate_limited"].includes(s) ? "stops" : s === "done" ? "done" : null;
  if(!kind || !settings.push[kind]) return;
  const msg = s === "waiting_for_answers" ? `${t.key} needs your answers` : s === "waiting_for_review" ? `${t.key} is ready for review` : s === "failed" ? `${t.key} stopped` : s === "rate_limited" ? `${t.key} paused at plan limit` : `${t.key} pushed`;
  const el = $("banner");
  el.innerHTML = `<button class="banner" data-open="${t.key}"><span class="ic"><svg viewBox="0 0 30 30"><path d="M18.75 11.25V20.75M18.75 16a4.75 4.75 0 1 1-9.5 0a4.75 4.75 0 1 1 9.5 0" stroke="#F4F3EF" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="20.2" y="7.2" width="3.6" height="3.6" rx="0.8" transform="rotate(45 22 9)" fill="#7F95E8"/></svg></span>
    <span class="bt"><b><span>agnts</span><small>now</small></b><span>${tr(msg)}</span><span class="notr" style="color:var(--ink-3);font-size:13px">${esc(t.title)}</span></span></button>`;
  translateDom(el);
  lastBannerAt = Date.now();
  clearTimeout(bannerT);
  bannerT = setTimeout(()=>{ const b = el.querySelector(".banner"); if(b){ b.classList.add("out"); setTimeout(()=>{ el.innerHTML = ""; }, 300); } }, 4200);
}
let lastBannerAt = 0;
const _toast = toast;
toast = function(msg){ if(Date.now() - lastBannerAt < 1500) return; _toast(msg); };
const _setState = setState;
setState = function(t, s, hist, kind){ _setState(t, s, hist, kind); if(kind !== "you") notify(t, s); };

/* ---- Render ---- */
function screenId(){ return mv.integ ? "i:"+mv.integ : mv.key ? "d:"+mv.key : mv.repo ? "r:"+mv.repo+":"+mv.rtab : mv.repos ? "repos" : mv.tab; }
function render(){
  view.page = mv.integ ? "integ" : mv.key ? "detail" : mv.repo ? "repo" : mv.repos ? "repos" : mv.tab; view.key = mv.key;
  const ae = document.activeElement;
  if(ae && $("app").contains(ae) && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")){ pendingRender = true; save(); return; }
  pendingRender = false;
  const old = $("view"), sid = screenId();
  if(old && old.dataset.sid) scrollMem[old.dataset.sid] = old.scrollTop;
  const needs = tickets.filter(t=>NEEDS.includes(t.state)).length;
  const tabs = [["home","Home"],["tickets","Tickets"],["tasks","Tasks"],["analytics","Analytics"],["more","More"]];
  const body = mv.integ ? scrInteg() : mv.key ? scrDetail() : mv.repo ? scrRepo() : mv.repos ? scrRepoList() : ({home:scrHome, tickets:scrTickets, tasks:scrTasks, analytics:scrAnalytics, more:scrMore})[mv.tab]();
  const ig = mv.integ && settings.integ[mv.integ];
  const bar = mv.integ ? (!ig.connected && !mConnecting ? `<button class="btn btn-p" data-mig="connect">${mv.integ==="jira" ? "Connect Jira" : `Connect ${PROV[mv.integ].name}`}</button>` : "") : mv.key ? dBar(find(mv.key) || {}) : "";
  $("app").innerHTML = `<main class="view" id="view" data-sid="${sid}" aria-live="polite">${body}</main>
    ${mv.key || mv.integ || mv.repo || mv.repos ? (bar ? `<div class="actionbar">${bar}</div>` : "") : `${mv.tab==="tasks" ? `<button class="fab" data-act="new-task" aria-label="New task">${mi("plus")}</button>` : ""}
    <nav class="tabbar" aria-label="Main">${tabs.map(([id,l])=>`<button class="tab" data-tab="${id}" ${mv.tab===id?'aria-current="page"':""}>${mi(id)}<span class="l">${l}</span>${id==="home"&&needs?`<span class="bdg">${needs}</span>`:""}</button>`).join("")}</nav>`}`;
  const v = $("view"); if(scrollMem[sid] != null) v.scrollTop = scrollMem[sid];
  const lg = $("log"); if(lg) lg.scrollTop = lg.scrollHeight;
  translateDom($("app"));
  save();
}
function renderPill(){ /* the session strip is part of the screens */ }

/* ---- Events ---- */
function openT(k){ mv.key = k; scrollMem["d:"+k] = 0; render(); }
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]"); if(tb){ if(mv.tab === tb.dataset.tab && !mv.key && !mv.integ && !mv.repo && !mv.repos){ $("view").scrollTo({top:0, behavior:"smooth"}); return; } mv.tab = tb.dataset.tab; mv.key = null; mv.integ = null; mv.repo = null; mv.repos = false; render(); return; }
  const op = e.target.closest("[data-open]"); if(op){ if(sheet) closeSheet(); $("banner").innerHTML = ""; openT(op.dataset.open); return; }
  const tf = e.target.closest("[data-tf]"); if(tf){ mv.tfilter = tf.dataset.tf; render(); return; }
  const trp = e.target.closest("[data-tr]"); if(trp){ mv.trepo = trp.dataset.tr; render(); return; }
  const mr = e.target.closest("[data-mrepo]"); if(mr){ mv.repo = mr.dataset.mrepo; mv.rtab = "branches"; render(); return; }
  const mrt = e.target.closest("[data-mrtab]"); if(mrt){ mv.rtab = mrt.dataset.mrtab; render(); return; }
  const dpl = e.target.closest("[data-deploy]"); if(dpl){ runDeploy(mv.repo, +dpl.dataset.deploy, +dpl.dataset.stage); return; }
  const mig0 = e.target.closest("[data-minteg]"); if(mig0){ mv.integ = mig0.dataset.minteg; mIgErr = ""; scrollMem["i:"+mv.integ] = 0; render(); return; }
  const msw = e.target.closest("[data-msw]"); if(msw){ mSet(msw.dataset.msw, !mGet(msw.dataset.msw)); render(); return; }
  const mac = e.target.closest("[data-macc]"); if(mac){ const acc = settings.integ[mv.integ].access; acc[mac.dataset.macc] = acc[mac.dataset.macc] === false; save(); render(); return; }
  const mg = e.target.closest("[data-mig]"); if(mg){ const id = mv.integ, a3 = mg.dataset.mig;
    if(a3 === "test"){ settings.integ[id].checked = Date.now(); save(); render(); toast("Connection works"); return; }
    if(a3 === "sync"){ settings.integ[id].checked = Date.now(); save(); render(); toast("Synced. No new tickets with the agnts label"); return; }
    if(a3 === "disconnect"){ settings.integ[id].connected = false; save(); render(); toast(`${PROV[id].name} disconnected`); return; }
    if(a3 === "connect"){ mConnect(); return; } }
  const go = e.target.closest("[data-go]"); if(go){ const [tab, x] = go.dataset.go.split(":"); mv.tab = tab; mv.key = null; if(tab==="tickets" && x) mv.tfilter = x; if(tab==="analytics") mv.asub = x || "analytics"; render(); return; }
  const as = e.target.closest("[data-asub]"); if(as){ mv.asub = as.dataset.asub; render(); return; }
  const pd = e.target.closest("[data-period]"); if(pd){ anPeriod = +pd.dataset.period; render(); return; }
  const af = e.target.closest("[data-af]"); if(af){ mv.afilter = af.dataset.af; mv.alimit = 40; render(); return; }
  const lb = e.target.closest("[data-lang]"); if(lb){ prefs.lang = lb.dataset.lang; savePrefs(); document.documentElement.lang = prefs.lang === "uz" ? "uz-Latn" : prefs.lang; closeSheet(); render(); renderCaption(); return; }
  const th = e.target.closest("[data-theme-set]"); if(th){ prefs.theme = th.dataset.themeSet; savePrefs(); applyTheme(); render(); return; }
  const md = e.target.closest("[data-model]"); if(md){ openSheet("model", {stage:md.dataset.model}); return; }
  const tmd = e.target.closest("[data-tmodel]"); if(tmd){ const ex = $("extra"); if(ex) find(mv.key).extra = ex.value; openSheet("model", {stage:tmd.dataset.tmodel, key:mv.key}); return; }
  const pk = e.target.closest("[data-pick]"); if(pk && sheet){ const d = sheet.data; if(d.key){ const t = find(d.key); t.models = t.models || {}; t.models[d.stage] = pk.dataset.pick; } else settings.models[d.stage] = pk.dataset.pick; closeSheet(); render(); toast("Settings saved"); return; }
  const rm = e.target.closest("[data-rm]"); if(rm && sheet){ const t = find(sheet.data.key); t.models = t.models || {}; t.models.retry = rm.dataset.rm; sheet.data.text = ($("fb")||{}).value || ""; renderSheet(); return; }
  const ps = e.target.closest("[data-push]"); if(ps){ settings.push[ps.dataset.push] = !settings.push[ps.dataset.push]; render(); return; }
  const q = e.target.closest("[data-q]"); if(q && mv.key){ const t = find(mv.key); const ex = $("extra"); if(ex) t.extra = ex.value; t.questions[+q.dataset.q].answer = q.dataset.opt; render(); return; }
  const nt = e.target.closest("[data-nt]"); if(nt && sheet){ sheet.data[nt.dataset.nt] = nt.dataset.val; renderSheet(); return; }
  const a = e.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act, t = mv.key && find(mv.key);
  if(act === "docs"){ openSheet("docs"); return; }
  if(act === "sheet-close"){ closeSheet(); return; }
  if(act === "lang"){ openSheet("lang"); return; }
  if(act === "repos"){ mv.repos = true; render(); return; }
  if(act === "repos-back"){ mv.repos = false; render(); return; }
  if(act === "repo-back"){ mv.repo = null; render(); return; }
  if(act === "go-more"){ mv.tab = "more"; mv.key = null; render(); return; }
  if(act === "back"){ mv.key = null; render(); return; }
  if(act === "integ-back"){ mv.integ = null; mConnecting = null; render(); return; }
  if(act === "more-act"){ mv.alimit += 40; render(); return; }
  if(act === "new-task"){ openSheet("newtask", {project: mv.trepo!=="all" ? mv.trepo : projects[0].id, title:"", desc:"", priority:"Medium", after:"main", start:"ask"}); setTimeout(()=>{ const i = $("nt-title"); if(i) i.focus(); }, 280); return; }
  if(act === "create-task"){
    const d = sheet.data, title = (d.title||"").trim();
    if(!title){ sheet.err = tr("Give the task a title."); renderSheet(); return; }
    const p = projects.find(x=>x.id===d.project);
    const nt = {key:`${p.prefix}-${p.next++}`, source:"local", project:p.id, title, desc:(d.desc||"").trim(), priority:d.priority, repo:p.repo, after:d.after, updated:now(), state:"new", revision:1, turns:0, duration:"", plan:[], questions:[], result:null, history:[[now(),"You created this task","you"]]};
    tickets.unshift(nt); closeSheet(); mv.tab = "tasks"; mv.key = nt.key;
    logEvent(nt, "user", "You created this task", {step:"Pickup", detail:{from:"new", to:"new"}});
    if(d.start === "ask") analyze(nt); else if(d.start === "code"){ setState(nt, "coding", "Started without questions", "you"); code(nt); }
    render(); toast(`${nt.key} created`); return;
  }
  if(act === "reset"){ Object.values(timers).forEach(clearTimeout); tickets = seed(); usage = seedUsage(); projects = seedProjects(); events = seedEvents(tickets); repos = seedRepos(); settings = seedSettings(); settings.push = {needs:true, stops:true, done:true};
    evSeq = events.reduce((m,x)=>Math.max(m,x.id),0); for(const k in logs) delete logs[k]; mv = {repos:false, repo:null, rtab:"branches", integ:null, tab:"home", key:null, tfilter:"running", trepo:"all", afilter:"all", q:"", alimit:40, asub:"analytics"}; render(); startRuns(); toast("Demo reset"); return; }
  if(act === "openpr"){ toast("Links are disabled in this demo"); return; }
  if(!t) return;
  if(act === "analyze") analyze(t);
  if(act === "start"){ const ex = $("extra"); t.extra = ex ? ex.value.trim() : (t.extra||""); setState(t, "coding", "You answered and started the run", "you"); t.turns = 0; code(t); }
  if(act === "stop"){ clearTimeout(timers[t.key]); t.failedAt = 2; t.error = "You stopped this run. The branch is kept so you can retry with new instructions."; setState(t, "failed", "You stopped the run", "you"); toast("Run stopped"); }
  if(act === "approve"){ push(t); }
  if(act === "changes"){ openSheet("changes", {key:t.key, text:""}); setTimeout(()=>{ const i = $("fb"); if(i) i.focus(); }, 280); return; }
  if(act === "retry"){ openSheet("retry", {key:t.key, text:""}); setTimeout(()=>{ const i = $("fb"); if(i) i.focus(); }, 280); return; }
  if(act === "send-changes" || act === "send-retry"){
    const fb = ($("fb").value || "").trim();
    if(!fb){ sheet.err = tr(act==="send-changes" ? "Write what to change first" : "Add instructions so agnts tries something different"); sheet.data.text = ""; renderSheet(); return; }
    closeSheet(); t.revision++; if(!t.plan.length) t.plan = ["Apply your instructions"];
    setState(t, "coding", act==="send-changes" ? `You requested changes: ${fb}` : `You retried with: ${fb}`, "you"); code(t, fb);
  }
  if(act === "reject"){ clearTimeout(timers[t.key]); setState(t, "rejected", "You rejected the changes. Branch discarded", "you"); toast(`${t.key} rejected`); }
  if(act === "resume"){ setState(t, "coding", "You resumed the run", "you"); code(t); }
  if(act === "requeue"){ t.revision = 1; setState(t, "new", "Sent back to queue", "you"); }
  if(act === "delete"){ tickets = tickets.filter(x=>x!==t); mv.key = null; render(); toast(`${t.key} deleted`); return; }
  render();
});
document.addEventListener("input", e => {
  if(e.target.id === "mq"){ mv.q = e.target.value; const pos = e.target.selectionStart; pendingRender = false; e.target.blur(); render(); const i = $("mq"); i.focus(); i.setSelectionRange(pos,pos); return; }
  if(e.target.dataset.note !== undefined && mv.key){ find(mv.key).questions[+e.target.dataset.note].note = e.target.value; save(); return; }
  if(e.target.id === "extra" && mv.key){ find(mv.key).extra = e.target.value; save(); return; }
  if(e.target.dataset.ntf && sheet){ sheet.data[e.target.dataset.ntf] = e.target.value; if(sheet.err){ sheet.err = ""; const er = document.querySelector("#sheet .ferr"); if(er) er.remove(); } return; }
});
document.addEventListener("focusout", e => { if(pendingRender && $("app").contains(e.target)) setTimeout(()=>{ const ae = document.activeElement; if(!(ae && $("app").contains(ae) && (ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"))) render(); }, 0); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet) closeSheet(); });
setInterval(() => { rollWindows(); if(!mv.key && (mv.tab==="home" || mv.tab==="more")) render(); }, 30000);

  c.innerHTML = ({en:"<b>agnts mobile</b> demo. Tap around: notifications slide in as tickets change.", ru:"Демо <b>agnts mobile</b>. Нажимайте на всё подряд: уведомления появляются, когда меняются тикеты.", uz:"<b>agnts mobile</b> demosi. Bemalol bosing: tiketlar oʻzgarganda bildirishnomalar chiqadi."})[prefs.lang];
}
if(window.matchMedia("(max-width:520px)").matches) document.querySelector(".phone").classList.add("real");
function tickClock(){ const c = document.querySelector(".sbar .time"); if(c) c.textContent = now(); }
tickClock(); setInterval(tickClock, 15000);
applyTheme(); document.documentElement.lang = prefs.lang === "uz" ? "uz-Latn" : prefs.lang;
renderCaption();
startRuns();
render();

})();
